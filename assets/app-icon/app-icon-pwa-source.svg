<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Van Tai Dong Bac App Icon">
  <defs>
    <!-- Background Gradient (Elegant Deep Navy Teal) -->
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0a535e"/>
      <stop offset="60%" stop-color="#032a30"/>
      <stop offset="100%" stop-color="#011518"/>
    </radialGradient>

    <!-- Deep Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#011518" flood-opacity="0.8"/>
    </filter>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base (No rounded corners to prevent iOS black corner bug) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Glass Highlight Overlay (Frosty top reflex) -->
  <path d="M 0,0 H 1024 V 160 C 1024,160 768,230 512,230 C 256,230 0,160 0,160 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Icon Graphics Group (Centered and scaled for PWA Icon) -->
  <g transform="translate(512, 512) scale(1.45) translate(-512, -430)">
    <!-- Tech Matrix Circles (Subtle background detailing) -->
    <g opacity="0.02" stroke="#ffffff" stroke-width="2">
      <circle cx="512" cy="460" r="420" fill="none"/>
      <circle cx="512" cy="460" r="280" fill="none"/>
    </g>

    <!-- 1. GPS / Radar Wireless Waves (All White - Perfect Curve alignment with container) -->
    <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#glow)">
      <path d="M 590,330 A 140,140 0 0,1 730,420"/>
      <path d="M 610,280 A 200,200 0 0,1 810,400"/>
      <path d="M 630,230 A 260,260 0 0,1 890,380"/>
    </g>

    <!-- 2. Perspective Road with Arrow (All White - Classic S-Curve from Left to Right Up) -->
    <g filter="url(#shadow)">
      <!-- Upper Road Boundary -->
      <path d="M 280,560 Q 500,560 670,490 L 720,460" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
      <!-- Lower Road Boundary -->
      <path d="M 390,580 Q 530,580 650,520 L 700,500" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <!-- Arrow Head at the end pointing North-East -->
      <polygon points="700,430 745,455 710,485" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- 3. Redesigned Container Truck (White Silhouette & Lines - Perfectly nested under letters) -->
    <g filter="url(#shadow)">
      <!-- Container Body Back Shadow -->
      <polygon points="410,350 635,290 635,460 410,520" fill="#011518" opacity="0.5"/>

      <!-- Container Body -->
      <polygon points="410,350 635,290 635,460 410,520" fill="#ffffff" stroke="#032a30" stroke-width="4"/>
      
      <!-- Vertical Container Ridges -->
      <g stroke="#032a30" stroke-width="5" stroke-linecap="round">
        <line x1="450" y1="340" x2="450" y2="510" />
        <line x1="490" y1="330" x2="490" y2="500" />
        <line x1="530" y1="320" x2="530" y2="490" />
        <line x1="570" y1="310" x2="570" y2="480" />
        <line x1="610" y1="300" x2="610" y2="470" />
      </g>

      <!-- Cabin Head (Left Side pointing Left) -->
      <path d="M 410,370 L 320,400 C 300,407 285,425 282,445 L 280,490 C 280,510 295,520 320,520 H 410 Z" fill="#ffffff" stroke="#032a30" stroke-width="4"/>
      
      <!-- Cabin Window Glass (Petroleum dark fill) -->
      <polygon points="335,425 400,405 400,455 345,465" fill="#032a30"/>
      
      <!-- Wheels -->
      <circle cx="330" cy="525" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="330" cy="525" r="10" fill="#94a3b8"/>
      
      <circle cx="470" cy="510" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="470" cy="510" r="10" fill="#94a3b8"/>
      
      <circle cx="590" cy="480" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="590" cy="480" r="10" fill="#94a3b8"/>
    </g>

    <!-- 4. Monogram DB (Perfect Nesting Overlay as reference image - White with Dark Outline) -->
    <g filter="url(#shadow)">
      <!-- Vertical Backbone (Shared Spine for D & B) -->
      <rect x="430" y="280" width="40" height="230" rx="20" fill="#ffffff" stroke="#032a30" stroke-width="12"/>

      <!-- Letter D (Overlapping cabin area - Spine at 450) -->
      <!-- D Outline (Dark mask to separate from white truck background) -->
      <path d="M 450,280 C 310,280 310,510 450,510" fill="none" stroke="#032a30" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- D Main Fill (White) -->
      <path d="M 450,280 C 310,280 310,510 450,510" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Letter B (Overlapping container area - Spine at 450) -->
      <!-- B Top Loop Outline -->
      <path d="M 450,280 C 560,280 560,395 450,395" fill="none" stroke="#032a30" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- B Top Loop Fill (White) -->
      <path d="M 450,280 C 560,280 560,395 450,395" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- B Bottom Loop Outline -->
      <path d="M 450,395 C 570,395 570,510 450,510" fill="none" stroke="#032a30" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- B Bottom Loop Fill (White) -->
      <path d="M 450,395 C 570,395 570,510 450,510" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
