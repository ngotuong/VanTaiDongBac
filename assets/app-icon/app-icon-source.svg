<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Van Tai Dong Bac App Icon">
  <defs>
    <!-- Background Gradient (Elegant Deep Navy Teal) -->
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#072d29"/>
      <stop offset="60%" stop-color="#021412"/>
      <stop offset="100%" stop-color="#000504"/>
    </radialGradient>

    <!-- Con đường Gradient (Perspective Path) -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Monogram DB Gradients (Clean Metal & Neon Teal) -->
    <linearGradient id="dbSpineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>

    <linearGradient id="dbLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Deep Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000807" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- High-Tech Circuit Matrix Gridlines (Subtle Digital Accent) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="2">
    <circle cx="512" cy="480" r="420" fill="none"/>
    <circle cx="512" cy="480" r="280" fill="none"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="0" y1="480" x2="1024" y2="480"/>
  </g>

  <!-- Perspective Road/Light Trails (Dynamic Path under the Letters) -->
  <g filter="url(#glow)">
    <path d="M 150,780 Q 512,680 874,780" fill="none" stroke="url(#roadGrad)" stroke-width="32" stroke-linecap="round" opacity="0.25"/>
    <path d="M 150,780 Q 512,680 874,780" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <path d="M 150,810 Q 512,730 874,810" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Monogram ĐB (Geometric Bold Tech Style) -->
  <g filter="url(#shadow)">
    <!-- 1. LETTER Đ (Left Side) -->
    <!-- Spine of Đ -->
    <rect x="320" y="160" width="50" height="380" rx="10" fill="url(#dbSpineGrad)"/>
    <!-- Arc of Đ (Curving to the Left) -->
    <path d="M 345,160 C 160,160 160,540 345,540" fill="none" stroke="url(#dbSpineGrad)" stroke-width="50" stroke-linecap="round"/>

    <!-- 2. THE CONTAINER TRUCK AS THE "Đ" STROKE (Clever Integration) -->
    <!-- Container Body (Running across the Đ spine) -->
    <rect x="180" y="325" width="150" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round">
      <line x1="220" y1="335" x2="220" y2="365" />
      <line x1="250" y1="335" x2="250" y2="365" />
      <line x1="280" y1="335" x2="280" y2="365" />
      <line x1="310" y1="335" x2="310" y2="365" />
    </g>
    <!-- Wheels of the Container -->
    <circle cx="220" cy="380" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="290" cy="380" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

    <!-- Cabin (Truck Head pointing East-North / Up-Right as Arrow) -->
    <path d="M 340,325 L 410,325 L 445,350 L 410,375 L 340,375 Z" fill="url(#dbLoopGrad)"/>
    <!-- Windshield Glass -->
    <polygon points="380,335 405,335 422,350 405,365 380,365" fill="#e0f2fe" opacity="0.9"/>
    
    <!-- GPS Signal Pulse (Pointing North-East from Cabin) -->
    <g filter="url(#glow)">
      <!-- Sóng định hướng GPS màu cam neon nổi bật -->
      <path d="M 440,320 A 35,35 0 0,1 475,355" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <path d="M 465,295 A 65,65 0 0,1 510,355" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <circle cx="430" cy="340" r="6" fill="#f59e0b"/>
    </g>

    <!-- 3. LETTER B (Right Side) -->
    <!-- Spine of B -->
    <rect x="520" y="160" width="50" height="380" rx="10" fill="url(#dbLoopGrad)"/>
    <!-- Top Loop of B -->
    <path d="M 545,160 C 670,160 670,350 545,350" fill="none" stroke="url(#dbLoopGrad)" stroke-width="50" stroke-linecap="round"/>
    <!-- Bottom Loop of B -->
    <path d="M 545,350 C 685,350 685,540 545,540" fill="none" stroke="url(#dbLoopGrad)" stroke-width="50" stroke-linecap="round"/>
    <!-- Inner Core Connection -->
    <circle cx="545" cy="350" r="10" fill="#021412" />
  </g>

  <!-- Subtext "ĐÔNG BẮC" in Modern Clean Font (Optional Visual Weight) -->
  <text x="512" y="650" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="12" text-anchor="middle" opacity="0.95" filter="url(#shadow)">ĐÔNG BẮC</text>
  <text x="512" y="700" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#2dd4bf" letter-spacing="6" text-anchor="middle" opacity="0.8">LOGISTICS</text>
</svg>
