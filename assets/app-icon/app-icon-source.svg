<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Van Tai Dong Bac App Icon">
  <defs>
    <!-- Background Gradient (Elegant Deep Navy Teal) -->
    <radialGradient id="bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0a3934"/>
      <stop offset="60%" stop-color="#021715"/>
      <stop offset="100%" stop-color="#000706"/>
    </radialGradient>

    <!-- Container Body Gradient -->
    <linearGradient id="containerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Cabin Head Gradient (Silver Metallic) -->
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Orange Glow Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Deep Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000706" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Tech Grid Background Lines (Clean Digital Touch) -->
  <g opacity="0.03" stroke="#2dd4bf" stroke-width="2">
    <circle cx="512" cy="380" r="390" fill="none"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="0" y1="380" x2="1024" y2="380"/>
  </g>

  <!-- Dynamic Under-Truck Neon Trail (Con đường ánh sáng phát quang chạy thẳng dưới gầm xe) -->
  <g opacity="0.15" filter="url(#glow)">
    <rect x="100" y="445" width="824" height="120" rx="60" fill="#2dd4bf"/>
  </g>

  <!-- MODERN CONTAINER TRUCK (Flat Side-View / Profile Art - Extremely Clean & Proportional) -->
  <g filter="url(#shadow)">
    <!-- 1. The Chassis/Gầm xe và sườn chắn bùn (Dark slate gray) -->
    <rect x="180" y="435" width="370" height="20" rx="6" fill="#1e293b"/>
    <rect x="580" y="435" width="150" height="20" rx="6" fill="#1e293b"/>
    
    <!-- Khớp nối xe (Coupler) -->
    <rect x="550" y="420" width="30" height="12" fill="#0f172a"/>

    <!-- 2. Container Body (Perfect flat rectangle) -->
    <rect x="160" y="270" width="410" height="175" rx="8" fill="url(#containerGrad)" stroke="#115e59" stroke-width="4"/>
    
    <!-- Vertical Ridges on the Container (Equal spacing, precise alignment) -->
    <g stroke="#115e59" stroke-width="6" stroke-linecap="round">
      <line x1="210" y1="282" x2="210" y2="433" />
      <line x1="260" y1="282" x2="260" y2="433" />
      <line x1="310" y1="282" x2="310" y2="433" />
      <line x1="360" y1="282" x2="360" y2="433" />
      <line x1="410" y1="282" x2="410" y2="433" />
      <line x1="460" y1="282" x2="460" y2="433" />
      <line x1="510" y1="282" x2="510" y2="433" />
      <line x1="560" y1="282" x2="560" y2="433" />
    </g>

    <!-- 3. Cabin Head (Tesla Semi inspired aerodynamic shape) -->
    <!-- Cabin Base Path -->
    <path d="M 580,290 H 650 L 735,370 L 745,410 C 745,430 735,445 715,445 H 580 Z" fill="url(#cabinGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Sleek Window Glass (Blackout style) -->
    <path d="M 600,305 H 645 L 690,360 H 600 Z" fill="#0f172a"/>
    <line x1="645" y1="305" x2="645" y2="360" stroke="#cbd5e1" stroke-width="2"/>

    <!-- LED Headlight (Thin neon teal line) -->
    <polygon points="725,405 743,410 740,420 725,415" fill="#2dd4bf" filter="url(#glow)"/>

    <!-- Front Bumper -->
    <path d="M 700,445 L 740,445 L 735,455 C 730,460 710,460 700,455 Z" fill="#1e293b"/>

    <!-- 4. Wheels (Perfect Circles, no distortion) -->
    <!-- Rear Wheels (Container) -->
    <circle cx="230" cy="460" r="32" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="230" cy="460" r="12" fill="#94a3b8"/>
    
    <circle cx="310" cy="460" r="32" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="310" cy="460" r="12" fill="#94a3b8"/>
    
    <circle cx="510" cy="460" r="32" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="510" cy="460" r="12" fill="#94a3b8"/>

    <!-- Front Wheel (Cabin) -->
    <circle cx="660" cy="460" r="32" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="660" cy="460" r="12" fill="#94a3b8"/>
  </g>

  <!-- GPS Node Beacon / Wireless Signal (IoT Management Accent) -->
  <g filter="url(#glow)">
    <circle cx="700" cy="280" r="8" fill="#f59e0b"/>
    <path d="M 680,260 A 30,30 0 0,1 720,260" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 660,240 A 60,60 0 0,1 740,240" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Separator Line (Modern Tech Bar - Clean spacing) -->
  <line x1="150" y1="580" x2="874" y2="580" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- TYPOGRAPHY: Maximum Size for "ĐÔNG BẮC" (Clean, massive, highly readable) -->
  <g filter="url(#shadow)">
    <text x="512" y="780" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="14" text-anchor="middle">ĐÔNG BẮC</text>
    <text x="512" y="850" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#2dd4bf" letter-spacing="12" text-anchor="middle">LOGISTICS &amp; TRANSPORT</text>
  </g>
</svg>
