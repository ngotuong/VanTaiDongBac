<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Van Tai Dong Bac App Icon">
  <defs>
    <!-- Background Gradient (Petroleum Blue / Deep Teal) -->
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0a535e"/>
      <stop offset="60%" stop-color="#032a30"/>
      <stop offset="100%" stop-color="#011518"/>
    </radialGradient>

    <!-- Deep Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#011518" flood-opacity="0.8"/>
    </filter>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Glass Highlight Overlay (Frosty top reflex) -->
  <path d="M 0,0 H 1024 V 160 C 1024,160 768,230 512,230 C 256,230 0,160 0,160 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Tech Matrix Circles (Subtle background detailing) -->
  <g opacity="0.02" stroke="#ffffff" stroke-width="2">
    <circle cx="512" cy="460" r="420" fill="none"/>
    <circle cx="512" cy="460" r="280" fill="none"/>
  </g>

  <!-- 1. GPS / Radar Wireless Waves (All White) -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#glow)">
    <path d="M 580,310 A 150,150 0 0,1 730,410"/>
    <path d="M 605,255 A 210,210 0 0,1 815,395"/>
    <path d="M 630,200 A 270,270 0 0,1 900,380"/>
  </g>

  <!-- 2. Perspective Road with Arrow (All White) -->
  <g filter="url(#shadow)">
    <!-- Road boundary line (Upper) -->
    <path d="M 240,550 Q 480,560 670,490 L 720,460" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <!-- Road boundary line (Lower) -->
    <path d="M 370,580 Q 530,580 650,520 L 700,500" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <!-- Directional Arrow Head (East-North / Up-Right) -->
    <polygon points="700,430 745,455 710,485" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- 3. Redesigned Container Truck (White Silhouette & Lines) -->
  <g filter="url(#shadow)">
    <!-- Container Body Back Shadow (for 3D pop) -->
    <polygon points="410,350 635,290 635,460 410,520" fill="#011518" opacity="0.5"/>

    <!-- Container Body -->
    <polygon points="410,350 635,290 635,460 410,520" fill="#ffffff" stroke="#032a30" stroke-width="4"/>
    
    <!-- Vertical Container Sọc -->
    <g stroke="#032a30" stroke-width="6" stroke-linecap="round">
      <line x1="450" y1="340" x2="450" y2="510" />
      <line x1="490" y1="330" x2="490" y2="500" />
      <line x1="530" y1="320" x2="530" y2="490" />
      <line x1="570" y1="310" x2="570" y2="480" />
      <line x1="610" y1="300" x2="610" y2="470" />
    </g>

    <!-- Cabin Head (Left Side pointing Left) -->
    <path d="M 410,370 L 320,400 C 300,407 285,425 282,445 L 280,480 C 280,500 295,520 320,520 H 410 Z" fill="#ffffff" stroke="#032a30" stroke-width="4"/>
    
    <!-- Cabin Window Glass (Petroleum dark fill) -->
    <polygon points="335,425 400,405 400,455 345,465" fill="#032a30"/>
    
    <!-- Heavy Wheels -->
    <circle cx="330" cy="525" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="330" cy="525" r="10" fill="#94a3b8"/>
    
    <circle cx="470" cy="510" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="470" cy="510" r="10" fill="#94a3b8"/>
    
    <circle cx="590" cy="480" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="590" cy="480" r="10" fill="#94a3b8"/>
  </g>

  <!-- 4. Monogram DB (Overlaid on Truck, All White with Dark Outline to Pop) -->
  <g filter="url(#shadow)">
    <!-- Letter D (Overlapping cabin area) -->
    <!-- D Outline (Dark mask to separate from white truck background) -->
    <path d="M 330,340 H 430 C 510,340 510,490 430,490 H 330 Z" fill="none" stroke="#032a30" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- D Main Fill (White) -->
    <path d="M 330,340 H 430 C 510,340 510,490 430,490 H 330 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter B (Overlapping container area) -->
    <!-- B Outline (Dark mask to separate from white container background) -->
    <path d="M 470,300 H 555 C 610,300 610,395 555,395 H 470 H 565 C 620,395 620,490 565,490 H 470 Z" fill="none" stroke="#032a30" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- B Main Fill (White) -->
    <path d="M 470,300 H 555 C 610,300 610,395 555,395 H 470 H 565 C 620,395 620,490 565,490 H 470 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5. Brand Typography (Clean, All White, massive readable font) -->
  <g filter="url(#shadow)">
    <text x="512" y="690" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="74" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">ĐÔNG BẮC</text>
    <text x="512" y="765" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="14" text-anchor="middle">TRANSPORT</text>
  </g>
</svg>
