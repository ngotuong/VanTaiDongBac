    // Helper functions for filtering and calculating subtotals
    function removeAccents(str) {
      if (!str) return '';
      return str.normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/Đ/g, 'D');
    }

    function parseCellValue(text) {
      if (!text || text === '-' || text === '0') return 0;
      let clean = text.replace(/[đ₫\s]/g, '');
      if (clean.includes('.') && clean.includes(',')) {
        if (clean.indexOf('.') < clean.indexOf(',')) {
          clean = clean.replace(/\./g, '').replace(/,/g, '.');
        } else {
          clean = clean.replace(/,/g, '');
        }
      } else if (clean.includes(',')) {
        const parts = clean.split(',');
        if (parts.length === 2 && parts[1].length <= 2) {
          clean = clean.replace(/,/g, '.');
        } else {
          clean = clean.replace(/,/g, '');
        }
      } else {
        const dotsCount = (clean.match(/\./g) || []).length;
        if (dotsCount > 1) {
          clean = clean.replace(/\./g, '');
        } else if (dotsCount === 1) {
          const parts = clean.split('.');
          if (parts[1].length === 3) {
            clean = clean.replace(/\./g, '');
          }
        }
      }
      const val = parseFloat(clean);
      return isNaN(val) ? null : val;
    }

    function formatValueLike(value, sampleText) {
      if (value === 0) {
        if (sampleText.includes('đ') || sampleText.includes('₫')) return '0 đ';
        return '0';
      }
      const isCurrency = sampleText.includes('đ') || sampleText.includes('₫');
      const currencySymbol = sampleText.includes('₫') ? '₫' : 'đ';
      
      let decimals = 0;
      if (sampleText.includes(',')) {
        const parts = sampleText.split(',');
        const decimalPart = parts[1].replace(/[^0-9]/g, '');
        decimals = decimalPart.length;
      } else if (sampleText.includes('.')) {
        const parts = sampleText.split('.');
        const lastPart = parts[1].replace(/[^0-9]/g, '');
        if (lastPart.length < 3) {
          decimals = lastPart.length;
        }
      }
      
      let formatted = '';
      if (isCurrency) {
        formatted = Math.round(value).toLocaleString('vi-VN') + ' ' + currencySymbol;
      } else {
        formatted = value.toLocaleString('vi-VN', {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals
        });
      }
      return formatted;
    }

    window.filterReportRows = () => {
      const query = (el('reportSearchInput')?.value || '').toLowerCase().trim();
      const parts = query.split(/[,;|]+/).map(p => removeAccents(p.trim())).filter(p => p !== '');
      
      const tables = document.querySelectorAll('#reports .table-card');
      tables.forEach((card) => {
        const type = card.dataset.reportType;
        if (type !== 'payroll' && type !== 'vehicles') return;
        
        const rows = card.querySelectorAll('tbody tr');
        rows.forEach((row) => {
          if (row.classList.contains('total-row')) {
            row.classList.remove('hidden-row');
            return;
          }
          
          const text = row.dataset.searchText || '';
          let match = false;
          if (parts.length === 0) {
            match = true;
          } else {
            match = parts.some(part => text.includes(part));
          }
          
          if (match) {
            row.classList.remove('hidden-row');
          } else {
            row.classList.add('hidden-row');
          }
        });
        
        updateTableSubtotals(card, type);
      });
    };

    function updateTableSubtotals(card, type) {
      const tbody = card.querySelector('tbody');
      if (!tbody) return;
      
      const rows = Array.from(tbody.rows);
      if (rows.length <= 1) return;
      
      let totalRow = null;
      let totalRowIndex = -1;
      
      for (let i = rows.length - 1; i >= 0; i--) {
        const firstCellText = (rows[i].cells[0]?.textContent || '').toLowerCase().trim();
        if (rows[i].classList.contains('total-row') || firstCellText.includes('tổng') || firstCellText.includes('cộng') || firstCellText.includes('trung bình') || firstCellText.includes('thực nhận')) {
          totalRow = rows[i];
          totalRowIndex = i;
          break;
        }
      }
      
      if (!totalRow) return;
      
      const dataRows = [];
      const allDataRows = [];
      for (let i = 0; i < rows.length; i++) {
        if (i !== totalRowIndex) {
          allDataRows.push(rows[i]);
          if (!rows[i].classList.contains('hidden-row')) {
            dataRows.push(rows[i]);
          }
        }
      }
      
      const totalCells = totalRow.cells;
      const firstCell = totalCells[0];
      const baseText = firstCell?.dataset.baseText || firstCell?.textContent || 'Tổng cộng';
      if (firstCell && !firstCell.dataset.baseText) {
        firstCell.dataset.baseText = baseText;
      }
      
      for (let colIdx = 1; colIdx < totalCells.length; colIdx++) {
        const firstDataRow = allDataRows[0];
        if (!firstDataRow) continue;
        
        const sampleText = firstDataRow.cells[colIdx]?.textContent || '';
        if (sampleText.trim() === '' || sampleText.trim() === '-') continue;
        
        let sum = 0;
        let hasNumbers = false;
        
        dataRows.forEach((row) => {
          const cell = row.cells[colIdx];
          if (cell) {
            const val = parseCellValue(cell.textContent);
            if (val !== null) {
              sum += val;
              hasNumbers = true;
            }
          }
        });
        
        if (hasNumbers) {
          totalCells[colIdx].textContent = formatValueLike(sum, sampleText);
        } else {
          totalCells[colIdx].textContent = '';
        }
      }
      
      const isFiltered = document.getElementById('reportSearchInput')?.value.trim() !== '';
      const cleanBase = baseText.replace(/\s*\(Lọc\)/i, '');
      if (firstCell) {
        if (isFiltered) {
          firstCell.textContent = `${cleanBase} (Lọc)`;
        } else {
          firstCell.textContent = cleanBase;
        }
      }
    }

    function parseOverview(matrix) {
      const rows = (matrix || []).slice(1)
        .filter((row) => row[0] && row[0].trim() !== '' && row[0] !== 'Tháng')
        .map((row) => {
          const rev = parseMoney(row[2]);
          const taxTndn = parseMoney(row[3]);
          const taxVat = parseMoney(row[4]);
          const fuelQM = parseMoney(row[5]);
          const fuelOut = parseMoney(row[6]);
          const toll = parseMoney(row[7]);
          const gross = rev - taxTndn - taxVat - fuelQM - toll;
          const grossText = formatCurrencyText(gross);
          
          const fund = parseMoney(row[9]);
          const operatingCost = taxTndn + taxVat + fuelQM + toll;
          const cashCost = fuelOut + fund;
          const totalCost = taxTndn + taxVat + fuelQM + fuelOut + toll + fund;
          const totalCostText = formatCurrencyText(totalCost);
          
          return {
            month: row[0],
            source: row,
            volumeText: row[1],
            volume: parseMoney(row[1]),
            revenueText: row[2],
            revenue: rev,
            taxTndnText: row[3],
            taxTndn: taxTndn,
            taxVatText: row[4],
            taxVat: taxVat,
            fuelText: row[5] + (row[6] ? ' / ' + row[6] : ''),
            fuelQM: fuelQM,
            fuelOut: fuelOut,
            tollText: row[7],
            toll: toll,
            grossText: grossText,
            gross: gross,
            operatingCost: operatingCost,
            operatingCostText: formatCurrencyText(operatingCost),
            cashCost: cashCost,
            cashCostText: formatCurrencyText(cashCost),
            totalCost: totalCost,
            totalCostText: totalCostText,
            fundText: row[9],
            fund: fund,
            finalText: row[10],
            final: parseMoney(row[10])
          };
        });
      return { rows, latest: rows[rows.length - 1] || {} };
    }

    function ensureSelectedMonth(rows) {
      if (!rows.length) return;
      if (!selectedMonth || (selectedMonth !== 'Tất cả' && !rows.some((row) => row.month === selectedMonth))) {
        selectedMonth = rows[rows.length - 1].month;
      }
    }

    function getSelectedOverviewRow(rows) {
      if (!rows.length) return {};
      if (selectedMonth === 'Tất cả') {
        let volume = 0;
        let revenue = 0;
        let taxTndn = 0;
        let taxVat = 0;
        let fuelQM = 0;
        let fuelOut = 0;
        let toll = 0;
        let gross = 0;
        let fund = 0;
        let operatingCost = 0;
        let cashCost = 0;
        let totalCost = 0;
        let final = 0;
        
        rows.forEach(r => {
          volume += r.volume || 0;
          revenue += r.revenue || 0;
          taxTndn += parseMoney(r.taxTndnText);
          taxVat += parseMoney(r.taxVatText);
          if (r.source) {
            fuelQM += parseMoney(r.source[5]);
            fuelOut += parseMoney(r.source[6]);
            toll += parseMoney(r.source[7]);
            fund += parseMoney(r.source[9]);
          }
          gross += r.gross || 0;
          operatingCost += r.operatingCost || 0;
          cashCost += r.cashCost || 0;
          totalCost += r.totalCost || 0;
          final += r.final || 0;
        });

        return {
          month: 'Tất cả',
          volume: volume,
          volumeText: volume.toLocaleString('vi-VN') + ' tấn',
          revenue: revenue,
          revenueText: formatCurrencyText(revenue),
          taxTndnText: formatCurrencyText(taxTndn),
          taxTndn: taxTndn,
          taxVatText: formatCurrencyText(taxVat),
          taxVat: taxVat,
          fuelText: formatCurrencyText(fuelQM) + ' / ' + formatCurrencyText(fuelOut),
          fuelQM: fuelQM,
          fuelOut: fuelOut,
          tollText: formatCurrencyText(toll),
          toll: toll,
          grossText: formatCurrencyText(gross),
          operatingCost: operatingCost,
          operatingCostText: formatCurrencyText(operatingCost),
          cashCost: cashCost,
          cashCostText: formatCurrencyText(cashCost),
          fundText: formatCurrencyText(fund),
          totalCostText: formatCurrencyText(totalCost),
          finalText: formatCurrencyText(final),
          final: final,
          source: [
            'Tất cả',
            volume.toLocaleString('vi-VN'),
            Math.round(revenue).toLocaleString('vi-VN') + ' ₫',
            Math.round(taxTndn).toLocaleString('vi-VN') + ' ₫',
            Math.round(taxVat).toLocaleString('vi-VN') + ' ₫',
            Math.round(fuelQM).toLocaleString('vi-VN') + ' ₫',
            Math.round(fuelOut).toLocaleString('vi-VN') + ' ₫',
            Math.round(toll).toLocaleString('vi-VN') + ' ₫',
            '',
            Math.round(fund).toLocaleString('vi-VN') + ' ₫',
            Math.round(final).toLocaleString('vi-VN') + ' ₫'
          ]
        };
      }
      return rows.find((row) => row.month === selectedMonth) || rows[rows.length - 1] || {};
    }

    // Render month filter inputs
    function renderMonthFilters(rows) {
      ['homeMonthFilter', 'reportMonthFilter'].forEach((id) => {
        const select = el(id);
        if (!select) return;
        const previous = select.value;
        select.innerHTML = '';
        select.appendChild(new Option("Tất cả", "Tất cả"));
        rows.forEach((row) => select.appendChild(new Option(row.month, row.month)));
        select.value = selectedMonth || previous || (rows[rows.length - 1]?.month || '');
        select.onchange = () => {
          selectedMonth = select.value;
          
          // Sync other month filter dropdown
          ['homeMonthFilter', 'reportMonthFilter'].forEach((otherId) => {
            const otherSelect = el(otherId);
            if (otherSelect) {
              otherSelect.value = selectedMonth;
            }
          });
          
          if (activeView === 'reports') {
            loadReportBundle(false);
          } else {
            renderDashboard();
            renderReports();
            renderView();
          }
        };
      });
    }

    function filterOverviewMatrix(matrix, month) {
      if (!matrix || !matrix.length) return [];
      // Find the header row (the one starting with "Tháng")
      let headIndex = matrix.findIndex(row => row && row[0] && String(row[0]).trim().toLowerCase() === 'tháng');
      if (headIndex === -1) headIndex = 1; // Fallback to index 1
      const head = matrix[headIndex] || [];
      // Filter rows that match the month
      const rows = matrix.slice(headIndex + 1).filter((row) => row[0] === month);
      return [head].concat(rows);
    }

    function buildSelectedDetails(row) {
      return [
        ['Nghiệp vụ chi tiết', 'Số tiền / Chỉ số'],
        ['Tháng vận hành', row.month || ''],
        ['Tổng khối lượng vận tải', row.volumeText || ''],
        ['Doanh thu chạy xe', row.revenueText || ''],
        ['Thuế thu nhập doanh nghiệp', row.taxTndnText || ''],
        ['Thuế giá trị gia tăng (VAT)', row.taxVatText || ''],
        ['Tổng chi phí dầu', row.fuelText || ''],
        ['Chi phí phí cầu đường', row.tollText || ''],
        ['Doanh thu gộp (Sau VAT & cầu đường/dầu)', row.grossText || ''],
        ['Chi quỹ thực tế (Ngân quỹ)', row.fundText || ''],
        ['Lợi nhuận thực nhận (Tổng cuối)', row.finalText || '']
      ];
    }

    function parseMoney(value) {
      const text = String(value || '').replace(/[^\d,\-.]/g, '');
      if (!text) return 0;
      const normalized = text.replace(/\./g, '').replace(',', '.');
      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function formatCurrencyParts(value) {
      const rounded = Math.round(Number(value || 0));
      return {
        value: rounded.toLocaleString('vi-VN'),
        unit: 'đ'
      };
    }

    function formatCurrencyText(value) {
      const money = formatCurrencyParts(value);
      return `${money.value} ${money.unit}`;
    }

    function newBlankRow(seed = {}) {
      const today = appData?.today || new Date().toISOString().slice(0, 10);
      const row = { ...seed };
      
      FIELD_SETS[activeForm].forEach(([key, , kind]) => {
        if (row[key] === undefined) {
          row[key] = kind === 'date' ? today : '';
        }
      });
      
      if (activeForm === 'chamCong') {
        row.fromDate = row.fromDate || today;
        row.toDate = row.toDate || row.fromDate;
        row.salary = row.salary || 'Có';
      }
      if (activeForm === 'nghiVanHanh') {
        row.countKpi = row.countKpi || 'Có';
      }
      return row;
    }

    function getOptions(source) {
      const c = getCurrentCatalogs();
      if (source === 'vehicles') return (c.activeVehicles.length ? c.activeVehicles : c.vehicles).map((x) => ({ value: x.plate, label: x.plate }));
      if (source === 'projects') return c.projects.map((x) => ({ value: x.name, label: x.name }));
      if (source === 'drivers') return (c.activeDrivers.length ? c.activeDrivers : c.people).map((x) => ({ value: x.name, label: x.name }));
      if (source === 'people') return (c.activePeople.length ? c.activePeople : c.people).map((x) => ({ value: x.name, label: `${x.name}${x.role ? ' - ' + x.role : ''}` }));
      if (source === 'penalties') return c.activePenalties.map((x) => ({ value: x.code, label: `${x.code} - ${x.content}` }));
      if (source === 'fuelSources') return c.fuelSources.map((x) => ({ value: x, label: x }));
      if (source === 'chamCongTypes') return c.chamCongTypes.map((x) => ({ value: x.name, label: x.name }));
      if (source === 'nghiVanHanhTypes') return c.nghiVanHanhTypes.map((x) => ({ value: x, label: x }));
      if (source === 'yesNo') return ['Có', 'Không'].map((x) => ({ value: x, label: x }));
      return [];
    }

    function handleFieldChange(index, key) {
      const row = rows[index];
      if (activeForm === 'taiXe' && (key === 'vehicle' || key === 'date') && !row.driver) {
        const drivers = suggestDrivers(row.vehicle, row.date);
        if (drivers.length === 1) {
          row.driver = drivers[0];
          renderEntry();
        }
      }
      
      const span = document.querySelector(`.entry-row-extra-title-${index}`);
      if (span) {
        span.innerHTML = getEntryRowExtraTitle(row);
      }
    }

    function suggestDrivers(plate, isoDate) {
      if (!plate || !isoDate) return [];
      const current = new Date(isoDate + 'T00:00:00');
      return getCurrentCatalogs().assignments
        .filter((item) => item.plate === plate && isInRange(current, item.fromDate, item.toDate))
        .map((item) => item.driver);
    }

    // Date checker helper
    function isInRange(date, from, to) {
      const fromDate = from ? new Date(from + 'T00:00:00') : null;
      const toDate = to ? new Date(to + 'T00:00:00') : null;
      return (!fromDate || date >= fromDate) && (!toDate || date <= toDate);
    }

    function parseLocaleNumber(value) {
      if (!value) return 0;
      const text = String(value).replace(/[₫đĐ\s]/g, '').replace(/\./g, '').replace(',', '.');
      const number = Number(text);
      return Number.isFinite(number) ? number : 0;
    }

    function getEmptyCatalogs() {
      return {
        vehicles: [], activeVehicles: [],
        people: [], activePeople: [], activeDrivers: [],
        projects: [],
        penalties: [], activePenalties: [],
        assignments: [],
        params: {},
        chamCongTypes: [
          { name: 'Nghỉ phép', group: 'NGHI_PHEP', salary: 'Có' },
          { name: 'Nghỉ không phép', group: 'TRU_LUONG', salary: 'Không' },
          { name: 'Nghỉ không lương', group: 'TRU_LUONG', salary: 'Không' },
          { name: 'Nghỉ việc tạm thời', group: 'TRU_LUONG', salary: 'Không' }
        ],
        nghiVanHanhTypes: ['Mỏ báo nghỉ', 'Mưa', 'Lễ/Tết', 'Xe hỏng', 'Khác'],
        fuelSources: ['Quang Minh', 'Đổ ngoài']
      };
    }

    function getCurrentCatalogs() {
      return { 
        ...getEmptyCatalogs(), 
        ...(catalogsByForm['all'] || {}),
        ...(catalogsByForm[activeForm] || {}) 
      };
    }

    function loadAllCatalogsIfNeeded(callback) {
      if (catalogsByForm['all']) {
        if (callback) callback();
        return;
      }
      const cached = sessionStorage.getItem('eb_catalogs_all');
      if (cached) {
        catalogsByForm['all'] = JSON.parse(cached);
        if (callback) callback();
        return;
      }
      callApi('GET', 'getCatalogs', { formType: '' })
        .then(res => {
          catalogsByForm['all'] = res;
          sessionStorage.setItem('eb_catalogs_all', JSON.stringify(res));
          if (callback) callback();
        })
        .catch(err => {
          console.error("Lỗi tải toàn bộ danh mục:", err);
          if (callback) callback();
        });
    }

    function getDashboardData() {
      return appData?.dashboard || appData?.reports || { overview: { months: [], details: [] }, inputs: [], links: getLinks(), loading: true };
    }

    function getLinks() {
      return appData?.links || appData?.dashboard?.links || appData?.reports?.links || {};
    }

    function addRow() { 
      rows.push(newBlankRow()); 
      renderEntry(); 
    }
    
    function cloneRow() { 
      rows.push(newBlankRow({ ...rows[rows.length - 1] })); 
      renderEntry(); 
    }

    // Submit Action via API
    function submitAll() {
      setBusy(true);
      clearStatus();
      
      const submittedForm = activeForm;
      const submitted = rows.map((row) => describeRow(submittedForm, row));
      const submittedRows = rows.map((row) => ({ ...row }));
      
      callApi('POST', 'submitRows', {}, { formType: submittedForm, rows: rows })
        .then((result) => {
          const details = [];
          if (result.errors?.length) details.push(result.errors.join('\n'));
          if (result.warnings?.length) details.push(result.warnings.join('\n'));
          
          showStatus(
            result.errors?.length ? 'warn' : 'ok', 
            `Đã ghi nhận ${result.inserted} dòng kê vào sheet ${result.sheetName || ''}.${details.length ? '\nLưu ý:\n' + details.join('\n') : ''}`
          );
          
          if (result.inserted) {
            recentSubmissions = submitted.filter(Boolean).concat(recentSubmissions).slice(0, 8);
            invalidateReportSessionCache();
            rows = [newBlankRow()];
          }
          
          renderEntry();
          
          if (result.inserted && (submittedForm === 'vanChuyen' || submittedForm === 'taiXe')) {
            checkTripReconciliation(submittedRows);
          }
          
          if (result.inserted && activeView === 'reports') {
            refreshReports(false);
          }
          setBusy(false);
        })
        .catch((err) => {
          showStatus('err', err.message || String(err));
          setBusy(false);
        });
    }

    function checkTripReconciliation(submittedRows) {
      callApi('POST', 'checkTripReconciliation', {}, { rows: submittedRows })
        .then((messages) => {
          if (messages && messages.length) {
            showStatus('warn', `Ghi dữ liệu thành công.\nCảnh báo đối soát:\n${messages.join('\n')}`);
          }
        })
        .catch(() => {});
    }

    function describeRow(type, row) {
      const label = FORM_LABELS[type] || type;
      const bits = [
        label, 
        row.date || row.fromDate || '', 
        row.vehicle || row.person || row.driver || '', 
        row.project || row.penaltyCode || '', 
        row.trips ? `${row.trips} chuyến` : '', 
        row.liters ? `${row.liters} lít` : '', 
        row.hours ? `${row.hours} giờ` : ''
      ];
      return bits.filter(Boolean).join(' · ');
    }

    // Catalogs loader (sessionStorage optimized)
    function loadCatalogs(formType) {
      if (catalogsByForm[formType]) return;
      
      const cachedCatalogs = sessionStorage.getItem('eb_catalogs_' + formType);
      if (cachedCatalogs) {
        catalogsByForm[formType] = JSON.parse(cachedCatalogs);
        if (formType === activeForm) {
          renderEntry();
          renderFormTabs();
        }
        return;
      }
      
      callApi('GET', 'getCatalogs', { formType: formType })
        .then((catalogs) => {
          catalogsByForm[formType] = catalogs;
          sessionStorage.setItem('eb_catalogs_' + formType, JSON.stringify(catalogs));
          
          if (formType === activeForm) {
            renderEntry();
            renderFormTabs();
          }
        })
        .catch((err) => showStatus('err', err.message || String(err)));
    }

    // Dashboard loader (sessionStorage optimized)
    function loadDashboard(forceRefresh) {
      setRefreshBusy(true);
      const cacheKey = 'eb_dashboard_v3';
      
      if (!forceRefresh) {
        const cachedDashboard = sessionStorage.getItem(cacheKey);
        if (cachedDashboard) {
          const dashboard = JSON.parse(cachedDashboard);
          appData.dashboard = dashboard;
          appData.reports = { ...appData.reports, ...dashboard, loading: false };
          renderDashboard();
          renderReports();
          renderView();
          setRefreshBusy(false);
          return;
        }
      }
      
      callApi('GET', 'getDashboard', { forceRefresh: forceRefresh })
        .then((dashboard) => {
          appData.dashboard = dashboard;
          appData.reports = { ...appData.reports, ...dashboard, loading: false };
          sessionStorage.setItem(cacheKey, JSON.stringify(dashboard));
          
          renderDashboard();
          renderReports();
          renderView();
          setRefreshBusy(false);
        })
        .catch((err) => {
          showStatus('err', err.message || String(err));
          setRefreshBusy(false);
        });
    }

    function getReportBundleCacheKey(month) {
      return 'eb_report_bundle_v3_' + (month || '');
    }

    function scheduleReportBundlePrefetch() {
      if (reportBundlePrefetching || activeView !== 'reports') return;
      const overviewRows = parseOverview(getDashboardData().overview.months).rows || [];
      const months = [...new Set(overviewRows.map((row) => row.month).filter(Boolean))]
        .filter((month) => month !== selectedMonth && !sessionStorage.getItem(getReportBundleCacheKey(month)))
        .slice(-6);
      if (!months.length) return;

      reportBundlePrefetching = true;
      const epoch = reportCacheEpoch;
      const loadNext = () => {
        if (epoch !== reportCacheEpoch || activeView !== 'reports') {
          reportBundlePrefetching = false;
          return;
        }
        const month = months.pop();
        if (!month) {
          reportBundlePrefetching = false;
          return;
        }
        callApi('GET', 'getReportBundle', { month })
          .then((bundle) => {
            if (epoch === reportCacheEpoch) {
              sessionStorage.setItem(getReportBundleCacheKey(month), JSON.stringify(bundle));
            }
          })
          .catch(() => {})
          .finally(() => setTimeout(loadNext, 250));
      };
      setTimeout(loadNext, 450);
    }

    // Bundled report loader (sessionStorage optimized)
    function loadReportBundle(forceRefresh) {
      const cacheKey = getReportBundleCacheKey(selectedMonth);
      const requestSeq = ++reportBundleRequestSeq;
      
      if (!forceRefresh) {
        const cachedBundle = sessionStorage.getItem(cacheKey);
        if (cachedBundle) {
          const bundle = JSON.parse(cachedBundle);
          
          reportsByType.payroll = { data: bundle.payroll };
          reportsByType.vehicles = { data: bundle.vehicles };
          appData.dashboard = { ...(appData.dashboard || {}), overview: bundle.overview, updatedAt: bundle.updatedAt };
          appData.reports = { ...appData.reports, ...appData.dashboard, loading: false };
          
          renderReports();
          scheduleReportBundlePrefetch();
          return;
        }
      }
      
      callApi('GET', 'getReportBundle', { month: selectedMonth, forceRefresh: forceRefresh })
        .then((bundle) => {
          if (requestSeq !== reportBundleRequestSeq) return;
          reportsByType.payroll = { data: bundle.payroll };
          reportsByType.vehicles = { data: bundle.vehicles };
          appData.dashboard = { ...(appData.dashboard || {}), overview: bundle.overview, updatedAt: bundle.updatedAt };
          appData.reports = { ...appData.reports, ...appData.dashboard, loading: false };
          
          sessionStorage.setItem(cacheKey, JSON.stringify(bundle));
          
          renderReports();
          scheduleReportBundlePrefetch();
        })
        .catch((err) => {
          if (requestSeq === reportBundleRequestSeq) showStatus('err', err.message || String(err));
        });
    }

    // Refresh reports
    function refreshReports(showMessage = true) {
      if (showMessage && activeView === 'entry') {
        showStatus('ok', 'Đang làm mới dữ liệu báo cáo...');
      }
      
      invalidateReportSessionCache();
      setRefreshBusy(true);
      invalidateServerCaches().then(() => {
        if (activeView === 'reports') {
          loadReportBundle(true);
        } else {
          loadDashboard(true);
        }
      });
    }

    function setBusy(isBusy) {
      ['submitBtn', 'addBtn', 'cloneBtn'].forEach((id) => el(id).disabled = isBusy);
      el('submitBtn').innerHTML = isBusy 
        ? '<div class="spinner" style="width:16px;height:16px;margin:0;"></div> Đang ghi...' 
        : `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg> Gửi dữ liệu lên Sheets`;
    }

    function setRefreshBusy(isBusy) {
      el('refreshBtn').disabled = isBusy;
    }

    function showStatus(type, message) {
      const box = el('status');
      box.className = `status show ${type}`;
      box.textContent = message;
    }

    function clearStatus() {
      const box = el('status');
      box.className = 'status';
      box.textContent = '';
    }

    function openDrawer() {
      document.body.classList.add('drawer-open');
    }

    function closeDrawer() {
      document.body.classList.remove('drawer-open');
    }

    // Configuration input controls binder
    function setupConfigInput() {
      const urlInput = el('backendUrlInput');
      const saveBtn = el('saveUrlBtn');
      const statusText = el('urlStatusText');
      
      urlInput.value = getBackendUrl();
      
      saveBtn.onclick = () => {
        const urlVal = urlInput.value.trim();
        if (!urlVal) {
          localStorage.removeItem('eb_backend_url');
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đã xóa cấu hình kết nối.';
          sessionStorage.clear();
          return;
        }
        
        if (!urlVal.startsWith('https://script.google.com/')) {
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đường dẫn không hợp lệ, phải bắt đầu bằng https://script.google.com/...';
          return;
        }
        
        localStorage.setItem('eb_backend_url', urlVal);
        sessionStorage.clear();
        statusText.style.color = 'var(--green)';
        statusText.textContent = 'Đã lưu cấu hình đường dẫn và làm mới bộ nhớ đệm!';
        
        setTimeout(() => {
          location.reload();
        }, 1000);
      };
    }

    window.showSettingsFromLoader = () => {
      document.body.classList.remove('locked');
      el('loader').classList.add('hidden');
      setView('settings');
    };

    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Trigger binding
    el('refreshBtn').onclick = () => refreshReports(true);
    el('menuBtn').onclick = openDrawer;
    el('drawerClose').onclick = closeDrawer;
    el('drawerBackdrop').onclick = closeDrawer;
    el('addBtn').onclick = addRow;
    el('cloneBtn').onclick = cloneRow;
    el('submitBtn').onclick = submitAll;
    
    // Run initial boot
    init();
</script>
