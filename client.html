    function formatTableDate(val, isMonthOnly) {
      if (!val) return '';
      let d = null;
      if (typeof val === 'string') {
        const m = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) {
          d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        } else {
          const parts = val.split(/[\/\-]/);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            } else if (parts[2].length === 4) {
              d = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
            } else if (parts[2].length === 2) {
              d = new Date(2000 + Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
            }
          }
        }
      } else if (val instanceof Date && !isNaN(val.getTime())) {
        d = val;
      }
      
      if (!d) return val;
      
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      
      if (isMonthOnly) {
        return `${mm}/${yy}`;
      } else {
        return `${dd}/${mm}/${yy}`;
      }
    }

    // Dynamic autocomplete select builder
    function createAutocomplete(wrap, options, value, onChange) {
      wrap.innerHTML = '';
      wrap.className = 'ac-container';
      
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ac-input';
      input.placeholder = 'Nhập tìm kiếm nhanh...';
      
      const initialOpt = options.find(o => o.value === value);
      input.value = initialOpt ? initialOpt.label : '';
      
      const dropdown = document.createElement('div');
      dropdown.className = 'ac-dropdown hidden';
      
      const renderOptions = (filterText = '') => {
        dropdown.innerHTML = '';
        const normFilter = filterText.toLowerCase().trim();
        const filtered = options.filter(o => 
          o.label.toLowerCase().includes(normFilter) || 
          o.value.toLowerCase().includes(normFilter)
        );
        
        if (filtered.length === 0) {
          const item = document.createElement('div');
          item.className = 'ac-item empty';
          item.textContent = 'Không tìm thấy mục khớp';
          dropdown.appendChild(item);
          return;
        }
        
        filtered.slice(0, 30).forEach(opt => {
          const item = document.createElement('div');
          item.className = `ac-item ${opt.value === value ? 'selected' : ''}`;
          item.textContent = opt.label;
          
          item.onmousedown = (e) => {
            e.preventDefault();
            value = opt.value;
            input.value = opt.label;
            dropdown.classList.add('hidden');
            onChange(opt.value);
          };
          dropdown.appendChild(item);
        });
      };
      
      input.onfocus = () => {
        input.value = '';
        renderOptions('');
        dropdown.classList.remove('hidden');
        
        document.querySelectorAll('.ac-dropdown').forEach(d => {
          if (d !== dropdown) d.classList.add('hidden');
        });
      };
      
      input.oninput = () => {
        renderOptions(input.value);
      };
      
      input.onblur = () => {
        setTimeout(() => {
          dropdown.classList.add('hidden');
          const matchedOpt = options.find(o => o.label.toLowerCase().trim() === input.value.toLowerCase().trim());
          if (matchedOpt) {
            value = matchedOpt.value;
            input.value = matchedOpt.label;
            onChange(value);
          } else {
            const currentOpt = options.find(o => o.value === value);
            input.value = currentOpt ? currentOpt.label : '';
          }
        }, 200);
      };
      
      wrap.appendChild(input);
      wrap.appendChild(dropdown);
    }

    // API REST Request Layer
    const DEFAULT_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzTp7g9JdYsP4x1kgL5iymJc67Sq7q1qjjLP-bPH2MBBitrAt-xv2W0qJSR9b6di6KAUA/exec';
    
    const getBackendUrl = () => {
      return localStorage.getItem('eb_backend_url') || DEFAULT_BACKEND_URL;
    };

    function callApi(method, action, params = {}, bodyData = null) {
      const backendUrl = getBackendUrl();
      if (!backendUrl) {
        return Promise.reject(new Error('Chưa cấu hình đường dẫn Web App trong Cài đặt!'));
      }
      
      let url = new URL(backendUrl);
      url.searchParams.set('action', action);
      Object.keys(params).forEach(k => {
        url.searchParams.set(k, params[k]);
      });
      if (params.forceRefresh === true || params.forceRefresh === 'true') {
        url.searchParams.set('_ts', Date.now());
      }
      
      const options = {
        method: method,
        headers: {
          'Content-Type': 'text/plain;charset=UTF-8' // bypass preflight CORS
        }
      };
      
      if (bodyData) {
        options.body = JSON.stringify({ action: action, ...bodyData });
      }
      
      return fetch(url.toString(), options)
        .then(res => {
          if (!res.ok) throw new Error('Kết nối API thất bại, status: ' + res.status);
          return res.json();
        })
        .then(data => {
          if (data && data.ok === false) {
            throw new Error(data.error || 'Lỗi API hệ thống.');
          }
          return data;
        });
    }

    function removeSessionKeysByPrefix(prefix) {
      Object.keys(sessionStorage).forEach((key) => {
        if (key.indexOf(prefix) === 0) sessionStorage.removeItem(key);
      });

    function invalidateReportSessionCache() {

    function renderManageTable() {
      if (!currentManageData) return;
      const headers = [...currentManageData.headers];
      const rawRows = currentManageData.rows || [];
      
      let vehicleColIdx = -1;
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].toLowerCase().trim();
        if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
          vehicleColIdx = i;
          break;
        }
      }

      const showOwnerCol = (vehicleColIdx !== -1);
      const thead = el('manageTableHeader');
      thead.innerHTML = '';
      
      headers.forEach((h, idx) => {
        const th = document.createElement('th');
        th.textContent = h;
        thead.appendChild(th);
        
        if (showOwnerCol && idx === vehicleColIdx) {
          const thOwner = document.createElement('th');
          thOwner.textContent = 'Công ty/Chủ xe';
          thead.appendChild(thOwner);
        }
      });
      
      const thActions = document.createElement('th');
      thActions.textContent = 'Thao tác';
      thActions.style.textAlign = 'center';
      thead.appendChild(thActions);

      const vehiclesByPlate = buildVehicleOwnerMap();
      filteredManageRowsData = rawRows.map(row => {
        let owner = '';
        if (showOwnerCol) {
          const plate = String(row.values[vehicleColIdx] || '').trim();
          owner = vehiclesByPlate[plate.toLowerCase()] || '';
        }
        return {
          ...row,
          owner: owner,
          searchText: removeAccents(row.values.concat(owner).join(' ').toLowerCase())
        };
      });

      filterManageRows();
    }

    function buildVehicleOwnerMap() {
      const map = {};
      (getCurrentCatalogs()?.vehicles || []).forEach(v => {
        const plate = String(v.plate || '').trim().toLowerCase();
        if (plate) map[plate] = v.owner || '';
      });
      return map;
    }

    function normalizeFilterValue(value) {
      return removeAccents(String(value || '').trim().toLowerCase());
    }

    function filterManageRows() {
      const query = el('manageSearchInput').value.toLowerCase().trim();
      const tbody = el('manageTableBody');
      tbody.innerHTML = '';
      
      let vehicleColIdx = -1;
      let sourceColIdx = -1;
      let litColIdx = -1;
      let amountColIdx = -1;
      let noteColIdx = -1;

      if (currentManageData) {
        currentManageData.headers.forEach((h, idx) => {
          const hLower = h.toLowerCase().trim();
          if (hLower === 'biển số xe' || hLower === 'xe' || hLower === 'bển số') vehicleColIdx = idx;
          if (hLower === 'nguồn' || hLower === 'nguồn cung cấp' || hLower === 'nguồn dầu' || hLower.includes('nguồn')) sourceColIdx = idx;
          if (hLower === 'số lít' || hLower === 'lít') litColIdx = idx;
          if (hLower === 'thành tiền' || hLower === 'tổng tiền' || hLower === 'tiền') amountColIdx = idx;
          if (hLower === 'ghi chú' || hLower === 'ghi chú thêm') noteColIdx = idx;
        });
      }
      const showOwnerCol = (vehicleColIdx !== -1);
      const isDauSheet = el('manageSheetSelect').value === 'NL_Dau';

      const matched = filteredManageRowsData.filter(row => {
        // 1. Search Query filter
        let matchQuery = true;
        if (query) {
          matchQuery = row.searchText.includes(removeAccents(query));
        }
        if (!matchQuery) return false;

        // 2. Custom NL_Dau filters
        if (currentManageData && isDauSheet) {
          const sourceFilter = el('manageDauSourceFilter').value;
          if (sourceFilter !== 'all' && sourceColIdx !== -1) {
            const rowSource = normalizeFilterValue(row.values[sourceColIdx]);
            if (rowSource !== normalizeFilterValue(sourceFilter)) {
              return false;
            }
          }

          const ownerFilter = el('manageDauOwnerFilter').value;
          if (ownerFilter !== 'all') {
            const ownerKey = normalizeFilterValue(ownerFilter);
            const autoOwner = normalizeFilterValue(row.owner);
            const noteText = noteColIdx !== -1 ? normalizeFilterValue(row.values[noteColIdx]) : '';
            const matchAuto = autoOwner.includes(ownerKey);
            const matchNote = noteText.includes(ownerKey);
            if (!matchAuto && !matchNote) {
              return false;
            }
          }
        }

        return true;
      });

      // 3. Update quick stats if NL_Dau
      if (currentManageData && isDauSheet) {
        let totalLiters = 0;
        let totalAmount = 0;
        matched.forEach(row => {
          if (litColIdx !== -1) {
            totalLiters += parseLocaleNumber(row.values[litColIdx]) || 0;
          }
          if (amountColIdx !== -1) {
            totalAmount += parseLocaleNumber(row.values[amountColIdx]) || 0;
          }
        });
        el('manageDauTotalLiters').textContent = Math.round(totalLiters).toLocaleString('vi-VN');
        el('manageDauTotalAmount').textContent = Math.round(totalAmount).toLocaleString('vi-VN') + ' ₫';
      }

      if (matched.length === 0) {
        el('manageTableEmpty').style.display = 'block';
        return;
      }
      el('manageTableEmpty').style.display = 'none';

      const fragment = document.createDocumentFragment();
      matched.forEach(row => {
        const tr = document.createElement('tr');
        
        row.values.forEach((val, idx) => {
          const td = document.createElement('td');
          
          const header = currentManageData.headers[idx];
          const headerLower = header.toLowerCase().trim();
          
          if (headerLower === 'tháng') {
            td.textContent = formatTableDate(val, true);
          } else if (headerLower.includes('ngày') || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val))) {
            td.textContent = formatTableDate(val, false);
          } else if (typeof val === 'number') {
            if (headerLower.includes('giá') || headerLower.includes('tiền') || headerLower.includes('phạt') || headerLower.includes('lương')) {
              td.textContent = Math.round(val).toLocaleString('vi-VN') + ' ₫';
              td.style.fontWeight = '600';
            } else {
              td.textContent = val.toLocaleString('vi-VN');
            }
          } else {
            td.textContent = val || '';
          }
          tr.appendChild(td);

          if (showOwnerCol && idx === vehicleColIdx) {
            const tdOwner = document.createElement('td');
            if (row.owner) {
              const span = document.createElement('span');
              span.className = `badge ${row.owner.toLowerCase().includes('quang quân') ? 'amber' : 'blue'}`;
              span.textContent = row.owner;
              tdOwner.appendChild(span);
            } else {
              tdOwner.textContent = '-';
            }
            tr.appendChild(tdOwner);
          }
        });

        const tdActions = document.createElement('td');
        tdActions.style.textAlign = 'center';
        tdActions.style.whiteSpace = 'nowrap';
        
        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'primary';
        btnEdit.style.padding = '4px 10px';
        btnEdit.style.fontSize = '12px';
        btnEdit.style.height = '28px';
        btnEdit.style.marginRight = '6px';
        btnEdit.textContent = 'Sửa';
        btnEdit.onclick = () => openManageEditModal(row);

        const btnDelete = document.createElement('button');
        btnDelete.type = 'button';
        btnDelete.className = 'danger';
        btnDelete.style.padding = '4px 10px';
        btnDelete.style.fontSize = '12px';
        btnDelete.style.height = '28px';
        btnDelete.textContent = 'Xóa';
        btnDelete.onclick = () => deleteManageRow(row.rowIndex);

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);
        tr.appendChild(tdActions);
        
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

      el('manageModalTitle').textContent = `Chỉnh sửa dòng thứ ${row.rowIndex}`;
      
      const rowData = {};
      const currentData = activeView === 'catalog' ? currentCatalogData : currentManageData;
      currentData.headers.forEach((h, idx) => {

      });
      
      buildManageModalFields(rowData);
      el('manageModal').classList.add('active');
    }

    function closeManageModal() {
      el('manageModal').classList.remove('active');
    }

    function getManageFieldOptions(header, sheetName) {
      const headerClean = header.trim().toLowerCase();
      if (headerClean === 'biển số xe' || headerClean === 'xe' || headerClean === 'bển số') {
        return getOptions('vehicles');
      }
      if (headerClean === 'tài xế' || headerClean === 'người lái') {
        return getOptions('drivers');
      }
      if (headerClean === 'dự án' || headerClean === 'tên dự án') {
        return getOptions('projects');
      }
      if (headerClean === 'nhân sự' || headerClean === 'nhân viên' || headerClean === 'họ và tên' || headerClean === 'tên nhân sự') {
        return getOptions('people');
      }
      if (headerClean === 'nguồn dầu' || headerClean === 'nguồn') {
        return getOptions('fuelSources');
      }
      if (headerClean === 'mã phạt') {
        return getOptions('penalties');
      }
      if (headerClean === 'loại ngày công') {
        return getOptions('chamCongTypes');
      }
      if (headerClean === 'loại nghỉ') {
        return getOptions('nghiVanHanhTypes');
      }
      if (headerClean === 'kpi' || headerClean === 'tính kpi' || headerClean === 'hưởng lương' || headerClean === 'bù kpi' || headerClean === 'có tính kpi?') {
        return getOptions('yesNo');
      }
      return null;
    }

    function buildManageModalFields(rowData) {
      const container = el('manageModalFields');
      container.innerHTML = '';
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      const currentData = activeView === 'catalog' ? currentCatalogData : currentManageData;

      if (!currentData) return;

      currentData.headers.forEach((header) => {
        const hLower = header.toLowerCase();
        if (header === 'Tháng' && sheetName.indexOf('NL_') === 0) {
          return;
        }
        
        // Skip Thành tiền G column since it is formula-calculated
        if (sheetName === 'NL_Dau' && header === 'Thành tiền') {
          return;
        }

        // Ẩn các cột công thức tự động của NL_ChamCong, NL_Phat, NL_NghiVanHanh
        if (sheetName === 'NL_ChamCong' && (hLower.indexOf('số ngày') !== -1 || hLower.indexOf('lương cứng') !== -1 || hLower.indexOf('nhóm') !== -1)) {
          return;
        }
        if (sheetName === 'NL_Phat' && (hLower.indexOf('nội dung') !== -1 || hLower.indexOf('tiền phạt') !== -1)) {
          return;
        }
        if (sheetName === 'NL_NghiVanHanh' && (hLower.indexOf('tính kpi') !== -1 || hLower.indexOf('giảm kpi') !== -1)) {
          return;
        }

        const label = document.createElement('label');
        const headerClean = header.trim().toLowerCase();
        
        if (headerClean.includes('ghi chú') || headerClean.includes('nội dung')) {
          label.className = 'full-width';
        }

        const span = document.createElement('span');
        span.textContent = header;
        label.appendChild(span);

        const options = getManageFieldOptions(header, sheetName);

        if (options) {
          const acWrap = document.createElement('div');
          acWrap.style.width = '100%';
          acWrap.style.position = 'relative';
          
          label.appendChild(acWrap);
          container.appendChild(label);
          
          const val = rowData[header] || '';
          createAutocomplete(acWrap, options, val, (newVal) => {
            acWrap.dataset.value = newVal;
          });
          acWrap.dataset.value = val;
          acWrap.dataset.header = header;
          acWrap.classList.add('manage-form-field');
          acWrap.classList.add('ac-container');
        } else {
          let input;
          if (headerClean.includes('ghi chú') || headerClean.includes('nội dung')) {
            input = document.createElement('textarea');
          } else {
            input = document.createElement('input');
            if (headerClean.includes('ngày') || headerClean.includes('từ ngày') || headerClean.includes('đến ngày')) {
              input.type = 'date';
            } else if (headerClean.includes('số lít') || headerClean.includes('số chuyến') || headerClean.includes('đơn giá') || headerClean.includes('tiền') || headerClean.includes('số ngày') || headerClean.includes('số giờ') || headerClean.includes('cự ly') || headerClean.includes('công')) {
              input.type = 'text';
              input.inputMode = 'decimal';
            } else {
              input.type = 'text';
            }
          }
          
          input.value = rowData[header] === undefined || rowData[header] === null ? '' : rowData[header];
          input.dataset.header = header;
          input.classList.add('manage-form-field');
          
          label.appendChild(input);
          container.appendChild(label);
        }
      });
    }

    function saveManageRow() {
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      const submitBtn = el('manageModalSubmitBtn');
      const originalText = submitBtn.textContent;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang lưu...';

      const rowData = {};
      const fields = el('manageModalFields').querySelectorAll('.manage-form-field');
      
      fields.forEach((f) => {
        const header = f.dataset.header;
        let val = '';
        if (f.classList.contains('ac-container')) {
          val = f.dataset.value || '';
        } else {
          val = f.value || '';
        }
        rowData[header] = val;
      });

      const rowIndex = activeView === 'catalog' ? currentEditCatalogRowIndex : currentEditRowIndex;

      let targetSheetName = sheetName;
      if (sheetName === 'DM_ThamSo_TS' || sheetName === 'DM_ThamSo_GD') {
        targetSheetName = 'DM_ThamSo';
      }

      const payload = {
        sheetName: targetSheetName,
        rowIndex: rowIndex,
        rowData: rowData
      };

      callApi('POST', 'saveSheetRow', {}, payload)
        .then((res) => {
          if (res.ok) {
            closeManageModal();
            if (sheetName.indexOf('DM_') === 0) {
              sessionStorage.clear();
              loadCatalogs(activeForm);
            }
            if (activeView === 'catalog') {
              loadCatalogSheetData();
            } else {
              loadManageSheetData();
            }
          } else {
            alert('Lỗi: ' + res.error);
          }
        })
        .catch((err) => {
          alert('Lỗi lưu dữ liệu: ' + err.message);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        });
    }

    function deleteManageRow(rowIndex) {
      if (!confirm(`Bạn có chắc chắn muốn xóa dòng thứ ${rowIndex} không? Hành động này không thể hoàn tác.`)) {
        return;
      }
      
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      
      let targetSheetName = sheetName;
      let columnsToClear = null;
      if (sheetName === 'DM_ThamSo_TS') {
        targetSheetName = 'DM_ThamSo';
        columnsToClear = ["Mã tham số", "Tên tham số", "Giá trị", "Ngày áp dụng tham số"];
      } else if (sheetName === 'DM_ThamSo_GD') {
        targetSheetName = 'DM_ThamSo';
        columnsToClear = ["Giá dầu áp dụng", "Ngày áp dụng giá dầu", "Ghi chú"];
      }

      callApi('POST', 'deleteSheetRow', {}, { sheetName: targetSheetName, rowIndex: rowIndex, columnsToClear: columnsToClear })
        .then((res) => {
          if (res.ok) {
            if (sheetName.indexOf('DM_') === 0) {
              sessionStorage.clear();
              loadCatalogs(activeForm);
            }
            if (activeView === 'catalog') {
              loadCatalogSheetData();
            } else {
              loadManageSheetData();
            }
          } else {
            alert('Lỗi: ' + res.error);
          }
        })
        .catch((err) => {
          alert('Lỗi xóa dữ liệu: ' + err.message);
        });
    }

    // Catalog CRUD Operations
    function loadCatalogSheetData() {
      const displaySheetName = el('catalogSheetSelect').value;
      const sheetName = (displaySheetName === 'DM_ThamSo_TS' || displaySheetName === 'DM_ThamSo_GD') ? 'DM_ThamSo' : displaySheetName;
      
      const tbody = el('catalogTableBody');
      const thead = el('catalogTableHeader');
      
      thead.innerHTML = '';
      tbody.innerHTML = `<tr><td colspan="20" style="text-align: center; padding: 48px; color: var(--muted);"><div style="display:inline-block; width: 30px; height: 30px; border: 3px solid var(--mint-soft); border-radius: 50%; border-top-color: var(--teal); animation: spin 1s linear infinite; margin-bottom: 12px;"></div><br>Đang tải danh mục từ Google Sheets...</td></tr>`;
      el('catalogTableEmpty').style.display = 'none';

      callApi('GET', 'readSheetData', { sheetName: sheetName })
        .then((res) => {
          if (res.ok) {
            if (displaySheetName === 'DM_NhanSu') {
              const colIdx = res.headers.indexOf('DS_TaiXe_DangLam');
              if (colIdx !== -1) {
                res.headers.splice(colIdx, 1);
                res.rows = res.rows.map(r => {
                  const newVals = [...r.values];
                  newVals.splice(colIdx, 1);
                  return {
                    rowIndex: r.rowIndex,
                    values: newVals
                  };
                });
              }
            } else if (displaySheetName === 'DM_ThamSo_TS') {
              res.headers = ["Mã tham số", "Tên tham số", "Giá trị", "Ngày áp dụng tham số"];
              res.rows = res.rows.map(r => {
                return {
                  rowIndex: r.rowIndex,
                  values: [r.values[0], r.values[1], r.values[2], r.values[3]]
                };
              }).filter(r => String(r.values[0] || '').trim() !== '');
            } else if (displaySheetName === 'DM_ThamSo_GD') {
              res.headers = ["Giá dầu áp dụng", "Ngày áp dụng giá dầu", "Ghi chú"];
              res.rows = res.rows.map(r => {
                return {
                  rowIndex: r.rowIndex,
                  values: [r.values[6], r.values[5], r.values[7]]
                };
              }).filter(r => String(r.values[0] || '').trim() !== '');
            }
            
            currentCatalogData = res;
            renderCatalogTable();
          } else {
            tbody.innerHTML = `<tr><td colspan="20" style="text-align: center; color: var(--red); padding: 48px;">Lỗi: ${res.error}</td></tr>`;
          }
        })
        .catch((err) => {
          tbody.innerHTML = `<tr><td colspan="20" style="text-align: center; color: var(--red); padding: 48px;">Lỗi kết nối: ${err.message}</td></tr>`;
        });
    }

    function renderCatalogTable() {
      if (!currentCatalogData) return;
      const headers = [...currentCatalogData.headers];
      const rawRows = currentCatalogData.rows || [];
      
      let vehicleColIdx = -1;
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].toLowerCase().trim();
        if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
          vehicleColIdx = i;
          break;
        }
      }

      const showOwnerCol = (vehicleColIdx !== -1);
      const thead = el('catalogTableHeader');
      thead.innerHTML = '';
      
      headers.forEach((h, idx) => {
        const th = document.createElement('th');
        th.textContent = h;
        thead.appendChild(th);
        
        if (showOwnerCol && idx === vehicleColIdx) {
          const thOwner = document.createElement('th');
          thOwner.textContent = 'Công ty/Chủ xe';
          thead.appendChild(thOwner);
        }
      });
      
      const thActions = document.createElement('th');
      thActions.textContent = 'Thao tác';
      thActions.style.textAlign = 'center';
      thead.appendChild(thActions);

      const vehiclesByPlate = buildVehicleOwnerMap();
      filteredCatalogRowsData = rawRows.map(row => {
        let owner = '';
        if (showOwnerCol) {
          const plate = String(row.values[vehicleColIdx] || '').trim();
          owner = vehiclesByPlate[plate.toLowerCase()] || '';
        }
        return {
          ...row,
          owner: owner,
          searchText: removeAccents(row.values.concat(owner).join(' ').toLowerCase())
        };
      });

      filterCatalogRows();
    }

    function filterCatalogRows() {
      const query = el('catalogSearchInput').value.toLowerCase().trim();
      const tbody = el('catalogTableBody');
      tbody.innerHTML = '';
      
      let vehicleColIdx = -1;
      if (currentCatalogData) {
        for (let i = 0; i < currentCatalogData.headers.length; i++) {
          const h = currentCatalogData.headers[i].toLowerCase().trim();
          if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
            vehicleColIdx = i;
            break;
          }
        }
      }
      const showOwnerCol = (vehicleColIdx !== -1);

      const matched = filteredCatalogRowsData.filter(row => {
        if (!query) return true;
        return row.searchText.includes(removeAccents(query));
      });

      if (matched.length === 0) {
        el('catalogTableEmpty').style.display = 'block';
        return;
      }
      el('catalogTableEmpty').style.display = 'none';

      const fragment = document.createDocumentFragment();
      matched.forEach(row => {
        const tr = document.createElement('tr');
        
        row.values.forEach((val, idx) => {
          const td = document.createElement('td');
          
          const header = currentCatalogData.headers[idx];
          const headerLower = header.toLowerCase().trim();
          
          if (headerLower === 'tháng') {
            td.textContent = formatTableDate(val, true);
          } else if (headerLower.includes('ngày') || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val))) {
            td.textContent = formatTableDate(val, false);
          } else if (typeof val === 'number') {
            if (headerLower.includes('giá') || headerLower.includes('tiền') || headerLower.includes('phạt') || headerLower.includes('lương')) {
              td.textContent = Math.round(val).toLocaleString('vi-VN') + ' ₫';
              td.style.fontWeight = '600';
            } else {
              td.textContent = val.toLocaleString('vi-VN');
            }
          } else {
            td.textContent = val || '';
          }
          tr.appendChild(td);

          if (showOwnerCol && idx === vehicleColIdx) {
            const tdOwner = document.createElement('td');
            if (row.owner) {
              const span = document.createElement('span');
              span.className = `badge ${row.owner.toLowerCase().includes('quang quân') ? 'amber' : 'blue'}`;
              span.textContent = row.owner;
              tdOwner.appendChild(span);
            } else {
              tdOwner.textContent = '-';
            }
            tr.appendChild(tdOwner);
          }
        });

        const tdActions = document.createElement('td');
        tdActions.style.textAlign = 'center';
        tdActions.style.whiteSpace = 'nowrap';
        
        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'primary';
        btnEdit.style.padding = '4px 10px';
        btnEdit.style.fontSize = '12px';
        btnEdit.style.height = '28px';
        btnEdit.style.marginRight = '6px';
        btnEdit.textContent = 'Sửa';
        btnEdit.onclick = () => openManageEditModal(row);

        const btnDelete = document.createElement('button');
        btnDelete.type = 'button';
        btnDelete.className = 'danger';
        btnDelete.style.padding = '4px 10px';
        btnDelete.style.fontSize = '12px';
        btnDelete.style.height = '28px';
        btnDelete.textContent = 'Xóa';
        btnDelete.onclick = () => deleteManageRow(row.rowIndex);

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);
        tr.appendChild(tdActions);
        
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    // App Initializer
    function init() {
      // Auto-clear old local/session cache on version updates to prevent old URL conflicts
      const APP_VERSION = 'v3.2_report_prefetch';
      if (localStorage.getItem('eb_version') !== APP_VERSION) {
        localStorage.removeItem('eb_backend_url');
        localStorage.setItem('eb_version', APP_VERSION);
        sessionStorage.clear();
      }

      renderNav();
      setupConfigInput();
      
      const backendUrl = getBackendUrl();
      if (!backendUrl) {
        el('loader').querySelector('.loader-title').textContent = 'Chưa thiết lập kết nối';
        el('loader').querySelector('.loader-text').innerHTML = 
          'Vui lòng cấu hình link Apps Script trong Cài đặt.<br><a href="#" onclick="showSettingsFromLoader()" style="color:var(--teal);font-weight:bold;text-decoration:underline;display:inline-block;margin-top:10px;">Cấu hình ngay</a>';
        el('loader').querySelector('.spinner').classList.add('hidden');
        document.body.classList.remove('locked');
        return;
      }
      
      const cachedBootstrap = sessionStorage.getItem('eb_bootstrap');
      if (cachedBootstrap) {
        appData = JSON.parse(cachedBootstrap);
        activeForm = appData.formTypes[0] || 'vanChuyen';
        rows = [newBlankRow()];
        document.body.classList.remove('locked');
        el('loader').classList.add('hidden');
        renderAll();
        loadCatalogs(activeForm);
        loadDashboard(false);
      } else {
        callApi('GET', 'getBootstrap')
          .then((data) => {
            appData = data;
            sessionStorage.setItem('eb_bootstrap', JSON.stringify(data));
            activeForm = data.formTypes[0] || 'vanChuyen';
            rows = [newBlankRow()];
            document.body.classList.remove('locked');
            el('loader').classList.add('hidden');
            renderAll();
            loadCatalogs(activeForm);
            loadDashboard(false);
          })
          .catch((err) => {
            el('loader').querySelector('.loader-title').textContent = 'Lỗi kết nối API';
            el('loader').querySelector('.loader-text').innerHTML = 
              `Không thể đồng bộ với Google Sheets.<br>Chi tiết: ${err.message}<br><a href="#" onclick="showSettingsFromLoader()" style="color:var(--teal);font-weight:bold;text-decoration:underline;display:inline-block;margin-top:10px;">Kiểm tra cài đặt URL</a>`;
            el('loader').querySelector('.spinner').classList.add('hidden');
            document.body.classList.remove('locked');
          });
      }
    }

    let html2CanvasLoader = null;
    function loadHtml2Canvas() {
      if (window.html2canvas) return Promise.resolve(window.html2canvas);
      if (html2CanvasLoader) return html2CanvasLoader;
      html2CanvasLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js';
        script.async = true;
        script.onload = () => resolve(window.html2canvas);
        script.onerror = () => reject(new Error('Không thể tải thư viện xuất ảnh.'));
        document.head.appendChild(script);
      });
      return html2CanvasLoader;
    }

    function restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions) {
      headActions.forEach(el => el.style.visibility = 'visible');
      card.style.width = originalCardStyleWidth;
      if (tableWrap) {
        if (originalWrapStyle !== null) {
          tableWrap.setAttribute('style', originalWrapStyle);
        } else {
          tableWrap.removeAttribute('style');
        }
      }
      if (table) {
        if (originalTableStyle !== null) {
          table.setAttribute('style', originalTableStyle);
        } else {
          table.removeAttribute('style');
        }
      }
      stickyEls.forEach((el, index) => {
        const orig = originalStickyStyles[index];
        el.style.position = orig.position;
        el.style.left = orig.left;
        el.style.boxShadow = orig.boxShadow;
      });
      btn.disabled = false;
      btn.innerHTML = originalText;
    }

    function exportCardAsImage(btn, type) {
      const card = btn.closest('.table-card');
      if (!card) return;
      
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="btn-svg" style="width: 16px; height: 16px; animation: spin 0.8s linear infinite;" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
      `;
      
      const headActions = card.querySelectorAll('.table-card-head a, .table-card-head button');
      headActions.forEach(el => el.style.visibility = 'hidden');
      
      const tableWrap = card.querySelector('.table-wrap');
      const table = card.querySelector('table');
      const originalCardStyleWidth = card.style.width;
      const originalWrapStyle = tableWrap ? tableWrap.getAttribute('style') : null;
      const originalTableStyle = table ? table.getAttribute('style') : null;
      
      if (table && tableWrap) {
        const scrollWidth = table.scrollWidth;
        const clientWidth = tableWrap.clientWidth;
        if (scrollWidth > clientWidth) {
          card.style.width = (scrollWidth + 32) + 'px';
          tableWrap.style.overflow = 'visible';
          tableWrap.style.width = 'auto';
          table.style.width = '100%';
          table.style.minWidth = '0';
        }
      }
      
      const stickyEls = card.querySelectorAll('th:first-child, td:first-child');
      const originalStickyStyles = [];
      stickyEls.forEach(el => {
        originalStickyStyles.push({ el, position: el.style.position, left: el.style.left, boxShadow: el.style.boxShadow });
        el.style.position = 'static';
        el.style.boxShadow = 'none';
      });

      loadHtml2Canvas()
        .then(() => window.html2canvas(card, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        }))
        .then((canvas) => {
          restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions);
          const link = document.createElement('a');
          const filename = `BaoCao_${type}_${new Date().toISOString().slice(0, 10)}.png`;
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        })
        .catch((err) => {
          console.error('Chụp ảnh thất bại:', err);
          alert('Lỗi xuất ảnh: ' + err.message);
          restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions);
        });
    }

    // Dashboard rendering
    function renderHomeSummaryTable(matrix) {
      const table = el('homeSummaryTable');
      if (!table) return;
      
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      const tableRows = matrix || [];
      const body = tableRows.slice(2); // Skip empty padding row and header row
      
      if (!body.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: var(--muted); padding: 24px;">Chưa có dữ liệu báo cáo tài chính.</td></tr>';
        return;
      }
      
      body.forEach((row) => {
        const tr = document.createElement('tr');
        for (let i = 0; i < 11; i++) {
          const td = document.createElement('td');
          if (i === 8) {
            const rev = parseMoney(row[2]);
            const taxTndn = parseMoney(row[3]);
            const taxVat = parseMoney(row[4]);
            const fuelQM = parseMoney(row[5]);
            const toll = parseMoney(row[7]);
            const calculatedGross = rev - taxTndn - taxVat - fuelQM - toll;
            td.textContent = formatCurrencyText(calculatedGross);
          } else {
            td.textContent = row[i] || '';
          }
          
          if (i === 0) {
            td.style.fontWeight = '700';
            td.style.color = 'var(--deep)';
          } else if (i === 2 || i === 8 || i === 10) {
            td.style.color = 'var(--green)';
            td.style.fontWeight = '600';
          } else if (i === 3 || i === 4 || i === 5 || i === 6 || i === 7 || i === 9) {
            td.style.color = 'var(--red)';
            td.style.fontWeight = '400';
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

      const warningSvg = `<svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

    function renderProfitChart(rows) {
      const holder = el('profitChart');
      holder.innerHTML = '';
      
      if (getDashboardData().loading) {
        holder.innerHTML = '<div class="shimmer shimmer-chart"></div>';
        return;
      }
      
      const data = rows.filter((row) => row.month).slice(-12);
      if (!data.length) {
        holder.innerHTML = '<div class="panel-note">Chưa có dữ liệu báo cáo lợi nhuận.</div>';
        return;
      }
      
      const step = 500000000;
      const maxValue = Math.max(...data.map((row) => Math.abs(row.final || 0)), 1);
      const max = Math.max(step, Math.ceil(maxValue / step) * step);
      
      const formatShortMoney = (val) => {
        const absVal = Math.abs(val);
        if (absVal >= 1e9) {
          return (val / 1e9).toFixed(1).replace('.', ',').replace(',0', '') + ' tỷ';
        }
        if (absVal >= 1e6) {
          return (val / 1e6).toFixed(0) + ' tr';
        }
        if (absVal >= 1e3) {
          return (val / 1e3).toFixed(0) + ' k';
        }
        return val + ' đ';
      };
      
      const wrapper = document.createElement('div');
      wrapper.className = 'chart-wrapper';
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'flex-end';
      wrapper.style.position = 'relative';
      wrapper.style.marginTop = '10px';
      
      // Static Y-Axis
      const yAxis = document.createElement('div');
      yAxis.className = 'chart-y-axis';
      yAxis.style.display = 'flex';
      yAxis.style.flexDirection = 'column';
      yAxis.style.justifyContent = 'space-between';
      yAxis.style.height = '130px';
      yAxis.style.paddingRight = '12px';
      yAxis.style.textAlign = 'right';
      yAxis.style.width = '60px';
      yAxis.style.color = 'var(--muted)';
      yAxis.style.fontSize = '10px';
      yAxis.style.fontWeight = '600';
      yAxis.style.marginBottom = '23px';
      yAxis.style.flexShrink = '0';
      yAxis.style.borderRight = '1px solid var(--line)';
      
      const ticks = [];
      for (let value = max; value >= 0; value -= step) {
        ticks.push(value);
      }
      yAxis.innerHTML = ticks.map((value) => `<div>${formatShortMoney(value)}</div>`).join('');
      
      // Chart Area
      const chartArea = document.createElement('div');
      chartArea.className = 'chart-area';
      chartArea.style.flex = '1';
      chartArea.style.position = 'relative';
      chartArea.style.overflowX = 'auto';
      
      // Grid Lines
      const gridLines = document.createElement('div');
      gridLines.className = 'chart-grid-lines';
      gridLines.style.position = 'absolute';
      gridLines.style.left = '0';
      gridLines.style.right = '0';
      gridLines.style.height = '130px';
      gridLines.style.bottom = '23px';
      gridLines.style.display = 'flex';
      gridLines.style.flexDirection = 'column';
      gridLines.style.justifyContent = 'space-between';
      gridLines.style.pointerEvents = 'none';
      gridLines.style.zIndex = '1';
      
      gridLines.innerHTML = ticks.map((value) => {
        const weight = value === 0 ? '2px solid var(--muted)' : '1px dashed var(--line)';
        return `<div style="border-bottom: ${weight}; width: 100%;"></div>`;
      }).join('');
      
      // Columns
      const chartContainer = document.createElement('div');
      chartContainer.className = 'chart-v';
      chartContainer.style.position = 'relative';
      chartContainer.style.zIndex = '2';
      chartContainer.style.background = 'transparent';
      chartContainer.style.display = 'flex';
      chartContainer.style.alignItems = 'flex-end';
      chartContainer.style.justifyContent = 'space-around';
      chartContainer.style.height = '175px';
      chartContainer.style.width = '100%';
      chartContainer.style.paddingTop = '0';
      chartContainer.style.paddingBottom = '0';
      chartContainer.style.gap = '8px';
      
      data.forEach((row) => {
        const col = document.createElement('div');
        col.className = 'chart-col';
        const pct = Math.max(2, Math.round(Math.abs(row.final || 0) / max * 100));
        const color = row.final < 0 
          ? 'linear-gradient(180deg, #f87171, var(--red))' 
          : 'linear-gradient(180deg, var(--teal), var(--deep-2))';
          
        col.innerHTML = `
          <div class="bar-value" style="${row.final < 0 ? 'color: var(--red);' : 'color: var(--teal);'}">${escapeHtml(formatCurrencyText(row.final || 0))}</div>
          <div class="bar-track-v">
            <div class="bar-fill-v" style="height:${pct}%; background:${color}; width: 100%;"></div>
          </div>
          <div class="bar-label">${escapeHtml(row.month)}</div>
        `;
        chartContainer.appendChild(col);
      });
      
      chartArea.appendChild(gridLines);
      chartArea.appendChild(chartContainer);
      
      wrapper.appendChild(yAxis);
      wrapper.appendChild(chartArea);
      
      holder.appendChild(wrapper);
    }

    function renderQuickActions(inputStats) {
      const holders = [el('quickActions'), el('mobileQuickActions')].filter(Boolean);
      holders.forEach((holder) => holder.innerHTML = '');

          holder.appendChild(buildQuickAction(type, stat));

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action-card';
      
      const rowCountText = stat.rows === undefined 
        ? '...' 
        : Number(stat.rows || 0).toLocaleString('vi-VN') + ' dòng';
        
      button.innerHTML = `
        <span class="action-row">
          <span class="action-icon">${FORM_ICONS[type]}</span>
          <span class="action-count">${rowCountText}</span>
        </span>
        <span>
          <span class="action-label">${escapeHtml(FORM_LABELS[type])}</span>
          <span class="action-note">Mới nhất: ${escapeHtml(stat.latestText || 'Đang tải...')}</span>
        </span>
      `;
      
      button.onclick = () => {
        activeForm = type;
        rows = [newBlankRow()];
        setView('entry');

      return button;

    function renderEntry() {
      el('formTitle').textContent = `Nhập bảng kê: ${FORM_LABELS[activeForm]}`;
      const catalogsReady = Boolean(catalogsByForm[activeForm]);
      el('formSummary').textContent = `${FORM_NOTES[activeForm]}. Đang lập ${rows.length} dòng kê.`;
      
      const holder = el('rows');
      holder.innerHTML = '';
      
      if (!catalogsReady) {
        const note = document.createElement('div');
        note.className = 'loading-note';
        note.textContent = 'Đang đồng bộ danh mục từ Google Sheets. Bạn có thể bắt đầu điền thông tin, ô tìm kiếm sẽ sẵn sàng ngay sau khi tải xong.';
        holder.appendChild(note);
      }
      
      rows.forEach((row, index) => {
        holder.appendChild(renderRow(row, index));
      });

    function renderRecentSubmissions(holder) {
      if (!recentSubmissions.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'recent-list';
      wrap.innerHTML = '<div class="panel-note" style="font-weight: 700;">Nhật ký giao dịch vừa thực hiện</div>';
      
      recentSubmissions.slice(0, 5).forEach((item) => {
        const row = document.createElement('div');
        row.className = 'recent-item';
        row.textContent = item;
        wrap.appendChild(row);
      });
      holder.appendChild(wrap);
    }

    function getEntryRowExtraTitle(row) {
      if (!row) return '';
      const c = getCurrentCatalogs();

      if (activeForm === 'dau') {
        const liters = parseLocaleNumber(row.liters) || 0;
        const price = parseLocaleNumber(row.price) || 0;
        const total = liters * price;
        if (total > 0) {
          return ` &mdash; <span style="color: var(--teal); font-weight: 700;">Thành tiền: ${Math.round(total).toLocaleString('vi-VN')} ₫</span>`;
        }
      }

      if (activeForm === 'chamCong') {
        let parts = [];
        if (row.fromDate && row.toDate) {
          const d1 = new Date(row.fromDate);
          const d2 = new Date(row.toDate);
          if (!isNaN(d1.getTime()) && !isNaN(d2.getTime()) && d2 >= d1) {
            const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            parts.push(`Số ngày nghỉ: <span style="color: var(--teal); font-weight: 700;">${diffDays} ngày</span>`);
          }
        }
        if (row.workdayType && c && c.chamCongTypes) {
          const typeObj = c.chamCongTypes.find(t => t.name === row.workdayType);
          if (typeObj) {
            parts.push(`Lương cứng: <span style="color: var(--blue); font-weight: 700;">${typeObj.salary}</span>`);
            if (typeObj.group) {
              parts.push(`Nhóm: <span style="color: var(--deep); font-weight: 600;">${typeObj.group}</span>`);
            }
          }
        }
        if (parts.length > 0) {
          return ' &mdash; ' + parts.join(' | ');
        }
      }

      if (activeForm === 'phat' && row.penaltyCode && c && c.penalties) {
        const penObj = c.penalties.find(p => p.code === row.penaltyCode);
        if (penObj) {
          return ` &mdash; <span style="color: var(--deep); font-weight: 600;">${penObj.content}</span> | <span style="color: var(--red); font-weight: 700;">Số tiền phạt: ${Math.round(penObj.amount).toLocaleString('vi-VN')} ₫</span>`;
        }
      }

      if (activeForm === 'nghiVanHanh' && row.hours) {
        const hours = parseLocaleNumber(row.hours) || 0;
        if (hours > 0) {
          const hoursPerTrip = (c && c.params && c.params.SO_GIO_1_CHUYEN_KPI) || 4;
          const estReduce = hours / hoursPerTrip;
          return ` &mdash; <span style="color: var(--amber); font-weight: 700;">Giảm KPI dự kiến: ${estReduce.toFixed(1)} chuyến</span>`;
        }
      }

      return '';
    }

    function renderRow(row, index) {
      const card = document.createElement('article');
      card.className = 'entry-row';
      
      const head = document.createElement('div');
      head.className = 'entry-row-head';
      
      const extraTitleHtml = getEntryRowExtraTitle(row);
      
      head.innerHTML = `<div class="entry-row-title"><span class="row-number">${index + 1}</span><span>Dòng chứng từ<span class="entry-row-extra-title-${index}">${extraTitleHtml}</span></span></div>`;
      
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = 'Xóa';
      remove.disabled = rows.length === 1;
      remove.onclick = () => { 
        rows.splice(index, 1); 
        renderEntry(); 
      };
      
      head.appendChild(remove);
      card.appendChild(head);
      
      const grid = document.createElement('div');
      grid.className = 'fields';
      
      FIELD_SETS[activeForm].forEach(([key, label, kind]) => {
        grid.appendChild(renderField(row, index, key, label, kind));
      });
      
      card.appendChild(grid);
      return card;
    }

    function renderField(row, index, key, label, kind) {
      const wrap = document.createElement('label');
      if (kind === 'textarea') wrap.className = 'full';
      wrap.appendChild(document.createTextNode(label));
      
      if (kind.startsWith('select:')) {
        const acWrap = document.createElement('div');
        const sourceName = kind.split(':')[1];
        
        if (catalogsByForm[activeForm]) {
          createAutocomplete(acWrap, getOptions(sourceName), row[key], (newValue) => {
            rows[index][key] = newValue;
            handleFieldChange(index, key);
          });
        } else {
          acWrap.innerHTML = '<input type="text" class="ac-input" placeholder="Đang tải danh mục..." disabled>';
        }
        wrap.appendChild(acWrap);
      } else {
        const input = document.createElement(kind === 'textarea' ? 'textarea' : 'input');
        input.type = kind === 'number' ? 'text' : kind;
        if (kind === 'number') input.inputMode = 'decimal';
        input.value = row[key] || '';
        
        input.oninput = () => {
          rows[index][key] = input.value;
          handleFieldChange(index, key);
        };
        wrap.appendChild(input);
      }
      
      return wrap;
    }
