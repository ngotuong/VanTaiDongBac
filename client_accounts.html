<script>
    function getCurrentRole() {
      return String(currentAuthUser?.role || 'operator').trim().toLowerCase();
    }

    function getRoleLabel(role) {
      return ({ admin: 'Quản trị viên', operator: 'Nhân viên vận hành', shareholder: 'Cổ đông (chỉ xem)' })[role] || role;
    }

    function isAdminUser() {
      return getCurrentRole() === 'admin';
    }

    function isShareholderUser() {
      return getCurrentRole() === 'shareholder';
    }

    function canWriteData() {
      return !isShareholderUser();
    }

    function applyRoleUi() {
      document.querySelectorAll('[data-admin-only]').forEach((node) => {
        node.hidden = !isAdminUser();
      });
      document.querySelectorAll('[data-write-only]').forEach((node) => {
        node.hidden = !canWriteData();
      });
      document.querySelectorAll('[data-hide-shareholder]').forEach((node) => {
        node.hidden = isShareholderUser();
      });
    }

    function requireWritePermission() {
      if (canWriteData()) return true;
      showSyncToast('Tài khoản cổ đông chỉ có quyền xem dữ liệu.', 'error');
      return false;
    }

    function togglePasswordVisibility(inputId, button) {
      const input = el(inputId);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? 'Hiện' : 'Ẩn';
      button.setAttribute('aria-label', showing ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
    }

    function setAccountStatus(message, type) {
      const status = el('accountSettingsStatus');
      if (!status) return;
      status.textContent = message || '';
      status.className = `account-settings-status ${type || ''}`.trim();
    }

    function loadAccountSettings() {
      applyRoleUi();
      const identity = el('currentAccountIdentity');
      if (identity) {
        identity.textContent = `${currentAuthUser?.displayName || currentAuthUser?.username || ''} · ${getRoleLabel(getCurrentRole())}`;
      }
      if (isAdminUser()) return loadUsers();
      return Promise.resolve(null);
    }

    async function changeOwnPassword() {
      const currentPassword = el('currentPasswordInput')?.value || '';
      const newPassword = el('newPasswordInput')?.value || '';
      const confirmPassword = el('confirmPasswordInput')?.value || '';
      if (!currentPassword) return setAccountStatus('Vui lòng nhập mật khẩu hiện tại.', 'error');
      if (newPassword.length < 12) return setAccountStatus('Mật khẩu mới phải có ít nhất 12 ký tự.', 'error');
      if (newPassword !== confirmPassword) return setAccountStatus('Mật khẩu xác nhận chưa khớp.', 'error');
      const button = el('changePasswordBtn');
      if (button) {
        button.disabled = true;
        button.textContent = 'Đang đổi...';
      }
      setAccountStatus('Đang xác thực mật khẩu hiện tại...', '');
      try {
        const result = await callApi('POST', 'changeOwnPassword', {}, { currentPassword, newPassword });
        ['currentPasswordInput', 'newPasswordInput', 'confirmPasswordInput'].forEach((id) => { if (el(id)) el(id).value = ''; });
        setAccountStatus(result.message || 'Đã đổi mật khẩu thành công.', 'success');
      } catch (err) {
        setAccountStatus(err.message || 'Không đổi được mật khẩu.', 'error');
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Đổi mật khẩu';
        }
      }
    }

    async function loadUsers() {
      if (!isAdminUser()) return;
      const body = el('accountUsersBody');
      if (body) body.innerHTML = '<tr><td colspan="5" class="account-table-message">Đang tải tài khoản...</td></tr>';
      try {
        const result = await callApi('GET', 'listUsers');
        renderUsers(result.users || []);
      } catch (err) {
        if (body) body.innerHTML = `<tr><td colspan="5" class="account-table-message error">${escapeHtml(err.message || err)}</td></tr>`;
      }
    }

    function renderUsers(users) {
      const body = el('accountUsersBody');
      if (!body) return;
      if (!users.length) {
        body.innerHTML = '<tr><td colspan="5" class="account-table-message">Chưa có tài khoản.</td></tr>';
        return;
      }
      body.innerHTML = users.map((user) => {
        const token = encodeURIComponent(user.user_id);
        return `
          <tr data-user-id="${escapeHtml(user.user_id)}">
            <td><strong>${escapeHtml(user.username || '')}</strong></td>
            <td><input class="account-inline-input" data-field="displayName" value="${escapeHtml(user.display_name || '')}" aria-label="Tên hiển thị của ${escapeHtml(user.username || '')}"></td>
            <td>
              <select class="account-inline-input" data-field="role" aria-label="Vai trò của ${escapeHtml(user.username || '')}">
                <option value="admin"${user.role === 'admin' ? ' selected' : ''}>Quản trị viên</option>
                <option value="operator"${user.role === 'operator' ? ' selected' : ''}>Nhân viên vận hành</option>
                <option value="shareholder"${user.role === 'shareholder' ? ' selected' : ''}>Cổ đông (chỉ xem)</option>
              </select>
            </td>
            <td><label class="account-active-toggle"><input type="checkbox" data-field="active"${user.active ? ' checked' : ''}> <span>${user.active ? 'Đang dùng' : 'Đã khóa'}</span></label></td>
            <td class="account-row-actions">
              <button type="button" class="ghost" onclick="saveUser('${token}', this)">Lưu</button>
              <button type="button" class="ghost" onclick="resetUserPassword('${token}', this)">Đặt lại MK</button>
            </td>
          </tr>`;
      }).join('');
    }

    async function createUserAccount() {
      const username = String(el('newAccountUsername')?.value || '').trim().toLowerCase();
      const displayName = String(el('newAccountDisplayName')?.value || '').trim();
      const role = el('newAccountRole')?.value || 'shareholder';
      const password = el('newAccountPassword')?.value || '';
      if (!/^[a-z0-9._-]{3,40}$/.test(username)) return setAccountStatus('Tên đăng nhập không hợp lệ.', 'error');
      if (!displayName) return setAccountStatus('Vui lòng nhập tên hiển thị.', 'error');
      if (password && password.length < 12) return setAccountStatus('Mật khẩu tự nhập phải có ít nhất 12 ký tự.', 'error');
      const button = el('createAccountBtn');
      if (button) {
        button.disabled = true;
        button.textContent = 'Đang tạo...';
      }
      try {
        const result = await callApi('POST', 'createUser', {}, { username, displayName, role, password });
        ['newAccountUsername', 'newAccountDisplayName', 'newAccountPassword'].forEach((id) => { if (el(id)) el(id).value = ''; });
        showTemporaryPassword(username, result.temporaryPassword);
        setAccountStatus(`Đã tạo tài khoản ${username}.`, 'success');
        await loadUsers();
      } catch (err) {
        setAccountStatus(err.message || 'Không tạo được tài khoản.', 'error');
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Tạo tài khoản';
        }
      }
    }

    async function saveUser(encodedUserId, button) {
      const userId = decodeURIComponent(encodedUserId);
      const row = button.closest('tr');
      const displayName = row.querySelector('[data-field="displayName"]').value.trim();
      const role = row.querySelector('[data-field="role"]').value;
      const active = row.querySelector('[data-field="active"]').checked;
      button.disabled = true;
      try {
        await callApi('POST', 'updateUser', {}, { userId, displayName, role, active });
        setAccountStatus('Đã cập nhật quyền tài khoản.', 'success');
        await loadUsers();
      } catch (err) {
        setAccountStatus(err.message || 'Không cập nhật được tài khoản.', 'error');
      } finally {
        button.disabled = false;
      }
    }

    async function resetUserPassword(encodedUserId, button) {
      const userId = decodeURIComponent(encodedUserId);
      const row = button.closest('tr');
      const username = row.querySelector('strong')?.textContent || '';
      if (!confirm(`Đặt lại mật khẩu cho tài khoản ${username}?`)) return;
      button.disabled = true;
      try {
        const result = await callApi('POST', 'resetUserPassword', {}, { userId });
        showTemporaryPassword(username, result.temporaryPassword);
        setAccountStatus(`Đã đặt lại mật khẩu cho ${username}.`, 'success');
      } catch (err) {
        setAccountStatus(err.message || 'Không đặt lại được mật khẩu.', 'error');
      } finally {
        button.disabled = false;
      }
    }

    function showTemporaryPassword(username, password) {
      const box = el('temporaryPasswordBox');
      const value = el('temporaryPasswordValue');
      const account = el('temporaryPasswordAccount');
      if (box) box.hidden = false;
      if (value) value.textContent = password || '';
      if (account) account.textContent = username || '';
    }

    async function copyTemporaryPassword() {
      const value = el('temporaryPasswordValue')?.textContent || '';
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        setAccountStatus('Đã sao chép mật khẩu tạm.', 'success');
      } catch (err) {
        setAccountStatus('Không thể tự sao chép. Hãy chọn và sao chép thủ công.', 'error');
      }
    }
</script>
