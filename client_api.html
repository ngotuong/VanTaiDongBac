<script>
    // API REST Request Layer
    function hasAppsScriptRuntime() {
      return typeof google !== 'undefined'
        && google.script
        && google.script.run
        && typeof google.script.run.withSuccessHandler === 'function';
    }

    function normalizeWebAppUrl(rawUrl) {
      if (!rawUrl) return '';
      try {
        const url = new URL(rawUrl);
        url.search = '';
        url.hash = '';
        return url.toString();
      } catch (err) {
        return '';
      }
    }

    const DEFAULT_BACKEND_URL = normalizeWebAppUrl(window.__DEFAULT_APP_SERVICE_URL);
    
    const getBackendUrl = () => {
      return normalizeWebAppUrl(window.__APP_SERVICE_URL)
        || DEFAULT_BACKEND_URL;
    };

    function getBackendUrlSource() {
      const appUrl = normalizeWebAppUrl(window.__APP_SERVICE_URL);
      if (appUrl) return 'app';
      return DEFAULT_BACKEND_URL ? 'default' : '';
    }

    function isAuthEnabled() {
      return normalizeSupabaseEnabledFlag((window.__SUPABASE_CONFIG || {}).authEnabled);
    }

    function getApiEndpoint() {
      return isAuthEnabled() && !hasAppsScriptRuntime() ? '/api/app' : getBackendUrl();
    }

    function getSupabaseAccessToken() {
      const client = getSupabaseClient();
      if (!client || !isAuthEnabled()) return Promise.resolve('');
      return client.auth.getSession().then(({ data }) => data?.session?.access_token || '');
    }

    function callAppsScriptAction(method, action, params = {}, bodyData = null) {
      if (!hasAppsScriptRuntime()) {
        return Promise.reject(new Error('google.script.run unavailable'));
      }

      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler((data) => {
            if (data && data.ok === false) {
              reject(new Error(data.error || 'Lỗi API hệ thống.'));
              return;
            }
            resolve(data);
          })
          .withFailureHandler((err) => {
            reject(new Error(err && err.message ? err.message : String(err || 'Lỗi gọi Apps Script.')));
          })
          .invokeApi(method, action, params || {}, bodyData || null);
      });
    }

    function callFetchApi(method, action, params = {}, bodyData = null) {
      const backendUrl = getApiEndpoint();
      if (!backendUrl) {
        return Promise.reject(new Error('Chưa cấu hình đường dẫn Web App trong Cài đặt!'));
      }
      
      let url = new URL(backendUrl, window.location.origin);
      url.searchParams.set('action', action);
      Object.keys(params).forEach(k => {
        url.searchParams.set(k, params[k]);
      });
      if (params.forceRefresh === true || params.forceRefresh === 'true') {
        url.searchParams.set('_ts', Date.now());
      }
      
      return getSupabaseAccessToken().then((accessToken) => {
        const usingProxy = isAuthEnabled() && !hasAppsScriptRuntime();
        const options = {
          method: method,
          headers: {
            'Content-Type': usingProxy ? 'application/json;charset=UTF-8' : 'text/plain;charset=UTF-8'
          }
        };
        if (accessToken) options.headers.Authorization = 'Bearer ' + accessToken;
        if (bodyData) options.body = JSON.stringify({ action: action, ...bodyData });
        return fetch(url.toString(), options);
      })
        .then(async (res) => {
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            if (res.status === 401 && isAuthEnabled()) {
              const client = getSupabaseClient();
              if (client) await client.auth.signOut();
              sessionStorage.clear();
              showAuthGate('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
            }
            throw new Error(data?.error || `Kết nối API thất bại, status: ${res.status}. URL: ${backendUrl}`);
          }
          return data;
        })
        .then(data => {
          if (data && data.ok === false) {
            throw new Error(data.error || 'Lỗi API hệ thống.');
          }
          return data;
        })
        .catch((err) => {
          const fallbackResult = buildFetchPostFallbackResult_(method, action, bodyData, backendUrl, err);
          if (fallbackResult) return fallbackResult;
          throw err;
        });
    }

    function callApi(method, action, params = {}, bodyData = null) {
      const normalizedMethod = String(method || '').toUpperCase();
      if (hasAppsScriptRuntime()) {
        return callAppsScriptAction(normalizedMethod, action, params, bodyData);
      }
      return callFetchApi(normalizedMethod, action, params, bodyData);
    }

    function normalizeSupabaseEnabledFlag(value) {
      const text = String(value || '').trim().toLowerCase();
      return ['1', 'true', 'yes', 'on'].includes(text);
    }

    function getSupabaseConfig() {
      const cfg = window.__SUPABASE_CONFIG || {};
      return {
        url: String(cfg.url || '').trim(),
        anonKey: String(cfg.anonKey || '').trim(),
        reportsEnabled: normalizeSupabaseEnabledFlag(cfg.reportsEnabled),
        authEnabled: normalizeSupabaseEnabledFlag(cfg.authEnabled)
      };
    }

    function getSupabaseReportStatus() {
      const cfg = getSupabaseConfig();
      if (!cfg.reportsEnabled) return { ok: false, reason: 'VITE_SUPABASE_REPORTS_ENABLED chưa bật hoặc chưa được build vào frontend.' };
      if (!cfg.url) return { ok: false, reason: 'Thiếu VITE_SUPABASE_URL trên frontend.' };
      if (!cfg.anonKey) return { ok: false, reason: 'Thiếu VITE_SUPABASE_ANON_KEY trên frontend.' };
      return { ok: true, reason: '' };
    }

    function canUseSupabaseReports() {
      return getSupabaseReportStatus().ok;
    }

    let supabaseClientInstance = null;
    function getSupabaseClient() {
      const cfg = getSupabaseConfig();
      if (!cfg.url || !cfg.anonKey) return null;
      if (!window.supabase || !window.supabase.createClient) return null;
      if (!supabaseClientInstance) {
        supabaseClientInstance = window.supabase.createClient(cfg.url, cfg.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
      }
      return supabaseClientInstance;
    }

    function setAuthStatus(message, isError) {
      const status = document.getElementById('authStatus');
      if (!status) return;
      status.textContent = message || '';
      status.style.color = isError ? 'var(--red)' : 'var(--muted)';
    }

    function showAuthGate(message) {
      document.getElementById('authGate')?.classList.remove('hidden');
      document.querySelector('.app')?.classList.add('hidden');
      document.getElementById('loader')?.classList.add('hidden');
      setApplicationInert_(true);
      document.body.classList.add('auth-locked');
      document.body.classList.remove('locked');
      setAuthStatus(message || '', Boolean(message));
      restoreRememberedUsername();
      document.getElementById('authUsername')?.focus();
    }

    function restoreRememberedUsername() {
      try {
        const input = document.getElementById('authUsername');
        const saved = localStorage.getItem('dongbac_auth_username') || '';
        if (input && !input.value && saved) input.value = saved;
      } catch (err) {}
    }

    function hideAuthGate(user) {
      currentAuthUser = user || null;
      try {
        if (user?.username) localStorage.setItem('dongbac_auth_username', String(user.username));
      } catch (err) {}
      document.body.dataset.role = getCurrentRole();
      setApplicationInert_(false);
      document.body.classList.remove('auth-locked');
      document.getElementById('authGate')?.classList.add('hidden');
      document.querySelector('.app')?.classList.remove('hidden');
      const panel = document.getElementById('authUserPanel');
      if (panel) panel.classList.remove('hidden');
      const email = document.getElementById('authUserEmail');
      if (email) email.textContent = `${user?.displayName || user?.username || ''} · ${getRoleLabel(getCurrentRole())}`;
      applyRoleUi();
    }

    function setApplicationInert_(isInert) {
      Array.from(document.body.children).forEach((element) => {
        if (element.id === 'authGate' || element.tagName === 'SCRIPT') return;
        if (isInert) {
          element.setAttribute('inert', '');
          element.setAttribute('aria-hidden', 'true');
          element.dataset.authInert = 'true';
        } else if (element.dataset.authInert === 'true') {
          element.removeAttribute('inert');
          element.removeAttribute('aria-hidden');
          delete element.dataset.authInert;
        }
      });
    }

    async function signInWithUsername() {
      const client = getSupabaseClient();
      if (!client) return setAuthStatus('Thiếu cấu hình Supabase Auth.', true);
      const username = String(document.getElementById('authUsername')?.value || '').trim().toLowerCase();
      const password = String(document.getElementById('authPassword')?.value || '');
      if (!/^[a-z0-9._-]{3,40}$/.test(username)) return setAuthStatus('Tên đăng nhập không hợp lệ.', true);
      if (!password) return setAuthStatus('Vui lòng nhập mật khẩu.', true);
      const button = document.getElementById('usernameSignInBtn');
      if (button) button.disabled = true;
      setAuthStatus('Đang xác thực...', false);
      const { error } = await client.auth.signInWithPassword({
        email: username + '@dongbac.internal',
        password: password
      });
      if (error) {
        if (button) button.disabled = false;
        setAuthStatus('Tên đăng nhập hoặc mật khẩu không đúng.', true);
        return;
      }
      try { localStorage.setItem('dongbac_auth_username', username); } catch (err) {}
      window.location.reload();
    }

    async function signOutCurrentUser() {
      const client = getSupabaseClient();
      if (client) await client.auth.signOut();
      sessionStorage.clear();
      showAuthGate('Bạn đã đăng xuất.');
    }

    async function bootstrapAuthenticatedApp() {
      if (!isAuthEnabled()) {
        document.getElementById('authGate')?.classList.add('hidden');
        init();
        return;
      }
      const client = getSupabaseClient();
      if (!client) {
        showAuthGate('Supabase Auth chưa được cấu hình trên frontend.');
        return;
      }
      const { data, error } = await client.auth.getSession();
      if (error || !data?.session) {
        showAuthGate(error?.message || '');
        return;
      }
      try {
        const result = await callFetchApi('GET', 'authSession');
        hideAuthGate(result.user || data.session.user);
        init();
      } catch (err) {
        await client.auth.signOut();
        showAuthGate(err.message || 'Tài khoản chưa được cấp quyền.');
      }
    }

    function readSupabaseRows(tableName, filters, selectColumns) {
      const status = getSupabaseReportStatus();
      if (!status.ok) return Promise.reject(new Error(status.reason || 'Supabase chưa được bật.'));
      const cfg = getSupabaseConfig();
      const baseUrl = cfg.url.replace(/\/+$/, '');
      const url = new URL(`${baseUrl}/rest/v1/${encodeURIComponent(tableName)}`);
      url.searchParams.set('select', selectColumns || 'payload,synced_at');
      Object.keys(filters || {}).forEach((key) => {
        url.searchParams.set(key, 'eq.' + String(filters[key]));
      });
      url.searchParams.set('order', 'synced_at.desc');
      url.searchParams.set('limit', '1');
      return getSupabaseAccessToken().then((accessToken) => fetch(url.toString(), {
        method: 'GET',
        headers: {
          apikey: cfg.anonKey,
          Authorization: 'Bearer ' + (accessToken || cfg.anonKey),
          Accept: 'application/json'
        }
      })).then((res) => {
        if (!res.ok) {
          return res.text().then((text) => {
            throw new Error(`Supabase đọc cache thất bại, status: ${res.status}. ${text || ''}`);
          });
        }
        return res.json();
      });
    }

    function readReportBundleFromSupabase(month) {
      const reportMonth = String(month || '').trim() || 'latest';
      const filters = { report_month: reportMonth };
      const spreadsheetId = getCurrentSpreadsheetIdForSupabase();
      if (spreadsheetId) filters.spreadsheet_id = spreadsheetId;
      return readSupabaseRows('report_bundles', filters, 'report_month,payload,synced_at')
        .then((rows) => {
          const data = rows && rows[0];
          if (!data || !data.payload) {
            throw new Error('Chưa có report bundle trong Supabase cho tháng ' + reportMonth + '.');
          }
          return {
            ...data.payload,
            supabaseCached: true,
            supabaseSyncedAt: data.synced_at
          };
        });
    }

    function readDashboardFromSupabase() {
      return readReportBundleFromSupabase('__dashboard_latest__');
    }

    function withTimeout(promise, timeoutMs, message) {
      let timer = null;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message || 'Yêu cầu quá thời gian chờ.')), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function readStartupFromSupabase(formType) {
      const safeFormType = String(formType || 'vanChuyen').trim() || 'vanChuyen';
      return readSupabasePayload('startup_bundles', {
        form_type: safeFormType
      }, 'Chưa có startup cache trong Supabase.');
    }

    function buildCatalogsKeyForSupabase(formType) {
      const safeFormType = String(formType || '').trim();
      return 'catalogs:' + (safeFormType || 'all');
    }

    function buildCatalogDataKeyForSupabase(displaySheetName) {
      return 'catalog_data:' + String(displaySheetName || '').trim();
    }

    function buildFundFormOptionsKeyForSupabase(year) {
      return 'fund_form_options:' + String(year || '2026').trim();
    }

    function buildFundCatalogKeyForSupabase(year, group) {
      return 'fund_catalog:' + String(year || '2026').trim() + ':' + (String(group || '').trim() || 'all');
    }

    function readCatalogsFromSupabase(formType) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildCatalogsKeyForSupabase(formType)
      }, 'Chưa có catalog cache trong Supabase.');
    }

    function readCatalogDataFromSupabase(displaySheetName) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildCatalogDataKeyForSupabase(displaySheetName)
      }, 'Chưa có catalog data cache trong Supabase.');
    }

    function readFundFormOptionsFromSupabase(year) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildFundFormOptionsKeyForSupabase(year)
      }, 'Chưa có cache Supabase cho danh mục nhập Quỹ.');
    }

    function readFundCatalogFromSupabase(year, group) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildFundCatalogKeyForSupabase(year, group)
      }, 'Chưa có cache Supabase cho danh mục Quỹ.');
    }

    function readManageDataFromSupabase(sheetName, filterKey = 'recent_500') {
      return readSupabasePayload('manage_data_bundles', {
        sheet_name: String(sheetName || '').trim(),
        filter_key: String(filterKey || 'recent_500').trim()
      }, 'Chưa có cache Supabase cho dữ liệu Vận hành.');
    }

    function readManageMonthDataFromSupabase(sheetName, monthKey) {
      return readManageDataFromSupabase(sheetName, 'month:' + String(monthKey || '').trim());
    }

    function normalizeFundMonthKeyForSupabase(month) {
      const text = String(month || '').trim();
      if (!text || text === 'latest' || text === 'all' || text === 'Tất cả') return '';
      const iso = text.match(/^(\d{4})-(\d{1,2})/);
      if (iso) return `${iso[1]}-${String(Number(iso[2])).padStart(2, '0')}`;
      const vn = text.match(/^(\d{1,2})\/(\d{4})$/);
      if (vn) return `${vn[2]}-${String(Number(vn[1])).padStart(2, '0')}`;
      return text;
    }

    function buildFundTransactionFilterKeyForSupabase(params) {
      const safe = params || {};
      const startDate = String(safe.startDate || '').trim();
      const endDate = String(safe.endDate || '').trim();
      const search = String(safe.search || safe.query || '').trim();
      const limit = String(safe.limit || 500);
      if (!startDate && !endDate && !search && limit === '500') return 'recent_500';
      const encodedSearch = search
        ? btoa(unescape(encodeURIComponent(search))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
        : 'all';
      return [startDate || 'all', endDate || 'all', encodedSearch, limit].join('|');
    }

    function readSupabasePayload(tableName, filters, missingMessage) {
      return readSupabaseRows(tableName, filters, 'payload,synced_at')
        .then((rows) => {
          const data = rows && rows[0];
          if (!data || !data.payload) throw new Error(missingMessage || 'Chưa có dữ liệu Supabase cache.');
          if (data.payload.ok === false) {
            throw new Error(data.payload.error || 'Supabase cache đang chứa payload lỗi.');
          }
          return {
            ...data.payload,
            supabaseCached: true,
            supabaseSyncedAt: data.synced_at
          };
        });
    }

    function readFundOverviewFromSupabase(year, month) {
      const monthKey = normalizeFundMonthKeyForSupabase(month);
      return readSupabasePayload('fund_overview_bundles', {
        year: String(year || '2026'),
        month_key: monthKey
      }, 'Chưa có cache Supabase cho tổng quan quỹ.');
    }

    function readFundTransactionsFromSupabase(year, params) {
      const filterKey = buildFundTransactionFilterKeyForSupabase(params || {});
      return readSupabasePayload('fund_transaction_bundles', {
        year: String(year || '2026'),
        filter_key: filterKey
      }, 'Chưa có cache Supabase cho giao dịch quỹ.');
    }

    function readFundTransactionMonthFromSupabase(year, monthKey) {
      return readSupabasePayload('fund_transaction_bundles', {
        year: String(year || '2026'),
        filter_key: 'month:' + normalizeFundMonthKeyForSupabase(monthKey)
      }, 'Chưa có cache Supabase theo tháng cho giao dịch quỹ.');
    }

    function readFundLoanOverviewFromSupabase(year, month) {
      const monthKey = normalizeFundMonthKeyForSupabase(month);
      return readSupabasePayload('fund_loan_bundles', {
        year: String(year || '2026'),
        month_key: monthKey
      }, 'Chưa có cache Supabase cho vay nợ.');
    }

    function getCurrentSpreadsheetIdForSupabase() {
      const link = getLinks()?.spreadsheet || '';
      const match = String(link).match(/\/spreadsheets\/d\/([^/]+)/);
      return match ? match[1] : '';
    }

    function buildFetchPostFallbackResult_(method, action, bodyData, backendUrl, err) {
      if (String(method || '').toUpperCase() !== 'POST') return null;
      if (!/script\.google\.com$/i.test((new URL(backendUrl)).hostname)) return null;
      const message = String(err && err.message ? err.message : err || '');
      if (!/Failed to fetch|NetworkError|Load failed/i.test(message)) return null;
      if (action === 'submitRows') return null;

      const warning = 'Yêu cầu đã được gửi tới Apps Script nhưng trình duyệt không đọc được phản hồi. Nếu dữ liệu đã xuất hiện trong Google Sheet thì có thể bỏ qua cảnh báo này.';
      if (action === 'submitRows') {
        return {
          ok: true,
          inserted: Array.isArray(bodyData && bodyData.rows) ? bodyData.rows.length : 0,
          sheetName: '',
          errors: [],
          warnings: [warning]
        };
      }
      return {
        ok: true,
        warnings: [warning]
      };
    }

    function removeSessionKeysByPrefix(prefix) {
      Object.keys(sessionStorage).forEach((key) => {
        if (key.indexOf(prefix) === 0) sessionStorage.removeItem(key);
      });
    }

    function invalidateReportSessionCache(options) {
      options = options || {};
      reportCacheEpoch += 1;
      reportBundlePrefetching = false;
      removeSessionKeysByPrefix('eb_report_bundle_');
      removeSessionKeysByPrefix('eb_sheet_data_');
      if (options.catalogs) removeSessionKeysByPrefix('eb_catalogs_');
      sessionStorage.removeItem('eb_dashboard_v3');
      sessionStorage.removeItem('eb_startup_data');
    }

    function getSheetDataCacheKey(params) {
      const safeParams = params || {};
      return [
        'eb_sheet_data_v2',
        safeParams.sheetName || '',
        safeParams.startDate || '',
        safeParams.endDate || '',
        safeParams.limit || ''
      ].join('|');
    }

    function getCachedSheetData(params) {
      try {
        const raw = sessionStorage.getItem(getSheetDataCacheKey(params));
        if (!raw) return null;
        const cached = JSON.parse(raw);
        if (!cached || !cached.savedAt || !cached.data) return null;
        if (cached.data.ok === false) {
          sessionStorage.removeItem(getSheetDataCacheKey(params));
          return null;
        }
        return cached;
      } catch (err) {
        return null;
      }
    }

    function setCachedSheetData(params, data) {
      try {
        sessionStorage.setItem(getSheetDataCacheKey(params), JSON.stringify({
          savedAt: Date.now(),
          data: data
        }));
      } catch (err) {
        removeSessionKeysByPrefix('eb_sheet_data_');
      }
    }

    function invalidateServerCaches() {
      return callApi('GET', 'invalidateCaches', { _ts: Date.now() }).catch((err) => {
        console.warn('Không thể xoá cache server trước khi làm mới:', err);
      });
    }
</script>
