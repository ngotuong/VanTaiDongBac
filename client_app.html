<script>
    // App Initializer
    function init() {
      // Auto-clear old local/session cache on version updates to prevent old URL conflicts
      const APP_VERSION = 'v3.21_supabase_rest_startup_cache';
      if (localStorage.getItem('eb_version') !== APP_VERSION) {
        localStorage.setItem('eb_version', APP_VERSION);
        sessionStorage.clear();
      }

      renderNav();
      
      const backendUrl = getBackendUrl();
      if (!backendUrl && !hasAppsScriptRuntime()) {
        el('loader').querySelector('.loader-title').textContent = 'Chưa thiết lập kết nối';
        el('loader').querySelector('.loader-text').innerHTML = 
          'Vui lòng cấu hình link Apps Script trong Cài đặt.<br><a href="#" onclick="showSettingsFromLoader()" style="color:var(--teal);font-weight:bold;text-decoration:underline;display:inline-block;margin-top:10px;">Cấu hình ngay</a>';
        el('loader').querySelector('.spinner').classList.add('hidden');
        document.body.classList.remove('locked');
        return;
      }
      
      const cachedStartup = sessionStorage.getItem('eb_startup_data');
      if (cachedStartup) {
        hydrateStartupData(JSON.parse(cachedStartup));
        finishStartupRender_();
        setTimeout(() => loadDashboard(false), 100);
      } else {
        let startupFallbackReason = '';
        const supabaseStatus = getSupabaseReportStatus();
        const loadStartupFromAppsScript = () => callApi('GET', 'getStartupData', { formType: 'vanChuyen' });
        const startupLoader = supabaseStatus.ok
          ? withTimeout(
              readStartupFromSupabase('vanChuyen'),
              2500,
              'Supabase startup cache quá 2.5 giây, quay về Apps Script.'
            ).catch((err) => {
              startupFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
              console.warn('Không đọc được dữ liệu khởi động từ Supabase, quay về Apps Script:', err);
              return loadStartupFromAppsScript();
            })
          : (() => {
              startupFallbackReason = supabaseStatus.reason;
              return loadStartupFromAppsScript();
            })();

        startupLoader
          .then((data) => {
            hydrateStartupData(data);
            sessionStorage.setItem('eb_startup_data', JSON.stringify(data));
            finishStartupRender_();
            setTimeout(() => {
              loadDashboard(false).finally(() => {
                setTimeout(() => {
                  showSyncToast(data && data.supabaseCached
                    ? 'Màn hình đầu đang đọc từ Supabase cache.'
                    : 'Màn hình đầu đã quay về Apps Script. ' + (startupFallbackReason || ''));
                }, 250);
              });
            }, 100);
          })
          .catch((err) => {
            el('loader').querySelector('.loader-title').textContent = 'Lỗi kết nối API';
            el('loader').querySelector('.loader-text').innerHTML = 
              `Không thể đồng bộ với Google Sheets.<br>Chi tiết: ${err.message}<br><a href="#" onclick="showSettingsFromLoader()" style="color:var(--teal);font-weight:bold;text-decoration:underline;display:inline-block;margin-top:10px;">Kiểm tra cài đặt URL</a>`;
            el('loader').querySelector('.spinner').classList.add('hidden');
            document.body.classList.remove('locked');
          });
      }
    }

    function finishStartupRender_() {
      rows = [newBlankRow()];
      document.body.classList.remove('locked');
      el('loader').classList.add('hidden');
      renderAll();
    }

    function hydrateStartupData(data) {
      appData = data || {};
      activeForm = appData.formTypes?.[0] || 'vanChuyen';
      if (appData.catalogs) {
        const catalogFormType = appData.catalogFormType || activeForm;
        catalogsByForm[catalogFormType] = appData.catalogs;
        sessionStorage.setItem('eb_catalogs_' + catalogFormType, JSON.stringify(appData.catalogs));
      }
      if (appData.dashboard) {
        appData.reports = { ...(appData.reports || {}), ...appData.dashboard, loading: false };
      }
    }

    function renderAll() {
      renderView();
      renderFormTabs();
      renderEntry();
      renderDashboard();
      renderReports();
      const links = getLinks();
      if (el('openSheetTop')) el('openSheetTop').href = links.spreadsheet || '#';
      loadRecentTransportWriteJobs();
    }

    function renderNav() {
      const side = el('sideNav');
      const bottom = el('bottomNav');
      side.innerHTML = '';
      bottom.innerHTML = '';
      
      const shareholder = isShareholderUser();
      const bottomKeys = shareholder
        ? ['home', 'reports', 'manage', 'cashflow', 'settings']
        : BOTTOM_NAV_KEYS;
      NAV.filter(([key]) => !(shareholder && key === 'catalog')).forEach(([key, label, sub, icoSvg]) => {
        const s = document.createElement('button');
        s.type = 'button';
        s.className = 'nav-btn';
        s.dataset.view = key;
        s.innerHTML = `<span class="nav-ico">${icoSvg}</span><span class="nav-main">${label}</span>`;
        s.onclick = () => setView(key);
        side.appendChild(s);

        if (bottomKeys.includes(key)) {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.view = key;
          b.setAttribute('aria-label', label);
          b.innerHTML = `${icoSvg}<span>${label}</span>`;
          b.onclick = () => setView(key);
          bottom.appendChild(b);
        }
      });
    }

    function setView(view) {
      if (view === 'entry') view = 'manage';
      if (isShareholderUser() && view === 'catalog') view = 'reports';
      closeMobileEntrySheet();
      activeView = view;
      closeDrawer();
      clearStatus();
      renderView();
      if (view === 'manage') {
        const sheetName = FORM_SHEET_MAP[activeForm] || 'NL_VanChuyen';
        if (el('manageSheetSelect').value !== sheetName) {
          el('manageSheetSelect').value = sheetName;
          document.querySelectorAll('#manageTabsBar .sub-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sheet === sheetName);
          });
        }
        renderFormTabs();
        renderEntry();
        loadCatalogs(activeForm);
        loadManageSheetData();
        loadAllCatalogsIfNeeded(() => {
          if (currentManageData && activeView === 'manage') renderManageTable();
        });
      }
      if (view === 'reports') {
        loadReportBundle(false);
      }
      if (view === 'catalog') {
        loadCatalogSheetData();
        loadAllCatalogsIfNeeded(() => {
          if (currentCatalogData && activeView === 'catalog') renderCatalogTable();
        });
      }
      if (view === 'cashflow') {
        if (activeCashflowTab === 'overview') loadFundOverview(false);
        if (activeCashflowTab === 'transactions') loadFundTransactions(false);
        if (activeCashflowTab === 'loans') loadFundLoanOverview(false);
      }
      if (view === 'settings') {
        loadAccountSettings();
        if (!isShareholderUser()) loadSupabaseSyncStatus(false);
      }
    }

    function getLatestDataUpdateText() {
      const dashboardUpdatedAt = getDashboardData()?.updatedAt;
      const reportUpdatedAt = appData?.reports?.updatedAt;
      const fallback = dashboardUpdatedAt || reportUpdatedAt || '';
      return `Cập nhật: ${fallback || 'Vui lòng chờ...'}`;
    }

    function getDataSourceBadgeHtml() {
      if (currentDataSource === 'supabase') {
        return '<span class="source-badge source-supabase" title="Đang đọc từ Supabase cache">S</span>';
      }
      if (currentDataSource === 'apps-script') {
        return '<span class="source-badge source-appscript" title="Đang đọc fallback từ Apps Script">AS</span>';
      }
      return '';
    }

    function setDataSourceStatus(source) {
      currentDataSource = source || '';
      const subtitle = el('subtitle');
      if (subtitle) subtitle.innerHTML = `${getLatestDataUpdateText()} ${getDataSourceBadgeHtml()}`;
    }

    function renderView() {
      document.querySelectorAll('[data-view]').forEach((button) => {
        button.classList.toggle('active', button.dataset.view === activeView);
      });
      ['home', 'reports', 'manage', 'catalog', 'cashflow', 'settings'].forEach((view) => {
        const viewEl = el(`${view}View`);
        if (viewEl) viewEl.classList.toggle('active', view === activeView);
      });
      
      const meta = {
        home: ['Tổng quan', 'Kết quả kinh doanh', getLatestDataUpdateText()],
        reports: ['Báo cáo', 'Tổng hợp chi tiết', getLatestDataUpdateText()],
        manage: ['Vận hành', 'Quản lý vận hành', getLatestDataUpdateText()],
        catalog: ['Danh mục', 'Quản lý danh mục hệ thống', getLatestDataUpdateText()],
        cashflow: ['Quỹ', 'Quản lý quỹ', getLatestDataUpdateText()],
        settings: ['Cài đặt', 'Cấu hình App', getLatestDataUpdateText()]
      }[activeView];
      
      el('eyebrow').textContent = meta[0];
      el('pageTitle').textContent = meta[1];
      el('subtitle').innerHTML = `${meta[2]} ${getDataSourceBadgeHtml()}`;
    }

    let html2CanvasLoader = null;
    function loadHtml2Canvas() {
      if (window.html2canvas) return Promise.resolve(window.html2canvas);
      if (html2CanvasLoader) return html2CanvasLoader;
      html2CanvasLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js';
        script.async = true;
        script.onload = () => resolve(window.html2canvas);
        script.onerror = () => reject(new Error('Không thể tải thư viện xuất ảnh.'));
        document.head.appendChild(script);
      });
      return html2CanvasLoader;
    }

    function restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions, noExportEls, originalNoExportDisplays) {
      card.classList.remove('is-exporting');
      headActions.forEach(el => el.style.visibility = 'visible');
      noExportEls.forEach((el, index) => {
        el.style.display = originalNoExportDisplays[index] || '';
      });
      card.style.width = originalCardStyleWidth;
      if (tableWrap) {
        if (originalWrapStyle !== null) {
          tableWrap.setAttribute('style', originalWrapStyle);
        } else {
          tableWrap.removeAttribute('style');
        }
      }
      if (table) {
        if (originalTableStyle !== null) {
          table.setAttribute('style', originalTableStyle);
        } else {
          table.removeAttribute('style');
        }
      }
      stickyEls.forEach((el, index) => {
        const orig = originalStickyStyles[index];
        el.style.position = orig.position;
        el.style.left = orig.left;
        el.style.boxShadow = orig.boxShadow;
      });
      btn.disabled = false;
      btn.innerHTML = originalText;
    }

    function exportCardAsImage(btn, type) {
      const card = btn.closest('.table-card');
      if (!card) return;
      
      const originalText = btn.innerHTML;
      btn.disabled = true;
      card.classList.add('is-exporting');
      btn.innerHTML = `
        <svg class="btn-svg" style="width: 16px; height: 16px; animation: spin 0.8s linear infinite;" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
      `;
      
      const headActions = card.querySelectorAll('.table-card-head a, .table-card-head button');
      headActions.forEach(el => el.style.visibility = 'hidden');
      const noExportEls = card.querySelectorAll('.no-export');
      const originalNoExportDisplays = [];
      noExportEls.forEach(el => {
        originalNoExportDisplays.push(el.style.display);
        el.style.display = 'none';
      });
      
      const tableWrap = card.querySelector('.table-wrap');
      const table = card.querySelector('table');
      const originalCardStyleWidth = card.style.width;
      const originalWrapStyle = tableWrap ? tableWrap.getAttribute('style') : null;
      const originalTableStyle = table ? table.getAttribute('style') : null;
      
      if (table && tableWrap) {
        const scrollWidth = table.scrollWidth;
        const clientWidth = tableWrap.clientWidth;
        if (scrollWidth > clientWidth) {
          card.style.width = (scrollWidth + 32) + 'px';
          tableWrap.style.overflow = 'visible';
          tableWrap.style.width = 'auto';
          table.style.width = '100%';
          table.style.minWidth = '0';
        }
      }
      
      const stickyEls = card.querySelectorAll('th:first-child, td:first-child');
      const originalStickyStyles = [];
      stickyEls.forEach(el => {
        originalStickyStyles.push({ el, position: el.style.position, left: el.style.left, boxShadow: el.style.boxShadow });
        el.style.position = 'static';
        el.style.boxShadow = 'none';
      });

      loadHtml2Canvas()
        .then(() => window.html2canvas(card, {
          scale: 3,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        }))
        .then((canvas) => {
          restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions, noExportEls, originalNoExportDisplays);
          const link = document.createElement('a');
          const filename = `BaoCao_${type}_${new Date().toISOString().slice(0, 10)}.png`;
          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        })
        .catch((err) => {
          console.error('Chụp ảnh thất bại:', err);
          alert('Lỗi xuất ảnh: ' + err.message);
          restoreExportCardState(btn, originalText, card, originalCardStyleWidth, tableWrap, originalWrapStyle, table, originalTableStyle, stickyEls, originalStickyStyles, headActions, noExportEls, originalNoExportDisplays);
        });
    }
</script>
