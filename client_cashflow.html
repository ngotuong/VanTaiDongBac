<script>
    function setCashflowTab(tab) {
      activeCashflowTab = tab;
      document.querySelectorAll('[data-cashflow-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.cashflowTab === tab);
      });
      document.querySelectorAll('[data-cashflow-panel]').forEach((panel) => {
        panel.style.display = panel.dataset.cashflowPanel === tab ? '' : 'none';
      });
      if (tab === 'transactions') {
        loadFundTransactions(false);
      }
      if (tab === 'entry') {
        loadFundFormOptions();
      }
      if (tab === 'overview') {
        loadFundOverview(false);
      }
      if (tab === 'loans') {
        loadFundLoanOverview(false);
      }
      if (tab === 'loanEntry') {
        loadFundFormOptions().then(renderLoanMethodOptions);
      }
    }

    function loadFundOverview(forceRefresh) {
      const monthFilter = el('fundOverviewMonthFilter');
      const month = monthFilter ? monthFilter.value : '';
      return callApi('GET', 'getFundOverview', {
        year: '2026',
        month: month,
        forceRefresh: forceRefresh ? 'true' : ''
      }).then((data) => {
        fundOverviewData = data;
        renderFundOverview(data);
      }).catch((err) => {
        el('fundOverviewMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải quỹ</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
      });
    }

    function renderFundOverview(data) {
      renderFundOverviewMonthFilter(data.months || [], data.selectedMonth || '');
      const metrics = el('fundOverviewMetrics');
      const timeStr = new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
      
      const config = {
        openingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>` },
        periodIncome: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>` },
        periodExpense: { badge: 'red', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>` },
        periodNet: { badge: 'amber', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>` },
        closingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>` },
        currentBalance: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>` }
      };

      metrics.innerHTML = (data.metrics || []).map((item) => {
        const conf = config[item.key] || { badge: 'blue', icon: '' };
        const formatted = formatFundAmount(item.value, '0');
        const numPart = formatted.replace(' đ', '');
        const unitPart = 'đ';
        
        let badgeColor = conf.badge;
        if (item.key === 'periodNet') {
          badgeColor = (item.value >= 0) ? 'green' : 'red';
        }
        
        return `
          <article class="kpi-card">
            <div class="kpi-card-header">
              <div class="kpi-label">${escapeHtml(item.label)}</div>
              <div class="kpi-icon-badge ${badgeColor}">${conf.icon}</div>
            </div>
            <div class="kpi-value ${badgeColor}">${escapeHtml(numPart)} <span class="unit">${escapeHtml(unitPart)}</span></div>
            <div class="kpi-card-footer" style="border-top:none; padding-top:0; margin-top:4px;">
              <div class="kpi-status ok" style="background:var(--mint-soft); color:var(--teal); font-size:10px; padding:2px 6px;"><span>Quỹ 2026</span></div>
              <div class="kpi-time">${escapeHtml(timeStr)}</div>
            </div>
          </article>
        `;
      }).join('');
      
      renderFundCategoryRows('fundIncomeCategoryBody', data.incomeCategories || [], 'Thu');
      renderFundCategoryRows('fundExpenseCategoryBody', data.expenseCategories || [], 'Chi');
    }

    function getFundMetricTone(key) {
      if (key === 'periodIncome') return 'fund-tone-income';
      if (key === 'periodExpense') return 'fund-tone-expense';
      if (key === 'periodNet') return 'fund-tone-net';
      return 'fund-tone-balance';
    }

    function renderFundOverviewMonthFilter(months, selectedMonth) {
      const select = el('fundOverviewMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tháng gần nhất</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function renderFundCategoryRows(targetId, rows, type) {
      const body = el(targetId);
      if (!body) return;
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:24px;">Không có dữ liệu.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row, index) => `
        <tr>
          <td>${escapeHtml(row.category)}</td>
          <td>${row.count || 0}</td>
          <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, '')}</td>
          <td style="text-align:right;"><button type="button" class="sub-tab" style="min-height:28px;" onclick="showFundCategoryDetail('${type}', ${index})">Xem</button></td>
        </tr>
      `).join('');
    }

    function showFundCategoryDetail(type, index) {
      const rows = type === 'Thu' ? (fundOverviewData?.incomeCategories || []) : (fundOverviewData?.expenseCategories || []);
      const item = rows[index];
      const title = el('fundCategoryDetailTitle');
      const hint = el('fundCategoryDetailHint');
      const body = el('fundCategoryDetailBody');
      const mobileList = el('fundDetailMobileList');
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      if (!item) return;
      
      if (title) title.textContent = `Chi tiết ${type.toLowerCase()} - ${item.category}`;
      if (hint) hint.textContent = `${item.count || 0} dòng, tổng ${formatFundAmount(item.amount, '')}.`;
      
      // Render Desktop Table
      if (body) {
        body.innerHTML = (item.details || []).map((row) => `
          <tr>
            <td>${escapeHtml(row.dateText || row.date || '')}</td>
            <td>${escapeHtml(row.voucher || '')}</td>
            <td>${escapeHtml(row.type || '')}</td>
            <td>${escapeHtml(row.category || '')}</td>
            <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, row.amountText)}</td>
            <td>${escapeHtml(row.partner || '')}</td>
            <td>${escapeHtml(row.content || '')}</td>
          </tr>
        `).join('') || '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</td></tr>';
      }
      
      // Render Mobile Card List with clear titles/labels
      if (mobileList) {
        mobileList.innerHTML = (item.details || []).map((row) => `
          <div class="fund-detail-mobile-card">
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Số phiếu</span>
              <span class="fund-detail-mobile-card-value" style="font-family: monospace; font-size: 13px; color: var(--teal);">${escapeHtml(row.voucher || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Ngày</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.dateText || row.date || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Hạng mục</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.category || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Phân loại</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.type || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Đối tác</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.partner || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row" style="border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px;">
              <span class="fund-detail-mobile-card-label">Số tiền</span>
              <span class="fund-detail-mobile-card-value fund-detail-mobile-card-amount" style="color: ${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">
                ${type === 'Thu' ? '+' : '-'}${formatFundAmount(row.amount, row.amountText)}
              </span>
            </div>
            <div class="fund-detail-mobile-card-row" style="flex-direction: column; align-items: flex-start; gap: 4px;">
              <span class="fund-detail-mobile-card-label">Nội dung</span>
              <span class="fund-detail-mobile-card-value" style="font-weight: 500; color: var(--muted); text-align: left; width: 100%; word-break: break-word; font-size: 12px; margin-top: 2px;">${escapeHtml(row.content || 'Không có nội dung')}</span>
            </div>
          </div>
        `).join('') || '<div style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</div>';
      }
      
      if (card) card.classList.add('open');
      if (backdrop) backdrop.style.display = 'block';
      document.body.classList.add('locked');
    }

    window.closeFundDetailDrawer = function() {
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      if (card) card.classList.remove('open');
      if (backdrop) backdrop.style.display = 'none';
      
      // Chỉ mở khóa body nếu không có menu sidebar di động đang mở
      if (!document.body.classList.contains('drawer-open')) {
        document.body.classList.remove('locked');
      }
    };

    function loadFundFormOptions() {
      if (fundFormOptions) return Promise.resolve(fundFormOptions);
      return callApi('GET', 'getFundFormOptions', { year: '2026' })
        .then((data) => {
          fundFormOptions = data;
          renderFundFormOptions();
          return data;
        })
        .catch((err) => {
          console.warn('Không thể tải danh mục Thu chi:', err);
          renderFundFormOptions();
          return null;
        });
    }

    function renderFundFormOptions() {
      const options = fundFormOptions || {};
      fillDatalist('fundIncomeCategoryList', options.incomeCategories || []);
      fillDatalist('fundExpenseCategoryList', options.expenseCategories || []);
      fillDatalist('fundActorList', options.actors || []);
      fillDatalist('fundPartnerList', options.partners || []);

      const methodSelect = el('fundMethodInput');
      if (methodSelect && !methodSelect.dataset.loaded) {
        (options.methods || []).forEach((method) => {
          const option = document.createElement('option');
          option.value = method;
          option.textContent = method;
          methodSelect.appendChild(option);
        });
        methodSelect.dataset.loaded = 'true';
      }
    }

    function fillDatalist(id, values) {
      const list = el(id);
      if (!list) return;
      list.innerHTML = '';
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        list.appendChild(option);
      });
    }

    function handleFundTypeChange() {
      const type = el('fundTypeInput')?.value || 'Chi';
      const category = el('fundCategoryInput');
      if (category) {
        category.setAttribute('list', type === 'Thu' ? 'fundIncomeCategoryList' : 'fundExpenseCategoryList');
        category.placeholder = type === 'Thu' ? 'Chọn hoặc nhập mục thu' : 'Chọn hoặc nhập mục chi';
      }
    }

    function submitFundTransaction() {
      const status = el('fundEntryStatus');
      const btn = el('fundSaveBtn');
      const transaction = {
        date: el('fundDateInput')?.value || '',
        type: el('fundTypeInput')?.value || '',
        category: el('fundCategoryInput')?.value || '',
        method: el('fundMethodInput')?.value || '',
        amount: el('fundAmountInput')?.value || '',
        actor: el('fundActorInput')?.value || '',
        partner: el('fundPartnerInput')?.value || '',
        content: el('fundContentInput')?.value || '',
        debt: el('fundDebtInput')?.checked || false
      };
      const error = validateFundTransaction(transaction);
      if (error) {
        showFundEntryStatus('error', error);
        return;
      }

      if (btn) btn.disabled = true;
      showFundEntryStatus('info', 'Đang lưu khoản thu/chi...');
      callApi('POST', 'addFundTransaction', {}, { year: '2026', transaction })
        .then(() => {
          clearFundEntryForm();
          showFundEntryStatus('success', 'Đã lưu khoản thu/chi vào file Thu chi.');
          setCashflowTab('transactions');
          loadFundTransactions(true);
        })
        .catch((err) => {
          showFundEntryStatus('error', 'Không thể lưu khoản thu/chi: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function validateFundTransaction(transaction) {
      if (!transaction.date) return 'Vui lòng nhập ngày.';
      if (transaction.type !== 'Thu' && transaction.type !== 'Chi') return 'Vui lòng chọn loại Thu hoặc Chi.';
      if (!transaction.category.trim()) return 'Vui lòng nhập mục thu/chi.';
      if (!transaction.method.trim()) return 'Vui lòng nhập hình thức.';
      if (!(parseLocaleNumber(transaction.amount) > 0)) return 'Số tiền phải lớn hơn 0.';
      if (!transaction.actor.trim()) return 'Vui lòng nhập Người Thu/Chi.';
      if (transaction.debt && !transaction.partner.trim()) return 'Khoản công nợ cần có Đối tác.';
      return '';
    }

    function showFundEntryStatus(type, message) {
      const status = el('fundEntryStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundEntryForm() {
      ['fundCategoryInput', 'fundAmountInput', 'fundActorInput', 'fundPartnerInput', 'fundContentInput'].forEach((id) => {
        const field = el(id);
        if (field) field.value = '';
      });
      const debt = el('fundDebtInput');
      if (debt) debt.checked = false;
    }

    function renderLoanMethodOptions() {
      const options = fundFormOptions || {};
      const select = el('loanMethodInput');
      if (!select || select.dataset.loaded) return;
      (options.methods || []).forEach((method) => {
        const option = document.createElement('option');
        option.value = method;
        option.textContent = method;
        select.appendChild(option);
      });
      select.dataset.loaded = 'true';
    }

    function loadFundLoanOverview(forceRefresh) {
      return callApi('GET', 'getFundLoanOverview', { year: '2026', forceRefresh: forceRefresh ? 'true' : '' })
        .then((data) => {
          fundLoanData = data;
          renderFundLoanOverview(data);
        })
        .catch((err) => {
          el('fundLoanMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải khoản vay</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
        });
    }

    function renderFundLoanOverview(data) {
      const metrics = el('fundLoanMetrics');
      metrics.innerHTML = (data.metrics || []).map((item) => `
        <article class="kpi-card">
          <div class="kpi-label">${escapeHtml(item.label)}</div>
          <div class="kpi-value">${formatFundAmount(item.value, '')}</div>
        </article>
      `).join('');

      const summary = el('fundLoanSummaryBody');
      const loans = data.loans || [];
      summary.innerHTML = loans.length ? loans.map((item) => `
        <tr>
          <td>${escapeHtml(item.code || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(item.borrowed, '')}</td>
          <td style="text-align:right;">${formatFundAmount(item.principalPaid, '')}</td>
          <td style="text-align:right;">${formatFundAmount(item.interestPaid, '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(item.outstanding, '')}</td>
          <td>${escapeHtml(item.latestDate || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:24px;">Chưa có khoản vay.</td></tr>';

      const history = el('fundLoanHistoryBody');
      const rows = data.recentRows || [];
      history.innerHTML = rows.length ? rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.dateText || row.date || '')}</td>
          <td>${escapeHtml(row.code || '')}</td>
          <td>${escapeHtml(row.type || '')}</td>
          <td>${escapeHtml(row.partner || '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(row.amount, row.amountText)}</td>
          <td>${escapeHtml(row.content || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">Chưa có lịch sử vay/trả.</td></tr>';
    }

    function submitFundLoan() {
      const btn = el('loanSaveBtn');
      const loan = {
        date: el('loanDateInput')?.value || '',
        method: el('loanMethodInput')?.value || '',
        partner: el('loanPartnerInput')?.value || '',
        amount: el('loanAmountInput')?.value || '',
        termMonths: el('loanTermInput')?.value || '',
        annualRate: el('loanRateInput')?.value || '',
        interestPeriodMonths: el('loanInterestPeriodInput')?.value || '',
        firstInterestDate: el('loanFirstInterestDateInput')?.value || '',
        content: el('loanContentInput')?.value || ''
      };
      const error = validateFundLoan(loan);
      if (error) {
        showFundLoanStatus('error', error);
        return;
      }
      if (btn) btn.disabled = true;
      showFundLoanStatus('success', 'Đang lưu khoản vay...');
      callApi('POST', 'addFundLoan', {}, { year: '2026', loan })
        .then(() => {
          clearFundLoanForm();
          showFundLoanStatus('success', 'Đã lưu khoản vay vào file Thu chi.');
          setCashflowTab('loans');
          loadFundLoanOverview(true);
        })
        .catch((err) => {
          showFundLoanStatus('error', 'Không thể lưu khoản vay: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function validateFundLoan(loan) {
      if (!loan.date) return 'Vui lòng nhập ngày vay.';
      if (!loan.method.trim()) return 'Vui lòng chọn hình thức vay.';
      if (!loan.partner.trim()) return 'Vui lòng nhập đối tác.';
      if (!(parseLocaleNumber(loan.amount) > 0)) return 'Số tiền vay phải lớn hơn 0.';
      return '';
    }

    function showFundLoanStatus(type, message) {
      const status = el('fundLoanEntryStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundLoanForm() {
      ['loanPartnerInput', 'loanAmountInput', 'loanTermInput', 'loanRateInput', 'loanInterestPeriodInput', 'loanFirstInterestDateInput', 'loanContentInput'].forEach((id) => {
        const field = el(id);
        if (field) field.value = '';
      });
    }

    function loadFundTransactions(forceRefresh) {
      const tableBody = el('fundTransactionsTableBody');
      const empty = el('fundTransactionsEmpty');
      const notice = el('fundTransactionsNotice');
      const monthFilter = el('fundMonthFilter');
      const pager = el('fundTransactionsPager');
      if (!tableBody || !empty || !notice || !monthFilter) return;

      tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center; color: var(--muted); padding: 24px;">Đang tải dữ liệu thu chi...</td></tr>';
      empty.style.display = 'none';
      if (pager) pager.style.display = 'none';
      notice.textContent = '';
      notice.style.display = 'none';

      const selectedMonth = monthFilter.value || '';
      callApi('GET', 'getFundTransactions', {
        year: '2026',
        month: selectedMonth,
        limit: 500,
        forceRefresh: forceRefresh ? 'true' : ''
      })
        .then((data) => {
          fundTransactionsData = data;
          fundTransactionsPage = 1;
          renderFundMonthFilter(data.months || [], data.selectedMonth || selectedMonth);
          renderFundTransactions(data);
        })
        .catch((err) => {
          tableBody.innerHTML = '';
          empty.style.display = 'block';
          empty.textContent = 'Không thể tải dữ liệu thu chi: ' + err.message;
        });
    }

    function renderFundMonthFilter(months, selectedMonth) {
      const select = el('fundMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tất cả tháng</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function renderFundTransactions(data) {
      const tableBody = el('fundTransactionsTableBody');
      const empty = el('fundTransactionsEmpty');
      const notice = el('fundTransactionsNotice');
      const pager = el('fundTransactionsPager');
      if (!tableBody || !empty || !notice) return;

      const rows = data.transactions || [];
      tableBody.innerHTML = '';
      if (!rows.length) {
        empty.style.display = 'block';
        empty.textContent = 'Không có dữ liệu thu chi phù hợp.';
        if (pager) pager.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      const totalPages = Math.max(1, Math.ceil(rows.length / FUND_TRANSACTIONS_PAGE_SIZE));
      fundTransactionsPage = Math.min(Math.max(1, fundTransactionsPage), totalPages);
      const start = (fundTransactionsPage - 1) * FUND_TRANSACTIONS_PAGE_SIZE;
      const pageRows = rows.slice(start, start + FUND_TRANSACTIONS_PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      pageRows.forEach((item) => {
        const tr = document.createElement('tr');
        const typeColor = item.type === 'Thu' ? 'var(--green)' : (item.type === 'Chi' ? 'var(--red)' : 'var(--muted)');
        tr.innerHTML = `
          <td>${escapeHtml(item.dateText || formatTableDate(item.date, false))}</td>
          <td>${escapeHtml(item.voucher || '')}</td>
          <td><span style="font-weight: 800; color: ${typeColor};">${escapeHtml(item.type || '-')}</span></td>
          <td>${escapeHtml(item.category || '')}</td>
          <td>${escapeHtml(item.method || '')}</td>
          <td style="text-align: right; font-weight: 800;">${formatFundAmount(item.amount, item.amountText)}</td>
          <td>${escapeHtml(item.actor || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td>${escapeHtml(item.content || '')}</td>
        `;
        fragment.appendChild(tr);
      });
      tableBody.appendChild(fragment);
      renderFundTransactionsPager(rows.length, totalPages, start + 1, start + pageRows.length);

      if (data.limited) {
        notice.textContent = `Đang tải ${rows.length}/${data.totalRows} dòng mới nhất. Bảng đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'block';
      } else {
        notice.textContent = `Có ${rows.length} dòng, đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'block';
      }
    }

    function renderFundTransactionsPager(totalRows, totalPages, startRow, endRow) {
      const pager = el('fundTransactionsPager');
      if (!pager) return;
      if (totalRows <= FUND_TRANSACTIONS_PAGE_SIZE) {
        pager.style.display = 'none';
        return;
      }
      pager.style.display = 'flex';
      pager.innerHTML = `
        <div style="font-size:12.5px; font-weight:700; color:var(--muted);">Dòng ${startRow}-${endRow}/${totalRows}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage - 1})" ${fundTransactionsPage <= 1 ? 'disabled' : ''}>Trước</button>
          <span style="font-size:12.5px; font-weight:800; color:var(--deep);">Trang ${fundTransactionsPage}/${totalPages}</span>
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage + 1})" ${fundTransactionsPage >= totalPages ? 'disabled' : ''}>Sau</button>
        </div>
      `;
    }

    function setFundTransactionsPage(page) {
      if (!fundTransactionsData) return;
      fundTransactionsPage = page;
      renderFundTransactions(fundTransactionsData);
      el('fundTransactionsTable')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function formatFundAmount(amount, fallbackText) {
      const number = Number(amount || 0);
      if (number) return Math.round(number).toLocaleString('vi-VN') + ' ₫';
      return escapeHtml(fallbackText || '');
    }
</script>
