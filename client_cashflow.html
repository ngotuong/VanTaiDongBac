<script>
    function setCashflowTab(tab) {
      activeCashflowTab = tab;
      document.querySelectorAll('[data-cashflow-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.cashflowTab === tab);
      });
      document.querySelectorAll('[data-cashflow-panel]').forEach((panel) => {
        panel.style.display = panel.dataset.cashflowPanel === tab ? '' : 'none';
      });
      if (tab === 'transactions') {
        if (!getDateInputIso('fundStartDate') && !getDateInputIso('fundEndDate')) {
          setFundQuickDate(el('fundQuickDateFilter')?.value || 'recent', true);
        }
        loadFundTransactions(false);
      }
      if (tab === 'entry') {
        loadFundFormOptions();
      }
      if (tab === 'overview') {
        loadFundOverview(false);
      }
      if (tab === 'loans') {
        loadFundLoanOverview(false);
        loadFundFormOptions();
      }
      if (tab === 'loanEntry') {
        loadFundFormOptions();
      }
      if (tab === 'catalog') {
        loadFundCatalog(false);
      }
    }

    function renderFundTableLoading(tbody, colspan, message) {
      if (!tbody) return;
      if (typeof renderTableLoading === 'function') {
        renderTableLoading(tbody, colspan, message);
        return;
      }
      tbody.innerHTML = `<tr><td colspan="${colspan}" style="padding:16px;"><div class="shimmer shimmer-table"></div></td></tr>`;
    }

    function renderFundKpiLoading(holder, count) {
      if (!holder) return;
      holder.innerHTML = Array.from({ length: count }).map(() => (
        '<article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>'
      )).join('');
    }

    function loadFundOverview(forceRefresh) {
      const metricsHolder = el('fundOverviewMetrics');
      renderFundKpiLoading(metricsHolder, 6);
      renderFundTableLoading(el('fundIncomeCategoryBody'), 3, 'Đang tải hạng mục thu...');
      renderFundTableLoading(el('fundExpenseCategoryBody'), 3, 'Đang tải hạng mục chi...');
      
      const month = el('fundOverviewMonthFilter')?.value || '';
      let fundOverviewFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadFundOverviewFromAppsScript = () => callApi('GET', 'getFundOverview', {
        year: '2026',
        month: month,
        forceRefresh: forceRefresh ? 'true' : ''
      });
      const loader = (!forceRefresh && supabaseStatus.ok)
        ? readFundOverviewFromSupabase('2026', month).catch((err) => {
            fundOverviewFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được Tổng quan Quỹ từ Supabase, quay về Apps Script:', err);
            return loadFundOverviewFromAppsScript();
          })
        : (() => {
            fundOverviewFallbackReason = supabaseStatus.reason;
            return loadFundOverviewFromAppsScript();
          })();

      return loader.then((data) => {
        fundOverviewData = data;
        renderFundOverview(data, null);
        showSyncToast(data.supabaseCached
          ? 'Quỹ tổng quan đang đọc từ Supabase cache.'
          : 'Quỹ tổng quan đã quay về Apps Script. ' + (fundOverviewFallbackReason || ''));
        
        const months = data.months || [];
        const selectedIndex = months.findIndex(m => m.key === data.selectedMonth);
        if (selectedIndex >= 0 && selectedIndex + 1 < months.length) {
          const prevMonthKey = months[selectedIndex + 1].key;
          callApi('GET', 'getFundOverview', {
            year: '2026',
            month: prevMonthKey
          }).then((prevData) => {
            renderFundOverview(data, prevData);
          }).catch(() => {});
        }
      }).catch((err) => {
        el('fundOverviewMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải quỹ</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
      });
    }

    function getFundGrowth(currVal, prevVal, invert = false) {
      if (prevVal === undefined || prevVal === null || prevVal === 0) {
        return { text: '-', statusClass: 'ok' };
      }
      const pct = ((currVal - prevVal) / Math.abs(prevVal)) * 100;
      if (!Number.isFinite(pct)) return { text: '-', statusClass: 'ok' };
      
      const symbol = pct >= 0 ? '▲' : '▼';
      const formattedPct = `${symbol} ${Math.abs(pct).toLocaleString('vi-VN', { maximumFractionDigits: 1 })}%`;
      
      let isGood = pct >= 0;
      if (invert) isGood = !isGood;
      
      return {
        text: formattedPct,
        statusClass: isGood ? 'ok' : 'err'
      };
    }

    function renderFundOverview(data, prevData) {
      renderFundOverviewMonthFilter(data.months || [], data.selectedMonth || '');
      const filterSelect = el('fundOverviewMonthFilter');
      const noteEl = el('fundOverviewNote');
      if (filterSelect && noteEl) {
        const selectedText = filterSelect.options[filterSelect.selectedIndex]?.text || 'Tháng gần nhất';
        noteEl.textContent = `Tháng: ${selectedText}`;
      }
      const metrics = el('fundOverviewMetrics');
      const timeStr = new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
      
      const config = {
        openingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>` },
        periodIncome: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>` },
        periodExpense: { badge: 'red', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>` },
        periodNet: { badge: 'amber', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>` },
        closingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>` },
        currentBalance: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>` }
      };

      metrics.innerHTML = (data.metrics || []).map((item) => {
        const conf = config[item.key] || { badge: 'blue', icon: '' };
        const numPart = formatFundAmount(item.value, '0');
        
        let badgeColor = conf.badge;
        if (item.key === 'periodNet') {
          badgeColor = (item.value >= 0) ? 'green' : 'red';
        }
        
        let growthText = '...';
        let growthClass = 'ok';
        if (prevData) {
          const prevItem = (prevData.metrics || []).find(m => m.key === item.key);
          if (prevItem) {
            const invert = item.key === 'periodExpense';
            const growth = getFundGrowth(item.value, prevItem.value, invert);
            growthText = growth.text;
            growthClass = growth.statusClass;
          } else {
            growthText = '-';
          }
        } else if (prevData === null) {
          growthText = '-';
        }
        
        return `
          <article class="kpi-card">
            <div class="kpi-card-header">
              <div class="kpi-label">${escapeHtml(item.label)}</div>
              <div class="kpi-icon-badge ${badgeColor}">${conf.icon}</div>
            </div>
            <div class="kpi-value ${badgeColor}">${escapeHtml(numPart)}</div>
            <div class="kpi-card-footer" style="border-top:none; padding-top:0; margin-top:4px;">
              <div class="kpi-status ${growthClass}"><span>${escapeHtml(growthText)}</span></div>
              <div class="kpi-time">${escapeHtml(timeStr)}</div>
            </div>
          </article>
        `;
      }).join('');
      
      renderFundCategoryRows('fundIncomeCategoryBody', data.incomeCategories || [], 'Thu');
      renderFundCategoryRows('fundExpenseCategoryBody', data.expenseCategories || [], 'Chi');
      renderFundFinancialReportCard(data);
    }

    function renderFundOverviewMonthFilter(months, selectedMonth) {
      const select = el('fundOverviewMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tháng gần nhất</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function renderFundCategoryRows(targetId, rows, type) {
      const body = el(targetId);
      if (!body) return;
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:24px;">Không có dữ liệu.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row, index) => `
        <tr>
          <td>${escapeHtml(row.category)}</td>
          <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, '')}</td>
          <td style="text-align:right;"><button type="button" class="sub-tab" style="min-height:28px;" onclick="showFundCategoryDetail('${type}', ${index})">Xem</button></td>
        </tr>
      `).join('');
    }

    function renderFundFinancialReportCard(data) {
      const body = el('fundFinancialReportBody');
      const note = el('fundFinancialReportNote');
      if (!body) return;

      const selectedLabel = el('fundOverviewMonthFilter')?.selectedOptions?.[0]?.text || 'Tháng gần nhất';
      if (note) note.textContent = `Kỳ báo cáo: ${selectedLabel}`;

      const metricMap = {};
      (data.metrics || []).forEach((item) => {
        metricMap[item.key] = item;
      });

      const summaryRows = [
        ['Số dư đầu kỳ', metricMap.openingBalance?.value, 'normal'],
        ['TỔNG THU TRONG KỲ', metricMap.periodIncome?.value, 'income'],
        ['Chi trong kỳ', metricMap.periodExpense?.value, 'expense'],
        ['Tổng thu-chi', metricMap.periodNet?.value, Number(metricMap.periodNet?.value || 0) >= 0 ? 'income' : 'expense'],
        ['Số dư cuối kỳ', metricMap.closingBalance?.value, 'income'],
        ['Số dư hiện tại', metricMap.currentBalance?.value, 'income']
      ];

      const summaryHtml = summaryRows.map(([label, value, tone]) => `
        <tr>
          <td>${escapeHtml(label)}:</td>
          <td class="fund-export-value ${tone}">${formatFundAmount(value || 0, '0')}</td>
        </tr>
      `).join('');

      const categoryRowsHtml = (rows, tone, type) => rows.length ? rows.map((row, index) => `
        <tr>
          <td>${escapeHtml(row.category || '-')}</td>
          <td class="fund-export-value ${tone}">${formatFundAmount(row.amount || 0, '0')}</td>
          <td class="fund-export-action no-export"><button type="button" class="sub-tab" onclick="showFundCategoryDetail('${type}', ${index})">Xem</button></td>
        </tr>
      `).join('') : '<tr><td colspan="3" class="fund-export-empty">Không có dữ liệu</td></tr>';

      const incomeTotal = Number(metricMap.periodIncome?.value || 0);
      const expenseTotal = Number(metricMap.periodExpense?.value || 0);

      body.innerHTML = `
        <div class="fund-export-grid">
          <section class="fund-export-section">
            <div class="fund-export-section-title teal">Tổng quan</div>
            <table class="fund-export-table"><tbody>${summaryHtml}</tbody></table>
          </section>
          <section class="fund-export-section">
            <div class="fund-export-section-title blue">
              <span>TỔNG THU TRONG KỲ:</span>
              <small>${formatFundAmount(incomeTotal, '0')}</small>
            </div>
            <table class="fund-export-table"><tbody>${categoryRowsHtml(data.incomeCategories || [], 'income', 'Thu')}</tbody></table>
          </section>
          <section class="fund-export-section">
            <div class="fund-export-section-title amber">
              <span>Tổng chi trong kỳ:</span>
              <small>${formatFundAmount(expenseTotal, '0')}</small>
            </div>
            <table class="fund-export-table"><tbody>${categoryRowsHtml(data.expenseCategories || [], 'expense', 'Chi')}</tbody></table>
          </section>
        </div>
      `;
    }

    function exportFundFinancialReport(btn) {
      const card = el('fundFinancialReportCard');
      const exportBtn = card?.querySelector('[data-fund-export-button]');
      if (exportBtn) {
        exportCardAsImage(exportBtn, 'ThuChi');
      } else if (btn) {
        exportCardAsImage(btn, 'ThuChi');
      }
    }

    function renderFundDetailRows(details, type) {
      const body = el('fundCategoryDetailBody');
      const mobileList = el('fundDetailMobileList');
      
      // Render Desktop Table (bỏ cột Loại)
      if (body) {
        body.innerHTML = (details || []).map((row) => `
          <tr>
            <td>${escapeHtml(row.dateText || row.date || '')}</td>
            <td>${escapeHtml(row.category || '')}</td>
            <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, row.amountText)}</td>
            <td>${escapeHtml(row.partner || '')}</td>
            <td>${escapeHtml(row.content || '')}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</td></tr>';
      }
      
      // Render Mobile Card List (bỏ Phân loại, đưa Nội dung lên dưới Đối tác căn phải, tiền ở dưới cùng)
      if (mobileList) {
        mobileList.innerHTML = (details || []).map((row) => `
          <div class="fund-detail-mobile-card">
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Ngày</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.dateText || row.date || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Hạng mục</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.category || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Đối tác</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.partner || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row" style="align-items: flex-start;">
              <span class="fund-detail-mobile-card-label">Nội dung</span>
              <span class="fund-detail-mobile-card-value" style="color: var(--muted); font-weight: 500; font-size: 12px; max-width: 70%; text-align: right; white-space: normal;">${escapeHtml(row.content || 'Không có nội dung')}</span>
            </div>
            <div class="fund-detail-mobile-card-row" style="border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px;">
              <span class="fund-detail-mobile-card-label">Số tiền</span>
              <span class="fund-detail-mobile-card-value fund-detail-mobile-card-amount" style="color: ${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">
                ${type === 'Thu' ? '+' : '-'}${formatFundAmount(row.amount, row.amountText)}
              </span>
            </div>
          </div>
        `).join('') || '<div style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</div>';
      }
    }

    function showFundCategoryDetail(type, index) {
      const rows = type === 'Thu' ? (fundOverviewData?.incomeCategories || []) : (fundOverviewData?.expenseCategories || []);
      const item = rows[index];
      const title = el('fundCategoryDetailTitle');
      const hint = el('fundCategoryDetailHint');
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      if (!item) return;
      
      currentDetailItem = item;
      currentDetailType = type;
      
      if (title) title.textContent = `Chi tiết ${type.toLowerCase()} - ${item.category}`;
      if (hint) hint.textContent = `Tổng ${formatFundAmount(item.amount, '')}.`;
      
      // Tạo danh sách đối tác độc nhất để đổ vào bộ lọc
      const select = el('fundDetailPartnerFilter');
      const filterArea = el('fundDetailFilterArea');
      if (select) {
        const partners = Array.from(new Set((item.details || []).map(d => String(d.partner || '').trim()).filter(Boolean)));
        select.innerHTML = '<option value="">Tất cả đối tác</option>';
        partners.sort().forEach((p) => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          select.appendChild(opt);
        });
        select.value = '';
      }
      if (filterArea) filterArea.style.display = 'flex';
      
      renderFundDetailRows(item.details || [], type);
      
      if (card) card.classList.add('open');
      if (backdrop) backdrop.style.display = 'block';
      document.body.classList.add('locked');
    }

    window.filterFundDetailByPartner = function() {
      if (!currentDetailItem) return;
      const selectedPartner = el('fundDetailPartnerFilter')?.value || '';
      const details = currentDetailItem.details || [];
      const filtered = selectedPartner
        ? details.filter(d => String(d.partner || '').trim() === selectedPartner)
        : details;
      
      // Tính lại tổng tiền sau khi lọc đối tác
      const total = filtered.reduce((sum, d) => sum + Number(d.amount || 0), 0);
      const hint = el('fundCategoryDetailHint');
      if (hint) hint.textContent = `Tổng ${formatFundAmount(total, '')}.`;
      
      renderFundDetailRows(filtered, currentDetailType);
    };

    window.closeFundDetailDrawer = function() {
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      const filterArea = el('fundDetailFilterArea');
      if (card) card.classList.remove('open');
      if (backdrop) backdrop.style.display = 'none';
      if (filterArea) filterArea.style.display = 'none';
      
      // Chỉ mở khóa body nếu không có menu sidebar di động đang mở
      if (!document.body.classList.contains('drawer-open')) {
        document.body.classList.remove('locked');
      }
    };

    function loadFundFormOptions() {
      if (fundFormOptions) return Promise.resolve(fundFormOptions);
      const supabaseStatus = getSupabaseReportStatus();
      const loadFromAppsScript = () => callApi('GET', 'getFundFormOptions', { year: '2026' });
      const loader = supabaseStatus.ok
        ? readFundFormOptionsFromSupabase('2026').catch((err) => {
            console.warn('Không đọc được danh mục nhập Quỹ từ Supabase, quay về Apps Script:', err);
            return loadFromAppsScript();
          })
        : loadFromAppsScript();
      return loader
        .then((data) => {
          fundFormOptions = data;
          renderFundFormOptions();
          return data;
        })
        .catch((err) => {
          console.warn('Không thể tải danh mục Thu chi:', err);
          renderFundFormOptions();
          return null;
        });
    }

    function renderFundFormOptions() {
      const options = fundFormOptions || {};
      renderFundCategoryOptions();
      fillSelect('fundActorInput', options.actors || [], 'Chọn người thu/chi');
      fillSelect('fundPartnerInput', options.partners || [], 'Chọn đối tác');
      fillSelect('loanPartnerInput', options.loanPartners || [], 'Chọn nơi vay');
      fillSelect('loanPaymentPartnerInput', options.loanPartners || [], 'Chọn đối tác');
    }

    function fillSelect(id, values, placeholder) {
      const list = el(id);
      if (!list) return;
      const currentValue = list.value || '';
      const unique = [];
      const seen = new Set();
      (values || []).forEach((value) => {
        const text = String(value || '').trim();
        if (!text) return;
        const key = text.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        unique.push(text);
      });
      list.innerHTML = '';
      const placeholderOption = document.createElement('option');
      placeholderOption.value = '';
      placeholderOption.textContent = placeholder || 'Chọn danh mục';
      placeholderOption.disabled = true;
      placeholderOption.selected = !currentValue;
      list.appendChild(placeholderOption);
      unique.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        list.appendChild(option);
      });
      if (currentValue && !unique.some((item) => item === currentValue)) {
        const option = document.createElement('option');
        option.value = currentValue;
        option.textContent = currentValue;
        list.appendChild(option);
      }
      if (currentValue) list.value = currentValue;
    }

    function renderFundCategoryOptions() {
      const options = fundFormOptions || {};
      const type = el('fundTypeInput')?.value || 'Chi';
      const categorySelect = el('fundCategoryInput');
      if (!categorySelect) return;
      const source = type === 'Thu' ? (options.incomeCategories || []) : (options.expenseCategories || []);
      fillSelect('fundCategoryInput', source, type === 'Thu' ? 'Chọn mục thu' : 'Chọn mục chi');
      categorySelect.value = categorySelect.dataset.selected || categorySelect.value || '';
    }

    function fillDatalist(id, values) {
      const list = el(id);
      if (!list) return;
      list.innerHTML = '';
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        list.appendChild(option);
      });
    }

    function handleFundTypeChange() {
      const category = el('fundCategoryInput');
      if (category) category.value = '';
      renderFundCategoryOptions();
    }

    function newBlankFundTransaction(seed = {}) {
      return {
        date: seed.date || appData?.today || new Date().toISOString().slice(0, 10),
        type: seed.type || 'Chi',
        category: seed.category || '',
        amount: stripCurrencySymbolText(seed.amountText || seed.amount || ''),
        actor: seed.actor || '',
        partner: seed.partner || '',
        content: seed.content || '',
        debt: seed.debt === true || seed.debt === 'Có'
      };
    }

    function getFundCategoryValues(type) {
      const options = fundFormOptions || {};
      return type === 'Thu' ? (options.incomeCategories || []) : (options.expenseCategories || []);
    }

    function buildFundOptionHtml(values, currentValue, placeholder) {
      const unique = [];
      const seen = new Set();
      (values || []).forEach((value) => {
        const text = String(value || '').trim();
        const key = text.toLowerCase();
        if (!text || seen.has(key)) return;
        seen.add(key);
        unique.push(text);
      });
      if (currentValue && !unique.includes(currentValue)) unique.push(currentValue);
      return [`<option value="">${escapeHtml(placeholder || 'Chọn')}</option>`].concat(unique.map((value) => {
        const selected = value === currentValue ? ' selected' : '';
        return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(value)}</option>`;
      })).join('');
    }

    function renderFundTransactionRows(options = {}) {
      const holder = el('fundTransactionRows');
      if (!holder) return;
      if (!fundTransactionRows.length) {
        fundTransactionRows = [newBlankFundTransaction()];
      }
      const isEdit = Boolean(fundTransactionEditRowIndex);
      holder.innerHTML = fundTransactionRows.map((row, index) => {
        const categories = getFundCategoryValues(row.type);
        const categoryOptions = ['<option value="">Chọn mục thu/chi</option>'].concat(categories.map((value) => {
          const selected = value === row.category ? ' selected' : '';
          return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(value)}</option>`;
        })).join('');
        const actorOptions = buildFundOptionHtml(fundFormOptions?.actors || [], row.actor, 'Chọn người thu/chi');
        const partnerOptions = buildFundOptionHtml(fundFormOptions?.partners || [], row.partner, 'Chọn đối tác');
        return `
          <article class="entry-row fund-transaction-row" data-fund-row="${index}">
            <div class="entry-row-head">
              <div class="entry-row-title"><span class="row-number">${index + 1}</span><span>Dòng thu chi</span></div>
              <button type="button" class="danger" onclick="removeFundTransactionRow(${index})" ${fundTransactionRows.length === 1 || (isEdit && index === 0) ? 'disabled' : ''}>Xóa</button>
            </div>
            <div class="fields">
              <label class="full">Ngày<input type="text" class="vi-date-input" inputmode="numeric" placeholder="dd/mm/yyyy" data-iso="${escapeHtml(row.date || '')}" value="${escapeHtml(formatIsoDateForDisplay(row.date || ''))}" oninput="updateFundTransactionRow(${index}, 'date', getDateInputIso(this))" onchange="updateFundTransactionRow(${index}, 'date', getDateInputIso(this))" required></label>
              <label>Loại<select onchange="updateFundTransactionRow(${index}, 'type', this.value)"><option value="Chi"${row.type === 'Chi' ? ' selected' : ''}>Chi</option><option value="Thu"${row.type === 'Thu' ? ' selected' : ''}>Thu</option></select></label>
              <label>Mục thu/chi<select onchange="updateFundTransactionRow(${index}, 'category', this.value)" required>${categoryOptions}</select></label>
              <label class="full">Số tiền<input type="text" class="format-money-input" inputmode="numeric" value="${escapeHtml(row.amount || '')}" placeholder="0" oninput="updateFundTransactionRow(${index}, 'amount', this.value)" required></label>
              <label>Người Thu/Chi<select onchange="updateFundTransactionRow(${index}, 'actor', this.value)" required>${actorOptions}</select></label>
              <label>Đối tác<select onchange="updateFundTransactionRow(${index}, 'partner', this.value)">${partnerOptions}</select></label>
              <label class="full fund-debt-toggle"><input type="checkbox" ${row.debt ? 'checked' : ''} onchange="updateFundTransactionRow(${index}, 'debt', this.checked)"> Đánh dấu là công nợ</label>
              <label class="full">Nội dung<textarea rows="2" placeholder="Nội dung thu/chi" oninput="updateFundTransactionRow(${index}, 'content', this.value)">${escapeHtml(row.content || '')}</textarea></label>
            </div>
          </article>
        `;
      }).join('');
      if (Number.isInteger(options.scrollIndex)) {
        requestAnimationFrame(() => scrollFundTransactionRowIntoView(options.scrollIndex, options.focusFirst));
      }
      if (!holder.dataset.focusBound) {
        holder.dataset.focusBound = '1';
        holder.addEventListener('focusin', (event) => {
          const rowEl = event.target.closest('[data-fund-row]');
          if (!rowEl) return;
          const index = Number(rowEl.dataset.fundRow);
          if (Number.isInteger(index)) {
            setTimeout(() => scrollFundTransactionRowIntoView(index, false), 80);
          }
        });
      }
    }

    function scrollFundTransactionRowIntoView(index, focusFirst) {
      const row = document.querySelector(`[data-fund-row="${index}"]`);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (focusFirst) {
        const input = row.querySelector('input, select, textarea');
        if (input) {
          setTimeout(() => input.focus({ preventScroll: true }), 120);
        }
      }
    }

    window.updateFundTransactionRow = function(index, key, value) {
      if (!fundTransactionRows[index]) return;
      fundTransactionRows[index][key] = value;
      if (key === 'type') {
        fundTransactionRows[index].category = '';
        renderFundTransactionRows();
      }
    };

    window.addFundTransactionRow = function() {
      fundTransactionRows.push(newBlankFundTransaction());
      renderFundTransactionRows({ scrollIndex: fundTransactionRows.length - 1, focusFirst: true });
    };

    window.cloneFundTransactionRow = function() {
      const last = fundTransactionRows[fundTransactionRows.length - 1] || newBlankFundTransaction();
      fundTransactionRows.push(newBlankFundTransaction({ ...last }));
      renderFundTransactionRows({ scrollIndex: fundTransactionRows.length - 1, focusFirst: false });
    };

    window.removeFundTransactionRow = function(index) {
      if (fundTransactionRows.length === 1) return;
      if (fundTransactionEditRowIndex && index === 0) return;
      fundTransactionRows.splice(index, 1);
      renderFundTransactionRows({ scrollIndex: Math.max(0, index - 1), focusFirst: false });
    };

    function submitFundTransaction() {
      const btn = el('fundSaveBtn');
      const transactions = fundTransactionRows.map((row) => ({ ...row }));
      const error = validateFundTransactions(transactions);
      if (error) {
        showFundEntryStatus('error', error);
        return;
      }

      if (btn) btn.disabled = true;

      if (fundTransactionEditRowIndex) {
        showFundEntryStatus('info', transactions.length > 1 ? `Đang cập nhật 1 khoản và lưu thêm ${transactions.length - 1} khoản mới...` : 'Đang cập nhật khoản thu/chi...');
        const oldItem = currentEditingTransaction || {};
        const transaction = transactions[0];
        const extraTransactions = transactions.slice(1);

        callApi('POST', 'updateFundTransaction', {}, {
          year: '2026',
          rowIndex: fundTransactionEditRowIndex,
          transaction: {
            ...transaction,
            voucher: oldItem.voucher || '',
            method: oldItem.method || ''
          }
        })
          .then(() => {
            if (!extraTransactions.length) return null;
            return callApi('POST', 'addFundTransactions', {}, {
              year: '2026',
              transactions: extraTransactions
            });
          })
          .then((res) => {
            const addResult = res || {};
            const inserted = Number(addResult.inserted ?? addResult.rows?.length ?? 0);
            if (extraTransactions.length && inserted < extraTransactions.length) {
              throw new Error(`Google Sheets chỉ xác nhận ghi ${inserted}/${extraTransactions.length} khoản mới.`);
            }
            return addResult;
          })
          .then((addResult) => {
            clearFundEntryForm();
            const rowRange = formatFundWriteRowRange(addResult);
            showFundEntryStatus('success', transactions.length > 1
              ? `Đã cập nhật 1 khoản và lưu thêm ${transactions.length - 1} khoản mới${rowRange}.`
              : 'Đã cập nhật khoản thu/chi thành công.');
            loadFundTransactions(true);
            loadFundOverview(true);
            setTimeout(closeFundTransactionAddDrawer, 1000);
          })
          .catch((err) => {
            showFundEntryStatus('error', 'Không thể cập nhật khoản thu/chi: ' + err.message);
          })
          .finally(() => {
            if (btn) btn.disabled = false;
          });
      } else {
        showFundEntryStatus('info', `Đang lưu ${transactions.length} khoản thu/chi...`);
        callApi('POST', 'addFundTransactions', {}, {
          year: '2026',
          transactions: transactions
        })
          .then((res) => {
            const addResult = res || {};
            const inserted = Number(addResult.inserted ?? addResult.rows?.length ?? 0);
            if (inserted < transactions.length) {
              throw new Error(`Google Sheets chỉ xác nhận ghi ${inserted}/${transactions.length} khoản.`);
            }
            clearFundEntryForm();
            showFundEntryStatus('success', `Đã lưu ${inserted} khoản thu/chi vào ${addResult.sheetName || 'file Thu chi'}${formatFundWriteRowRange(addResult)}.`);
            loadFundTransactions(true);
            loadFundOverview(true);
            setTimeout(closeFundTransactionAddDrawer, 1000);
          })
          .catch((err) => {
            showFundEntryStatus('error', 'Không thể lưu khoản thu/chi: ' + err.message);
          })
          .finally(() => {
            if (btn) btn.disabled = false;
          });
      }
    }

    function formatFundWriteRowRange(result) {
      const data = result || {};
      const first = Number(data.firstRow || data.rows?.[0]?.rowIndex || 0);
      const last = Number(data.lastRow || data.rows?.[data.rows.length - 1]?.rowIndex || first || 0);
      if (!first) return '';
      return first === last ? `, dòng ${first}` : `, dòng ${first}-${last}`;
    }

    function validateFundTransactions(transactions) {
      for (let i = 0; i < transactions.length; i++) {
        const error = validateFundTransaction(transactions[i]);
        if (error) return `Dòng ${i + 1}: ${error}`;
      }
      return '';
    }

    function validateFundTransaction(transaction) {
      if (!transaction.date) return 'Vui lòng nhập ngày.';
      if (transaction.type !== 'Thu' && transaction.type !== 'Chi') return 'Vui lòng chọn loại Thu hoặc Chi.';
      if (!transaction.category.trim()) return 'Vui lòng nhập mục thu/chi.';
      if (!(parseLocaleNumber(transaction.amount) > 0)) return 'Số tiền phải lớn hơn 0.';
      if (!transaction.actor.trim()) return 'Vui lòng nhập Người Thu/Chi.';
      if (transaction.debt && !transaction.partner.trim()) return 'Khoản công nợ cần có Đối tác.';
      return '';
    }

    function showFundEntryStatus(type, message) {
      const status = el('fundEntryStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundEntryForm() {
      fundTransactionRows = [newBlankFundTransaction()];
      renderFundTransactionRows();
    }

    function loadFundCatalog(forceRefresh) {
      const group = activeFundCatalogGroup || 'incomeCategories';
      const tableBody = el('fundCatalogTableBody');
      renderFundTableLoading(tableBody, 3, 'Đang tải danh mục quỹ...');
      const supabaseStatus = getSupabaseReportStatus();
      const loadFromAppsScript = () => callApi('GET', 'getFundCatalog', {
        year: '2026',
        group: group,
        forceRefresh: forceRefresh ? 'true' : ''
      });
      const loader = (!forceRefresh && supabaseStatus.ok)
        ? readFundCatalogFromSupabase('2026', group).catch((err) => {
            console.warn('Không đọc được danh mục Quỹ từ Supabase, quay về Apps Script:', err);
            return loadFromAppsScript();
          })
        : loadFromAppsScript();
      return loader.then((data) => {
        fundCatalogData = data;
        renderFundCatalog(data);
      }).catch((err) => {
        if (tableBody) {
          tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--red); padding: 24px;">Lỗi tải danh mục: ${escapeHtml(err.message)}</td></tr>`;
        }
      });
    }

    function setFundCatalogGroup(group) {
      activeFundCatalogGroup = group;
      document.querySelectorAll('[data-fund-catalog-group]').forEach((button) => {
        button.classList.toggle('active', button.dataset.fundCatalogGroup === group);
      });
      fundCatalogEditRowIndex = null;
      clearFundCatalogForm();
      loadFundCatalog(false);
    }

    function renderFundCatalog(data) {
      const rows = data.rows || [];
      const tableBody = el('fundCatalogTableBody');
      const title = el('fundCatalogTitle');
      const note = el('fundCatalogNote');
      if (title) title.textContent = getFundCatalogGroupLabel(activeFundCatalogGroup);
      if (note) {
        const fallbackCount = rows.filter((row) => row.source === 'fallback').length;
        note.textContent = fallbackCount
          ? `Có ${rows.length} mục. ${fallbackCount} mục đang được quét từ dữ liệu đã nhập, chưa nằm trong danh mục cấu hình.`
          : `Có ${rows.length} mục trong danh mục cấu hình.`;
      }
      if (!tableBody) return;

      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--muted); padding: 24px;">Chưa có danh mục nào.</td></tr>';
        return;
      }

      tableBody.innerHTML = rows.map((row, index) => {
        const rowToken = encodeURIComponent(row.rowIndex || '');
        const valueToken = encodeURIComponent(row.value || '');
        return `
        <tr>
          <td>${index + 1}</td>
          <td>
            ${escapeHtml(row.value || '')}
            ${row.source === 'fallback' ? '<span class="preview-badge info" title="Giá trị này được quét từ các phiếu đã nhập, không phải ô danh mục cấu hình." style="margin:0 0 0 8px;">Từ dữ liệu hiện có</span>' : ''}
          </td>
          <td style="text-align:right; white-space:nowrap;">
            ${row.source === 'fallback' ? '' : `
            <button type="button" class="btn-table-action edit" title="Sửa" aria-label="Sửa dòng" style="margin-right: 4px;" onclick="openFundCatalogEdit(decodeURIComponent('${rowToken}'), decodeURIComponent('${valueToken}'))">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button type="button" class="btn-table-action delete" title="Xóa" aria-label="Xóa dòng" onclick="deleteFundCatalogItem(decodeURIComponent('${rowToken}'))">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
            `}
          </td>
        </tr>
        `;
      }).join('');
    }

    function getFundCatalogGroupLabel(group) {
      const labels = {
        incomeCategories: 'Mục Thu',
        expenseCategories: 'Mục Chi',
        actors: 'Người Thu/Chi',
        partners: 'Đối tác',
        loanPartners: 'Nơi vay'
      };
      return labels[group] || group;
    }

    function openFundCatalogEdit(rowIndex, value) {
      fundCatalogEditRowIndex = rowIndex;
      const valueInput = el('fundCatalogValueInput');
      if (valueInput) valueInput.value = value || '';
      const status = el('fundCatalogStatus');
      if (status) {
        status.style.display = 'none';
        status.textContent = '';
      }
    }

    function clearFundCatalogForm() {
      const valueInput = el('fundCatalogValueInput');
      if (valueInput) valueInput.value = '';
      fundCatalogEditRowIndex = null;
    }

    function saveFundCatalogItem() {
      const value = el('fundCatalogValueInput')?.value || '';
      const btn = el('fundCatalogSaveBtn');
      if (!value.trim()) {
        showFundCatalogStatus('error', 'Vui lòng nhập giá trị danh mục.');
        return;
      }
      if (btn) btn.disabled = true;
      showFundCatalogStatus('success', 'Đang lưu danh mục...');
      showSyncToast('Đang lưu danh mục Quỹ...', 'info', true);
      callApi('POST', 'saveFundCatalogItem', {}, {
        year: '2026',
        payload: {
          group: activeFundCatalogGroup,
          rowIndex: fundCatalogEditRowIndex || '',
          value: value,
          note: ''
        }
      })
        .then(() => {
          showFundCatalogStatus('success', 'Đã lưu danh mục. Đang tải lại danh sách...');
          clearFundCatalogForm();
          fundFormOptions = null;
          return Promise.all([
            loadFundCatalog(true),
            loadFundFormOptions()
          ]).then(() => showSyncToast('Danh mục Quỹ đã được cập nhật.', 'info'));
        })
        .catch((err) => {
          showSyncToast('Không thể lưu danh mục Quỹ: ' + err.message, 'error');
          showFundCatalogStatus('error', 'Không thể lưu danh mục: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function deleteFundCatalogItem(rowIndex) {
      if (!confirm('Xóa mục danh mục này?')) return;
      showFundCatalogStatus('success', 'Đang xóa danh mục...');
      showSyncToast('Đang xóa danh mục Quỹ...', 'info', true);
      callApi('POST', 'deleteFundCatalogItem', {}, {
        year: '2026',
        payload: {
          rowIndex: rowIndex
        }
      }).then(() => {
        fundFormOptions = null;
        return Promise.all([
          loadFundCatalog(true),
          loadFundFormOptions()
        ]).then(() => {
          showFundCatalogStatus('success', 'Đã xóa danh mục.');
          showSyncToast('Danh mục Quỹ đã được cập nhật.', 'info');
        });
      }).catch((err) => {
        showSyncToast('Không thể xóa danh mục Quỹ: ' + err.message, 'error');
        showFundCatalogStatus('error', 'Không thể xóa danh mục: ' + err.message);
      });
    }

    function showFundCatalogStatus(type, message) {
      const status = el('fundCatalogStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function loadFundLoanOverview(forceRefresh) {
      const month = el('fundLoanMonthFilter')?.value || '';
      renderFundKpiLoading(el('fundLoanMetrics'), 4);
      renderFundTableLoading(el('fundLoanSummaryBody'), 4, 'Đang tải khoản vay...');
      renderFundTableLoading(el('fundLoanHistoryBody'), 5, 'Đang tải lịch sử vay/trả...');
      const historyPager = el('fundLoanHistoryPager');
      if (historyPager) historyPager.style.display = 'none';
      let fundLoanFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadFundLoanFromAppsScript = () => callApi('GET', 'getFundLoanOverview', { year: '2026', month: month, forceRefresh: forceRefresh ? 'true' : '' });
      const loader = (!forceRefresh && supabaseStatus.ok)
        ? readFundLoanOverviewFromSupabase('2026', month).catch((err) => {
            fundLoanFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được Khoản vay từ Supabase, quay về Apps Script:', err);
            return loadFundLoanFromAppsScript();
          })
        : (() => {
            fundLoanFallbackReason = supabaseStatus.reason;
            return loadFundLoanFromAppsScript();
          })();
      return loader
        .then((data) => {
          fundLoanData = data;
          fundLoanHistoryPage = 1;
          renderFundLoanOverview(data);
          showSyncToast(data.supabaseCached
            ? 'Khoản vay đang đọc từ Supabase cache.'
            : 'Khoản vay đã quay về Apps Script. ' + (fundLoanFallbackReason || ''));
        })
        .catch((err) => {
          el('fundLoanMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải khoản vay</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
        });
    }

    let currentLoanOutstanding = 0;

    function renderFundLoanOverview(data) {
      renderFundLoanMonthFilter(data.months || [], data.selectedMonth || '');
      renderFundLoanPartnerFilter(data.loans || []);
      renderFundLoanHistoryFilters(data.recentRows || []);
      const selectedPartner = el('fundLoanPartnerFilter')?.value || '';
      const loans = (data.loans || []).filter((item) => {
        return !selectedPartner || String(item.partner || '') === selectedPartner;
      });
      const metricRows = buildFundLoanMetrics(data, loans, selectedPartner);
      const metrics = el('fundLoanMetrics');
      const loanKpiColors = {
        borrowed: 'blue',
        principalPaid: 'green',
        interestPaid: 'amber',
        outstanding: 'red'
      };
      metrics.innerHTML = metricRows.map((item) => {
        const color = loanKpiColors[item.key] || 'blue';
        return `
          <article class="kpi-card">
            <div class="kpi-label">${escapeHtml(item.label)}</div>
            <div class="kpi-value ${color}">${formatFundAmount(item.value, '')}</div>
          </article>
        `;
      }).join('');

      const summary = el('fundLoanSummaryBody');
      // Lọc chỉ hiển thị các khoản vay đang còn nợ (outstanding > 0)
      const activeLoans = loans
        .filter(item => Number(item.outstanding || 0) > 0)
        .sort((a, b) => parseFundDateValue(b.loanDate || b.loanDateText) - parseFundDateValue(a.loanDate || a.loanDateText));
      summary.innerHTML = activeLoans.length ? activeLoans.map((item) => `
        <tr>
          <td>${escapeHtml(item.loanDateText || item.loanDate || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td style="text-align:right; font-weight:800; color: var(--red);">${formatFundAmount(item.outstanding, '')}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button type="button" class="sub-tab" style="min-height:28px;" onclick="openFundLoanPayment(decodeURIComponent('${encodeURIComponent(item.code || '')}'), decodeURIComponent('${encodeURIComponent(item.partner || '')}'), ${Number(item.outstanding || 0)})">Thanh toán</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:24px;">Không có khoản vay nào đang nợ.</td></tr>';

      const historyType = el('fundLoanHistoryTypeFilter')?.value || '';
      const historyPartner = el('fundLoanHistoryPartnerFilter')?.value || '';
      const history = el('fundLoanHistoryBody');
      const rows = (data.recentRows || [])
        .slice()
        .filter((row) => !historyType || String(row.type || '') === historyType)
        .filter((row) => !historyPartner || String(row.partner || '') === historyPartner)
        .sort((a, b) => parseFundDateValue(b.date || b.dateText) - parseFundDateValue(a.date || a.dateText));
      const totalHistoryPages = Math.max(1, Math.ceil(rows.length / FUND_LOAN_HISTORY_PAGE_SIZE));
      fundLoanHistoryPage = Math.min(Math.max(1, fundLoanHistoryPage), totalHistoryPages);
      const historyStart = (fundLoanHistoryPage - 1) * FUND_LOAN_HISTORY_PAGE_SIZE;
      const pageRows = rows.slice(historyStart, historyStart + FUND_LOAN_HISTORY_PAGE_SIZE);
      history.innerHTML = pageRows.length ? pageRows.map((row) => {
        const amountColor = row.type === 'Vay' ? 'var(--green)' : 'var(--red)';
        const amountSign = row.type === 'Vay' ? '+' : '-';
        return `
          <tr>
            <td>${escapeHtml(row.dateText || row.date || '')}</td>
            <td>${escapeHtml(row.type || '')}</td>
            <td>${escapeHtml(row.partner || '')}</td>
            <td style="text-align:right; font-weight:800; color: ${amountColor};">${amountSign}${formatFundAmount(row.amount, row.amountText)}</td>
            <td>${escapeHtml(row.content || '')}</td>
          </tr>
        `;
      }).join('') : '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:24px;">Chưa có lịch sử vay/trả.</td></tr>';
      renderFundLoanHistoryPager(rows.length, totalHistoryPages, historyStart + 1, historyStart + pageRows.length);
    }

    function renderFundLoanPartnerFilter(loans) {
      const select = el('fundLoanPartnerFilter');
      if (!select) return;
      const current = select.value || '';
      const partners = Array.from(new Set((loans || [])
        .map((item) => String(item.partner || '').trim())
        .filter(Boolean)))
        .sort((a, b) => a.localeCompare(b, 'vi'));
      select.innerHTML = '<option value="">Tất cả</option>' + partners.map((partner) => (
        `<option value="${escapeHtml(partner)}">${escapeHtml(partner)}</option>`
      )).join('');
      select.value = partners.includes(current) ? current : '';
    }

    function renderFundLoanHistoryFilters(rows) {
      const typeSelect = el('fundLoanHistoryTypeFilter');
      const partnerSelect = el('fundLoanHistoryPartnerFilter');
      if (!typeSelect || !partnerSelect) return;
      const currentType = typeSelect.value || '';
      const currentPartner = partnerSelect.value || '';
      const types = Array.from(new Set((rows || []).map((row) => String(row.type || '').trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'vi'));
      const partners = Array.from(new Set((rows || []).map((row) => String(row.partner || '').trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'vi'));
      typeSelect.innerHTML = '<option value="">Tất cả loại</option>' + types.map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join('');
      partnerSelect.innerHTML = '<option value="">Tất cả đối tác</option>' + partners.map((partner) => `<option value="${escapeHtml(partner)}">${escapeHtml(partner)}</option>`).join('');
      typeSelect.value = types.includes(currentType) ? currentType : '';
      partnerSelect.value = partners.includes(currentPartner) ? currentPartner : '';
    }

    function renderFundLoanHistoryPager(totalRows, totalPages, startRow, endRow) {

    function parseFundDateValue(value) {
      if (!value) return 0;
      if (value instanceof Date && !isNaN(value.getTime())) return value.getTime();
      const text = String(value).trim();
      const iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3])).getTime();
      const vn = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (vn) {
        const year = Number(vn[3].length === 2 ? '20' + vn[3] : vn[3]);
        return new Date(year, Number(vn[2]) - 1, Number(vn[1])).getTime();
      }
      const parsed = new Date(text);
      return isNaN(parsed.getTime()) ? 0 : parsed.getTime();
    }

    function buildFundLoanMetrics(data, loans, selectedPartner) {
      if (!selectedPartner) return data.metrics || [];
      const borrowed = loans.reduce((sum, item) => sum + Number(item.borrowed || 0), 0);
      const principalPaid = loans.reduce((sum, item) => sum + Number(item.principalPaid || 0), 0);
      const interestPaid = loans.reduce((sum, item) => sum + Number(item.interestPaid || 0), 0);
      const outstanding = loans.reduce((sum, item) => sum + Number(item.outstanding || 0), 0);
      return [
        { key: 'borrowed', label: 'Tổng khoản vay', value: borrowed },
        { key: 'principalPaid', label: 'Đã trả nợ gốc', value: principalPaid },
        { key: 'interestPaid', label: 'Đã trả lãi', value: interestPaid },
        { key: 'outstanding', label: 'Dư nợ theo lọc', value: outstanding }
      ];
    }

      };

      const loadFundTransactionsFromAppsScript = () => callApi('GET', 'getFundTransactions', requestParams);
      const loader = (!forceRefresh && supabaseStatus.ok)
        ? readFundTransactionsRangeFromSupabase('2026', requestParams).catch((err) => {

    function readFundTransactionsRangeFromSupabase(year, params) {
      const startDate = String(params.startDate || '').trim();
      const endDate = String(params.endDate || '').trim();
      if (startDate && endDate) {
        const monthKeys = getFundMonthKeysForRange(startDate, endDate);
        if (monthKeys.length) {
          return Promise.all(monthKeys.map((monthKey) => readFundTransactionMonthFromSupabase(year, monthKey)))
            .then((payloads) => filterFundTransactionsPayload(combineFundTransactionPayloads(payloads), params));
        }
      }
      return readFundTransactionsFromSupabase(year, params);
    }

    function getFundMonthKeysForRange(startDate, endDate) {
      const startTime = parseFundDateValue(startDate);
      const endTime = parseFundDateValue(endDate);
      if (!startTime || !endTime || startTime > endTime) return [];
      const start = new Date(startTime);
      const end = new Date(endTime);
      const keys = [];
      const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
      const endCursor = new Date(end.getFullYear(), end.getMonth(), 1);
      while (cursor <= endCursor && keys.length < 24) {
        keys.push(`${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`);
        cursor.setMonth(cursor.getMonth() + 1);
      }
      return keys;
    }

    function combineFundTransactionPayloads(payloads) {
      const validPayloads = (payloads || []).filter(Boolean);
      const first = validPayloads[0] || { ok: true, year: '2026', sheetName: '', headers: [], months: [], transactions: [] };
      const seen = new Set();
      const transactions = [];
      const monthMap = {};
      validPayloads.forEach((payload) => {
        (payload.months || []).forEach((month) => {
          if (month && month.key) monthMap[month.key] = month.label || month.key;
        });
        (payload.transactions || []).forEach((item) => {
          const key = String(item.rowIndex || '') + '|' + String(item.voucher || '') + '|' + String(item.date || '');
          if (seen.has(key)) return;
          seen.add(key);
          transactions.push(item);
        });
      });
      transactions.sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return Number(b.rowIndex || 0) - Number(a.rowIndex || 0);
      });
      return {
        ...first,
        months: Object.keys(monthMap).sort().reverse().map((key) => ({ key, label: monthMap[key] })),
        transactions,
        totalRows: transactions.length,
        limited: validPayloads.some((payload) => payload.limited),
        supabaseCached: true,
        supabaseMonthlyCached: true,
        supabaseSyncedAt: validPayloads.map((payload) => payload.supabaseSyncedAt).filter(Boolean).sort().pop() || first.supabaseSyncedAt
      };
    }

    function filterFundTransactionsPayload(data, params) {
      const startDate = String(params.startDate || '').trim();
      const endDate = String(params.endDate || '').trim();
      const search = removeAccents(String(params.search || params.query || '').trim().toLowerCase());
      const start = startDate ? parseFundDateValue(startDate) : null;
      const end = endDate ? parseFundDateValue(endDate) : null;
      const limit = Math.max(1, Math.min(parseInt(params.limit, 10) || 500, 1000));
      const transactions = (data.transactions || []).filter((item) => {
        const date = parseFundDateValue(item.date || item.dateText || '');
        if (start && (!date || date < start)) return false;
        if (end && (!date || date > end)) return false;
        if (search) {
          const haystack = removeAccents([
            item.voucher,
            item.dateText || item.date,
            item.type,
            item.category,
            item.amountText,
            item.actor,
            item.partner,
            item.content,
            item.debt
          ].join(' ').toLowerCase());
          if (!haystack.includes(search)) return false;
        }
        return true;
      });
      return {
        ...data,
        transactions: transactions.slice(0, limit),
        totalRows: transactions.length,
        limited: transactions.length > limit
      };
    }

    function toFundIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function setFundQuickDate(mode, skipLoad) {
      const start = el('fundStartDate');
      const end = el('fundEndDate');
      const quick = el('fundQuickDateFilter');
      if (quick && quick.value !== mode) quick.value = mode;
      const today = new Date();
      if (mode === 'recent') {
        setDateInputValue(start, '');
        setDateInputValue(end, '');
      } else if (mode === 'today') {
        setDateInputValue(start, toFundIsoDate(today));
        setDateInputValue(end, toFundIsoDate(today));
      } else if (mode === '7days') {
        const from = new Date(today);
        from.setDate(today.getDate() - 6);
        setDateInputValue(start, toFundIsoDate(from));
        setDateInputValue(end, toFundIsoDate(today));
      } else if (mode === 'thisMonth') {
        setDateInputValue(start, toFundIsoDate(new Date(today.getFullYear(), today.getMonth(), 1)));
        setDateInputValue(end, toFundIsoDate(today));
      } else if (mode === 'lastMonth') {
        setDateInputValue(start, toFundIsoDate(new Date(today.getFullYear(), today.getMonth() - 1, 1)));
        setDateInputValue(end, toFundIsoDate(new Date(today.getFullYear(), today.getMonth(), 0)));
      }
      if (!skipLoad && mode !== 'custom') loadFundTransactions(false);
    }

    function renderFundTransactions(data) {
      const tableBody = el('fundTransactionsTableBody');
      const empty = el('fundTransactionsEmpty');
      const notice = el('fundTransactionsNotice');
      const pager = el('fundTransactionsPager');
      if (!tableBody || !empty || !notice) return;

      const rows = data.transactions || [];
      tableBody.innerHTML = '';
      if (!rows.length) {
        empty.style.display = 'block';
        empty.textContent = 'Không có dữ liệu thu chi phù hợp.';
        if (pager) pager.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      const totalPages = Math.max(1, Math.ceil(rows.length / FUND_TRANSACTIONS_PAGE_SIZE));
      fundTransactionsPage = Math.min(Math.max(1, fundTransactionsPage), totalPages);
      const start = (fundTransactionsPage - 1) * FUND_TRANSACTIONS_PAGE_SIZE;
      const pageRows = rows.slice(start, start + FUND_TRANSACTIONS_PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      pageRows.forEach((item) => {
        const tr = document.createElement('tr');
        const typeColor = item.type === 'Thu' ? 'var(--green)' : (item.type === 'Chi' ? 'var(--red)' : 'var(--muted)');
        tr.innerHTML = `
          <td>${escapeHtml(item.dateText || formatTableDate(item.date, false))}</td>
          <td><span style="font-weight: 800; color: ${typeColor};">${escapeHtml(item.type || '-')}</span></td>
          <td>${escapeHtml(item.category || '')}</td>
          <td style="text-align: right; font-weight: 800; color: ${typeColor};">${item.type === 'Thu' ? '+' : (item.type === 'Chi' ? '-' : '')}${formatFundAmount(item.amount, item.amountText)}</td>
          <td>${escapeHtml(item.actor || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td>${escapeHtml(item.content || '')}</td>
          <td style="text-align: center; white-space: nowrap;" class="sticky-col-right">
            <button type="button" class="btn-table-action edit" title="Sửa" style="margin-right: 4px;" onclick="editFundTransaction(${item.rowIndex})">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button type="button" class="btn-table-action delete" title="Xóa" onclick="deleteFundTransaction(${item.rowIndex})">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </td>
        `;
        fragment.appendChild(tr);
      });
      tableBody.appendChild(fragment);
      renderFundTransactionsPager(rows.length, totalPages, start + 1, start + pageRows.length);

      if (data.limited) {
        notice.textContent = `Đang tải ${rows.length}/${data.totalRows} dòng mới nhất. Bảng đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'none';
      } else {
        notice.textContent = `Có ${rows.length} dòng, đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'none';
      }
    }

    function renderFundTransactionsPager(totalRows, totalPages, startRow, endRow) {
      const pager = el('fundTransactionsPager');
      if (!pager) return;
      if (totalRows <= FUND_TRANSACTIONS_PAGE_SIZE) {
        pager.style.display = 'none';
        return;
      }
      pager.style.display = 'flex';
      pager.innerHTML = `
        <div style="font-size:12.5px; font-weight:700; color:var(--muted);">Dòng ${startRow}-${endRow}/${totalRows}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage - 1})" ${fundTransactionsPage <= 1 ? 'disabled' : ''}>Trước</button>
          <span style="font-size:12.5px; font-weight:800; color:var(--deep);">Trang ${fundTransactionsPage}/${totalPages}</span>
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage + 1})" ${fundTransactionsPage >= totalPages ? 'disabled' : ''}>Sau</button>
        </div>
      `;
    }

    function setFundTransactionsPage(page) {
      if (!fundTransactionsData) return;
      fundTransactionsPage = page;
      renderFundTransactions(fundTransactionsData);
      el('fundTransactionsTable')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function formatFundAmount(amount, fallbackText) {
      const number = Number(amount || 0);
      if (number) return Math.round(number).toLocaleString('vi-VN');
      return escapeHtml(stripCurrencySymbolText(fallbackText || ''));
    }

    function stripCurrencySymbolText(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/[₫đĐ]/g, '')
        .trim();
    }

    window.editFundTransaction = function(rowIndex) {
      const item = fundTransactionsData?.transactions?.find(t => t.rowIndex === rowIndex);
      if (!item) return;

      fundTransactionEditRowIndex = rowIndex;
      currentEditingTransaction = item;

      fundTransactionRows = [newBlankFundTransaction(item)];

      openFundTransactionAddDrawer(true);
    };

    window.deleteFundTransaction = function(rowIndex) {
      if (!confirm('Bạn có chắc chắn muốn xóa giao dịch thu chi này?')) return;

      showGlobalLoader('Đang xóa giao dịch...', 'Hệ thống đang tiến hành xóa dòng trên Google Sheets...');
      callApi('POST', 'deleteFundTransaction', {}, {
        year: '2026',
        rowIndex: rowIndex
      })
        .then(() => {
          hideGlobalLoader();
          loadFundTransactions(true);
          loadFundOverview(true);
        })
        .catch((err) => {
          hideGlobalLoader();
          alert('Không thể xóa giao dịch: ' + err.message);
        });
    };

    function showGlobalLoader(title, text) {
      const loader = el('loader');
      if (loader) {
        loader.querySelector('.loader-title').textContent = title || 'Đang xử lý';
        loader.querySelector('.loader-text').textContent = text || 'Vui lòng đợi trong giây lát...';
        loader.querySelector('.spinner').classList.remove('hidden');
        loader.classList.remove('hidden');
      }
    }

    function hideGlobalLoader() {
      el('loader')?.classList.add('hidden');
    }
</script>
