<script>
    function setCashflowTab(tab) {
      activeCashflowTab = tab;
      document.querySelectorAll('[data-cashflow-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.cashflowTab === tab);
      });
      document.querySelectorAll('[data-cashflow-panel]').forEach((panel) => {
        panel.style.display = panel.dataset.cashflowPanel === tab ? '' : 'none';
      });
      if (tab === 'transactions') {
        loadFundTransactions(false);
      }
      if (tab === 'entry') {
        loadFundFormOptions();
      }
      if (tab === 'overview') {
        loadFundOverview(false);
      }
      if (tab === 'loans') {
        loadFundLoanOverview(false);
        loadFundFormOptions();
      }
      if (tab === 'loanEntry') {
        loadFundFormOptions();
      }
      if (tab === 'catalog') {
        loadFundCatalog(false);
      }
    }

    function loadFundOverview(forceRefresh) {
      const metricsHolder = el('fundOverviewMetrics');
      if (metricsHolder) {
        metricsHolder.innerHTML = `
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
          <article class="kpi-card"><div class="shimmer shimmer-text"></div><div class="shimmer shimmer-value"></div></article>
        `;
      }
      
      const month = el('fundOverviewMonthFilter')?.value || '';
      return callApi('GET', 'getFundOverview', {
        year: '2026',
        month: month,
        forceRefresh: forceRefresh ? 'true' : ''
      }).then((data) => {
        fundOverviewData = data;
        renderFundOverview(data, null);
        
        const months = data.months || [];
        const selectedIndex = months.findIndex(m => m.key === data.selectedMonth);
        if (selectedIndex >= 0 && selectedIndex + 1 < months.length) {
          const prevMonthKey = months[selectedIndex + 1].key;
          callApi('GET', 'getFundOverview', {
            year: '2026',
            month: prevMonthKey
          }).then((prevData) => {
            renderFundOverview(data, prevData);
          }).catch(() => {});
        }
      }).catch((err) => {
        el('fundOverviewMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải quỹ</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
      });
    }

    function getFundGrowth(currVal, prevVal, invert = false) {
      if (prevVal === undefined || prevVal === null || prevVal === 0) {
        return { text: '-', statusClass: 'ok' };
      }
      const pct = ((currVal - prevVal) / Math.abs(prevVal)) * 100;
      if (!Number.isFinite(pct)) return { text: '-', statusClass: 'ok' };
      
      const symbol = pct >= 0 ? '▲' : '▼';
      const formattedPct = `${symbol} ${Math.abs(pct).toLocaleString('vi-VN', { maximumFractionDigits: 1 })}%`;
      
      let isGood = pct >= 0;
      if (invert) isGood = !isGood;
      
      return {
        text: formattedPct,
        statusClass: isGood ? 'ok' : 'err'
      };
    }

    function renderFundOverview(data, prevData) {
      renderFundOverviewMonthFilter(data.months || [], data.selectedMonth || '');
      const filterSelect = el('fundOverviewMonthFilter');
      const noteEl = el('fundOverviewNote');
      if (filterSelect && noteEl) {
        const selectedText = filterSelect.options[filterSelect.selectedIndex]?.text || 'Tháng gần nhất';
        noteEl.textContent = `Tháng: ${selectedText}`;
      }
      const metrics = el('fundOverviewMetrics');
      const timeStr = new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
      
      const config = {
        openingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>` },
        periodIncome: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>` },
        periodExpense: { badge: 'red', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>` },
        periodNet: { badge: 'amber', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>` },
        closingBalance: { badge: 'blue', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>` },
        currentBalance: { badge: 'green', icon: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>` }
      };

      metrics.innerHTML = (data.metrics || []).map((item) => {
        const conf = config[item.key] || { badge: 'blue', icon: '' };
        const formatted = formatFundAmount(item.value, '0');
        const numPart = formatted.replace(' đ', '');
        const unitPart = 'đ';
        
        let badgeColor = conf.badge;
        if (item.key === 'periodNet') {
          badgeColor = (item.value >= 0) ? 'green' : 'red';
        }
        
        let growthText = '...';
        let growthClass = 'ok';
        if (prevData) {
          const prevItem = (prevData.metrics || []).find(m => m.key === item.key);
          if (prevItem) {
            const invert = item.key === 'periodExpense';
            const growth = getFundGrowth(item.value, prevItem.value, invert);
            growthText = growth.text;
            growthClass = growth.statusClass;
          } else {
            growthText = '-';
          }
        } else if (prevData === null) {
          growthText = '-';
        }
        
        return `
          <article class="kpi-card">
            <div class="kpi-card-header">
              <div class="kpi-label">${escapeHtml(item.label)}</div>
              <div class="kpi-icon-badge ${badgeColor}">${conf.icon}</div>
            </div>
            <div class="kpi-value ${badgeColor}">${escapeHtml(numPart)} <span class="unit">${escapeHtml(unitPart)}</span></div>
            <div class="kpi-card-footer" style="border-top:none; padding-top:0; margin-top:4px;">
              <div class="kpi-status ${growthClass}"><span>${escapeHtml(growthText)}</span></div>
              <div class="kpi-time">${escapeHtml(timeStr)}</div>
            </div>
          </article>
        `;
      }).join('');
      
      renderFundCategoryRows('fundIncomeCategoryBody', data.incomeCategories || [], 'Thu');
      renderFundCategoryRows('fundExpenseCategoryBody', data.expenseCategories || [], 'Chi');
    }

    function renderFundOverviewMonthFilter(months, selectedMonth) {
      const select = el('fundOverviewMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tháng gần nhất</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function renderFundCategoryRows(targetId, rows, type) {
      const body = el(targetId);
      if (!body) return;
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:24px;">Không có dữ liệu.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row, index) => `
        <tr>
          <td>${escapeHtml(row.category)}</td>
          <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, '')}</td>
          <td style="text-align:right;"><button type="button" class="sub-tab" style="min-height:28px;" onclick="showFundCategoryDetail('${type}', ${index})">Xem</button></td>
        </tr>
      `).join('');
    }

    function renderFundDetailRows(details, type) {
      const body = el('fundCategoryDetailBody');
      const mobileList = el('fundDetailMobileList');
      
      // Render Desktop Table (bỏ cột Loại)
      if (body) {
        body.innerHTML = (details || []).map((row) => `
          <tr>
            <td>${escapeHtml(row.dateText || row.date || '')}</td>
            <td>${escapeHtml(row.category || '')}</td>
            <td style="text-align:right; font-weight:800; color:${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">${formatFundAmount(row.amount, row.amountText)}</td>
            <td>${escapeHtml(row.partner || '')}</td>
            <td>${escapeHtml(row.content || '')}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</td></tr>';
      }
      
      // Render Mobile Card List (bỏ Phân loại, đưa Nội dung lên dưới Đối tác căn phải, tiền ở dưới cùng)
      if (mobileList) {
        mobileList.innerHTML = (details || []).map((row) => `
          <div class="fund-detail-mobile-card">
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Ngày</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.dateText || row.date || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Hạng mục</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.category || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row">
              <span class="fund-detail-mobile-card-label">Đối tác</span>
              <span class="fund-detail-mobile-card-value">${escapeHtml(row.partner || '-')}</span>
            </div>
            <div class="fund-detail-mobile-card-row" style="align-items: flex-start;">
              <span class="fund-detail-mobile-card-label">Nội dung</span>
              <span class="fund-detail-mobile-card-value" style="color: var(--muted); font-weight: 500; font-size: 12px; max-width: 70%; text-align: right; white-space: normal;">${escapeHtml(row.content || 'Không có nội dung')}</span>
            </div>
            <div class="fund-detail-mobile-card-row" style="border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px;">
              <span class="fund-detail-mobile-card-label">Số tiền</span>
              <span class="fund-detail-mobile-card-value fund-detail-mobile-card-amount" style="color: ${type === 'Thu' ? 'var(--green)' : 'var(--red)'};">
                ${type === 'Thu' ? '+' : '-'}${formatFundAmount(row.amount, row.amountText)}
              </span>
            </div>
          </div>
        `).join('') || '<div style="text-align:center; color:var(--muted); padding:24px;">Không có chi tiết.</div>';
      }
    }

    function showFundCategoryDetail(type, index) {
      const rows = type === 'Thu' ? (fundOverviewData?.incomeCategories || []) : (fundOverviewData?.expenseCategories || []);
      const item = rows[index];
      const title = el('fundCategoryDetailTitle');
      const hint = el('fundCategoryDetailHint');
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      if (!item) return;
      
      currentDetailItem = item;
      currentDetailType = type;
      
      if (title) title.textContent = `Chi tiết ${type.toLowerCase()} - ${item.category}`;
      if (hint) hint.textContent = `Tổng ${formatFundAmount(item.amount, '')}.`;
      
      // Tạo danh sách đối tác độc nhất để đổ vào bộ lọc
      const select = el('fundDetailPartnerFilter');
      const filterArea = el('fundDetailFilterArea');
      if (select) {
        const partners = Array.from(new Set((item.details || []).map(d => String(d.partner || '').trim()).filter(Boolean)));
        select.innerHTML = '<option value="">Tất cả đối tác</option>';
        partners.sort().forEach((p) => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          select.appendChild(opt);
        });
        select.value = '';
      }
      if (filterArea) filterArea.style.display = 'flex';
      
      renderFundDetailRows(item.details || [], type);
      
      if (card) card.classList.add('open');
      if (backdrop) backdrop.style.display = 'block';
      document.body.classList.add('locked');
    }

    window.filterFundDetailByPartner = function() {
      if (!currentDetailItem) return;
      const selectedPartner = el('fundDetailPartnerFilter')?.value || '';
      const details = currentDetailItem.details || [];
      const filtered = selectedPartner
        ? details.filter(d => String(d.partner || '').trim() === selectedPartner)
        : details;
      
      // Tính lại tổng tiền sau khi lọc đối tác
      const total = filtered.reduce((sum, d) => sum + Number(d.amount || 0), 0);
      const hint = el('fundCategoryDetailHint');
      if (hint) hint.textContent = `Tổng ${formatFundAmount(total, '')}.`;
      
      renderFundDetailRows(filtered, currentDetailType);
    };

    window.closeFundDetailDrawer = function() {
      const card = el('fundCategoryDetailCard');
      const backdrop = el('fundDetailBackdrop');
      const filterArea = el('fundDetailFilterArea');
      if (card) card.classList.remove('open');
      if (backdrop) backdrop.style.display = 'none';
      if (filterArea) filterArea.style.display = 'none';
      
      // Chỉ mở khóa body nếu không có menu sidebar di động đang mở
      if (!document.body.classList.contains('drawer-open')) {
        document.body.classList.remove('locked');
      }
    };

    function loadFundFormOptions() {
      if (fundFormOptions) return Promise.resolve(fundFormOptions);
      return callApi('GET', 'getFundFormOptions', { year: '2026' })
        .then((data) => {
          fundFormOptions = data;
          renderFundFormOptions();
          return data;
        })
        .catch((err) => {
          console.warn('Không thể tải danh mục Thu chi:', err);
          renderFundFormOptions();
          return null;
        });
    }

    function renderFundFormOptions() {
      const options = fundFormOptions || {};
      renderFundCategoryOptions();
      fillSelect('fundActorInput', options.actors || [], 'Chọn người thu/chi');
      fillSelect('fundPartnerInput', options.partners || [], 'Chọn đối tác');
      fillSelect('loanPartnerInput', options.loanPartners || [], 'Chọn nơi vay');
      fillSelect('loanPaymentPartnerInput', options.loanPartners || [], 'Chọn đối tác');
    }

    function fillSelect(id, values, placeholder) {
      const list = el(id);
      if (!list) return;
      const currentValue = list.value || '';
      const unique = [];
      const seen = new Set();
      (values || []).forEach((value) => {
        const text = String(value || '').trim();
        if (!text) return;
        const key = text.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);
        unique.push(text);
      });
      list.innerHTML = '';
      const placeholderOption = document.createElement('option');
      placeholderOption.value = '';
      placeholderOption.textContent = placeholder || 'Chọn danh mục';
      placeholderOption.disabled = true;
      placeholderOption.selected = !currentValue;
      list.appendChild(placeholderOption);
      unique.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        list.appendChild(option);
      });
      if (currentValue && !unique.some((item) => item === currentValue)) {
        const option = document.createElement('option');
        option.value = currentValue;
        option.textContent = currentValue;
        list.appendChild(option);
      }
      if (currentValue) list.value = currentValue;
    }

    function renderFundCategoryOptions() {
      const options = fundFormOptions || {};
      const type = el('fundTypeInput')?.value || 'Chi';
      const categorySelect = el('fundCategoryInput');
      if (!categorySelect) return;
      const source = type === 'Thu' ? (options.incomeCategories || []) : (options.expenseCategories || []);
      fillSelect('fundCategoryInput', source, type === 'Thu' ? 'Chọn mục thu' : 'Chọn mục chi');
      categorySelect.value = categorySelect.dataset.selected || categorySelect.value || '';
    }

    function fillDatalist(id, values) {
      const list = el(id);
      if (!list) return;
      list.innerHTML = '';
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        list.appendChild(option);
      });
    }

    function handleFundTypeChange() {
      const category = el('fundCategoryInput');
      if (category) category.value = '';
      renderFundCategoryOptions();
    }

    function submitFundTransaction() {
      const status = el('fundEntryStatus');
      const btn = el('fundSaveBtn');
      const transaction = {
        date: el('fundDateInput')?.value || '',
        type: el('fundTypeInput')?.value || '',
        category: el('fundCategoryInput')?.value || '',
        amount: el('fundAmountInput')?.value || '',
        actor: el('fundActorInput')?.value || '',
        partner: el('fundPartnerInput')?.value || '',
        content: el('fundContentInput')?.value || '',
        debt: el('fundDebtInput')?.checked || false
      };
      const error = validateFundTransaction(transaction);
      if (error) {
        showFundEntryStatus('error', error);
        return;
      }

      if (btn) btn.disabled = true;

      if (fundTransactionEditRowIndex) {
        showFundEntryStatus('info', 'Đang cập nhật khoản thu/chi...');
        const oldItem = currentEditingTransaction || {};
        const rowData = [
          oldItem.voucher || '', // Số phiếu
          transaction.date, // Ngày
          transaction.type === 'Thu' ? transaction.category : '', // MỤC THU
          transaction.type === 'Chi' ? transaction.category : '', // MỤC CHI
          oldItem.method || '', // Hình thức
          parseLocaleNumber(transaction.amount), // Số tiền
          transaction.actor, // Người Thu/Chi
          transaction.partner, // Đối tác
          transaction.content, // Nội dung
          transaction.debt ? 'Có' : '' // Công nợ
        ];

        callApi('POST', 'saveSheetRow', {}, {
          sheetName: 'NHAP_THUCHI',
          rowIndex: fundTransactionEditRowIndex,
          rowData: rowData
        })
          .then(() => {
            clearFundEntryForm();
            showFundEntryStatus('success', 'Đã cập nhật khoản thu/chi thành công.');
            setCashflowTab('transactions');
            loadFundTransactions(true);
            loadFundOverview(true);
          })
          .catch((err) => {
            showFundEntryStatus('error', 'Không thể cập nhật khoản thu/chi: ' + err.message);
          })
          .finally(() => {
            if (btn) btn.disabled = false;
          });
      } else {
        showFundEntryStatus('info', 'Đang lưu khoản thu/chi...');
        callApi('POST', 'addFundTransaction', {}, { year: '2026', transaction })
          .then(() => {
            clearFundEntryForm();
            showFundEntryStatus('success', 'Đã lưu khoản thu/chi vào file Thu chi.');
            setCashflowTab('transactions');
            loadFundTransactions(true);
            loadFundOverview(true);
          })
          .catch((err) => {
            showFundEntryStatus('error', 'Không thể lưu khoản thu/chi: ' + err.message);
          })
          .finally(() => {
            if (btn) btn.disabled = false;
          });
      }
    }

    function validateFundTransaction(transaction) {
      if (!transaction.date) return 'Vui lòng nhập ngày.';
      if (transaction.type !== 'Thu' && transaction.type !== 'Chi') return 'Vui lòng chọn loại Thu hoặc Chi.';
      if (!transaction.category.trim()) return 'Vui lòng nhập mục thu/chi.';
      if (!(parseLocaleNumber(transaction.amount) > 0)) return 'Số tiền phải lớn hơn 0.';
      if (!transaction.actor.trim()) return 'Vui lòng nhập Người Thu/Chi.';
      if (transaction.debt && !transaction.partner.trim()) return 'Khoản công nợ cần có Đối tác.';
      return '';
    }

    function showFundEntryStatus(type, message) {
      const status = el('fundEntryStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundEntryForm() {
      ['fundAmountInput', 'fundActorInput', 'fundPartnerInput', 'fundContentInput'].forEach((id) => {
        const field = el(id);
        if (field) field.value = '';
      });
      const category = el('fundCategoryInput');
      if (category) {
        category.value = '';
      }
      const debt = el('fundDebtInput');
      if (debt) debt.checked = false;
    }

    function loadFundCatalog(forceRefresh) {
      const group = activeFundCatalogGroup || 'incomeCategories';
      const tableBody = el('fundCatalogTableBody');
      if (tableBody) {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--muted); padding: 24px;">Đang tải danh mục...</td></tr>';
      }
      return callApi('GET', 'getFundCatalog', {
        year: '2026',
        group: group,
        forceRefresh: forceRefresh ? 'true' : ''
      }).then((data) => {
        fundCatalogData = data;
        renderFundCatalog(data);
      }).catch((err) => {
        if (tableBody) {
          tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--red); padding: 24px;">Lỗi tải danh mục: ${escapeHtml(err.message)}</td></tr>`;
        }
      });
    }

    function setFundCatalogGroup(group) {
      activeFundCatalogGroup = group;
      document.querySelectorAll('[data-fund-catalog-group]').forEach((button) => {
        button.classList.toggle('active', button.dataset.fundCatalogGroup === group);
      });
      fundCatalogEditRowIndex = null;
      clearFundCatalogForm();
      loadFundCatalog(false);
    }

    function renderFundCatalog(data) {
      const rows = data.rows || [];
      const tableBody = el('fundCatalogTableBody');
      const title = el('fundCatalogTitle');
      const note = el('fundCatalogNote');
      if (title) title.textContent = getFundCatalogGroupLabel(activeFundCatalogGroup);
      if (note) note.textContent = `Có ${rows.length} mục trong nhóm này.`;
      if (!tableBody) return;

      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--muted); padding: 24px;">Chưa có danh mục nào.</td></tr>';
        return;
      }

      tableBody.innerHTML = rows.map((row, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHtml(row.value || '')}</td>
          <td>${escapeHtml(row.note || '')}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button type="button" class="btn-table-action edit" title="Sửa" style="margin-right: 4px;" onclick="openFundCatalogEdit(${row.rowIndex}, decodeURIComponent('${encodeURIComponent(row.value || '')}'), decodeURIComponent('${encodeURIComponent(row.note || '')}'))">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button type="button" class="btn-table-action delete" title="Xóa" onclick="deleteFundCatalogItem(${row.rowIndex})">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function getFundCatalogGroupLabel(group) {
      const labels = {
        incomeCategories: 'Mục Thu',
        expenseCategories: 'Mục Chi',
        actors: 'Người Thu/Chi',
        partners: 'Đối tác',
        loanPartners: 'Nơi vay'
      };
      return labels[group] || group;
    }

    function openFundCatalogEdit(rowIndex, value, note) {
      fundCatalogEditRowIndex = rowIndex;
      const valueInput = el('fundCatalogValueInput');
      const noteInput = el('fundCatalogNoteInput');
      if (valueInput) valueInput.value = value || '';
      if (noteInput) noteInput.value = note || '';
      const status = el('fundCatalogStatus');
      if (status) {
        status.style.display = 'none';
        status.textContent = '';
      }
    }

    function clearFundCatalogForm() {
      const valueInput = el('fundCatalogValueInput');
      const noteInput = el('fundCatalogNoteInput');
      if (valueInput) valueInput.value = '';
      if (noteInput) noteInput.value = '';
      fundCatalogEditRowIndex = null;
    }

    function saveFundCatalogItem() {
      const value = el('fundCatalogValueInput')?.value || '';
      const note = el('fundCatalogNoteInput')?.value || '';
      const btn = el('fundCatalogSaveBtn');
      if (!value.trim()) {
        showFundCatalogStatus('error', 'Vui lòng nhập giá trị danh mục.');
        return;
      }
      if (btn) btn.disabled = true;
      showFundCatalogStatus('success', 'Đang lưu danh mục...');
      callApi('POST', 'saveFundCatalogItem', {}, {
        year: '2026',
        payload: {
          group: activeFundCatalogGroup,
          rowIndex: fundCatalogEditRowIndex || '',
          value: value,
          note: note
        }
      })
        .then(() => {
          showFundCatalogStatus('success', 'Đã lưu danh mục.');
          clearFundCatalogForm();
          fundFormOptions = null;
          return Promise.all([
            loadFundCatalog(true),
            loadFundFormOptions()
          ]);
        })
        .catch((err) => {
          showFundCatalogStatus('error', 'Không thể lưu danh mục: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function deleteFundCatalogItem(rowIndex) {
      if (!confirm('Xóa mục danh mục này?')) return;
      callApi('POST', 'deleteFundCatalogItem', {}, {
        year: '2026',
        payload: {
          rowIndex: rowIndex
        }
      }).then(() => {
        fundFormOptions = null;
        loadFundCatalog(true);
        loadFundFormOptions();
      }).catch((err) => {
        showFundCatalogStatus('error', 'Không thể xóa danh mục: ' + err.message);
      });
    }

    function showFundCatalogStatus(type, message) {
      const status = el('fundCatalogStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function loadFundLoanOverview(forceRefresh) {
      const month = el('fundLoanMonthFilter')?.value || '';
      return callApi('GET', 'getFundLoanOverview', { year: '2026', month: month, forceRefresh: forceRefresh ? 'true' : '' })
        .then((data) => {
          fundLoanData = data;
          renderFundLoanOverview(data);
        })
        .catch((err) => {
          el('fundLoanMetrics').innerHTML = `<article class="kpi-card"><div class="kpi-label">Lỗi tải khoản vay</div><div class="kpi-value" style="font-size:18px;">${escapeHtml(err.message)}</div></article>`;
        });
    }

    function renderFundLoanOverview(data) {
      renderFundLoanMonthFilter(data.months || [], data.selectedMonth || '');
      const metrics = el('fundLoanMetrics');
      metrics.innerHTML = (data.metrics || []).map((item) => `
        <article class="kpi-card">
          <div class="kpi-label">${escapeHtml(item.label)}</div>
          <div class="kpi-value">${formatFundAmount(item.value, '')}</div>
        </article>
      `).join('');

      const summary = el('fundLoanSummaryBody');
      const loans = data.loans || [];
      summary.innerHTML = loans.length ? loans.map((item) => `
        <tr>
          <td>${escapeHtml(item.loanDateText || item.loanDate || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(item.borrowed, '')}</td>
          <td style="text-align:right;">${formatFundAmount(item.principalPaid, '')}</td>
          <td style="text-align:right;">${formatFundAmount(item.interestPaid, '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(item.outstanding, '')}</td>
          <td>${escapeHtml(item.principalLatestDateText || item.principalLatestDate || '')}</td>
          <td style="text-align:right; white-space:nowrap;">
            ${Number(item.outstanding || 0) > 0 ? `
              <button type="button" class="sub-tab" style="min-height:28px;" onclick="openFundLoanPayment(decodeURIComponent('${encodeURIComponent(item.code || '')}'), decodeURIComponent('${encodeURIComponent(item.partner || '')}'), ${Number(item.outstanding || 0)}, 'partial')">Trả</button>
              <button type="button" class="sub-tab" style="min-height:28px;" onclick="openFundLoanPayment(decodeURIComponent('${encodeURIComponent(item.code || '')}'), decodeURIComponent('${encodeURIComponent(item.partner || '')}'), ${Number(item.outstanding || 0)}, 'settle')">Tất toán</button>
            ` : `<span style="color: var(--muted); font-weight: 600;">Đã gốc</span>`}
          </td>
        </tr>
      `).join('') : '<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:24px;">Chưa có khoản vay.</td></tr>';

      const history = el('fundLoanHistoryBody');
      const rows = data.recentRows || [];
      history.innerHTML = rows.length ? rows.map((row) => `
        <tr>
          <td>${escapeHtml(row.dateText || row.date || '')}</td>
          <td>${row.isSettled ? '<span class="preview-badge success" style="white-space:nowrap;">Đã trả gốc</span>' : ''}</td>
          <td>${escapeHtml(row.type || '')}</td>
          <td>${escapeHtml(row.partner || '')}</td>
          <td style="text-align:right; font-weight:800;">${formatFundAmount(row.amount, row.amountText)}</td>
          <td>${escapeHtml(row.content || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">Chưa có lịch sử vay/trả.</td></tr>';
    }

    function renderFundLoanMonthFilter(months, selectedMonth) {
      const select = el('fundLoanMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tất cả tháng</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function openFundLoanPayment(code, partner, outstanding, mode) {
      const panel = el('fundLoanPaymentPanel');
      if (!panel) return;
      panel.style.display = 'block';
      el('loanPaymentCodeInput').value = code || '';
      el('loanPaymentPartnerInput').value = partner || '';
      el('loanPaymentTypeInput').value = 'Trả nợ';
      el('loanPaymentAmountInput').value = mode === 'settle' ? Math.max(0, Math.round(Number(outstanding || 0))) : '';
      el('loanPaymentContentInput').value = mode === 'settle' ? 'Tất toán khoản vay' : '';
      showFundLoanPaymentStatus('', '');
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function submitFundLoanPayment() {
      const btn = el('loanPaymentSaveBtn');
      const payment = {
        date: el('loanPaymentDateInput')?.value || '',
        code: el('loanPaymentCodeInput')?.value || '',
        type: el('loanPaymentTypeInput')?.value || '',
        partner: el('loanPaymentPartnerInput')?.value || '',
        amount: el('loanPaymentAmountInput')?.value || '',
        content: el('loanPaymentContentInput')?.value || ''
      };
      const error = validateFundLoanPayment(payment);
      if (error) {
        showFundLoanPaymentStatus('error', error);
        return;
      }
      if (btn) btn.disabled = true;
      showFundLoanPaymentStatus('success', 'Đang lưu thanh toán khoản vay...');
      callApi('POST', 'addFundLoanPayment', {}, { year: '2026', payment })
        .then(() => {
          showFundLoanPaymentStatus('success', 'Đã lưu thanh toán vào NHAP_VAY.');
          clearFundLoanPaymentForm();
          loadFundLoanOverview(true);
          loadFundOverview(true);
        })
        .catch((err) => {
          showFundLoanPaymentStatus('error', 'Không thể lưu thanh toán: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function validateFundLoanPayment(payment) {
      if (!payment.date) return 'Vui lòng nhập ngày thanh toán.';
      if (!payment.code.trim()) return 'Vui lòng chọn mã khoản vay.';
      if (payment.type !== 'Trả nợ' && payment.type !== 'Trả lãi') return 'Vui lòng chọn Trả nợ hoặc Trả lãi.';
      if (!payment.partner.trim()) return 'Vui lòng nhập đối tác.';
      if (!(parseLocaleNumber(payment.amount) > 0)) return 'Số tiền thanh toán phải lớn hơn 0.';
      return '';
    }

    function showFundLoanPaymentStatus(type, message) {
      const status = el('fundLoanPaymentStatus');
      if (!status) return;
      if (!message) {
        status.style.display = 'none';
        status.textContent = '';
        return;
      }
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundLoanPaymentForm() {
      ['loanPaymentDateInput', 'loanPaymentCodeInput', 'loanPaymentPartnerInput', 'loanPaymentAmountInput', 'loanPaymentContentInput'].forEach((id) => {
        const field = el(id);
        if (field) field.value = '';
      });
      const type = el('loanPaymentTypeInput');
      if (type) type.value = 'Trả nợ';
    }

    function submitFundLoan() {
      const btn = el('loanSaveBtn');
      const loan = {
        date: el('loanDateInput')?.value || '',
        method: '',
        partner: el('loanPartnerInput')?.value || '',
        amount: el('loanAmountInput')?.value || '',
        termMonths: el('loanTermInput')?.value || '',
        annualRate: el('loanRateInput')?.value || '',
        interestPeriodMonths: el('loanInterestPeriodInput')?.value || '',
        firstInterestDate: el('loanFirstInterestDateInput')?.value || '',
        content: el('loanContentInput')?.value || ''
      };
      const error = validateFundLoan(loan);
      if (error) {
        showFundLoanStatus('error', error);
        return;
      }
      if (btn) btn.disabled = true;
      showFundLoanStatus('success', 'Đang lưu khoản vay...');
      callApi('POST', 'addFundLoan', {}, { year: '2026', loan })
        .then(() => {
          clearFundLoanForm();
          showFundLoanStatus('success', 'Đã lưu khoản vay vào file Thu chi.');
          setCashflowTab('loans');
          loadFundLoanOverview(true);
        })
        .catch((err) => {
          showFundLoanStatus('error', 'Không thể lưu khoản vay: ' + err.message);
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function validateFundLoan(loan) {
      if (!loan.date) return 'Vui lòng nhập ngày vay.';
      if (!loan.partner.trim()) return 'Vui lòng nhập đối tác.';
      if (!(parseLocaleNumber(loan.amount) > 0)) return 'Số tiền vay phải lớn hơn 0.';
      return '';
    }

    function showFundLoanStatus(type, message) {
      const status = el('fundLoanEntryStatus');
      if (!status) return;
      status.className = 'status ' + (type === 'error' ? 'error' : 'success');
      status.textContent = message;
      status.style.display = 'block';
    }

    function clearFundLoanForm() {
      ['loanPartnerInput', 'loanAmountInput', 'loanTermInput', 'loanRateInput', 'loanInterestPeriodInput', 'loanFirstInterestDateInput', 'loanContentInput'].forEach((id) => {
        const field = el(id);
        if (field) field.value = '';
      });
    }

    function loadFundTransactions(forceRefresh) {
      const tableBody = el('fundTransactionsTableBody');
      const empty = el('fundTransactionsEmpty');
      const notice = el('fundTransactionsNotice');
      const monthFilter = el('fundMonthFilter');
      const pager = el('fundTransactionsPager');
      if (!tableBody || !empty || !notice || !monthFilter) return;

      tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--muted); padding: 24px;">Đang tải dữ liệu thu chi...</td></tr>';
      empty.style.display = 'none';
      if (pager) pager.style.display = 'none';
      notice.textContent = '';
      notice.style.display = 'none';

      const selectedMonth = monthFilter.value || '';
      callApi('GET', 'getFundTransactions', {
        year: '2026',
        month: selectedMonth,
        limit: 500,
        forceRefresh: forceRefresh ? 'true' : ''
      })
        .then((data) => {
          fundTransactionsData = data;
          fundTransactionsPage = 1;
          renderFundMonthFilter(data.months || [], data.selectedMonth || selectedMonth);
          renderFundTransactions(data);
        })
        .catch((err) => {
          tableBody.innerHTML = '';
          empty.style.display = 'block';
          empty.textContent = 'Không thể tải dữ liệu thu chi: ' + err.message;
        });
    }

    function renderFundMonthFilter(months, selectedMonth) {
      const select = el('fundMonthFilter');
      if (!select) return;
      const current = selectedMonth || select.value || '';
      select.innerHTML = '<option value="">Tất cả tháng</option>';
      months.forEach((month) => {
        const option = document.createElement('option');
        option.value = month.key;
        option.textContent = month.label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function renderFundTransactions(data) {
      const tableBody = el('fundTransactionsTableBody');
      const empty = el('fundTransactionsEmpty');
      const notice = el('fundTransactionsNotice');
      const pager = el('fundTransactionsPager');
      if (!tableBody || !empty || !notice) return;

      const rows = data.transactions || [];
      tableBody.innerHTML = '';
      if (!rows.length) {
        empty.style.display = 'block';
        empty.textContent = 'Không có dữ liệu thu chi phù hợp.';
        if (pager) pager.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      const totalPages = Math.max(1, Math.ceil(rows.length / FUND_TRANSACTIONS_PAGE_SIZE));
      fundTransactionsPage = Math.min(Math.max(1, fundTransactionsPage), totalPages);
      const start = (fundTransactionsPage - 1) * FUND_TRANSACTIONS_PAGE_SIZE;
      const pageRows = rows.slice(start, start + FUND_TRANSACTIONS_PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      pageRows.forEach((item) => {
        const tr = document.createElement('tr');
        const typeColor = item.type === 'Thu' ? 'var(--green)' : (item.type === 'Chi' ? 'var(--red)' : 'var(--muted)');
        tr.innerHTML = `
          <td>${escapeHtml(item.dateText || formatTableDate(item.date, false))}</td>
          <td><span style="font-weight: 800; color: ${typeColor};">${escapeHtml(item.type || '-')}</span></td>
          <td>${escapeHtml(item.category || '')}</td>
          <td style="text-align: right; font-weight: 800;">${formatFundAmount(item.amount, item.amountText)}</td>
          <td>${escapeHtml(item.actor || '')}</td>
          <td>${escapeHtml(item.partner || '')}</td>
          <td>${escapeHtml(item.content || '')}</td>
          <td style="text-align: center; white-space: nowrap;" class="sticky-col-right">
            <button type="button" class="btn-table-action edit" title="Sửa" style="margin-right: 4px;" onclick="editFundTransaction(${item.rowIndex})">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button type="button" class="btn-table-action delete" title="Xóa" onclick="deleteFundTransaction(${item.rowIndex})">
              <svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </td>
        `;
        fragment.appendChild(tr);
      });
      tableBody.appendChild(fragment);
      renderFundTransactionsPager(rows.length, totalPages, start + 1, start + pageRows.length);

      if (data.limited) {
        notice.textContent = `Đang tải ${rows.length}/${data.totalRows} dòng mới nhất. Bảng đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'block';
      } else {
        notice.textContent = `Có ${rows.length} dòng, đang chia ${FUND_TRANSACTIONS_PAGE_SIZE} dòng/trang.`;
        notice.style.display = 'block';
      }
    }

    function renderFundTransactionsPager(totalRows, totalPages, startRow, endRow) {
      const pager = el('fundTransactionsPager');
      if (!pager) return;
      if (totalRows <= FUND_TRANSACTIONS_PAGE_SIZE) {
        pager.style.display = 'none';
        return;
      }
      pager.style.display = 'flex';
      pager.innerHTML = `
        <div style="font-size:12.5px; font-weight:700; color:var(--muted);">Dòng ${startRow}-${endRow}/${totalRows}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage - 1})" ${fundTransactionsPage <= 1 ? 'disabled' : ''}>Trước</button>
          <span style="font-size:12.5px; font-weight:800; color:var(--deep);">Trang ${fundTransactionsPage}/${totalPages}</span>
          <button type="button" class="ghost" style="min-height:34px; height:34px; padding:0 12px;" onclick="setFundTransactionsPage(${fundTransactionsPage + 1})" ${fundTransactionsPage >= totalPages ? 'disabled' : ''}>Sau</button>
        </div>
      `;
    }

    function setFundTransactionsPage(page) {
      if (!fundTransactionsData) return;
      fundTransactionsPage = page;
      renderFundTransactions(fundTransactionsData);
      el('fundTransactionsTable')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function formatFundAmount(amount, fallbackText) {
      const number = Number(amount || 0);
      if (number) return Math.round(number).toLocaleString('vi-VN') + ' ₫';
      return escapeHtml(fallbackText || '');
    }

    window.editFundTransaction = function(rowIndex) {
      const item = fundTransactionsData?.transactions?.find(t => t.rowIndex === rowIndex);
      if (!item) return;

      fundTransactionEditRowIndex = rowIndex;
      currentEditingTransaction = item;

      // Điền dữ liệu cũ vào form Thêm khoản thu/chi
      if (el('fundDateInput')) el('fundDateInput').value = item.date || '';
      if (el('fundTypeInput')) el('fundTypeInput').value = item.type || 'Chi';
      
      // Kích hoạt thay đổi loại để cập nhật danh sách hạng mục dropdown
      el('fundCategoryInput').dataset.selected = item.category || '';
      handleFundTypeChange();
      
      if (el('fundAmountInput')) el('fundAmountInput').value = item.amountText || item.amount || '';
      if (el('fundActorInput')) el('fundActorInput').value = item.actor || '';
      if (el('fundPartnerInput')) el('fundPartnerInput').value = item.partner || '';
      if (el('fundContentInput')) el('fundContentInput').value = item.content || '';
      if (el('fundDebtInput')) el('fundDebtInput').checked = (item.debt === 'Có');

      const btn = el('fundSaveBtn');
      if (btn) btn.textContent = 'Cập nhật khoản thu/chi';

      setCashflowTab('entry');
    };

    window.deleteFundTransaction = function(rowIndex) {
      if (!confirm('Bạn có chắc chắn muốn xóa giao dịch thu chi này?')) return;

      showGlobalLoader('Đang xóa giao dịch...', 'Hệ thống đang tiến hành xóa dòng trên Google Sheets...');
      callApi('POST', 'deleteSheetRow', {}, {
        sheetName: 'NHAP_THUCHI',
        rowIndex: rowIndex
      })
        .then(() => {
          hideGlobalLoader();
          loadFundTransactions(true);
          loadFundOverview(true);
        })
        .catch((err) => {
          hideGlobalLoader();
          alert('Không thể xóa giao dịch: ' + err.message);
        });
    };

    function showGlobalLoader(title, text) {
      const loader = el('loader');
      if (loader) {
        loader.querySelector('.loader-title').textContent = title || 'Đang xử lý';
        loader.querySelector('.loader-text').textContent = text || 'Vui lòng đợi trong giây lát...';
        loader.querySelector('.spinner').classList.remove('hidden');
        loader.classList.remove('hidden');
      }
    }

    function hideGlobalLoader() {
      el('loader')?.classList.add('hidden');
    }
</script>
