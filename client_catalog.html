<script>
    let catalogPage = 1;
    const catalogPageSize = 20;
    let lastCatalogQuery = '';

    // Catalog CRUD Operations
    function loadCatalogSheetData() {
      catalogPage = 1;
      lastCatalogQuery = '';
      const displaySheetName = el('catalogSheetSelect').value;
      const sheetName = (displaySheetName === 'DM_ThamSo_TS' || displaySheetName === 'DM_ThamSo_GD') ? 'DM_ThamSo' : displaySheetName;
      
      const tbody = el('catalogTableBody');
      const thead = el('catalogTableHeader');
      
      thead.innerHTML = '';
      renderTableLoading(tbody, 20, 'Đang tải danh mục từ Google Sheets...');
      el('catalogTableEmpty').style.display = 'none';

      return callApi('GET', 'readSheetData', { sheetName: sheetName })
        .then((res) => {
          if (res.ok) {
            if (displaySheetName === 'DM_NhanSu') {
              const colIdx = res.headers.indexOf('DS_TaiXe_DangLam');
              if (colIdx !== -1) {
                res.headers.splice(colIdx, 1);
                res.rows = res.rows.map(r => {
                  const newVals = [...r.values];
                  newVals.splice(colIdx, 1);
                  return {
                    rowIndex: r.rowIndex,
                    values: newVals
                  };
                });
              }
            } else if (displaySheetName === 'DM_ThamSo_TS') {
              res.headers = ["Mã tham số", "Tên tham số", "Giá trị", "Ngày áp dụng tham số"];
              res.rows = res.rows.map(r => {
                return {
                  rowIndex: r.rowIndex,
                  values: [r.values[0], r.values[1], r.values[2], r.values[3]]
                };
              }).filter(r => String(r.values[0] || '').trim() !== '');
            } else if (displaySheetName === 'DM_ThamSo_GD') {
              res.headers = ["Giá dầu áp dụng", "Ngày áp dụng giá dầu", "Ghi chú"];
              res.rows = res.rows.map(r => {
                return {
                  rowIndex: r.rowIndex,
                  values: [r.values[6], r.values[5], r.values[7]]
                };
              }).filter(r => String(r.values[0] || '').trim() !== '');
            }
            
            currentCatalogData = res;
            renderCatalogTable();
            return res;
          } else {
            showTableError(tbody, 20, res.error || 'Google Sheets trả về lỗi không xác định.');
            throw new Error(res.error || 'Google Sheets trả về lỗi không xác định.');
          }
        })
        .catch((err) => {
          showTableError(tbody, 20, err.message || String(err));
          throw err;
        });
    }

    function renderCatalogTable() {
      if (!currentCatalogData) return;
      const headers = [...currentCatalogData.headers];
      const rawRows = currentCatalogData.rows || [];
      
      let vehicleColIdx = -1;
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].toLowerCase().trim();
        if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
          vehicleColIdx = i;
          break;
        }
      }

      const showOwnerCol = (vehicleColIdx !== -1);
      const thead = el('catalogTableHeader');
      thead.innerHTML = '';
      
      headers.forEach((h, idx) => {
        const th = document.createElement('th');
        th.textContent = h;
        if (idx === 0) th.className = 'sticky-col';
        thead.appendChild(th);
        
        if (showOwnerCol && idx === vehicleColIdx) {
          const thOwner = document.createElement('th');
          thOwner.textContent = 'Công ty/Chủ xe';
          thead.appendChild(thOwner);
        }
      });
      
      const thActions = document.createElement('th');
      thActions.textContent = 'Thao tác';
      thActions.style.textAlign = 'center';
      thActions.className = 'sticky-col-right';
      thead.appendChild(thActions);

      const vehiclesByPlate = buildVehicleOwnerMap();
      filteredCatalogRowsData = rawRows.map(row => {
        let owner = '';
        if (showOwnerCol) {
          const plate = String(row.values[vehicleColIdx] || '').trim();
          owner = vehiclesByPlate[plate.toLowerCase()] || '';
        }
        return {
          ...row,
          owner: owner,
          searchText: removeAccents(row.values.concat(owner).join(' ').toLowerCase())
        };
      });

      filterCatalogRows();
    }

    function filterCatalogRows() {
      const query = el('catalogSearchInput').value.toLowerCase().trim();
      if (query !== lastCatalogQuery) {
        catalogPage = 1;
        lastCatalogQuery = query;
      }
      
      const tbody = el('catalogTableBody');
      tbody.innerHTML = '';
      
      let vehicleColIdx = -1;
      if (currentCatalogData) {
        for (let i = 0; i < currentCatalogData.headers.length; i++) {
          const h = currentCatalogData.headers[i].toLowerCase().trim();
          if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
            vehicleColIdx = i;
            break;
          }
        }
      }
      const showOwnerCol = (vehicleColIdx !== -1);

      const matched = filteredCatalogRowsData.filter(row => {
        if (!query) return true;
        return row.searchText.includes(removeAccents(query));
      });

      const totalMatched = matched.length;
      const totalPages = Math.ceil(totalMatched / catalogPageSize) || 1;
      
      if (catalogPage > totalPages) catalogPage = totalPages;
      if (catalogPage < 1) catalogPage = 1;
      
      const startIndex = (catalogPage - 1) * catalogPageSize;
      const endIndex = Math.min(startIndex + catalogPageSize, totalMatched);
      const pageRows = matched.slice(startIndex, endIndex);

      const paginBar = el('catalogPaginationBar');
      if (paginBar) {
        paginBar.style.display = totalMatched > 0 ? 'flex' : 'none';
        el('catalogPaginationInfo').textContent = totalMatched ? `Đang hiển thị ${startIndex + 1}-${endIndex} trên ${totalMatched}` : 'Hiển thị 0-0 trên 0';
        el('catalogPrevPageBtn').disabled = (catalogPage <= 1);
        el('catalogNextPageBtn').disabled = (catalogPage >= totalPages);
      }

      if (totalMatched === 0) {
        el('catalogTableEmpty').style.display = 'block';
        return;
      }
      el('catalogTableEmpty').style.display = 'none';

      const fragment = document.createDocumentFragment();
      pageRows.forEach(row => {
        const tr = document.createElement('tr');
        
        row.values.forEach((val, idx) => {
          const td = document.createElement('td');
          if (idx === 0) td.className = 'sticky-col';
          
          const header = currentCatalogData.headers[idx];
          td.dataset.label = header;
          const headerLower = header.toLowerCase().trim();
          
          if (headerLower === 'tháng') {
            td.textContent = formatTableDate(val, true);
          } else if (headerLower.includes('ngày') || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val))) {
            td.textContent = formatTableDate(val, false);
          } else if (typeof val === 'number') {
            if (headerLower.includes('giá') || headerLower.includes('tiền') || headerLower.includes('phạt') || headerLower.includes('lương')) {
              td.textContent = Math.round(val).toLocaleString('vi-VN') + ' ₫';
              td.style.fontWeight = '600';
            } else {
              td.textContent = val.toLocaleString('vi-VN');
            }
          } else {
            td.textContent = val || '';
          }
          tr.appendChild(td);

          if (showOwnerCol && idx === vehicleColIdx) {
            const tdOwner = document.createElement('td');
            tdOwner.dataset.label = 'Công ty/Chủ xe';
            if (row.owner) {
              const span = document.createElement('span');
              span.className = `badge ${row.owner.toLowerCase().includes('quang quân') ? 'amber' : 'blue'}`;
              span.textContent = row.owner;
              tdOwner.appendChild(span);
            } else {
              tdOwner.textContent = '-';
            }
            tr.appendChild(tdOwner);
          }
        });

        const tdActions = document.createElement('td');
        tdActions.className = 'sticky-col-right';
        tdActions.dataset.label = 'Thao tác';
        tdActions.style.textAlign = 'center';
        tdActions.style.whiteSpace = 'nowrap';
        
        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'btn-table-action edit';
        btnEdit.title = 'Sửa';
        btnEdit.setAttribute('aria-label', 'Sửa dòng');
        btnEdit.style.marginRight = '4px';
        btnEdit.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
        btnEdit.onclick = () => openManageEditModal(row);

        const btnDelete = document.createElement('button');
        btnDelete.type = 'button';
        btnDelete.className = 'btn-table-action delete';
        btnDelete.title = 'Xóa';
        btnDelete.setAttribute('aria-label', 'Xóa dòng');
        btnDelete.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
        btnDelete.onclick = () => deleteManageRow(row.rowIndex);

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);
        tr.appendChild(tdActions);
        
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    function openCatalogAddModal() {
      openManageAddModal();
    }

    function changeCatalogPage(offset) {
      catalogPage += offset;
      filterCatalogRows();
    }
</script>
