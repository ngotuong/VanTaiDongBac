<script>
    let catalogPage = 1;
    const catalogPageSize = 20;
    let lastCatalogQuery = '';
    let lastCatalogPersonnelStatus = 'active';
    let lastCatalogVehicleOwner = '';
    let catalogLoadSeq = 0;

    // Catalog CRUD Operations
    function loadCatalogSheetData(forceRefresh) {
      catalogPage = 1;
      lastCatalogQuery = '';
      const requestSeq = ++catalogLoadSeq;
      const displaySheetName = el('catalogSheetSelect').value;
      syncCatalogPersonnelStatusFilter(displaySheetName);
      syncCatalogVehicleOwnerFilter(displaySheetName);
      
      const tbody = el('catalogTableBody');
      const thead = el('catalogTableHeader');
      
      thead.innerHTML = '';
      renderTableLoading(tbody, 20, 'Đang tải danh mục...');
      el('catalogTableEmpty').style.display = 'none';

      const requestParams = { displaySheetName: displaySheetName };
      const cached = !forceRefresh && getCachedSheetData({ sheetName: displaySheetName });
      if (cached) {
        currentCatalogData = cached.data;
        renderCatalogTable();
      }

      let catalogFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadCatalogDataFromAppsScript = () => callApi('GET', 'readCatalogData', {
        ...requestParams,
        forceRefresh: forceRefresh ? 'true' : ''
      });
      const catalogLoader = (!forceRefresh && supabaseStatus.ok)
        ? readCatalogDataFromSupabase(displaySheetName).catch((err) => {
            catalogFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được bảng danh mục từ Supabase, quay về Apps Script:', err);
            return loadCatalogDataFromAppsScript();
          })
        : (() => {
            catalogFallbackReason = supabaseStatus.reason;
            return loadCatalogDataFromAppsScript();
          })();

      return catalogLoader
        .then((res) => {
          if (requestSeq !== catalogLoadSeq) return res;
          if (res.ok) {
            currentCatalogData = res;
            setCachedSheetData({ sheetName: displaySheetName }, res);
            renderCatalogTable();
            if (res.supabaseCached) {
              showSyncToast('Bảng danh mục đang đọc từ Supabase cache.');
            } else if (catalogFallbackReason) {
              showSyncToast('Bảng danh mục đã quay về Apps Script. ' + catalogFallbackReason);
            }
            return res;
          } else {
            showTableError(tbody, 20, res.error || 'Google Sheets trả về lỗi không xác định.');
            throw new Error(res.error || 'Google Sheets trả về lỗi không xác định.');
          }
        })
        .catch((err) => {
          if (cached) return cached.data;
          showTableError(tbody, 20, err.message || String(err));
          throw err;
        });
    }

    function renderCatalogTable() {
      if (!currentCatalogData) return;
      const headers = [...currentCatalogData.headers];
      const rawRows = currentCatalogData.rows || [];
      
      let vehicleColIdx = -1;
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].toLowerCase().trim();
        if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
          vehicleColIdx = i;
          break;
        }
      }

      const showOwnerCol = (vehicleColIdx !== -1);
      const thead = el('catalogTableHeader');
      thead.innerHTML = '';
      
      headers.forEach((h, idx) => {
        const th = document.createElement('th');
        th.textContent = h;
        if (idx === 0) th.className = 'sticky-col';
        thead.appendChild(th);
        
        if (showOwnerCol && idx === vehicleColIdx) {
          const thOwner = document.createElement('th');
          thOwner.textContent = 'Công ty/Chủ xe';
          thead.appendChild(thOwner);
        }
      });
      
      const thActions = document.createElement('th');
      thActions.textContent = 'Thao tác';
      thActions.style.textAlign = 'center';
      thActions.className = 'sticky-col-right';
      thead.appendChild(thActions);

      const vehiclesByPlate = buildVehicleOwnerMap();
      filteredCatalogRowsData = rawRows.map(row => {
        let owner = '';
        if (showOwnerCol) {
          const plate = String(row.values[vehicleColIdx] || '').trim();
          owner = getCatalogVehicleOwner(row, headers, vehicleColIdx, vehiclesByPlate);
        }
        return {
          ...row,
          owner: owner,
          searchText: removeAccents(row.values.concat(owner).join(' ').toLowerCase())
        };
      });
      populateCatalogVehicleOwnerFilter(displaySheetName, filteredCatalogRowsData);

      filterCatalogRows();
    }

    function syncCatalogPersonnelStatusFilter(sheetName) {
      const wrap = el('catalogPersonnelStatusFilterWrap');
      const select = el('catalogPersonnelStatusFilter');
      const isPersonnel = sheetName === 'DM_NhanSu';
      if (wrap) wrap.style.display = isPersonnel ? 'flex' : 'none';
      if (select && isPersonnel && !select.value) select.value = 'active';
    }

    function syncCatalogVehicleOwnerFilter(sheetName) {
      const wrap = el('catalogVehicleOwnerFilterWrap');
      if (wrap) wrap.style.display = sheetName === 'DM_Xe' ? 'flex' : 'none';
    }

    function getCatalogOwnerColumnIndex(headers) {
      return (headers || []).findIndex((header) => {
        const normalized = removeAccents(String(header || '').trim().toLowerCase());
        return normalized === 'cong ty so huu'
          || normalized === 'cong ty chu xe'
          || normalized === 'cong ty/chu xe'
          || normalized === 'chu xe'
          || normalized === 'don vi so huu';
      });
    }

    function getCatalogVehicleOwner(row, headers, vehicleColIdx, vehiclesByPlate) {
      const ownerColIdx = getCatalogOwnerColumnIndex(headers);
      const directOwner = ownerColIdx >= 0 ? String(row.values[ownerColIdx] || '').trim() : '';
      if (directOwner) return directOwner;
      const plate = String(row.values[vehicleColIdx] || '').trim().toLowerCase();
      return vehiclesByPlate[plate] || '';
    }

    function populateCatalogVehicleOwnerFilter(sheetName, rows) {
      const select = el('catalogVehicleOwnerFilter');
      if (!select) return;
      if (sheetName !== 'DM_Xe') {
        select.value = '';
        return;
      }
      const currentValue = select.value || '';
      const owners = Array.from(new Set((rows || [])
        .map((row) => String(row.owner || '').trim())
        .filter(Boolean)))
        .sort((a, b) => a.localeCompare(b, 'vi'));
      select.innerHTML = '<option value="">Tất cả công ty</option>';
      owners.forEach((owner) => {
        const option = document.createElement('option');
        option.value = owner;
        option.textContent = owner;
        select.appendChild(option);
      });
      select.value = owners.includes(currentValue) ? currentValue : '';
    }

    function getCatalogStatusColumnIndex() {
      const headers = currentCatalogData?.headers || [];
      return headers.findIndex((header) => {
        const normalized = removeAccents(String(header || '').trim().toLowerCase());
        return normalized === 'trang thai' || normalized === 'status';
      });
    }

    function isInactivePersonnelStatus(value) {
      const normalized = removeAccents(String(value || '').trim().toLowerCase());
      return normalized.includes('nghi') || normalized.includes('da nghi') || normalized.includes('khong lam');
    }

    function filterCatalogRows() {
      const query = el('catalogSearchInput').value.toLowerCase().trim();
      const sheetName = el('catalogSheetSelect')?.value || '';
      const personnelStatus = sheetName === 'DM_NhanSu' ? (el('catalogPersonnelStatusFilter')?.value || 'active') : 'all';
      const vehicleOwner = sheetName === 'DM_Xe' ? (el('catalogVehicleOwnerFilter')?.value || '') : '';
      if (query !== lastCatalogQuery || personnelStatus !== lastCatalogPersonnelStatus || vehicleOwner !== lastCatalogVehicleOwner) {
        catalogPage = 1;
        lastCatalogQuery = query;
        lastCatalogPersonnelStatus = personnelStatus;
        lastCatalogVehicleOwner = vehicleOwner;
      }
      
      const tbody = el('catalogTableBody');
      tbody.innerHTML = '';
      
      let vehicleColIdx = -1;
      if (currentCatalogData) {
        for (let i = 0; i < currentCatalogData.headers.length; i++) {
          const h = currentCatalogData.headers[i].toLowerCase().trim();
          if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
            vehicleColIdx = i;
            break;
          }
        }
      }
      const showOwnerCol = (vehicleColIdx !== -1);

      const statusColIdx = sheetName === 'DM_NhanSu' ? getCatalogStatusColumnIndex() : -1;
      const matched = filteredCatalogRowsData.filter(row => {
        if (sheetName === 'DM_NhanSu' && personnelStatus !== 'all' && statusColIdx >= 0) {
          const inactive = isInactivePersonnelStatus(row.values[statusColIdx]);
          if (personnelStatus === 'active' && inactive) return false;
          if (personnelStatus === 'inactive' && !inactive) return false;
        }
        if (sheetName === 'DM_Xe' && vehicleOwner && row.owner !== vehicleOwner) return false;
        if (!query) return true;
        return row.searchText.includes(removeAccents(query));
      });

      const totalMatched = matched.length;
      const totalPages = Math.ceil(totalMatched / catalogPageSize) || 1;
      
      if (catalogPage > totalPages) catalogPage = totalPages;
      if (catalogPage < 1) catalogPage = 1;
      
      const startIndex = (catalogPage - 1) * catalogPageSize;
      const endIndex = Math.min(startIndex + catalogPageSize, totalMatched);
      const pageRows = matched.slice(startIndex, endIndex);

      const paginBar = el('catalogPaginationBar');
      if (paginBar) {
        paginBar.style.display = totalMatched > 0 ? 'flex' : 'none';
        el('catalogPaginationInfo').textContent = totalMatched ? `Đang hiển thị ${startIndex + 1}-${endIndex} trên ${totalMatched}` : 'Hiển thị 0-0 trên 0';
        el('catalogPrevPageBtn').disabled = (catalogPage <= 1);
        el('catalogNextPageBtn').disabled = (catalogPage >= totalPages);
      }

      if (totalMatched === 0) {
        el('catalogTableEmpty').style.display = 'block';
        return;
      }
      el('catalogTableEmpty').style.display = 'none';

      const fragment = document.createDocumentFragment();
      pageRows.forEach(row => {
        const tr = document.createElement('tr');
        
        row.values.forEach((val, idx) => {
          const td = document.createElement('td');
          if (idx === 0) td.className = 'sticky-col';
          
          const header = currentCatalogData.headers[idx];
          td.dataset.label = header;
          const headerLower = header.toLowerCase().trim();
          
          if (headerLower === 'tháng') {
            td.textContent = formatTableDate(val, true);
          } else if (headerLower.includes('ngày') || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val))) {
            td.textContent = formatTableDate(val, false);
          } else if (typeof val === 'number') {
            if (headerLower.includes('giá') || headerLower.includes('tiền') || headerLower.includes('phạt') || headerLower.includes('lương')) {
              td.textContent = Math.round(val).toLocaleString('vi-VN');
              td.style.fontWeight = '600';
            } else {
              td.textContent = val.toLocaleString('vi-VN');
            }
          } else {
            td.textContent = val || '';
          }
          tr.appendChild(td);

          if (showOwnerCol && idx === vehicleColIdx) {
            const tdOwner = document.createElement('td');
            tdOwner.dataset.label = 'Công ty/Chủ xe';
            if (row.owner) {
              const span = document.createElement('span');
              span.className = `badge ${row.owner.toLowerCase().includes('quang quân') ? 'amber' : 'blue'}`;
              span.textContent = row.owner;
              tdOwner.appendChild(span);
            } else {
              tdOwner.textContent = '-';
            }
            tr.appendChild(tdOwner);
          }
        });

        const tdActions = document.createElement('td');
        tdActions.className = 'sticky-col-right';
        tdActions.dataset.label = '';
        tdActions.style.textAlign = 'center';
        tdActions.style.whiteSpace = 'nowrap';
        
        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'btn-table-action edit';
        btnEdit.title = 'Sửa';
        btnEdit.setAttribute('aria-label', 'Sửa dòng');
        btnEdit.style.marginRight = '4px';
        btnEdit.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
        btnEdit.onclick = () => openManageEditModal(row);

        const btnDelete = document.createElement('button');
        btnDelete.type = 'button';
        btnDelete.className = 'btn-table-action delete';
        btnDelete.title = 'Xóa';
        btnDelete.setAttribute('aria-label', 'Xóa dòng');
        btnDelete.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
        btnDelete.onclick = () => deleteManageRow(row.rowIndex);

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);
        tr.appendChild(tdActions);
        
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    function openCatalogAddModal() {
      openManageAddModal();
    }

    function changeCatalogPage(offset) {
      catalogPage += offset;
      filterCatalogRows();
    }
</script>
