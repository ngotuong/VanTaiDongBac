    let appData = null;
    let currentAuthUser = null;
    let catalogsByForm = {};
    let reportsByType = {};
    let recentSubmissions = [];
    let pendingWriteJobs = [];
    let pendingFundWriteJobs = [];
    let fundSubmitRequestId = '';
    let activeView = 'home';
    let activeForm = 'vanChuyen';
    let activeReportTab = 'all';
    let selectedMonth = '';
    let rows = [];
    let currentManageData = null;
    let filteredManageRowsData = [];
    let currentEditRowIndex = null;
    let currentCatalogData = null;
    let filteredCatalogRowsData = [];
    let currentEditCatalogRowIndex = null;
    let activeCashflowTab = 'overview';
    let fundTransactionsData = null;
    let fundTransactionsPage = 1;
    let fundLoanHistoryPage = 1;
    let fundFormOptions = null;
    let fundOverviewData = null;
    let fundLoanData = null;
    let fundCatalogData = null;
    let activeFundCatalogGroup = 'incomeCategories';
    let fundCatalogEditRowIndex = null;
    let currentDetailItem = null;
    let currentDetailType = '';
    let fundTransactionRows = [];
    let fundTransactionEditRowIndex = null;
    let currentEditingTransaction = null;

    let reportBundlePrefetching = false;
    let reportCacheEpoch = 0;
    
    const el = (id) => document.getElementById(id);

    function setManageSheetTab(sheetName) {
      el('manageSheetSelect').value = sheetName;
      document.querySelectorAll('#manageTabsBar .sub-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sheet === sheetName);
      });
      document.querySelector(`#manageTabsBar .sub-tab[data-sheet="${sheetName}"]`)
        ?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      const formType = SHEET_FORM_MAP[sheetName];
      if (formType && formType !== activeForm) {
        activeForm = formType;
        rows = [newBlankRow()];
        clearStatus();
        renderFormTabs();
        renderEntry();
        loadCatalogs(activeForm);
      }
      loadManageSheetData();
    }

    function setCatalogSheetTab(sheetName) {
      el('catalogSheetSelect').value = sheetName;
      if (sheetName === 'DM_NhanSu') {
        const statusFilter = el('catalogPersonnelStatusFilter');
        if (statusFilter && !statusFilter.value) statusFilter.value = 'active';
      }
      document.querySelectorAll('#catalogTabsBar .sub-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sheet === sheetName);
      });
      document.querySelector(`#catalogTabsBar .sub-tab[data-sheet="${sheetName}"]`)
        ?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      loadCatalogSheetData();
    }

    // Dynamic autocomplete select builder
    function createAutocomplete(wrap, options, value, onChange) {
      wrap.innerHTML = '';
      wrap.className = 'ac-container';
      
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ac-input';
      input.placeholder = 'Nhập tìm kiếm nhanh...';
      
      const initialOpt = options.find(o => o.value === value);
      input.value = initialOpt ? initialOpt.label : '';
      
      const dropdown = document.createElement('div');
      dropdown.className = 'ac-dropdown hidden';
      
      let filteredOptions = [];
      let activeIndex = -1;
      
      const renderOptions = (filterText = '') => {
        dropdown.innerHTML = '';
        const normFilter = filterText.toLowerCase().trim();
        filteredOptions = options.filter(o => 
          o.label.toLowerCase().includes(normFilter) || 
          o.value.toLowerCase().includes(normFilter)
        );
        
        if (filteredOptions.length === 0) {
          const item = document.createElement('div');
          item.className = 'ac-item empty';
          item.textContent = 'Không tìm thấy mục khớp';
          dropdown.appendChild(item);
          activeIndex = -1;
          return;
        }
        
        activeIndex = -1;
        filteredOptions.slice(0, 30).forEach((opt, idx) => {
          const item = document.createElement('div');
          item.className = `ac-item ${opt.value === value ? 'selected' : ''}`;
          item.textContent = opt.label;
          item.dataset.index = idx;
          
          const handleSelect = (e) => {
            e.preventDefault();
            e.stopPropagation();
            selectOption(opt);
          };
          item.onmousedown = handleSelect;
          item.ontouchstart = handleSelect;
          dropdown.appendChild(item);
        });
      };
      
      const selectOption = (opt) => {
        value = opt.value;
        input.value = opt.label;
        dropdown.classList.add('hidden');
        onChange(opt.value);
      };
      
      const updateActiveItem = () => {
        const items = dropdown.querySelectorAll('.ac-item:not(.empty)');
        items.forEach((item, idx) => {
          if (idx === activeIndex) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('active');
          }
        });
      };
      
      input.onkeydown = (e) => {
        if (dropdown.classList.contains('hidden')) {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            dropdown.classList.remove('hidden');
            renderOptions(input.value);
          }
          return;
        }
        
        const itemsCount = filteredOptions.slice(0, 30).length;
        
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (itemsCount > 0) {
            activeIndex = (activeIndex + 1) % itemsCount;
            updateActiveItem();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (itemsCount > 0) {
            activeIndex = (activeIndex - 1 + itemsCount) % itemsCount;
            updateActiveItem();
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (activeIndex >= 0 && activeIndex < itemsCount) {
            selectOption(filteredOptions[activeIndex]);
            input.blur();
          } else if (itemsCount > 0) {
            selectOption(filteredOptions[0]);
            input.blur();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          dropdown.classList.add('hidden');
          const currentOpt = options.find(o => o.value === value);
          input.value = currentOpt ? currentOpt.label : '';
          input.blur();
        }
      };
      
      input.onfocus = () => {
        input.value = '';
        renderOptions('');
        dropdown.classList.remove('hidden');
        
        document.querySelectorAll('.ac-dropdown').forEach(d => {
          if (d !== dropdown) d.classList.add('hidden');
        });
      };
      
      input.oninput = () => {
        renderOptions(input.value);
      };
      
      input.onblur = () => {
        setTimeout(() => {
          dropdown.classList.add('hidden');
          const matchedOpt = options.find(o => o.label.toLowerCase().trim() === input.value.toLowerCase().trim());
          if (matchedOpt) {
            value = matchedOpt.value;
            input.value = matchedOpt.label;
            onChange(value);
          } else {
            const currentOpt = options.find(o => o.value === value);
            input.value = currentOpt ? currentOpt.label : '';
          }
        }, 220);
      };
      
      wrap.appendChild(input);
      wrap.appendChild(dropdown);
    }
</script>
