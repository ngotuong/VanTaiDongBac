    function formatTableDate(val, isMonthOnly) {
      if (!val) return '';
      let d = null;
      if (typeof val === 'string') {
        const m = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) {
          d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        } else {
          const parts = val.split(/[\/\-]/);
          if (parts.length === 3) {
            if (parts[0].length === 4) {
              d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            } else if (parts[2].length === 4) {
              d = new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
            } else if (parts[2].length === 2) {
              d = new Date(2000 + Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
            }
          }
        }
      } else if (val instanceof Date && !isNaN(val.getTime())) {
        d = val;
      }
      
      if (!d) return val;
      
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      
      if (isMonthOnly) {
        return `${mm}/${yy}`;
      } else {
        return `${dd}/${mm}/${yy}`;
      }
    }

    // Dynamic autocomplete select builder
    function createAutocomplete(wrap, options, value, onChange) {
      wrap.innerHTML = '';
      wrap.className = 'ac-container';
      
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ac-input';
      input.placeholder = 'Nhập tìm kiếm nhanh...';
      
      const initialOpt = options.find(o => o.value === value);
      input.value = initialOpt ? initialOpt.label : '';
      
      const dropdown = document.createElement('div');
      dropdown.className = 'ac-dropdown hidden';
      
      let filteredOptions = [];
      let activeIndex = -1;
      
      const renderOptions = (filterText = '') => {
        dropdown.innerHTML = '';
        const normFilter = filterText.toLowerCase().trim();
        filteredOptions = options.filter(o => 
          o.label.toLowerCase().includes(normFilter) || 
          o.value.toLowerCase().includes(normFilter)
        );
        
        if (filteredOptions.length === 0) {
          const item = document.createElement('div');
          item.className = 'ac-item empty';
          item.textContent = 'Không tìm thấy mục khớp';
          dropdown.appendChild(item);
          activeIndex = -1;
          return;
        }
        
        activeIndex = -1;
        filteredOptions.slice(0, 30).forEach((opt, idx) => {
          const item = document.createElement('div');
          item.className = `ac-item ${opt.value === value ? 'selected' : ''}`;
          item.textContent = opt.label;
          item.dataset.index = idx;
          
          const handleSelect = (e) => {
            e.preventDefault();
            e.stopPropagation();
            selectOption(opt);
          };
          item.onmousedown = handleSelect;
          item.ontouchstart = handleSelect;
          dropdown.appendChild(item);
        });
      };
      
      const selectOption = (opt) => {
        value = opt.value;
        input.value = opt.label;
        dropdown.classList.add('hidden');
        onChange(opt.value);
      };
      
      const updateActiveItem = () => {
        const items = dropdown.querySelectorAll('.ac-item:not(.empty)');
        items.forEach((item, idx) => {
          if (idx === activeIndex) {
            item.classList.add('active');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('active');
          }
        });
      };
      
      input.onkeydown = (e) => {
        if (dropdown.classList.contains('hidden')) {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            dropdown.classList.remove('hidden');
            renderOptions(input.value);
          }
          return;
        }
        
        const itemsCount = filteredOptions.slice(0, 30).length;
        
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (itemsCount > 0) {
            activeIndex = (activeIndex + 1) % itemsCount;
            updateActiveItem();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (itemsCount > 0) {
            activeIndex = (activeIndex - 1 + itemsCount) % itemsCount;
            updateActiveItem();
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (activeIndex >= 0 && activeIndex < itemsCount) {
            selectOption(filteredOptions[activeIndex]);
            input.blur();
          } else if (itemsCount > 0) {
            selectOption(filteredOptions[0]);
            input.blur();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          dropdown.classList.add('hidden');
          const currentOpt = options.find(o => o.value === value);
          input.value = currentOpt ? currentOpt.label : '';
          input.blur();
        }
      };
      
      input.onfocus = () => {
        input.value = '';
        renderOptions('');
        dropdown.classList.remove('hidden');
        
        document.querySelectorAll('.ac-dropdown').forEach(d => {
          if (d !== dropdown) d.classList.add('hidden');
        });
      };
      
      input.oninput = () => {
        renderOptions(input.value);
      };
      
      input.onblur = () => {
        setTimeout(() => {
          dropdown.classList.add('hidden');
          const matchedOpt = options.find(o => o.label.toLowerCase().trim() === input.value.toLowerCase().trim());
          if (matchedOpt) {
            value = matchedOpt.value;
            input.value = matchedOpt.label;
            onChange(value);
          } else {
            const currentOpt = options.find(o => o.value === value);
            input.value = currentOpt ? currentOpt.label : '';
          }
        }, 220);
      };
      
      wrap.appendChild(input);
      wrap.appendChild(dropdown);
    }
