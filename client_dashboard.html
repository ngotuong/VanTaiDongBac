<script>
    // Dashboard rendering
    function renderHomeSummaryTable(matrix) {
      const table = el('homeSummaryTable');
      if (!table) return;
      
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      
      tbody.innerHTML = '';
      
      const tableRows = matrix || [];
      const body = tableRows.slice(2); // Skip empty padding row and header row
      
      if (!body.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: var(--muted); padding: 24px;">Chưa có dữ liệu báo cáo tài chính.</td></tr>';
        return;
      }
      
      body.forEach((row) => {
        const tr = document.createElement('tr');
        for (let i = 0; i < 11; i++) {
          const td = document.createElement('td');
          if (i === 8) {
            const rev = parseMoney(row[2]);
            const taxTndn = parseMoney(row[3]);
            const taxVat = parseMoney(row[4]);
            const fuelQM = parseMoney(row[5]);
            const toll = parseMoney(row[7]);
            const calculatedGross = rev - taxTndn - taxVat - fuelQM - toll;
            td.textContent = formatCurrencyText(calculatedGross);
          } else {
            td.textContent = row[i] || '';
          }
          
          if (i === 0) {
            td.style.fontWeight = '700';
            td.style.color = 'var(--deep)';
          } else if (i === 2 || i === 8 || i === 10) {
            td.style.color = 'var(--green)';
            td.style.fontWeight = '600';
          } else if (i === 3 || i === 4 || i === 5 || i === 6 || i === 7 || i === 9) {
            td.style.color = 'var(--red)';
            td.style.fontWeight = '400';
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

    function renderDashboard() {
      const dashboard = getDashboardData();
      if (dashboard.loading || !dashboard.overview || !dashboard.overview.months) {
        renderMetrics({ month: 'Tất cả' });
        renderProfitChart([]);
        return;
      }
      
      const parsed = parseOverview(dashboard.overview.months);
      ensureSelectedMonth(parsed.rows);
      const selected = getSelectedOverviewRow(parsed.rows);
      renderMonthFilters(parsed.rows);
      
      const titleEl = el('homeFilterTitle');
      if (titleEl) {
        titleEl.innerHTML = `
          <svg class="btn-svg" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--teal); stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Tháng ${selectedMonth ? selectedMonth : ''}
        `;
      }
      
      renderMetrics(selected);
      renderProfitChart(parsed.rows);
      
      // Render the latest trips table
      renderLatestTripsTable(getLatestTripsWithPending_(dashboard.latestTrips));
      
      // Render the condensed summary table on the dashboard
      renderHomeSummaryTable(dashboard.overview.months);
      
      el('chartNote').textContent = dashboard.loading 
        ? 'Đang tải dữ liệu từ Google Sheets...' 
        : '';
    }

    function renderLatestTripsTable(latestTrips) {
      const dateSpan = el('latestTripsDate');
      const table = el('homeLatestTripsTable');
      if (!table) return;
      
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      
      const dashboard = getDashboardData();
      if (dashboard.loading) {
        if (dateSpan) dateSpan.textContent = '';
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted); padding: 24px;">Đang tải dữ liệu số chuyến...</td></tr>';
        return;
      }
      
      if (!latestTrips || !latestTrips.date || !latestTrips.trips || !latestTrips.trips.length) {
        if (dateSpan) dateSpan.textContent = '';
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted); padding: 24px;">Chưa có dữ liệu chuyến xe của ngày mới nhất.</td></tr>';
        return;
      }
      
      if (dateSpan) dateSpan.textContent = `(${latestTrips.date})`;
      
      tbody.innerHTML = '';
      let totalTrips = 0;
      latestTrips.trips.forEach((item) => {
        const tr = document.createElement('tr');

        const tdProject = document.createElement('td');
        tdProject.textContent = item.project || '-';
        tdProject.style.fontWeight = '600';
        tdProject.style.color = 'var(--ink)';
        
        const tdVehicle = document.createElement('td');
        tdVehicle.textContent = item.vehicle || '';
        tdVehicle.style.fontWeight = '700';
        tdVehicle.style.color = 'var(--deep)';
        
        const tdCount = document.createElement('td');
        tdCount.textContent = Number(item.count || 0).toLocaleString('vi-VN');
        tdCount.style.fontWeight = '600';
        tdCount.style.color = 'var(--ink)';
        totalTrips += Number(item.count || 0);

        const tdTicket = document.createElement('td');
        tdTicket.textContent = item.ticket || '-';
        tdTicket.style.color = 'var(--muted)';
        
        tr.appendChild(tdProject);
        tr.appendChild(tdVehicle);
        tr.appendChild(tdCount);
        tr.appendChild(tdTicket);
        tbody.appendChild(tr);
      });

      const totalRow = document.createElement('tr');
      totalRow.className = 'total-row';
      totalRow.innerHTML = `
        <td colspan="2" style="font-weight:800;color:var(--deep);">Tổng cộng</td>
        <td style="font-weight:800;color:var(--teal);">${totalTrips.toLocaleString('vi-VN')}</td>
        <td></td>
      `;
      tbody.appendChild(totalRow);
    }

    function getLatestTripsWithPending_(latestTrips) {
      const base = latestTrips || { date: '', trips: [] };
      const pendingState = buildPendingLatestTrips_();
      const pendingTrips = pendingState.upserts || [];
      const removalKeys = new Set(pendingState.removals || []);
      if (!pendingTrips.length && !removalKeys.size) return base;

      const candidates = [];
      if (base.date) {
        candidates.push({
          key: normalizeLatestTripDateKey_(base.date),
          label: base.date,
          trips: (base.trips || []).filter((item) => {
            return !removalKeys.has(buildLatestTripKey_(item, item.date || base.date));
          })
        });
      }
      pendingTrips.forEach((item) => {
        const key = normalizeLatestTripDateKey_(item.date);
        if (!key) return;
        let bucket = candidates.find((candidate) => candidate.key === key);
        if (!bucket) {
          bucket = { key, label: formatIsoDateForDisplay(item.date), trips: [] };
          candidates.push(bucket);
        }
        bucket.trips.push(item);
      });
      candidates.sort((a, b) => String(b.key).localeCompare(String(a.key)));
      const latest = candidates[0] || base;
      const seen = new Set();
      const trips = [];
      (latest.trips || []).forEach((item) => {
        const key = buildLatestTripKey_(item, item.date || latest.label);
        if (seen.has(key)) return;
        seen.add(key);
        trips.push(item);
      });
      return { date: latest.label, trips: trips };
    }

    function buildPendingLatestTrips_() {
      const rows = [];
      const removals = [];
      (pendingWriteJobs || []).forEach((job) => {
        const isVanChuyenJob = job.formType === 'vanChuyen' || job.sheetName === 'NL_VanChuyen';
        if (!isVanChuyenJob) return;
        if (!['pending', 'processing', 'failed'].includes(job.status)) return;
        if (job.action === 'deleteSheetRow') {
          const deletedTrip = mapManageRowDataToLatestTrip_(job.rowData);
          if (deletedTrip) removals.push(buildLatestTripKey_(deletedTrip, deletedTrip.date));
          return;
        }
        if (job.action === 'saveSheetRow') {
          const previousTrip = mapManageRowDataToLatestTrip_(job.previousRowData);
          if (previousTrip) removals.push(buildLatestTripKey_(previousTrip, previousTrip.date));
          const updatedTrip = mapManageRowDataToLatestTrip_(job.rowData);
          if (updatedTrip) rows.push({ ...updatedTrip, pendingStatus: job.status });
          return;
        }
        (job.rows || []).forEach((row) => {
          if (!row || !row.date) return;
          rows.push({
            date: row.date,
            project: row.project || '',
            vehicle: row.vehicle || '',
            count: parseLocaleNumber(row.trips) || 0,
            ticket: row.tickets || row.note || '',
            pendingStatus: job.status
          });
        });
      });
      return { upserts: rows, removals: removals };
    }

    function mapManageRowDataToLatestTrip_(rowData) {
      if (!rowData) return null;
      const date = rowData['Ngày'] || rowData.date || '';
      if (!date) return null;
      return {
        date: date,
        project: rowData['Dự án'] || rowData.project || '',
        vehicle: rowData['Biển số xe'] || rowData.vehicle || '',
        count: parseLocaleNumber(rowData['Số chuyến'] || rowData.trips) || 0,
        ticket: rowData['Số phiếu'] || rowData.tickets || rowData['Ghi chú'] || rowData.note || ''
      };
    }

    function buildLatestTripKey_(item, fallbackDate) {
      return [
        normalizeLatestTripDateKey_(item && (item.date || fallbackDate)),
        String(item && item.project || '').trim().toLowerCase(),
        String(item && item.vehicle || '').trim().toLowerCase(),
        String(item && item.count || '').trim(),
        String(item && item.ticket || '').trim().toLowerCase()
      ].join('|');
    }

    function normalizeLatestTripDateKey_(value) {
      if (!value) return '';
      const text = String(value).trim();
      let match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) return `${match[1]}-${match[2]}-${match[3]}`;
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (match) {
        const year = match[3].length === 2 ? `20${match[3]}` : match[3];
        return `${year}-${match[2].padStart(2, '0')}-${match[1].padStart(2, '0')}`;
      }
      return text;
    }

    function renderMetrics(latest) {
      const holder = el('metrics');
      holder.innerHTML = '';
      
      const dashboard = getDashboardData();
      const timeStr = dashboard.updatedAt ? dashboard.updatedAt.split(' ')[1] : new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});

      const parsed = parseOverview(dashboard.overview.months);
      const selectedIndex = parsed.rows.findIndex((row) => row.month === latest.month);
      const previous = selectedIndex > 0 ? parsed.rows[selectedIndex - 1] : null;
      const kpiMap = typeof buildOverviewKpiMap_ === 'function' ? buildOverviewKpiMap_() : {};
      const latestKpi = kpiMap[normalizeMonthLabel_(latest.month || '')] || {};
      const previousKpi = previous ? (kpiMap[normalizeMonthLabel_(previous.month || '')] || {}) : {};
      
      // Helper function to build a shortened growth comparison
      const getGrowth = (current, previousValue, invertGood = false) => {
        if (!previous || previousValue === undefined || previousValue === null || previousValue === 0) {
          return { text: latest.month === 'Tất cả' ? 'Tổng hợp' : '-', statusClass: 'ok' };
        }
        const pct = ((current - previousValue) / Math.abs(previousValue)) * 100;
        if (!Number.isFinite(pct)) return { text: '-', statusClass: 'ok' };
        
        const symbol = pct >= 0 ? '▲' : '▼';
        const formattedPct = `${symbol} ${Math.abs(pct).toLocaleString('vi-VN', { maximumFractionDigits: 1 })}%`;
        
        let isGood = pct >= 0;
        if (invertGood) isGood = !isGood; // For cost metrics, down is good, up is bad
        
        return {
          text: formattedPct,
          statusClass: isGood ? 'ok' : 'err'
        };
      };

      const operatingCost = latestKpi.operatingCost ?? latest.operatingCost ?? 0;
      const cashCost = latest.cashCost || 0;
      const isPositive = (latest.final || 0) >= 0;
      
      const revenueGrowth = getGrowth(latest.revenue || 0, previous?.revenue || 0);
      const operatingCostGrowth = getGrowth(operatingCost, previousKpi.operatingCost ?? previous?.operatingCost ?? 0, true);
      const grossGrowth = getGrowth(latest.gross || 0, previous?.gross || 0);
      const cashCostGrowth = getGrowth(cashCost, previous?.cashCost || 0, true);
      const finalGrowth = getGrowth(latest.final || 0, previous?.final || 0);
      
      const items = [
        {
          label: 'Tổng doanh thu',
          value: latest.revenue || 0,
          badgeClass: 'blue',
          svg: `<svg class="btn-svg" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>`,
          statusText: revenueGrowth.text,
          statusClass: revenueGrowth.statusClass
        },
        {
          label: 'Chi phí vận hành',
          value: operatingCost,
          badgeClass: 'red',
          svg: `<svg class="btn-svg" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>`,
          statusText: operatingCostGrowth.text,
          statusClass: operatingCostGrowth.statusClass
        },
        {
          label: 'Lợi nhuận gộp',
          value: latest.gross || 0,
          badgeClass: 'amber',
          svg: `<svg class="btn-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`,
          statusText: grossGrowth.text,
          statusClass: grossGrowth.statusClass
        },
        {
          label: 'Chi phí sau vận hành',
          value: cashCost,
          badgeClass: 'red',
          svg: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M3 6h18v12H3z"></path><path d="M7 10h.01M17 14h.01M12 12a2 2 0 1 0 0 .01"></path></svg>`,
          statusText: cashCostGrowth.text,
          statusClass: cashCostGrowth.statusClass
        },
        {
          label: 'Lợi nhuận thực tế',
          value: latest.final || 0,
          badgeClass: isPositive ? 'green' : 'red',
          svg: `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
          statusText: finalGrowth.text,
          statusClass: finalGrowth.statusClass
        }
      ];

      items.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'kpi-card';
        
        if (dashboard.loading) {
          card.innerHTML = `
            <div class="kpi-card-header">
              <div class="shimmer" style="height:12px; width:80px;"></div>
              <div class="shimmer" style="height:32px; width:32px; border-radius:50%;"></div>
            </div>
            <div class="shimmer" style="height:32px; width:140px; margin-bottom:16px;"></div>
            <div class="kpi-card-footer" style="border-top:none; padding-top:0;">
              <div class="shimmer" style="height:12px; width:100px;"></div>
              <div class="shimmer" style="height:12px; width:40px;"></div>
            </div>
          `;
        } else {
          const money = formatCurrencyParts(item.value);
          card.innerHTML = `
            <div class="kpi-card-header">
              <div class="kpi-label">${escapeHtml(item.label)}</div>
              <div class="kpi-icon-badge ${item.badgeClass}">${item.svg}</div>
            </div>
            <div class="kpi-value ${item.badgeClass}">${escapeHtml(money.value)} <span class="unit">${escapeHtml(money.unit)}</span></div>
            <div class="kpi-card-footer">
              <div class="kpi-status ${item.statusClass}"><span>${escapeHtml(item.statusText)}</span></div>
              <div class="kpi-time">${escapeHtml(timeStr)}</div>
            </div>
          `;
        }
        holder.appendChild(card);
      });
    }

    function renderProfitChart(rows) {
      const holder = el('profitChart');
      holder.innerHTML = '';
      
      if (getDashboardData().loading) {
        holder.innerHTML = '<div class="shimmer shimmer-chart"></div>';
        return;
      }
      
      const data = rows.filter((row) => row.month).slice(-12);
      if (!data.length) {
        holder.innerHTML = '<div class="panel-note">Chưa có dữ liệu báo cáo lợi nhuận.</div>';
        return;
      }
      
      const step = 500000000;
      const maxValue = Math.max(...data.map((row) => Math.abs(row.final || 0)), 1);
      const max = Math.max(step, Math.ceil(maxValue / step) * step);
      
      const formatShortMoney = (val) => {
        const absVal = Math.abs(val);
        if (absVal >= 1e9) {
          return (val / 1e9).toFixed(1).replace('.', ',').replace(',0', '') + ' tỷ';
        }
        if (absVal >= 1e6) {
          return (val / 1e6).toFixed(0) + ' tr';
        }
        if (absVal >= 1e3) {
          return (val / 1e3).toFixed(0) + ' k';
        }
        return String(val);
      };
      
      const wrapper = document.createElement('div');
      wrapper.className = 'chart-wrapper';
      wrapper.style.display = 'flex';
      wrapper.style.alignItems = 'flex-end';
      wrapper.style.position = 'relative';
      wrapper.style.marginTop = '10px';
      
      // Static Y-Axis
      const yAxis = document.createElement('div');
      yAxis.className = 'chart-y-axis';
      yAxis.style.display = 'flex';
      yAxis.style.flexDirection = 'column';
      yAxis.style.justifyContent = 'space-between';
      yAxis.style.height = '130px';
      yAxis.style.paddingRight = '12px';
      yAxis.style.textAlign = 'right';
      yAxis.style.width = '60px';
      yAxis.style.color = 'var(--muted)';
      yAxis.style.fontSize = '10px';
      yAxis.style.fontWeight = '600';
      yAxis.style.marginBottom = '23px';
      yAxis.style.flexShrink = '0';
      yAxis.style.borderRight = '1px solid var(--line)';
      
      const ticks = [];
      for (let value = max; value >= 0; value -= step) {
        ticks.push(value);
      }
      yAxis.innerHTML = ticks.map((value) => `<div>${formatShortMoney(value)}</div>`).join('');
      
      // Chart Area
      const chartArea = document.createElement('div');
      chartArea.className = 'chart-area';
      chartArea.style.flex = '1';
      chartArea.style.position = 'relative';
      chartArea.style.overflowX = 'auto';
      
      // Grid Lines
      const gridLines = document.createElement('div');
      gridLines.className = 'chart-grid-lines';
      gridLines.style.position = 'absolute';
      gridLines.style.left = '0';
      gridLines.style.right = '0';
      gridLines.style.height = '130px';
      gridLines.style.bottom = '23px';
      gridLines.style.display = 'flex';
      gridLines.style.flexDirection = 'column';
      gridLines.style.justifyContent = 'space-between';
      gridLines.style.pointerEvents = 'none';
      gridLines.style.zIndex = '1';
      
      gridLines.innerHTML = ticks.map((value) => {
        const weight = value === 0 ? '2px solid var(--muted)' : '1px dashed var(--line)';
        return `<div style="border-bottom: ${weight}; width: 100%;"></div>`;
      }).join('');
      
      // Columns
      const chartContainer = document.createElement('div');
      chartContainer.className = 'chart-v';
      chartContainer.style.position = 'relative';
      chartContainer.style.zIndex = '2';
      chartContainer.style.background = 'transparent';
      chartContainer.style.display = 'flex';
      chartContainer.style.alignItems = 'flex-end';
      chartContainer.style.justifyContent = 'space-around';
      chartContainer.style.height = '190px'; // Matching optimized CSS height
      chartContainer.style.width = '100%';
      chartContainer.style.gap = '8px';
      
      data.forEach((row) => {
        const col = document.createElement('div');
        col.className = 'chart-col';
        const pct = Math.max(2, Math.round(Math.abs(row.final || 0) / max * 100));
        const color = row.final < 0 
          ? 'linear-gradient(180deg, #f87171, var(--red))' 
          : 'linear-gradient(180deg, var(--teal), var(--deep-2))';
          
        col.innerHTML = `
          <div class="bar-value">${row.final < 0 ? '-' : ''}${escapeHtml(formatCurrencyText(Math.abs(row.final || 0)))}</div>
          <div class="bar-track-v">
            <div class="bar-fill-v" style="height:0%; background:${color}; width: 100%;"></div>
          </div>
          <div class="bar-label">${escapeHtml(row.month)}</div>
        `;

        // Support mobile hover alternative: touch/click event to show tooltip
        const toggleActive = (e) => {
          e.stopPropagation();
          const wasActive = col.classList.contains('active');
          document.querySelectorAll('.chart-col').forEach(c => c.classList.remove('active'));
          if (!wasActive) col.classList.add('active');
        };
        col.onclick = toggleActive;
        col.ontouchstart = toggleActive;

        chartContainer.appendChild(col);
        
        // Trigger micro-animation for growing bars
        setTimeout(() => {
          const fill = col.querySelector('.bar-fill-v');
          if (fill) fill.style.height = pct + '%';
        }, 60);
      });

      // Bind global event once to hide active tooltips when clicking outside
      if (!window.chartClickBound) {
        const hideTooltips = () => {
          document.querySelectorAll('.chart-col').forEach(c => c.classList.remove('active'));
        };
        document.addEventListener('click', hideTooltips);
        document.addEventListener('touchstart', hideTooltips);
        window.chartClickBound = true;
      }
      
      chartArea.appendChild(gridLines);
      chartArea.appendChild(chartContainer);
      
      wrapper.appendChild(yAxis);
      wrapper.appendChild(chartArea);
      
      holder.appendChild(wrapper);
    }

    function renderQuickActions(inputStats) {
      const holders = [el('quickActions'), el('mobileQuickActions')].filter(Boolean);
      holders.forEach((holder) => holder.innerHTML = '');
      
      Object.keys(FORM_LABELS).forEach((type) => {
        const stat = inputStats.find((item) => item.type === type) || {};
        holders.forEach((holder) => {
          holder.appendChild(buildQuickAction(type, stat));
        });
      });
    }

    function buildQuickAction(type, stat) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action-card';
      
      const rowCountText = stat.rows === undefined 
        ? '...' 
        : Number(stat.rows || 0).toLocaleString('vi-VN') + ' dòng';
        
      button.innerHTML = `
        <span class="action-row">
          <span class="action-icon">${FORM_ICONS[type]}</span>
          <span class="action-count">${rowCountText}</span>
        </span>
        <span>
          <span class="action-label">${escapeHtml(FORM_LABELS[type])}</span>
          <span class="action-note">Mới nhất: ${escapeHtml(stat.latestText || 'Đang tải...')}</span>
        </span>
      `;
      
      button.onclick = () => {
        activeForm = type;
        rows = [newBlankRow()];
        const sheetName = FORM_SHEET_MAP[type];
        if (sheetName) {
          el('manageSheetSelect').value = sheetName;
          document.querySelectorAll('#manageTabsBar .sub-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sheet === sheetName);
          });
        }
        setView('manage');
        renderFormTabs();
        renderEntry();
        loadCatalogs(type);
      };
      return button;
    }
</script>
