<script>
    function newBlankRow(seed = {}) {
      const today = appData?.today || new Date().toISOString().slice(0, 10);
      const row = { ...seed };
      
      FIELD_SETS[activeForm].forEach(([key, , kind]) => {
        if (row[key] === undefined) {
          row[key] = kind === 'date' ? today : '';
        }
      });
      
      if (activeForm === 'chamCong') {
        row.fromDate = row.fromDate || today;
        row.toDate = row.toDate || row.fromDate;
        row.salary = row.salary || 'Có';
      }
      if (activeForm === 'nghiVanHanh') {
        row.countKpi = row.countKpi || 'Có';
      }
      return row;
    }

    function getOptions(source) {
      const c = getCurrentCatalogs();
      if (source === 'vehicles') return (c.activeVehicles.length ? c.activeVehicles : c.vehicles).map((x) => ({ value: x.plate, label: x.plate }));
      if (source === 'projects') return c.projects.map((x) => ({ value: x.name, label: x.name }));
      if (source === 'drivers') return (c.activeDrivers.length ? c.activeDrivers : c.people).map((x) => ({ value: x.name, label: x.name }));
      if (source === 'people') return (c.activePeople.length ? c.activePeople : c.people).map((x) => ({ value: x.name, label: `${x.name}${x.role ? ' - ' + x.role : ''}` }));
      if (source === 'penalties') return c.activePenalties.map((x) => ({ value: x.code, label: `${x.code} - ${x.content}` }));
      if (source === 'fuelSources') return c.fuelSources.map((x) => ({ value: x, label: x }));
      if (source === 'fuelPaymentSources') return (c.fuelPaymentSources || ['Quang Quân', 'Minh Vương', 'Quỹ']).map((x) => ({ value: x, label: x }));
      if (source === 'chamCongTypes') return c.chamCongTypes.map((x) => ({ value: x.name, label: x.name }));
      if (source === 'nghiVanHanhTypes') return c.nghiVanHanhTypes.map((x) => ({ value: x, label: x }));
      if (source === 'yesNo') return ['Có', 'Không'].map((x) => ({ value: x, label: x }));
      return [];
    }

    function handleFieldChange(index, key) {
      const row = rows[index];
      if (activeForm === 'taiXe' && (key === 'vehicle' || key === 'date') && !row.driver) {
        const drivers = suggestDrivers(row.vehicle, row.date);
        if (drivers.length === 1) {
          row.driver = drivers[0];
          renderEntry();
        }
      }
      
      const span = document.querySelector(`.entry-row-extra-title-${index}`);
      if (span) {
        span.innerHTML = getEntryRowExtraTitle(row);
      }
    }

    function suggestDrivers(plate, isoDate) {
      if (!plate || !isoDate) return [];
      const current = new Date(isoDate + 'T00:00:00');
      return getCurrentCatalogs().assignments
        .filter((item) => item.plate === plate && isInRange(current, item.fromDate, item.toDate))
        .map((item) => item.driver);
    }

    // Date checker helper
    function isInRange(date, from, to) {
      const fromDate = from ? new Date(from + 'T00:00:00') : null;
      const toDate = to ? new Date(to + 'T00:00:00') : null;
      return (!fromDate || date >= fromDate) && (!toDate || date <= toDate);
    }

    function getEmptyCatalogs() {
      return {
        vehicles: [], activeVehicles: [],
        people: [], activePeople: [], activeDrivers: [],
        projects: [],
        penalties: [], activePenalties: [],
        assignments: [],
        params: {},
        chamCongTypes: [],
        nghiVanHanhTypes: ['Mỏ báo nghỉ', 'Mưa', 'Lễ/Tết', 'Xe hỏng', 'Khác'],
        fuelSources: ['Quang Minh', 'Đổ ngoài']
      };
    }

    function getCurrentCatalogs() {
      return { 
        ...getEmptyCatalogs(), 
        ...(catalogsByForm['all'] || {}),
        ...(catalogsByForm[activeForm] || {}) 
      };
    }

    function loadAllCatalogsIfNeeded(callback) {
      if (catalogsByForm['all']) {
        if (callback) callback();
        return;
      }
      const cached = sessionStorage.getItem('eb_catalogs_all');
      if (cached) {
        catalogsByForm['all'] = JSON.parse(cached);
        if (callback) callback();
        return;
      }
      let catalogsFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadCatalogsFromAppsScript = () => callApi('GET', 'getCatalogs', { formType: '' });
      const catalogsLoader = supabaseStatus.ok
        ? readCatalogsFromSupabase('').catch((err) => {
            catalogsFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được toàn bộ danh mục từ Supabase, quay về Apps Script:', err);
            return loadCatalogsFromAppsScript();
          })
        : (() => {
            catalogsFallbackReason = supabaseStatus.reason;
            return loadCatalogsFromAppsScript();
          })();

      catalogsLoader
        .then(res => {
          catalogsByForm['all'] = res;
          sessionStorage.setItem('eb_catalogs_all', JSON.stringify(res));
          if (res && res.supabaseCached && activeView === 'catalog') {
            showSyncToast('Danh mục đang đọc từ Supabase cache.');
          } else if (catalogsFallbackReason && activeView === 'catalog') {
            showSyncToast('Danh mục đã quay về Apps Script. ' + catalogsFallbackReason);
          }
          if (callback) callback();
        })
        .catch(err => {
          console.error("Lỗi tải toàn bộ danh mục:", err);
          if (callback) callback();
        });
    }

    function getDashboardData() {
      if (activeView === 'reports' && appData?.reports?.overview?.details?.length) {
        return appData.reports;
      }
      return appData?.dashboard || appData?.reports || { overview: { months: [], details: [] }, inputs: [], links: getLinks(), loading: true };
    }

    function getLinks() {
      return appData?.links || appData?.dashboard?.links || appData?.reports?.links || {};
    }

    function addRow() { 
      rows.push(newBlankRow()); 
      renderEntry(); 
    }
    
    function cloneRow() { 
      rows.push(newBlankRow({ ...rows[rows.length - 1] })); 
      renderEntry(); 
    }

    // Submit Action via API
    function submitAll() {
      setBusy(true);
      clearStatus();
      
      const submittedForm = activeForm;
      const submitted = rows.map((row) => describeRow(submittedForm, row));
      const submittedRows = rows.map((row) => ({ ...row }));
      
      callApi('POST', 'submitRows', {}, { formType: submittedForm, rows: rows })
        .then((result) => {
          if (result && result.queued && result.jobId) {
            const description = `${submitted.length} dòng ${FORM_LABELS[submittedForm] || submittedForm}`;
            trackPendingWriteJob(result, description, submittedForm, submittedRows);
            showStatus('warn', `Đã nhận lệnh lưu ${description}. Trạng thái hiện tại: pending. Hệ thống sẽ đồng bộ về Google Sheet ở nền.`);
            recentSubmissions = submitted.filter(Boolean).map((item) => `[pending] ${item}`).concat(recentSubmissions).slice(0, 8);
            rows = [newBlankRow()];
            renderEntry();
            if (activeView === 'manage' && isMobileViewport()) {
              closeMobileEntrySheet();
              showSyncToast('Đã nhận lệnh lưu. Đang chờ đồng bộ Google Sheet.');
            }
            kickWriteJobWorker();
            setBusy(false);
            return;
          }

          const details = [];
          if (result.errors?.length) details.push(result.errors.join('\n'));
          if (result.warnings?.length) details.push(result.warnings.join('\n'));
          const sheetText = result.sheetName ? ` sheet ${result.sheetName}` : ' Google Sheet';
          
          let status = 'ok';
          if (result.errors?.length) {
            status = 'warn';
          } else if (!result.inserted) {
            status = 'warn';
          }
          
          let msg = '';
          if (!result.inserted) {
            msg = `Không có dòng dữ liệu nào được ghi nhận. Vui lòng kiểm tra lại thông tin nhập liệu (đặc biệt là các ô tìm kiếm gợi ý trên mobile)!`;
          } else {
            msg = `Đã ghi nhận ${result.inserted} dòng kê vào${sheetText}.`;
          }
          if (details.length) {
            msg += `\nLưu ý:\n` + details.join('\n');
          }
          
          showStatus(status, msg);
          
          if (result.inserted) {
            recentSubmissions = submitted.filter(Boolean).concat(recentSubmissions).slice(0, 8);
            invalidateReportSessionCache();
            rows = [newBlankRow()];
            loadDashboard(true).catch((err) => console.warn('Không thể tải lại Tổng quan sau khi ghi:', err));
          }
          
          renderEntry();
          if (result.inserted && activeView === 'manage') {
            if (isMobileViewport()) {
              closeMobileEntrySheet();
              showSyncToast('Đã ghi dữ liệu và cập nhật danh sách Vận hành.');
            }
            loadManageSheetData(true);
          }
          
          if (result.inserted && activeView === 'reports') {
            refreshReports(false);
          }
          setBusy(false);
        })
        .catch((err) => {
          showStatus('err', err.message || String(err));
          setBusy(false);
        });
    }

    function kickWriteJobWorker() {
      setTimeout(() => {
        callApi('POST', 'processWriteJobs', {}, { maxJobs: 2 })
          .catch((err) => console.warn('Không kick được worker write_jobs:', err));
      }, 250);
    }

    function checkTripReconciliation(submittedRows) {
      callApi('POST', 'checkTripReconciliation', {}, { rows: submittedRows })
        .then((messages) => {
          if (messages && messages.length) {
            showStatus('warn', `Ghi dữ liệu thành công.\nCảnh báo đối soát:\n${messages.join('\n')}`);
          }
        })
        .catch(() => {});
    }

    function describeRow(type, row) {
      const label = FORM_LABELS[type] || type;
      const bits = [
        label, 
        row.date || row.fromDate || '', 
        row.vehicle || row.person || row.driver || '', 
        row.project || row.penaltyCode || '', 
        row.trips ? `${row.trips} chuyến` : '', 
        row.liters ? `${row.liters} lít` : '', 
        row.hours ? `${row.hours} giờ` : ''
      ];
      return bits.filter(Boolean).join(' · ');
    }

    // Catalogs loader (sessionStorage optimized)
    function loadCatalogs(formType) {
      if (catalogsByForm[formType]) return;
      
      const cachedCatalogs = sessionStorage.getItem('eb_catalogs_' + formType);
      if (cachedCatalogs) {
        catalogsByForm[formType] = JSON.parse(cachedCatalogs);
        if (formType === activeForm) {
          renderEntry();
          renderFormTabs();
        }
        return;
      }
      
      let catalogsFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadCatalogsFromAppsScript = () => callApi('GET', 'getCatalogs', { formType: formType });
      const catalogsLoader = supabaseStatus.ok
        ? readCatalogsFromSupabase(formType).catch((err) => {
            catalogsFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được danh mục form từ Supabase, quay về Apps Script:', err);
            return loadCatalogsFromAppsScript();
          })
        : (() => {
            catalogsFallbackReason = supabaseStatus.reason;
            return loadCatalogsFromAppsScript();
          })();

      catalogsLoader
        .then((catalogs) => {
          catalogsByForm[formType] = catalogs;
          sessionStorage.setItem('eb_catalogs_' + formType, JSON.stringify(catalogs));
          
          if (formType === activeForm) {
            renderEntry();
            renderFormTabs();
            if (catalogs && catalogs.supabaseCached && (activeView === 'manage' || activeView === 'home')) {
              showSyncToast('Danh mục nhập liệu đang đọc từ Supabase cache.');
            } else if (catalogsFallbackReason && activeView === 'manage') {
              showSyncToast('Danh mục nhập liệu đã quay về Apps Script. ' + catalogsFallbackReason);
            }
          }
        })
        .catch((err) => showStatus('err', err.message || String(err)));
    }

    // Dashboard loader (sessionStorage optimized)
    function loadDashboard(forceRefresh) {
      setRefreshBusy(true);
      const cacheKey = 'eb_dashboard_v3';
      
      if (!forceRefresh) {
        const cachedDashboard = sessionStorage.getItem(cacheKey);
        if (cachedDashboard) {
          const dashboard = JSON.parse(cachedDashboard);
          appData.dashboard = dashboard;
          const reportOverview = appData.reports?.overview?.details?.length ? appData.reports.overview : dashboard.overview;
          appData.reports = { ...appData.reports, ...dashboard, overview: reportOverview, loading: false };
          renderDashboard();
          if (activeView !== 'reports') renderReports();
          renderView();
          setRefreshBusy(false);
          return Promise.resolve(dashboard);
        }
      }
      
      let dashboardFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadDashboardFromAppsScript = () => callApi('GET', 'getDashboard', { forceRefresh: forceRefresh });
      const dashboardLoader = (!forceRefresh && supabaseStatus.ok)
        ? readDashboardFromSupabase().catch((err) => {
            dashboardFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được Tổng quan từ Supabase, quay về Apps Script:', err);
            return loadDashboardFromAppsScript();
          })
        : (() => {
            dashboardFallbackReason = supabaseStatus.reason;
            return loadDashboardFromAppsScript();
          })();

      return dashboardLoader
        .then((dashboard) => {
          appData.dashboard = dashboard;
          const reportOverview = appData.reports?.overview?.details?.length ? appData.reports.overview : dashboard.overview;
          appData.reports = { ...appData.reports, ...dashboard, overview: reportOverview, loading: false };
          sessionStorage.setItem(cacheKey, JSON.stringify(dashboard));
          
          renderDashboard();
          if (activeView !== 'reports') renderReports();
          renderView();
          if (activeView === 'home') {
            showSyncToast(dashboard.supabaseCached
              ? 'Tổng quan đang đọc từ Supabase cache.'
              : 'Tổng quan đã quay về Apps Script. ' + (dashboardFallbackReason || ''));
          }
          setRefreshBusy(false);
          return dashboard;
        })
        .catch((err) => {
          showStatus('err', err.message || String(err));
          setRefreshBusy(false);
          throw err;
        });
    }

    function getReportBundleCacheKey(month) {
      return 'eb_report_bundle_v3_' + (month || '');
    }

    function scheduleReportBundlePrefetch() {
      return;
      if (reportBundlePrefetching || activeView !== 'reports') return;
      const overviewRows = parseOverview(getDashboardData().overview.months).rows || [];
      const months = [...new Set(overviewRows.map((row) => row.month).filter(Boolean))]
        .filter((month) => month !== selectedMonth && !sessionStorage.getItem(getReportBundleCacheKey(month)))
        .slice(-6);
      if (!months.length) return;

      reportBundlePrefetching = true;
      const epoch = reportCacheEpoch;
      const loadNext = () => {
        if (epoch !== reportCacheEpoch || activeView !== 'reports') {
          reportBundlePrefetching = false;
          return;
        }
        const month = months.pop();
        if (!month) {
          reportBundlePrefetching = false;
          return;
        }
        callApi('GET', 'getReportBundle', { month })
          .then((bundle) => {
            if (epoch === reportCacheEpoch) {
              sessionStorage.setItem(getReportBundleCacheKey(month), JSON.stringify(bundle));
            }
          })
          .catch(() => {})
          .finally(() => setTimeout(loadNext, 250));
      };
      setTimeout(loadNext, 450);
    }

    // Bundled report loader (sessionStorage optimized)
    function loadReportBundle(forceRefresh) {
      const cacheKey = getReportBundleCacheKey(selectedMonth);
      const requestSeq = ++reportBundleRequestSeq;
      if (forceRefresh) setRefreshBusy(true);
      
      if (!forceRefresh) {
        const cachedBundle = sessionStorage.getItem(cacheKey);
        if (cachedBundle) {
          const bundle = JSON.parse(cachedBundle);
          
          reportsByType.payroll = { data: bundle.payroll };
          reportsByType.vehicles = { data: bundle.vehicles };
          appData.dashboard = { ...(appData.dashboard || {}), overview: bundle.overview, updatedAt: bundle.updatedAt, loading: false };
          appData.reports = { ...appData.reports, ...appData.dashboard, loading: false };
          
          renderView();
          renderReports();
          if (activeView === 'reports') {
            showSyncToast(bundle.supabaseCached ? 'Báo cáo đang đọc từ Supabase cache.' : 'Báo cáo đang đọc từ bộ nhớ trình duyệt.');
          }
          scheduleReportBundlePrefetch();
          return Promise.resolve(bundle);
        }
      }
      appData.reports = { ...(appData.reports || {}), loading: true };
      appData.dashboard = { ...(appData.dashboard || {}), loading: true };
      renderReports();
      
      let supabaseFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadFromAppsScript = () => callApi('GET', 'getReportBundle', { month: selectedMonth, forceRefresh: forceRefresh });
      const loader = (!forceRefresh && supabaseStatus.ok)
        ? readReportBundleFromSupabase(selectedMonth).catch((err) => {
            supabaseFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được báo cáo từ Supabase, quay về Apps Script:', err);
            return loadFromAppsScript();
          })
        : (() => {
            supabaseFallbackReason = supabaseStatus.reason;
            return loadFromAppsScript();
          })();

      return loader
        .then((bundle) => {
          if (requestSeq !== reportBundleRequestSeq) return;
          reportsByType.payroll = { data: bundle.payroll };
          reportsByType.vehicles = { data: bundle.vehicles };
          appData.dashboard = { ...(appData.dashboard || {}), overview: bundle.overview, updatedAt: bundle.updatedAt, loading: false };
          appData.reports = { ...appData.reports, ...appData.dashboard, loading: false };
          
          sessionStorage.setItem(cacheKey, JSON.stringify(bundle));
          
          renderView();
          renderReports();
          if (activeView === 'reports') {
            showSyncToast(bundle.supabaseCached
              ? 'Báo cáo đang đọc từ Supabase cache.'
              : 'Báo cáo đã quay về Apps Script. ' + (supabaseFallbackReason || ''));
          }
          scheduleReportBundlePrefetch();
          return bundle;
        })
        .catch((err) => {
          if (requestSeq === reportBundleRequestSeq) {
            appData.dashboard = { ...(appData.dashboard || {}), loading: false };
            appData.reports = { ...(appData.reports || {}), loading: false };
            renderReports();
            showStatus('err', err.message || String(err));
          }
          throw err;
        })
        .finally(() => {
          if (forceRefresh) setRefreshBusy(false);
        });
    }

    // Refresh reports
    function refreshReports(showMessage = true) {
      if (showMessage) showSyncToast('Đang cập nhật dữ liệu từ Google Sheets...', 'info', true);
      invalidateReportSessionCache();
      setRefreshBusy(true);
      if (activeView === 'manage') {
        invalidateServerCaches()
          .then(() => loadManageSheetData(true))
          .then(() => showMessage && showSyncToast('Đã cập nhật Vận hành.'))
          .catch((err) => showMessage && showSyncToast(err.message || String(err), 'error'))
          .finally(() => setRefreshBusy(false));
        return;
      }
      if (activeView === 'catalog') {
        invalidateServerCaches()
          .then(() => loadCatalogSheetData(true))
          .then(() => showMessage && showSyncToast('Đã cập nhật Danh mục.'))
          .catch((err) => showMessage && showSyncToast(err.message || String(err), 'error'))
          .finally(() => setRefreshBusy(false));
        return;
      }
      if (activeView === 'cashflow') {
        const loaders = [];
        if (activeCashflowTab === 'overview') loaders.push(loadFundOverview(true));
        if (activeCashflowTab === 'transactions') loaders.push(loadFundTransactions(true));
        if (activeCashflowTab === 'loans') loaders.push(loadFundLoanOverview(true));
        if (activeCashflowTab === 'catalog') loaders.push(loadFundCatalog(true));
        Promise.all(loaders.length ? loaders : [loadFundOverview(true)])
          .then(() => showMessage && showSyncToast('Đã cập nhật Quỹ.'))
          .catch((err) => showMessage && showSyncToast(err.message || String(err), 'error'))
          .finally(() => setRefreshBusy(false));
        return;
      }
      invalidateServerCaches().then(() => {
        if (activeView === 'reports') {
          loadReportBundle(true)
            .then(() => showMessage && showSyncToast('Đã cập nhật Báo cáo.'))
            .catch((err) => showMessage && showSyncToast(err.message || String(err), 'error'))
            .finally(() => setRefreshBusy(false));
        } else {
          loadDashboard(true)
            .then(() => showMessage && showSyncToast('Đã cập nhật Tổng quan.'))
            .catch((err) => showMessage && showSyncToast(err.message || String(err), 'error'))
            .finally(() => setRefreshBusy(false));
        }
      }).catch((err) => {
        setRefreshBusy(false);
        if (showMessage) showSyncToast(err.message || String(err), 'error');
      });
    }
</script>
