<script>
    let managePage = 1;
    const managePageSize = 20;
    let lastManageQuery = '';
    let lastManageSheet = '';
    let manageLoadSeq = 0;

    // CRUD Manager Operations
    function loadManageSheetData(forceRefresh) {
      managePage = 1;
      lastManageQuery = '';
      const requestSeq = ++manageLoadSeq;
      const sheetName = el('manageSheetSelect').value;
      const tbody = el('manageTableBody');
      const thead = el('manageTableHeader');
      
      if (sheetName === 'NL_Dau') {
        el('manageDauFilterBlock').style.display = 'flex';
      } else {
        el('manageDauFilterBlock').style.display = 'none';
      }
      if (sheetName === 'NL_TaiXe') {
        el('manageTaiXeStatsBlock').style.display = 'block';
      } else {
        el('manageTaiXeStatsBlock').style.display = 'none';
      }
      
      thead.innerHTML = '';
      renderTableLoading(tbody, 20, 'Đang tải nhật ký vận hành...');
      el('manageTableEmpty').style.display = 'none';
      el('manageLimitNotice').style.display = 'none';

      const startDate = getDateInputIso('manageStartDate');
      const endDate = getDateInputIso('manageEndDate');
      const requestParams = {
        sheetName: sheetName,
        startDate: startDate,
        endDate: endDate,
        limit: startDate || endDate ? 500 : 50
      };
      const canUseManageSupabaseCache = !forceRefresh;

      const cached = !forceRefresh && getCachedSheetData(requestParams);
      if (cached) {
        currentManageData = cached.data;
        if (currentManageData.isLimited) {
          el('manageLimitNotice').style.display = 'block';
        }
        renderManageTable();
      }

      let manageFallbackReason = '';
      const supabaseStatus = getSupabaseReportStatus();
      const loadManageFromAppsScript = () => callApi('GET', 'readManageData', {
        ...requestParams,
        forceRefresh: forceRefresh ? 'true' : ''
      });
      const manageLoader = (canUseManageSupabaseCache && supabaseStatus.ok)
        ? readManageDataRangeFromSupabase(sheetName, startDate, endDate)
          .then((res) => filterManageSupabasePayload(res, startDate, endDate, requestParams.limit))
          .catch((err) => {
            manageFallbackReason = err && err.message ? err.message : String(err || 'Không rõ lỗi Supabase.');
            console.warn('Không đọc được Vận hành từ Supabase, quay về Apps Script:', err);
            return loadManageFromAppsScript();
          })
        : (() => {
            manageFallbackReason = supabaseStatus.reason;
            return loadManageFromAppsScript();
          })();

      return manageLoader
        .then((res) => {
          if (requestSeq !== manageLoadSeq) return res;
          if (res.ok) {
            currentManageData = res;
            setCachedSheetData(requestParams, res);
            if (res.isLimited) {
              el('manageLimitNotice').style.display = 'block';
            } else {
              el('manageLimitNotice').style.display = 'none';
            }
            renderManageTable();
            if (res.supabaseCached) {
              showSyncToast(res.supabaseMonthlyCached
                ? 'Vận hành đang đọc cache tháng từ Supabase.'
                : (startDate || endDate
                  ? 'Vận hành đang lọc từ Supabase cache.'
                  : 'Vận hành đang đọc từ Supabase cache.'));
            } else if (manageFallbackReason && canUseManageSupabaseCache) {
              showSyncToast('Vận hành đã quay về Apps Script. ' + manageFallbackReason);
            }
            return res;
          } else {
            showTableError(tbody, 20, res.error || 'Google Sheets trả về lỗi không xác định.');
            throw new Error(res.error || 'Google Sheets trả về lỗi không xác định.');
          }
        })
        .catch((err) => {
          if (cached) return cached.data;
          showTableError(tbody, 20, err.message || String(err));
          throw err;
        });
    }

    function readManageDataRangeFromSupabase(sheetName, startDate, endDate) {
      if (startDate && endDate) {
        const monthKeys = getManageMonthKeysForRange(startDate, endDate);
        if (monthKeys.length) {
          return Promise.all(monthKeys.map((monthKey) => readManageMonthDataFromSupabase(sheetName, monthKey)))
            .then((payloads) => combineManageSupabasePayloads(payloads));
        }
      }
      return readManageDataFromSupabase(sheetName);
    }

    function getManageMonthKeysForRange(startDate, endDate) {
      const start = parseManageRowDate(startDate);
      const end = parseManageRowDate(endDate);
      if (!start || !end || start > end) return [];
      const keys = [];
      const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
      const endCursor = new Date(end.getFullYear(), end.getMonth(), 1);
      while (cursor <= endCursor && keys.length < 24) {
        keys.push(`${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`);
        cursor.setMonth(cursor.getMonth() + 1);
      }
      return keys;
    }

    function combineManageSupabasePayloads(payloads) {
      const validPayloads = (payloads || []).filter(Boolean);
      const first = validPayloads[0] || { ok: true, headers: [], rows: [] };
      const seen = new Set();
      const rows = [];
      validPayloads.forEach((payload) => {
        (payload.rows || []).forEach((row) => {
          const key = String(row.rowIndex || '') + '|' + JSON.stringify(row.values || []);
          if (seen.has(key)) return;
          seen.add(key);
          rows.push(row);
        });
      });
      rows.sort((a, b) => Number(b.rowIndex || 0) - Number(a.rowIndex || 0));
      return {
        ...first,
        rows: rows,
        isLimited: validPayloads.some((payload) => payload.isLimited),
        supabaseCached: true,
        supabaseMonthlyCached: true,
        supabaseSyncedAt: validPayloads.map((payload) => payload.supabaseSyncedAt).filter(Boolean).sort().pop() || first.supabaseSyncedAt
      };
    }

    function filterManageSupabasePayload(data, startDate, endDate, limit) {
      if (!data || (!startDate && !endDate)) return data;
      const start = startDate ? new Date(startDate + 'T00:00:00') : null;
      const end = endDate ? new Date(endDate + 'T23:59:59') : null;
      const rowLimit = Math.max(1, Math.min(parseInt(limit, 10) || 500, 500));
      const rows = (data.rows || []).filter((row) => {
        const value = row && row.values ? row.values[0] : '';
        const parsed = parseManageRowDate(value);
        if (!parsed) return false;
        if (start && parsed < start) return false;
        if (end && parsed > end) return false;
        return true;
      }).slice(0, rowLimit);
      return {
        ...data,
        rows: rows,
        isLimited: Boolean(data.isLimited || (data.rows || []).length >= 500),
        supabaseFiltered: true
      };
    }

    function parseManageRowDate(value) {
      if (!value) return null;
      const text = String(value).trim();
      let match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (match) {
        const year = Number(match[3].length === 2 ? '20' + match[3] : match[3]);
        return new Date(year, Number(match[2]) - 1, Number(match[1]));
      }
      return null;
    }

    function renderManageTable() {
      if (!currentManageData) return;
      const sheetName = el('manageSheetSelect').value;
      const headers = [...currentManageData.headers];
      const rawRows = getManageRowsWithPending_(sheetName, currentManageData.headers, currentManageData.rows || []);
      const visibleColumns = getManageVisibleColumns(headers, sheetName);
      const isDauSheet = sheetName === 'NL_Dau';
      const manageTable = el('manageTable');
      if (manageTable) manageTable.classList.toggle('manage-horizontal-table', isDauSheet);
      const manageScroll = manageTable ? manageTable.closest('.table-scroll') : null;
      if (manageScroll) manageScroll.classList.toggle('manage-horizontal-scroll', isDauSheet);
      
      let vehicleColIdx = -1;
      for (let i = 0; i < headers.length; i++) {
        const h = headers[i].toLowerCase().trim();
        if (h === 'biển số xe' || h === 'xe' || h === 'bển số') {
          vehicleColIdx = i;
          break;
        }
      }

      const showOwnerCol = shouldShowManageOwnerColumn(sheetName, vehicleColIdx);
      const thead = el('manageTableHeader');
      thead.innerHTML = '';
      
      visibleColumns.forEach((idx) => {
        const h = headers[idx];
        const th = document.createElement('th');
        th.textContent = h;
        if (idx === visibleColumns[0]) th.className = 'sticky-col';
        thead.appendChild(th);
        
        if (showOwnerCol && idx === vehicleColIdx) {
          const thOwner = document.createElement('th');
          thOwner.textContent = 'Công ty/Chủ xe';
          thead.appendChild(thOwner);
        }
      });
      
      const thActions = document.createElement('th');
      thActions.textContent = 'Thao tác';
      thActions.style.textAlign = 'center';
      thActions.className = 'sticky-col-right';
      thead.appendChild(thActions);

      const vehiclesByPlate = buildVehicleOwnerMap();
      filteredManageRowsData = rawRows.map(row => {
        let owner = '';
        if (showOwnerCol) {
          const plate = String(row.values[vehicleColIdx] || '').trim();
          owner = vehiclesByPlate[plate.toLowerCase()] || '';
        }
        return {
          ...row,
          owner: owner,
          searchText: removeAccents(row.values.concat(owner).join(' ').toLowerCase())
        };
      });

      filterManageRows();
    }

    function getManageRowsWithPending_(sheetName, headers, baseRows) {
      const pendingRows = buildPendingManageRows_(sheetName, headers, baseRows || []);
      return pendingRows.length ? pendingRows.concat(baseRows || []) : (baseRows || []);
    }

    function buildPendingManageRows_(sheetName, headers, baseRows) {
      if (!Array.isArray(headers) || !headers.length) return [];
      const jobs = (pendingWriteJobs || []).filter((job) => {
        return job.sheetName === sheetName
          && (job.status === 'pending' || job.status === 'processing' || job.status === 'failed');
      });
      const rows = [];
      jobs.forEach((job) => {
        (job.rows || []).forEach((entryRow, index) => {
          const values = headers.map((header) => mapPendingEntryValue_(job.formType, entryRow, header));
          if (hasMatchingManageBaseRow_(values, baseRows)) return;
          rows.push({
            rowIndex: `pending:${job.jobId}:${index}`,
            values: values,
            isPendingWrite: true,
            pendingStatus: job.status,
            pendingJobId: job.jobId
          });
        });
      });
      return rows;
    }

    function hasMatchingManageBaseRow_(pendingValues, baseRows) {
      const filledIndexes = (pendingValues || [])
        .map((value, index) => ({ value: String(value || '').trim(), index }))
        .filter((item) => item.value);
      if (!filledIndexes.length) return false;
      return (baseRows || []).some((row) => {
        const values = row.values || [];
        return filledIndexes.every((item) => {
          return String(values[item.index] || '').trim().toLowerCase() === item.value.toLowerCase();
        });
      });
    }

    function mapPendingEntryValue_(formType, row, header) {
      const normalized = removeAccents(String(header || '').trim().toLowerCase());
      if (!row) return '';
      const directMap = {
        date: ['ngay', 'ngay chay', 'ngay tiep dau', 'ngay lap bien ban', 'ngay bao nghi'],
        vehicle: ['bien so xe', 'bien so xe nhan', 'xe', 'bien so xe nghi'],
        project: ['du an', 'du an chay', 'du an anh huong'],
        trips: ['so chuyen', 'so chuyen chay'],
        tickets: ['so phieu', 'so phieu chung tu', 'chung tu'],
        note: ['ghi chu', 'ghi chu them', 'ghi chu chi tiet'],
        driver: ['tai xe', 'tai xe cam lai'],
        source: ['nguon', 'nguon cung cap', 'nguon dau'],
        liters: ['so lit', 'lit', 'so lit dau'],
        price: ['gia dau lit', 'gia dau', 'don gia'],
        sourcePay: ['nguon chi'],
        fromDate: ['tu ngay'],
        toDate: ['den ngay', 'den ngay gom ca'],
        person: ['nhan su', 'nhan su nghi', 'nhan su vi pham'],
        workdayType: ['loai ngay nghi', 'loai ngay cong'],
        penaltyCode: ['ma vi pham', 'ma vi pham noi bo'],
        stopType: ['ly do dung may'],
        hours: ['so gio', 'so gio dung may']
      };

      const found = Object.keys(directMap).find((key) => directMap[key].includes(normalized));
      if (found) return row[found] || '';
      if (normalized === 'trang thai' || normalized === 'trang thai dong bo') {
        return 'Đang đồng bộ';
      }
      return '';
    }

    function getManageVisibleColumns(headers, sheetName) {
      return headers.map((header, index) => ({ header, index }))
        .filter(({ header }) => {
          const h = String(header || '').trim().toLowerCase();
          if (h === 'tháng') return false;
          if (shouldHideManageField_(h, sheetName)) return false;
          return true;
        })
        .map(({ index }) => index);
    }

    function shouldHideManageField_(headerLower, sheetName) {
      if (sheetName === 'NL_ChamCong') {
        return headerLower === 'loại ngày công hợp lệ' || headerLower === 'lưu ý';
      }
      return false;
    }

    function shouldShowManageOwnerColumn(sheetName, vehicleColIdx) {
      if (vehicleColIdx === -1) return false;
      if (sheetName === 'NL_TaiXe' || sheetName === 'NL_NghiVanHanh' || sheetName === 'NL_Dau') return false;
      return true;
    }

    function setManageQuickDate(mode) {
      syncManageQuickDateFilters(mode);
      const start = el('manageStartDate');
      const end = el('manageEndDate');
      const today = new Date();
      const toIso = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      if (mode === 'recent') {
        setDateInputValue(start, '');
        setDateInputValue(end, '');
      } else if (mode === 'today') {
        setDateInputValue(start, toIso(today));
        setDateInputValue(end, toIso(today));
      } else if (mode === '7days') {
        const from = new Date(today);
        from.setDate(today.getDate() - 6);
        setDateInputValue(start, toIso(from));
        setDateInputValue(end, toIso(today));
      } else if (mode === 'thisMonth') {
        setDateInputValue(start, toIso(new Date(today.getFullYear(), today.getMonth(), 1)));
        setDateInputValue(end, toIso(today));
      } else if (mode === 'lastMonth') {
        setDateInputValue(start, toIso(new Date(today.getFullYear(), today.getMonth() - 1, 1)));
        setDateInputValue(end, toIso(new Date(today.getFullYear(), today.getMonth(), 0)));
      }

      if (mode !== 'custom') loadManageSheetData();
    }

    function setManageCustomDate() {
      syncManageQuickDateFilters('custom');
      loadManageSheetData();
    }

    function syncManageQuickDateFilters(mode) {
      ['manageQuickDateFilter', 'manageQuickDateFilterMobile'].forEach((id) => {
        const target = el(id);
        if (target && target.value !== mode) target.value = mode;
      });
    }

    let manageSearchTimeout = null;
    function debounceManageSearch() {
      clearTimeout(manageSearchTimeout);
      manageSearchTimeout = setTimeout(filterManageRows, 150);
    }
    
    let catalogSearchTimeout = null;
    function debounceCatalogSearch() {
      clearTimeout(catalogSearchTimeout);
      catalogSearchTimeout = setTimeout(filterCatalogRows, 150);
    }

    let reportSearchTimeout = null;
    function debounceReportSearch() {
      clearTimeout(reportSearchTimeout);
      reportSearchTimeout = setTimeout(() => {
        if (typeof filterReportRows === 'function') filterReportRows();
      }, 150);
    }

    function buildVehicleOwnerMap() {
      const map = {};
      (getCurrentCatalogs()?.vehicles || []).forEach(v => {
        const plate = String(v.plate || '').trim().toLowerCase();
        if (plate) map[plate] = v.owner || '';
      });
      return map;
    }

    function normalizeFilterValue(value) {
      return removeAccents(String(value || '').trim().toLowerCase());
    }

    function filterManageRows() {
      const query = el('manageSearchInput').value.toLowerCase().trim();
      const sheetName = el('manageSheetSelect').value;
      
      if (query !== lastManageQuery || sheetName !== lastManageSheet) {
        managePage = 1;
        lastManageQuery = query;
        lastManageSheet = sheetName;
      }
      
      const tbody = el('manageTableBody');
      tbody.innerHTML = '';
      
      let vehicleColIdx = -1;
      let fuelSourceColIdx = -1;
      let paymentSourceColIdx = -1;
      let litColIdx = -1;
      let amountColIdx = -1;
      let noteColIdx = -1;
      let tripsColIdx = -1;
      const visibleColumns = currentManageData ? getManageVisibleColumns(currentManageData.headers, sheetName) : [];

      if (currentManageData) {
        currentManageData.headers.forEach((h, idx) => {
          const hLower = h.toLowerCase().trim();
          if (hLower === 'biển số xe' || hLower === 'xe' || hLower === 'bển số') vehicleColIdx = idx;
          if (hLower === 'nguồn' || hLower === 'nguồn cung cấp' || hLower === 'nguồn dầu') fuelSourceColIdx = idx;
          if (hLower === 'nguồn chi') paymentSourceColIdx = idx;
          if (hLower === 'số lít' || hLower === 'lít') litColIdx = idx;
          if (hLower === 'thành tiền' || hLower === 'tổng tiền' || hLower === 'tiền') amountColIdx = idx;
          if (hLower === 'ghi chú' || hLower === 'ghi chú thêm') noteColIdx = idx;
          if (hLower === 'số chuyến' || hLower.includes('số chuyến')) tripsColIdx = idx;
        });
      }
      const showOwnerCol = shouldShowManageOwnerColumn(sheetName, vehicleColIdx);
      const isDauSheet = sheetName === 'NL_Dau';
      const isTaiXeSheet = sheetName === 'NL_TaiXe';

      const matched = filteredManageRowsData.filter(row => {
        // 1. Search Query filter
        let matchQuery = true;
        if (query) {
          matchQuery = row.searchText.includes(removeAccents(query));
        }
        if (!matchQuery) return false;

        // 2. Custom NL_Dau filters
        if (currentManageData && isDauSheet) {
          const sourceFilter = el('manageDauSourceFilter').value;
          if (sourceFilter !== 'all' && fuelSourceColIdx !== -1) {
            const rowSource = normalizeFilterValue(row.values[fuelSourceColIdx]);
            if (rowSource !== normalizeFilterValue(sourceFilter)) {
              return false;
            }
          }

          const ownerFilter = el('manageDauOwnerFilter').value;
          if (ownerFilter !== 'all') {
            const ownerKey = normalizeFilterValue(ownerFilter);
            const autoOwner = normalizeFilterValue(row.owner);
            const paymentSource = paymentSourceColIdx !== -1 ? normalizeFilterValue(row.values[paymentSourceColIdx]) : '';
            const noteText = noteColIdx !== -1 ? normalizeFilterValue(row.values[noteColIdx]) : '';
            const matchAuto = autoOwner.includes(ownerKey);
            const matchPayment = paymentSource.includes(ownerKey);
            const matchNote = noteText.includes(ownerKey);
            if (!matchAuto && !matchPayment && !matchNote) {
              return false;
            }
          }
        }

        return true;
      });

      // 3. Update quick stats if NL_Dau
      if (currentManageData && isDauSheet) {
        let totalLiters = 0;
        let totalAmount = 0;
        matched.forEach(row => {
          if (!isValidManageDataRow_(row, sheetName, row.values)) return;
          if (litColIdx !== -1) {
            totalLiters += parseLocaleNumber(row.values[litColIdx]) || 0;
          }
          if (amountColIdx !== -1) {
            totalAmount += parseLocaleNumber(row.values[amountColIdx]) || 0;
          }
        });
        el('manageDauTotalLiters').textContent = Math.round(totalLiters).toLocaleString('vi-VN');
        el('manageDauTotalAmount').textContent = Math.round(totalAmount).toLocaleString('vi-VN');
      }

      if (currentManageData && isTaiXeSheet) {
        let totalTrips = 0;
        matched.forEach(row => {
          if (!isValidManageDataRow_(row, sheetName, row.values)) return;
          if (tripsColIdx !== -1) {
            totalTrips += parseLocaleNumber(row.values[tripsColIdx]) || 0;
          }
        });
        const totalTarget = el('manageTaiXeTotalTrips');
        if (totalTarget) totalTarget.textContent = Math.round(totalTrips).toLocaleString('vi-VN');
      }

      // Pagination calculation
      const totalMatched = matched.length;
      const totalPages = Math.ceil(totalMatched / managePageSize) || 1;
      if (managePage > totalPages) managePage = totalPages;
      if (managePage < 1) managePage = 1;

      const startIndex = (managePage - 1) * managePageSize;
      const endIndex = Math.min(startIndex + managePageSize, totalMatched);
      const pageRows = matched.slice(startIndex, endIndex);

      const paginBar = el('managePaginationBar');
      if (paginBar) {
        paginBar.style.display = totalMatched > 0 ? 'flex' : 'none';
        el('managePaginationInfo').textContent = totalMatched ? `Đang hiển thị ${startIndex + 1}-${endIndex} trên ${totalMatched}` : 'Hiển thị 0-0 trên 0';
        el('managePrevPageBtn').disabled = (managePage <= 1);
        el('manageNextPageBtn').disabled = (managePage >= totalPages);
      }

      if (totalMatched === 0) {
        el('manageTableEmpty').style.display = 'block';
        return;
      }
      el('manageTableEmpty').style.display = 'none';

      const fragment = document.createDocumentFragment();
      pageRows.forEach(row => {
        const tr = document.createElement('tr');
        if (row.isPendingWrite) tr.className = `manage-pending-row ${row.pendingStatus || 'pending'}`;
        
        visibleColumns.forEach((idx) => {
          const val = row.values[idx];
          const td = document.createElement('td');
          if (idx === visibleColumns[0]) td.className = 'sticky-col';
          
          const header = currentManageData.headers[idx];
          td.dataset.label = header;
          const headerLower = header.toLowerCase().trim();
          
          if (headerLower === 'tháng') {
            td.textContent = formatTableDate(val, true);
          } else if (headerLower.includes('ngày') || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val))) {
            td.textContent = formatTableDate(val, false);
          } else if (typeof val === 'number') {
            if (headerLower.includes('giá') || headerLower.includes('tiền') || headerLower.includes('phạt') || headerLower.includes('lương')) {
              td.textContent = Math.round(val).toLocaleString('vi-VN');
              td.style.fontWeight = '600';
            } else {
              td.textContent = val.toLocaleString('vi-VN');
            }
          } else {
            td.textContent = val || '';
          }
          if (row.isPendingWrite && idx === visibleColumns[0]) {
            const badge = document.createElement('span');
            badge.className = `preview-badge ${row.pendingStatus === 'failed' ? 'warning' : 'info'}`;
            badge.style.marginLeft = '8px';
            badge.textContent = row.pendingStatus === 'failed'
              ? 'Lỗi đồng bộ'
              : (row.pendingStatus === 'synced' ? 'Đã đồng bộ' : 'Đang đồng bộ');
            td.appendChild(badge);
          }
          tr.appendChild(td);

          if (showOwnerCol && idx === vehicleColIdx) {
            const tdOwner = document.createElement('td');
            tdOwner.dataset.label = 'Công ty/Chủ xe';
            if (row.owner) {
              const span = document.createElement('span');
              span.className = `badge ${row.owner.toLowerCase().includes('quang quân') ? 'amber' : 'blue'}`;
              span.textContent = row.owner;
              tdOwner.appendChild(span);
            } else {
              tdOwner.textContent = '-';
            }
            tr.appendChild(tdOwner);
          }
        });

        const tdActions = document.createElement('td');
        tdActions.className = 'sticky-col-right';
        tdActions.dataset.label = '';
        tdActions.style.textAlign = 'center';
        tdActions.style.whiteSpace = 'nowrap';
        
        if (row.isPendingWrite) {
          const pendingText = document.createElement('span');
          pendingText.className = 'preview-badge info';
          pendingText.textContent = row.pendingStatus === 'failed'
            ? 'Có thể thử lại'
            : (row.pendingStatus === 'synced' ? 'Chờ cache' : 'Chờ Sheet');
          tdActions.appendChild(pendingText);
        } else {
          const btnEdit = document.createElement('button');
          btnEdit.type = 'button';
          btnEdit.className = 'btn-table-action edit';
          btnEdit.title = 'Sửa';
          btnEdit.setAttribute('aria-label', 'Sửa dòng');
          btnEdit.style.marginRight = '4px';
          btnEdit.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
          btnEdit.onclick = () => openManageEditModal(row);

          const btnDelete = document.createElement('button');
          btnDelete.type = 'button';
          btnDelete.className = 'btn-table-action delete';
          btnDelete.title = 'Xóa';
          btnDelete.setAttribute('aria-label', 'Xóa dòng');
          btnDelete.innerHTML = `<svg class="btn-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
          btnDelete.onclick = () => deleteManageRow(row.rowIndex);

          tdActions.appendChild(btnEdit);
          tdActions.appendChild(btnDelete);
        }
        tr.appendChild(tdActions);
        
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);
    }

    function isValidManageDataRow_(row, sheetName, values) {
      if (!row || !Array.isArray(values) || !values.length) return false;
      const firstCell = values[0];
      const hasDate = typeof firstCell === 'string'
        ? /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(firstCell.trim()) || /^\d{4}-\d{2}-\d{2}/.test(firstCell.trim())
        : firstCell instanceof Date && !isNaN(firstCell.getTime());
      if (!hasDate) return false;

      if (sheetName === 'NL_Dau') {
        return values.some((val) => parseLocaleNumber(val) !== 0 || String(val || '').trim() === '0');
      }
      if (sheetName === 'NL_TaiXe') {
        return values.some((val, idx) => idx !== 0 && idx !== 1 && String(val || '').trim() !== '');
      }
      return true;
    }

    function openManageAddModal() {
      if (activeView === 'catalog') {
        currentEditCatalogRowIndex = null;
      } else {
        currentEditRowIndex = null;
      }
      el('manageModalTitle').textContent = 'Thêm dòng dữ liệu mới';
      buildManageModalFields({});
      el('manageModal').classList.add('active');
    }

    function openManageEditModal(row) {
      if (activeView === 'catalog') {
        currentEditCatalogRowIndex = row.rowIndex;
      } else {
        currentEditRowIndex = row.rowIndex;
      }
      el('manageModalTitle').textContent = `Chỉnh sửa dòng thứ ${row.rowIndex}`;
      
      const rowData = {};
      const currentData = activeView === 'catalog' ? currentCatalogData : currentManageData;
      currentData.headers.forEach((h, idx) => {
        rowData[h] = row.values[idx];
      });
      
      buildManageModalFields(rowData);
      el('manageModal').classList.add('active');
    }

    function closeManageModal() {
      el('manageModal').classList.remove('active');
    }

    function getManageFieldOptions(header, sheetName) {
      const headerClean = header.trim().toLowerCase();
      if (headerClean === 'biển số xe' || headerClean === 'xe' || headerClean === 'bển số') {
        return getOptions('vehicles');
      }
      if (headerClean === 'tài xế' || headerClean === 'người lái') {
        return getOptions('drivers');
      }
      if (headerClean === 'dự án' || headerClean === 'tên dự án') {
        return getOptions('projects');
      }
      if (headerClean === 'nhân sự' || headerClean === 'nhân viên' || headerClean === 'họ và tên' || headerClean === 'tên nhân sự') {
        return getOptions('people');
      }
      if (headerClean === 'nguồn dầu' || headerClean === 'nguồn') {
        return getOptions('fuelSources');
      }
      if (headerClean === 'mã phạt') {
        return getOptions('penalties');
      }
      if (headerClean === 'loại ngày công') {
        return getOptions('chamCongTypes');
      }
      if (headerClean === 'loại nghỉ') {
        return getOptions('nghiVanHanhTypes');
      }
      if (headerClean === 'kpi' || headerClean === 'tính kpi' || headerClean === 'hưởng lương' || headerClean === 'bù kpi' || headerClean === 'có tính kpi?') {
        return getOptions('yesNo');
      }
      return null;
    }

    function buildManageModalFields(rowData) {
      const container = el('manageModalFields');
      container.innerHTML = '';
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      const currentData = activeView === 'catalog' ? currentCatalogData : currentManageData;

      if (!currentData) return;

      currentData.headers.forEach((header) => {
        const hLower = header.toLowerCase();
        if (header === 'Tháng' && sheetName.indexOf('NL_') === 0) {
          return;
        }
        if (shouldHideManageField_(hLower, sheetName)) {
          return;
        }
        
        // Skip Thành tiền G column since it is formula-calculated
        if (sheetName === 'NL_Dau' && header === 'Thành tiền') {
          return;
        }

        // Ẩn các cột công thức tự động của NL_ChamCong, NL_Phat, NL_NghiVanHanh
        if (sheetName === 'NL_ChamCong' && (hLower.indexOf('số ngày') !== -1 || hLower.indexOf('lương cứng') !== -1 || hLower.indexOf('nhóm') !== -1)) {
          return;
        }
        if (sheetName === 'NL_Phat' && (hLower.indexOf('nội dung') !== -1 || hLower.indexOf('tiền phạt') !== -1)) {
          return;
        }
        if (sheetName === 'NL_NghiVanHanh' && (hLower.indexOf('tính kpi') !== -1 || hLower.indexOf('giảm kpi') !== -1)) {
          return;
        }

        const label = document.createElement('label');
        const headerClean = header.trim().toLowerCase();
        
        if (headerClean.includes('ghi chú') || headerClean.includes('nội dung')) {
          label.className = 'full-width';
        }

        const span = document.createElement('span');
        span.textContent = header;
        label.appendChild(span);

        const options = getManageFieldOptions(header, sheetName);

        if (options) {
          const acWrap = document.createElement('div');
          acWrap.style.width = '100%';
          acWrap.style.position = 'relative';
          
          label.appendChild(acWrap);
          container.appendChild(label);
          
          const val = rowData[header] || '';
          createAutocomplete(acWrap, options, val, (newVal) => {
            acWrap.dataset.value = newVal;
          });
          acWrap.dataset.value = val;
          acWrap.dataset.header = header;
          acWrap.classList.add('manage-form-field');
          acWrap.classList.add('ac-container');
        } else {
          let input;
          if (headerClean.includes('ghi chú') || headerClean.includes('nội dung')) {
            input = document.createElement('textarea');
          } else {
            input = document.createElement('input');
            if (headerClean.includes('ngày') || headerClean.includes('từ ngày') || headerClean.includes('đến ngày')) {
              setupViDateInput(input, rowData[header] || '');
            } else if (headerClean.includes('số lít') || headerClean.includes('số chuyến') || headerClean.includes('đơn giá') || headerClean.includes('tiền') || headerClean.includes('số ngày') || headerClean.includes('số giờ') || headerClean.includes('cự ly') || headerClean.includes('công')) {
              input.type = 'text';
              input.inputMode = 'decimal';
              if (headerClean.includes('tiền') || headerClean.includes('đơn giá')) {
                input.classList.add('format-money-input');
              }
            } else {
              input.type = 'text';
            }
          }
          
          if (!input.classList.contains('vi-date-input')) {
            input.value = rowData[header] === undefined || rowData[header] === null ? '' : rowData[header];
          }
          input.dataset.header = header;
          input.classList.add('manage-form-field');
          
          label.appendChild(input);
          container.appendChild(label);
        }
      });
    }

    function saveManageRow() {
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      const submitBtn = el('manageModalSubmitBtn');
      const originalText = submitBtn.textContent;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang lưu...';

      const rowData = {};
      const fields = el('manageModalFields').querySelectorAll('.manage-form-field');
      
      fields.forEach((f) => {
        const header = f.dataset.header;
        let val = '';
        if (f.classList.contains('ac-container')) {
          val = f.dataset.value || '';
        } else if (f.classList.contains('vi-date-input')) {
          val = getDateInputIso(f);
        } else {
          val = f.value || '';
        }
        rowData[header] = val;
      });

      const rowIndex = activeView === 'catalog' ? currentEditCatalogRowIndex : currentEditRowIndex;

      let targetSheetName = sheetName;
      if (sheetName === 'DM_ThamSo_TS' || sheetName === 'DM_ThamSo_GD') {
        targetSheetName = 'DM_ThamSo';
      }

      const payload = {
        sheetName: targetSheetName,
        rowIndex: rowIndex,
        rowData: rowData
      };

      callApi('POST', 'saveSheetRow', {}, payload)
        .then((res) => {
          if (res.ok) {
            closeManageModal();
            if (sheetName.indexOf('DM_') === 0) {
              sessionStorage.clear();
              loadCatalogs(activeForm);
            }
            if (activeView === 'catalog') {
              loadCatalogSheetData();
            } else {
              showSyncToast('Đã lưu. Đang tải lại dữ liệu mới nhất từ Apps Script...', 'info', true);
              loadManageSheetData(true)
                .then(() => showSyncToast('Dữ liệu Vận hành đã được cập nhật.', 'info'))
                .catch((err) => showSyncToast('Đã lưu, nhưng tải lại bảng lỗi: ' + (err.message || err), 'error'));
            }
          } else {
            alert('Lỗi: ' + res.error);
          }
        })
        .catch((err) => {
          alert('Lỗi lưu dữ liệu: ' + err.message);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        });
    }

    function deleteManageRow(rowIndex) {
      if (!confirm(`Bạn có chắc chắn muốn xóa dòng thứ ${rowIndex} không? Hành động này không thể hoàn tác.`)) {
        return;
      }
      
      const sheetName = activeView === 'catalog' ? el('catalogSheetSelect').value : el('manageSheetSelect').value;
      
      let targetSheetName = sheetName;
      let columnsToClear = null;
      if (sheetName === 'DM_ThamSo_TS') {
        targetSheetName = 'DM_ThamSo';
        columnsToClear = ["Mã tham số", "Tên tham số", "Giá trị", "Ngày áp dụng tham số"];
      } else if (sheetName === 'DM_ThamSo_GD') {
        targetSheetName = 'DM_ThamSo';
        columnsToClear = ["Giá dầu áp dụng", "Ngày áp dụng giá dầu", "Ghi chú"];
      }

      showSyncToast('Đang xóa dòng và cập nhật bảng...', 'info', true);
      callApi('POST', 'deleteSheetRow', {}, { sheetName: targetSheetName, rowIndex: rowIndex, columnsToClear: columnsToClear })
        .then((res) => {
          if (res.ok) {
            if (sheetName.indexOf('DM_') === 0) {
              sessionStorage.clear();
              loadCatalogs(activeForm);
            }
            if (activeView === 'catalog') {
              loadCatalogSheetData();
            } else {
              return loadManageSheetData(true)
                .then(() => showSyncToast('Đã xóa dòng và tải lại dữ liệu mới nhất.', 'info'));
            }
          } else {
            alert('Lỗi: ' + res.error);
          }
        })
        .catch((err) => {
          showSyncToast('Không thể xóa dữ liệu: ' + err.message, 'error');
          alert('Lỗi xóa dữ liệu: ' + err.message);
        });
    }

    function changeManagePage(offset) {
      managePage += offset;
      filterManageRows();
    }
</script>
