<script>
    function getSupabaseReportStatus() {
      const cfg = getSupabaseConfig();
      if (!cfg.reportsEnabled) return { ok: false, reason: 'VITE_SUPABASE_REPORTS_ENABLED chưa bật hoặc chưa được build vào frontend.' };
      if (!cfg.url) return { ok: false, reason: 'Thiếu VITE_SUPABASE_URL trên frontend.' };
      if (!cfg.anonKey) return { ok: false, reason: 'Thiếu VITE_SUPABASE_ANON_KEY trên frontend.' };
      return { ok: true, reason: '' };
    }

    function canUseSupabaseReports() {
      return getSupabaseReportStatus().ok;
    }

    function readSupabaseRows(tableName, filters, selectColumns) {
      const status = getSupabaseReportStatus();
      if (!status.ok) return Promise.reject(new Error(status.reason || 'Supabase chưa được bật.'));
      const cfg = getSupabaseConfig();
      const baseUrl = cfg.url.replace(/\/+$/, '');
      const url = new URL(`${baseUrl}/rest/v1/${encodeURIComponent(tableName)}`);
      url.searchParams.set('select', selectColumns || 'payload,synced_at');
      Object.keys(filters || {}).forEach((key) => {
        url.searchParams.set(key, 'eq.' + String(filters[key]));
      });
      url.searchParams.set('order', 'synced_at.desc');
      url.searchParams.set('limit', '1');
      return getSupabaseAccessToken().then((accessToken) => fetch(url.toString(), {
        method: 'GET',
        headers: {
          apikey: cfg.anonKey,
          Authorization: 'Bearer ' + (accessToken || cfg.anonKey),
          Accept: 'application/json'
        }
      })).then((res) => {
        if (!res.ok) {
          return res.text().then((text) => {
            throw new Error(`Supabase đọc cache thất bại, status: ${res.status}. ${text || ''}`);
          });
        }
        return res.json();
      });
    }

    function readReportBundleFromSupabase(month) {
      const reportMonth = String(month || '').trim() || 'latest';
      const filters = { report_month: reportMonth };
      const spreadsheetId = getCurrentSpreadsheetIdForSupabase();
      if (spreadsheetId) filters.spreadsheet_id = spreadsheetId;
      return readSupabaseRows('report_bundles', filters, 'report_month,payload,synced_at')
        .then((rows) => {
          const data = rows && rows[0];
          if (!data || !data.payload) {
            throw new Error('Chưa có report bundle trong Supabase cho tháng ' + reportMonth + '.');
          }
          return {
            ...data.payload,
            supabaseCached: true,
            supabaseSyncedAt: data.synced_at
          };
        });
    }

    function readDashboardFromSupabase() {
      return readReportBundleFromSupabase('__dashboard_latest__');
    }

    function withTimeout(promise, timeoutMs, message) {
      let timer = null;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message || 'Yêu cầu quá thời gian chờ.')), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function readStartupFromSupabase(formType) {
      const safeFormType = String(formType || 'vanChuyen').trim() || 'vanChuyen';
      return readSupabasePayload('startup_bundles', {
        form_type: safeFormType
      }, 'Chưa có startup cache trong Supabase.');
    }

    function buildCatalogsKeyForSupabase(formType) {
      const safeFormType = String(formType || '').trim();
      return 'catalogs:' + (safeFormType || 'all');
    }

    function buildCatalogDataKeyForSupabase(displaySheetName) {
      return 'catalog_data:' + String(displaySheetName || '').trim();
    }

    function buildFundFormOptionsKeyForSupabase(year) {
      return 'fund_form_options:' + String(year || '2026').trim();
    }

    function buildFundCatalogKeyForSupabase(year, group) {
      return 'fund_catalog:' + String(year || '2026').trim() + ':' + (String(group || '').trim() || 'all');
    }

    function readCatalogsFromSupabase(formType) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildCatalogsKeyForSupabase(formType)
      }, 'Chưa có catalog cache trong Supabase.');
    }

    function readCatalogDataFromSupabase(displaySheetName) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildCatalogDataKeyForSupabase(displaySheetName)
      }, 'Chưa có catalog data cache trong Supabase.');
    }

    function readFundFormOptionsFromSupabase(year) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildFundFormOptionsKeyForSupabase(year)
      }, 'Chưa có cache Supabase cho danh mục nhập Quỹ.');
    }

    function readFundCatalogFromSupabase(year, group) {
      return readSupabasePayload('catalog_bundles', {
        catalog_key: buildFundCatalogKeyForSupabase(year, group)
      }, 'Chưa có cache Supabase cho danh mục Quỹ.');
    }

    function readManageDataFromSupabase(sheetName, filterKey = 'recent_500') {
      return readSupabasePayload('manage_data_bundles', {
        sheet_name: String(sheetName || '').trim(),
        filter_key: String(filterKey || 'recent_500').trim()
      }, 'Chưa có cache Supabase cho dữ liệu Vận hành.');
    }

    function readManageMonthDataFromSupabase(sheetName, monthKey) {
      return readManageDataFromSupabase(sheetName, 'month:' + String(monthKey || '').trim());
    }

    function normalizeFundMonthKeyForSupabase(month) {
      const text = String(month || '').trim();
      if (!text || text === 'latest' || text === 'all' || text === 'Tất cả') return '';
      const iso = text.match(/^(\d{4})-(\d{1,2})/);
      if (iso) return `${iso[1]}-${String(Number(iso[2])).padStart(2, '0')}`;
      const vn = text.match(/^(\d{1,2})\/(\d{4})$/);
      if (vn) return `${vn[2]}-${String(Number(vn[1])).padStart(2, '0')}`;
      return text;
    }

    function buildFundTransactionFilterKeyForSupabase(params) {
      const safe = params || {};
      const startDate = String(safe.startDate || '').trim();
      const endDate = String(safe.endDate || '').trim();
      const search = String(safe.search || safe.query || '').trim();
      const limit = String(safe.limit || 500);
      if (!startDate && !endDate && !search && limit === '500') return 'recent_500';
      const encodedSearch = search
        ? btoa(unescape(encodeURIComponent(search))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
        : 'all';
      return [startDate || 'all', endDate || 'all', encodedSearch, limit].join('|');
    }

    function readSupabasePayload(tableName, filters, missingMessage) {
      return readSupabaseRows(tableName, filters, 'payload,synced_at')
        .then((rows) => {
          const data = rows && rows[0];
          if (!data || !data.payload) throw new Error(missingMessage || 'Chưa có dữ liệu Supabase cache.');
          if (data.payload.ok === false) {
            throw new Error(data.payload.error || 'Supabase cache đang chứa payload lỗi.');
          }
          return {
            ...data.payload,
            supabaseCached: true,
            supabaseSyncedAt: data.synced_at
          };
        });
    }

    function readFundOverviewFromSupabase(year, month) {
      const monthKey = normalizeFundMonthKeyForSupabase(month);
      return readSupabasePayload('fund_overview_bundles', {
        year: String(year || '2026'),
        month_key: monthKey
      }, 'Chưa có cache Supabase cho tổng quan quỹ.');
    }

    function readFundTransactionsFromSupabase(year, params) {
      const filterKey = buildFundTransactionFilterKeyForSupabase(params || {});
      return readSupabasePayload('fund_transaction_bundles', {
        year: String(year || '2026'),
        filter_key: filterKey
      }, 'Chưa có cache Supabase cho giao dịch quỹ.');
    }

    function readFundTransactionMonthFromSupabase(year, monthKey) {
      return readSupabasePayload('fund_transaction_bundles', {
        year: String(year || '2026'),
        filter_key: 'month:' + normalizeFundMonthKeyForSupabase(monthKey)
      }, 'Chưa có cache Supabase theo tháng cho giao dịch quỹ.');
    }

    function readFundLoanOverviewFromSupabase(year, month) {
      const monthKey = normalizeFundMonthKeyForSupabase(month);
      return readSupabasePayload('fund_loan_bundles', {
        year: String(year || '2026'),
        month_key: monthKey
      }, 'Chưa có cache Supabase cho vay nợ.');
    }

    function getCurrentSpreadsheetIdForSupabase() {
      const link = getLinks()?.spreadsheet || '';
      const match = String(link).match(/\/spreadsheets\/d\/([^/]+)/);
      return match ? match[1] : '';
    }
</script>
