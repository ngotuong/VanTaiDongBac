<script>
    function setBusy(isBusy) {
      ['submitBtn', 'addBtn', 'cloneBtn'].forEach((id) => el(id).disabled = isBusy);
      el('submitBtn').innerHTML = isBusy 
        ? '<div class="spinner" style="width:16px;height:16px;margin:0;"></div> Đang ghi...' 
        : `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg> Gửi dữ liệu lên Sheets`;
    }

    function setRefreshBusy(isBusy) {
      el('refreshBtn').disabled = isBusy;
    }

    function showStatus(type, message) {
      const box = el('status');
      box.className = `status show ${type}`;
      box.textContent = message;
    }

    function clearStatus() {
      const box = el('status');
      box.className = 'status';
      box.textContent = '';
    }

    function openDrawer() {
      document.body.classList.add('drawer-open');
    }

    function closeDrawer() {
      document.body.classList.remove('drawer-open');
    }

    // Configuration input controls binder
    function setupConfigInput() {
      const urlInput = el('backendUrlInput');
      const saveBtn = el('saveUrlBtn');
      const statusText = el('urlStatusText');
      
      urlInput.value = getBackendUrl();
      
      saveBtn.onclick = () => {
        const urlVal = urlInput.value.trim();
        if (!urlVal) {
          localStorage.removeItem('eb_backend_url');
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đã xóa cấu hình kết nối.';
          sessionStorage.clear();
          return;
        }
        
        if (!urlVal.startsWith('https://script.google.com/')) {
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đường dẫn không hợp lệ, phải bắt đầu bằng https://script.google.com/...';
          return;
        }
        
        localStorage.setItem('eb_backend_url', urlVal);
        sessionStorage.clear();
        statusText.style.color = 'var(--green)';
        statusText.textContent = 'Đã lưu cấu hình đường dẫn và làm mới bộ nhớ đệm!';
        
        setTimeout(() => {
          location.reload();
        }, 1000);
      };
    }

    window.showSettingsFromLoader = () => {
      document.body.classList.remove('locked');
      el('loader').classList.add('hidden');
      setView('settings');
    };

    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Trigger binding
    el('refreshBtn').onclick = () => refreshReports(true);
    el('menuBtn').onclick = openDrawer;
    el('drawerClose').onclick = closeDrawer;
    el('drawerBackdrop').onclick = closeDrawer;
    el('addBtn').onclick = addRow;
    el('cloneBtn').onclick = cloneRow;
    el('submitBtn').onclick = submitAll;
    
    // Scroll handling for bottom-nav visibility on mobile
    let lastScrollY = window.scrollY;
    let accumulatedDelta = 0;
    const threshold = 15; // Minimum scroll delta in px to trigger toggle
    
    window.addEventListener('scroll', () => {
      const bottomNav = el('bottomNav');
      if (!bottomNav) return;
      
      const currentScrollY = window.scrollY;
      const delta = currentScrollY - lastScrollY;
      
      // Ignore elastic bounce scroll on iOS/Safari
      const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
      if (currentScrollY < 0 || currentScrollY > maxScrollY) {
        lastScrollY = currentScrollY;
        return;
      }
      
      accumulatedDelta += delta;
      
      if (accumulatedDelta > threshold) {
        // Scroll down -> hide bottomNav
        if (currentScrollY > 80) {
          bottomNav.classList.add('nav-hidden');
        }
        accumulatedDelta = 0;
      } else if (accumulatedDelta < -threshold) {
        // Scroll up -> show bottomNav
        bottomNav.classList.remove('nav-hidden');
        accumulatedDelta = 0;
      }
      
      // Always hide bottomNav when close to the bottom of the page (to avoid blocking content)
      if (currentScrollY >= maxScrollY - 60) {
        bottomNav.classList.add('nav-hidden');
      }
      
      // Always show bottomNav when close to the top of the page
      if (currentScrollY <= 10) {
        bottomNav.classList.remove('nav-hidden');
      }
      
      lastScrollY = currentScrollY;
    }, { passive: true });
    
    function formatMoneyInput(inputElement) {
      const selectionStart = inputElement.selectionStart;
      const selectionEnd = inputElement.selectionEnd;
      const originalLength = inputElement.value.length;
      
      let rawValue = inputElement.value.replace(/\D/g, '');
      if (rawValue === '') {
        inputElement.value = '';
        return;
      }
      
      const formattedValue = Number(rawValue).toLocaleString('vi-VN').replace(/,/g, '.');
      inputElement.value = formattedValue;
      
      const newLength = formattedValue.length;
      const cursorOffset = newLength - originalLength;
      
      try {
        inputElement.setSelectionRange(selectionStart + cursorOffset, selectionEnd + cursorOffset);
      } catch (err) {
        // Tránh lỗi trên các trình duyệt cũ hoặc kiểu input đặc biệt
      }
    }

    document.addEventListener('input', function(e) {
      const target = e.target;
      const isStaticMoney = ['fundAmountInput', 'loanAmountInput', 'loanPaymentAmountInput'].includes(target.id);
      const isDynamicMoney = target.classList.contains('format-money-input');
      
      if (isStaticMoney || isDynamicMoney) {
        formatMoneyInput(target);
      }
    });
    
    // Run initial boot
    init();
</script>
