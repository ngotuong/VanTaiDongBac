<script>
    function setBusy(isBusy) {
      ['submitBtn', 'addBtn', 'cloneBtn'].forEach((id) => el(id).disabled = isBusy);
      el('submitBtn').innerHTML = isBusy 
        ? '<div class="spinner" style="width:16px;height:16px;margin:0;"></div> Đang ghi...' 
        : `<svg class="btn-svg" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg> Gửi dữ liệu lên Sheets`;
    }

    function setRefreshBusy(isBusy) {
      const btn = el('refreshBtn');
      if (!btn) return;
      btn.disabled = isBusy;
      btn.classList.toggle('is-busy', isBusy);
      btn.innerHTML = isBusy
        ? `<svg class="btn-svg spin-icon" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>`
        : `<svg class="btn-svg" viewBox="0 0 24 24" style="margin: 0;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>`;
    }

    let syncToastTimer = null;
    function showSyncToast(message, type = 'info', persistent = false) {
      if (handleDataSourceToast(message)) return;
      const toast = el('syncToast');
      if (!toast) return;
      clearTimeout(syncToastTimer);
      toast.className = `sync-toast show ${type}`;
      toast.innerHTML = `
        <span class="sync-toast-icon ${persistent ? 'spinning' : ''}">
          ${persistent
            ? '<svg class="btn-svg" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>'
            : '<svg class="btn-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>'}
        </span>
        <span>${escapeHtml(message)}</span>
      `;
      if (!persistent) {
        syncToastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
      }
    }

    function handleDataSourceToast(message) {
      const text = String(message || '');
      const isSourceMessage = /đang đọc|đang lọc|đã quay về Apps Script/i.test(text)
        && /Supabase|Apps Script|cache/i.test(text);
      if (!isSourceMessage) return false;
      if (/Supabase/i.test(text)) {
        setDataSourceStatus('supabase');
      } else if (/Apps Script/i.test(text)) {
        setDataSourceStatus('apps-script');
      }
      return true;
    }

    function hideSyncToast() {
      const toast = el('syncToast');
      if (!toast) return;
      clearTimeout(syncToastTimer);
      toast.classList.remove('show');
    }

    function renderTableLoading(tbody, colspan, message) {
      if (!tbody) return;
      const rowsHtml = Array.from({ length: 5 }).map((_, index) => `
        <tr class="table-skeleton-row">
          <td colspan="${colspan}">
            <div class="record-skeleton">
              <div>
                <div class="shimmer shimmer-line" style="width:${index % 2 ? 52 : 64}%;"></div>
                <div class="shimmer shimmer-line" style="width:${index % 2 ? 74 : 46}%;"></div>
              </div>
              <div class="shimmer shimmer-pill"></div>
            </div>
          </td>
        </tr>
      `).join('');
      tbody.innerHTML = `
        <tr class="table-loading-message">
          <td colspan="${colspan}">
            <div class="loading-card">
              <div class="spinner mini"></div>
              <div>
                <div class="loading-card-title">${escapeHtml(message)}</div>
                <div class="loading-card-note">Đang lấy dữ liệu mới nhất, bạn có thể tiếp tục xem các mục khác.</div>
              </div>
            </div>
          </td>
        </tr>
        ${rowsHtml}
      `;
    }

    function showTableError(tbody, colspan, message) {
      if (!tbody) return;
      tbody.innerHTML = `
        <tr>
          <td colspan="${colspan}">
            <div class="empty-card error">
              <div class="empty-card-title">Không tải được dữ liệu</div>
              <div class="empty-card-note">${escapeHtml(message)}</div>
            </div>
          </td>
        </tr>
      `;
    }

    function showStatus(type, message) {
      const box = el('status');
      box.className = `status show ${type}`;
      box.textContent = message;
    }

    function clearStatus() {
      const box = el('status');
      box.className = 'status';
      box.textContent = '';
    }

    function openDrawer() {
      document.body.classList.add('drawer-open');
    }

    function closeDrawer() {
      document.body.classList.remove('drawer-open');
    }

    function isMobileViewport() {
      return window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
    }

    function openMobileEntrySheet() {
      if (activeView !== 'manage') setView('manage');
      if (!rows.length) rows = [newBlankRow()];
      document.body.classList.add('mobile-entry-open');
      document.body.classList.add('locked');
      renderFormTabs();
      renderEntry();
      loadCatalogs(activeForm);
    }

    function closeMobileEntrySheet() {
      // Đóng trên mobile
      document.body.classList.remove('mobile-entry-open');
      if (!document.body.classList.contains('drawer-open')) {
        document.body.classList.remove('locked');
      }
      
      // Đóng trên PC (nếu đang hiển thị form nhập nhanh)
      const entryShell = el('entryShell');
      const btn = el('toggleEntryFormBtn');
      if (entryShell) entryShell.classList.remove('entry-shell-visible');
      if (btn) btn.classList.remove('active');
    }

    function toggleManageEntryForm() {
      const entryShell = el('entryShell');
      const btn = el('toggleEntryFormBtn');
      if (!entryShell) return;
      
      const isVisible = entryShell.classList.toggle('entry-shell-visible');
      if (btn) {
        btn.classList.toggle('active', isVisible);
      }
      
      // Load form và catalogs tương ứng nếu mở ra
      if (isVisible) {
        renderFormTabs();
        renderEntry();
        loadCatalogs(activeForm);
      }
    }

    function openResponsiveManageAdd() {
      if (isMobileViewport()) {
        openMobileEntrySheet();
      } else {
        openManageAddModal();
      }
    }

    const THEME_STORAGE_KEY = 'dongbac_theme';

    function getThemeMode() {
      try {
        return localStorage.getItem(THEME_STORAGE_KEY) === 'dark' ? 'dark' : 'light';
      } catch (err) {
        return 'light';
      }
    }

    function applyThemeMode(mode) {
      const isDark = mode === 'dark';
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', isDark ? '#07111f' : '#062e2b');
      const toggle = el('darkModeToggle');
      if (toggle) toggle.checked = isDark;
    }

    function setThemeMode(mode) {
      const normalized = mode === 'dark' ? 'dark' : 'light';
      try {
        localStorage.setItem(THEME_STORAGE_KEY, normalized);
      } catch (err) {}
      applyThemeMode(normalized);
    }

    function setupThemeControls() {
      applyThemeMode(getThemeMode());
      const toggle = el('darkModeToggle');
      if (toggle) {
        toggle.onchange = () => setThemeMode(toggle.checked ? 'dark' : 'light');
      }
    }

    // Configuration input controls binder
    function setupConfigInput() {
      const urlInput = el('backendUrlInput');
      const saveBtn = el('saveUrlBtn');
      const statusText = el('urlStatusText');
      setupThemeControls();
      
      urlInput.value = getBackendUrl();
      
      saveBtn.onclick = () => {
        const urlVal = urlInput.value.trim();
        if (!urlVal) {
          localStorage.removeItem('eb_backend_url');
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đã xóa cấu hình kết nối.';
          sessionStorage.clear();
          return;
        }
        
        if (!urlVal.startsWith('https://script.google.com/')) {
          statusText.style.color = 'var(--red)';
          statusText.textContent = 'Đường dẫn không hợp lệ, phải bắt đầu bằng https://script.google.com/...';
          return;
        }
        
        localStorage.setItem('eb_backend_url', urlVal);
        sessionStorage.clear();
        statusText.style.color = 'var(--green)';
        statusText.textContent = 'Đã lưu cấu hình đường dẫn và làm mới bộ nhớ đệm!';
        
        setTimeout(() => {
          location.reload();
        }, 1000);
      };
    }

    function loadSupabaseSyncStatus(forceRefresh = false) {
      const body = el('syncStatusBody');
      const checkedAt = el('syncStatusCheckedAt');
      const btn = el('syncStatusRefreshBtn');
      if (!body) return Promise.resolve(null);
      if (btn) btn.disabled = true;
      if (checkedAt) checkedAt.textContent = forceRefresh ? 'Đang làm mới...' : 'Đang tải trạng thái...';
      body.innerHTML = '<div class="sync-status-empty">Đang tải trạng thái đồng bộ...</div>';

      const reportAuditLoader = forceRefresh
        ? callApi('GET', 'getReportCacheAudit', { months: '05/2026,06/2026,07/2026,Tất cả', forceRefresh: 'true' }).catch((err) => ({ ok: false, error: err.message || String(err), results: [] }))
        : Promise.resolve({ ok: true, skipped: true, results: [] });

      return Promise.all([
        callApi('GET', 'getSupabaseSyncStatus', { limit: 24, forceRefresh: forceRefresh ? 'true' : '' }).catch((err) => ({ ok: false, error: err.message || String(err), rows: [] })),
        callApi('GET', 'getRecentWriteJobs', { module: 'transport', limit: 12, forceRefresh: forceRefresh ? 'true' : '' }).catch((err) => ({ ok: false, error: err.message || String(err), jobs: [] })),
        callApi('GET', 'getManageCacheAudit', {
          sheetNames: forceRefresh ? '' : getCurrentManageAuditSheetName_(),
          forceRefresh: forceRefresh ? 'true' : ''
        }).catch((err) => ({ ok: false, error: err.message || String(err), results: [] })),
        reportAuditLoader
      ])
        .then(([syncData, jobData, manageAuditData, reportAuditData]) => {
          const data = { sync: syncData || {}, jobs: jobData || {}, manageAudit: manageAuditData || {}, reportAudit: reportAuditData || {}, checkedAt: new Date().toISOString() };
          renderSupabaseSyncStatus(data);
          return data;
        })
        .catch((err) => {
          if (checkedAt) checkedAt.textContent = 'Không tải được trạng thái.';
          body.innerHTML = `<div class="sync-status-empty">Không tải được trạng thái: ${escapeHtml(err.message || err)}</div>`;
          return null;
        })
        .finally(() => {
          if (btn) btn.disabled = false;
        });
    }

    function renderSupabaseSyncStatus(data) {
      const body = el('syncStatusBody');
      const checkedAt = el('syncStatusCheckedAt');
      if (!body) return;
      const syncData = data.sync || data || {};
      const jobData = data.jobs || {};
      const manageAuditData = data.manageAudit || {};
      const reportAuditData = data.reportAudit || data.audit || {};
      const rows = syncData.rows || [];
      const jobs = jobData.jobs || [];
      const manageAuditRows = manageAuditData.results || [];
      const reportAuditRows = reportAuditData.results || [];
      const visibleJobs = jobs.filter((job) => job.status === 'pending' || job.status === 'processing' || job.status === 'failed').slice(0, 8);
      if (checkedAt) checkedAt.textContent = data.checkedAt ? `Kiểm tra lúc ${formatSyncStatusTime(data.checkedAt)}` : 'Đã tải trạng thái.';

      const sections = [];
      sections.push(renderSyncStatusSection_('Cache Supabase', syncData.ok === false ? syncData.error : '', rows.map(renderSyncStatusRow_).join('') || '<div class="sync-status-empty">Chưa có trạng thái đồng bộ cache.</div>'));
      sections.push(renderSyncStatusSection_('Write queue Vận hành', jobData.ok === false ? jobData.error : '', renderWriteJobStatusRows_(visibleJobs, jobs)));
      sections.push(renderSyncStatusSection_('Audit Vận hành', manageAuditData.ok === false ? manageAuditData.error : '', renderManageAuditRows_(manageAuditRows)));
      sections.push(renderSyncStatusSection_('Audit Báo cáo', reportAuditData.ok === false ? reportAuditData.error : '', renderReportAuditRows_(reportAuditRows, reportAuditData.skipped)));
      body.innerHTML = sections.join('');
    }

    function renderSyncStatusRow_(row) {
        const status = String(row.status || '').toLowerCase();
        const statusClass = status === 'ok' ? 'ok' : (status === 'error' ? 'error' : '');
        return `
          <div class="sync-status-row">
            <div class="sync-status-main">
              <div class="sync-status-key" title="${escapeHtml(row.syncKey || '')}">${escapeHtml(row.syncKey || '')}</div>
              <div class="sync-status-note" title="${escapeHtml(row.message || '')}">${escapeHtml(row.module || '')}${row.message ? ' · ' + escapeHtml(row.message) : ''}</div>
            </div>
            <span class="sync-status-pill ${statusClass}">${escapeHtml((row.status || '').toUpperCase())}</span>
            <div class="sync-status-time">${formatSyncStatusAge(row.ageSeconds, row.syncedAt)}</div>
          </div>
        `;
    }

    function renderSyncStatusSection_(title, error, content) {
      return `
        <div class="sync-status-section">
          <div class="sync-status-section-title">
            <strong>${escapeHtml(title)}</strong>
            ${error ? `<span>${escapeHtml(error)}</span>` : ''}
          </div>
          <div class="sync-status-list">${content}</div>
        </div>
      `;
    }

    function getCurrentManageAuditSheetName_() {
      const select = el('manageSheetSelect');
      return select && select.value ? select.value : 'NL_VanChuyen';
    }

    function renderWriteJobStatusRows_(visibleJobs, allJobs) {
      if (!visibleJobs.length) {
        const total = Array.isArray(allJobs) ? allJobs.length : 0;
        return `<div class="sync-status-empty">${total ? 'Không có job pending/failed trong các job gần đây.' : 'Chưa có write job gần đây.'}</div>`;
      }
      return visibleJobs.map((job) => {
        const status = String(job.status || '').toLowerCase();
        const statusClass = status === 'failed' ? 'error' : (status === 'synced' ? 'ok' : 'pending');
        const payload = job.payload || {};
        const note = [
          job.action || '',
          payload.sheetName || payload.formType || '',
          payload.rowIndex ? `dòng ${payload.rowIndex}` : ''
        ].filter(Boolean).join(' · ');
        const retryHtml = status === 'failed'
          ? `<button type="button" class="ghost sync-status-retry" onclick="retryPendingWriteJob('${escapeHtml(job.jobId || '')}')">Thử lại</button>`
          : `<div class="sync-status-time">${formatSyncStatusTime(job.updatedAt || job.createdAt)}</div>`;
        return `
          <div class="sync-status-row">
            <div class="sync-status-main">
              <div class="sync-status-key" title="${escapeHtml(job.jobId || '')}">${escapeHtml(job.jobId || '')}</div>
              <div class="sync-status-note" title="${escapeHtml(job.lastError || note)}">${escapeHtml(note)}${job.lastError ? ' · ' + escapeHtml(job.lastError) : ''}</div>
            </div>
            <span class="sync-status-pill ${statusClass}">${escapeHtml((job.status || '').toUpperCase())}</span>
            ${retryHtml}
          </div>
        `;
      }).join('');
    }

    function renderManageAuditRows_(auditRows) {
      if (!auditRows.length) {
        return '<div class="sync-status-empty">Chưa có kết quả audit Vận hành.</div>';
      }
      return auditRows.map((item) => {
        const status = String(item.status || '').toLowerCase();
        const statusClass = item.ok ? 'ok' : 'error';
        return `
          <div class="sync-status-row">
            <div class="sync-status-main">
              <div class="sync-status-key">${escapeHtml(item.sheetName || '')}</div>
              <div class="sync-status-note" title="${escapeHtml(item.message || '')}">${escapeHtml(item.message || '')}</div>
            </div>
            <span class="sync-status-pill ${statusClass}">${escapeHtml((status || 'unknown').toUpperCase())}</span>
            <div class="sync-status-time">${formatSyncStatusAge(null, item.syncedAt)}</div>
          </div>
        `;
      }).join('');
    }

    function renderReportAuditRows_(auditRows, skipped) {
      if (skipped) {
        return '<div class="sync-status-empty">Audit Báo cáo khá nặng; bấm Làm mới khi cần đối chiếu 05/2026, 06/2026, 07/2026 và Tất cả.</div>';
      }
      if (!auditRows.length) {
        return '<div class="sync-status-empty">Chưa có kết quả audit Báo cáo.</div>';
      }
      return auditRows.map((item) => {
        const status = String(item.status || '').toLowerCase();
        const statusClass = item.ok ? 'ok' : 'error';
        return `
          <div class="sync-status-row">
            <div class="sync-status-main">
              <div class="sync-status-key">Báo cáo ${escapeHtml(item.month || '')}</div>
              <div class="sync-status-note" title="${escapeHtml(item.message || '')}">${escapeHtml(item.message || '')}</div>
            </div>
            <span class="sync-status-pill ${statusClass}">${escapeHtml((status || 'unknown').toUpperCase())}</span>
            <div class="sync-status-time">${formatSyncStatusAge(null, item.syncedAt)}</div>
          </div>
        `;
      }).join('');
    }

    function formatSyncStatusTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      return date.toLocaleString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    function formatSyncStatusAge(ageSeconds, syncedAt) {
      const seconds = Number(ageSeconds);
      if (!isNaN(seconds)) {
        if (seconds < 60) return `${seconds}s trước`;
        if (seconds < 3600) return `${Math.round(seconds / 60)} phút trước`;
        if (seconds < 86400) return `${Math.round(seconds / 3600)} giờ trước`;
      }
      return formatSyncStatusTime(syncedAt);
    }

    window.showSettingsFromLoader = () => {
      document.body.classList.remove('locked');
      el('loader').classList.add('hidden');
      setView('settings');
    };

    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Trigger binding
    el('refreshBtn').onclick = () => refreshReports(true);
    el('menuBtn').onclick = openDrawer;
    el('drawerClose').onclick = closeDrawer;
    el('drawerBackdrop').onclick = closeDrawer;
    el('addBtn').onclick = addRow;
    el('cloneBtn').onclick = cloneRow;
    el('submitBtn').onclick = submitAll;
    
    // Scroll handling for bottom-nav visibility on mobile
    let lastScrollY = window.scrollY;
    let accumulatedDelta = 0;
    const threshold = 15; // Minimum scroll delta in px to trigger toggle
    
    window.addEventListener('scroll', () => {
      const bottomNav = el('bottomNav');
      if (!bottomNav) return;
      
      const currentScrollY = window.scrollY;
      const delta = currentScrollY - lastScrollY;
      
      // Ignore elastic bounce scroll on iOS/Safari
      const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
      if (currentScrollY < 0 || currentScrollY > maxScrollY) {
        lastScrollY = currentScrollY;
        return;
      }
      
      accumulatedDelta += delta;
      
      if (accumulatedDelta > threshold) {
        // Scroll down -> hide bottomNav
        if (currentScrollY > 80) {
          bottomNav.classList.add('nav-hidden');
        }
        accumulatedDelta = 0;
      } else if (accumulatedDelta < -threshold) {
        // Scroll up -> show bottomNav
        bottomNav.classList.remove('nav-hidden');
        accumulatedDelta = 0;
      }
      
      // Always hide bottomNav when close to the bottom of the page (to avoid blocking content)
      if (currentScrollY >= maxScrollY - 60) {
        bottomNav.classList.add('nav-hidden');
      }
      
      // Always show bottomNav when close to the top of the page
      if (currentScrollY <= 10) {
        bottomNav.classList.remove('nav-hidden');
      }
      
      lastScrollY = currentScrollY;
    }, { passive: true });
    
    function formatMoneyInput(inputElement) {
      const selectionStart = inputElement.selectionStart;
      const selectionEnd = inputElement.selectionEnd;
      const originalLength = inputElement.value.length;
      
      let rawValue = inputElement.value.replace(/\D/g, '');
      if (rawValue === '') {
        inputElement.value = '';
        return;
      }
      
      const formattedValue = Number(rawValue).toLocaleString('vi-VN').replace(/,/g, '.');
      inputElement.value = formattedValue;
      
      const newLength = formattedValue.length;
      const cursorOffset = newLength - originalLength;
      
      try {
        inputElement.setSelectionRange(selectionStart + cursorOffset, selectionEnd + cursorOffset);
      } catch (err) {
        // Tránh lỗi trên các trình duyệt cũ hoặc kiểu input đặc biệt
      }
    }

    function formatIsoDateForDisplay(value) {
      const text = String(value || '').trim();
      const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
      const vn = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (vn) {
        const day = vn[1].padStart(2, '0');
        const month = vn[2].padStart(2, '0');
        const year = vn[3].length === 2 ? `20${vn[3]}` : vn[3];
        return `${day}/${month}/${year}`;
      }
      return text;
    }

    function parseDisplayDateToIso(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (iso) return text;
      const digits = text.replace(/\D/g, '');
      if (digits.length !== 8) return '';
      const day = digits.slice(0, 2);
      const month = digits.slice(2, 4);
      const year = digits.slice(4, 8);
      const date = new Date(Number(year), Number(month) - 1, Number(day));
      if (date.getFullYear() !== Number(year) || date.getMonth() !== Number(month) - 1 || date.getDate() !== Number(day)) return '';
      return `${year}-${month}-${day}`;
    }

    function formatDateInputText(inputElement) {
      const digits = String(inputElement.value || '').replace(/\D/g, '').slice(0, 8);
      const parts = [];
      if (digits.length > 0) parts.push(digits.slice(0, 2));
      if (digits.length > 2) parts.push(digits.slice(2, 4));
      if (digits.length > 4) parts.push(digits.slice(4, 8));
      inputElement.value = parts.filter(Boolean).join('/');
    }

    function getDateInputIso(idOrElement) {
      const input = typeof idOrElement === 'string' ? el(idOrElement) : idOrElement;
      if (!input) return '';
      return input.dataset.iso || parseDisplayDateToIso(input.value) || '';
    }

    function setDateInputValue(idOrElement, isoValue) {
      const input = typeof idOrElement === 'string' ? el(idOrElement) : idOrElement;
      if (!input) return;
      attachNativeDatePicker(input);
      const iso = parseDisplayDateToIso(isoValue) || String(isoValue || '').slice(0, 10);
      input.dataset.iso = iso;
      input.value = formatIsoDateForDisplay(iso);
      const nativeInput = input.parentElement?.querySelector?.('.vi-date-native');
      if (nativeInput) nativeInput.value = iso;
    }

    function attachNativeDatePicker(inputElement) {
      if (!inputElement || inputElement.dataset.datePickerAttached === 'true') return;
      if (!inputElement.parentNode) return;
      inputElement.dataset.datePickerAttached = 'true';
      inputElement.readOnly = true;
      inputElement.setAttribute('aria-label', inputElement.getAttribute('aria-label') || inputElement.placeholder || 'Chọn ngày');

      let wrapper = inputElement.parentElement;
      if (!wrapper || !wrapper.classList.contains('vi-date-field')) {
        wrapper = document.createElement('span');
        wrapper.className = 'vi-date-field';
        inputElement.parentNode.insertBefore(wrapper, inputElement);
        wrapper.appendChild(inputElement);
      }

      const nativeInput = document.createElement('input');
      nativeInput.type = 'date';
      nativeInput.className = 'vi-date-native';
      nativeInput.tabIndex = -1;
      nativeInput.setAttribute('aria-hidden', 'true');
      nativeInput.value = inputElement.dataset.iso || parseDisplayDateToIso(inputElement.value) || '';
      nativeInput.addEventListener('change', function() {
        setDateInputValue(inputElement, nativeInput.value);
        inputElement.dispatchEvent(new Event('input', { bubbles: true }));
        inputElement.dispatchEvent(new Event('change', { bubbles: true }));
      });
      wrapper.appendChild(nativeInput);
    }

    function openNativeDatePicker(inputElement) {
      attachNativeDatePicker(inputElement);
      const nativeInput = inputElement.parentElement?.querySelector?.('.vi-date-native');
      if (!nativeInput) return;
      nativeInput.value = inputElement.dataset.iso || parseDisplayDateToIso(inputElement.value) || '';
      try {
        if (typeof nativeInput.showPicker === 'function') {
          nativeInput.showPicker();
          return;
        }
      } catch (err) {
        // iOS Safari có thể chặn showPicker nếu không phải gesture trực tiếp.
      }
      nativeInput.focus();
      nativeInput.click();
    }

    function setupViDateInput(inputElement, isoValue) {
      inputElement.type = 'text';
      inputElement.inputMode = 'numeric';
      inputElement.placeholder = 'dd/mm/yyyy';
      inputElement.autocomplete = 'off';
      inputElement.classList.add('vi-date-input');
      setDateInputValue(inputElement, isoValue || inputElement.value || '');
    }

    document.addEventListener('input', function(e) {
      const target = e.target;
      const isStaticMoney = ['fundAmountInput', 'loanAmountInput', 'loanPaymentAmountInput'].includes(target.id);
      const isDynamicMoney = target.classList.contains('format-money-input');
      
      if (isStaticMoney || isDynamicMoney) {
        formatMoneyInput(target);
      }
      if (target.classList.contains('vi-date-input')) {
        attachNativeDatePicker(target);
        formatDateInputText(target);
        target.dataset.iso = parseDisplayDateToIso(target.value);
        const nativeInput = target.parentElement?.querySelector?.('.vi-date-native');
        if (nativeInput) nativeInput.value = target.dataset.iso || '';
      }
    }, true);

    document.addEventListener('blur', function(e) {
      const target = e.target;
      if (target.classList?.contains('vi-date-input')) {
        attachNativeDatePicker(target);
        const iso = parseDisplayDateToIso(target.value);
        if (iso) setDateInputValue(target, iso);
      }
    }, true);

    document.addEventListener('change', function(e) {
      const target = e.target;
      if (target.classList?.contains('vi-date-input')) {
        attachNativeDatePicker(target);
        target.dataset.iso = parseDisplayDateToIso(target.value);
        const nativeInput = target.parentElement?.querySelector?.('.vi-date-native');
        if (nativeInput) nativeInput.value = target.dataset.iso || '';
      }
    });

    document.addEventListener('focusin', function(e) {
      const target = e.target;
      if (target.classList?.contains('vi-date-input')) attachNativeDatePicker(target);
    });

    document.addEventListener('pointerdown', function(e) {
      const target = e.target;
      if (!target.classList?.contains('vi-date-input')) return;
      e.preventDefault();
      openNativeDatePicker(target);
    }, true);
    
    // Run initial boot
    init();
</script>
