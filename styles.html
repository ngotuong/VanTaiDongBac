<style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --line: #e2e8f0;
      
      /* Premium Teal & Mint Colors */
      --deep: #062e2b;
      --deep-2: #0b4f49;
      --teal: #0d9488;
      --mint: #ccfbf1;
      --mint-soft: #f0fdfa;
      
      /* Accent Colors */
      --blue: #0284c7;
      --blue-soft: #f0f9ff;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #f0fdfa;
      
      /* Shadow & Glass System */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-premium: 0 20px 25px -5px rgba(6, 46, 43, 0.06), 0 8px 10px -6px rgba(6, 46, 43, 0.04);
      --radius: 12px;
      --radius-lg: 16px;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      background: var(--canvas);
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: 
        radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.04) 0px, transparent 50%),
        var(--canvas);
      overflow-x: hidden;
    }
    
    body.locked { overflow: hidden; }
    
    button, input, select, textarea { 
      font-family: inherit;
    }
    
    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 0 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    button:hover {
      border-color: var(--teal);
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    button:disabled { 
      opacity: 0.5; 
      cursor: not-allowed !important;
    }
    
    button.primary { 
      background: var(--deep); 
      border-color: var(--deep); 
      color: #fff;
    }
    
    button.primary:hover { 
      background: var(--teal); 
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    
    button.ghost { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(8px);
      border-color: var(--line);
    }
    
    button.danger { 
      color: var(--red); 
      border-color: rgba(220, 38, 38, 0.2); 
      background: var(--red-soft); 
    }
    
    button.danger:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    a { 
      color: var(--teal); 
      text-decoration: none; 
      font-weight: 600;
      transition: color 0.15s;
    }
    
    a:hover {
      color: var(--deep);
    }
    
    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }
    
    /* Sidebar styling with glassmorphism */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
      padding: 0 12px;
    }
    
    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      background: linear-gradient(135deg, var(--deep), var(--teal));
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(6, 46, 43, 0.15);
    }
    
    .brand-name { 
      font-weight: 800; 
      line-height: 1.15; 
      font-size: 16px;
    }
    
    .brand-sub { 
      margin-top: 2px; 
      color: var(--muted); 
      font-size: 11px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .drawer-close { display: none; }
    
    .nav-stack { 
      display: flex; 
      flex-direction: column;
      gap: 8px; 
      flex-grow: 1;
    }
    
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      min-height: 48px;
      padding: 0 12px;
      border-radius: var(--radius);
      color: var(--muted);
      width: 100%;
    }
    
    .nav-btn:hover {
      background: rgba(13, 148, 136, 0.05);
      color: var(--teal);
    }
    
    .nav-btn.active { 
      background: var(--deep); 
      color: #fff; 
    }
    
    .nav-ico {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s;
    }
    .nav-ico svg {
      width: 22px;
      height: 22px;
    }
    .bottom-nav button svg {
      width: 22px;
      height: 22px;
    }
    
    .nav-btn.active .nav-ico { 
      background: rgba(255, 255, 255, 0.15) !important; 
      color: #fff; 
    }
    .nav-btn:not(.active) .nav-ico {
      background: transparent !important;
    }
    
    .nav-main { 
      font-weight: 600; 
      font-size: 14px; 
    }
    
    .side-card {
      margin-top: auto;
      padding: 16px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--mint-soft), #fff);
      border: 1px solid var(--mint);
    }
    
    .side-card-title { 
      font-weight: 700; 
      font-size: 13px; 
      color: var(--deep-2);
    }
    
    .side-card-text { 
      margin-top: 6px; 
      color: var(--muted); 
      font-size: 12px; 
      line-height: 1.5; 
    }
    
    /* Main Panel */
    .main { 
      min-width: 0; 
      padding: 32px 32px 100px; 
    }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .eyebrow { 
      color: var(--teal); 
      font-size: 11px; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }
    
    h1 { 
      margin: 4px 0 0; 
      font-size: 28px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep);
    }
    
    .subtitle { 
      margin-top: 6px; 
      color: var(--muted); 
      font-size: 14px; 
    }
    
    .top-actions { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
    }
    
    .menu-button { display: none; }
    
    .view { display: none; }
    .view.active { display: block; }
    
    /* KPI Dashboard Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .kpi-card {
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 148px;
      position: relative;
      transition: all 0.2s;
    }
    
    .kpi-card:hover {
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
      transform: translateY(-2px);
    }
    
    .kpi-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .kpi-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .kpi-icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .kpi-icon-badge.teal { background: #f0fdfa; color: #0d9488; }
    .kpi-icon-badge.blue { background: #f0f9ff; color: #0284c7; }
    .kpi-icon-badge.amber { background: #fffbeb; color: #d97706; }
    .kpi-icon-badge.green { background: #f0fdf4; color: #16a34a; }
    .kpi-icon-badge.red { background: #fef2f2; color: #dc2626; }
    
    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 16px 0;
      display: flex;
      align-items: baseline;
      gap: 4px;
      line-height: 1.2;
    }
    
    .kpi-value span.unit {
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
    }
    
    .kpi-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    
    .kpi-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      min-width: 0;
    }
    .kpi-status.ok { color: #16a34a; }
    .kpi-status.warn { color: #d97706; }
    .kpi-status.err { color: #dc2626; }
    
    .kpi-time {
      font-size: 11px;
      color: #94a3b8;
    }
    
    /* Grid system */
    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(360px, 0.6fr);
      gap: 20px;
      align-items: start;
    }
    
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-premium);
      overflow: hidden;
    }
    
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.4);
    }
    
    .panel-title { 
      margin: 0; 
      font-size: 18px; 
      font-weight: 700;
      color: var(--deep);
    }
    
    .panel-note { 
      margin-top: 4px; 
      color: var(--muted); 
      font-size: 13px; 
    }
    
    .panel-body { padding: 24px; }
    
    .filter-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .filter-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    
    .filter-row select {
      min-height: 38px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 0 10px;
      font-size: 13px;
      font-weight: 600;
      background: var(--paper);
      outline: none;
      cursor: pointer;
    }
    
    .filter-row select:focus {
      border-color: var(--teal);
    }
    
    /* Performance Chart */
    .chart {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .bar-row {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) 130px;
      gap: 16px;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
    }
    
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: #f1f5f9;
      overflow: hidden;
    }
    
    .bar-fill {
      height: 100%;
      min-width: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--teal), var(--blue));
      transition: width 1s ease-out;
    }
    
    .bar-value { 
      text-align: right; 
      color: var(--deep); 
      font-weight: 700; 
    }

    /* Vertical Chart upgrades for 12 months */
    .chart-v {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 250px;
      padding-top: 30px;
      padding-bottom: 10px;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    
    .chart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 60px;
      height: 100%;
      justify-content: flex-end;
    }
    
    .bar-track-v {
      width: 20px;
      height: 130px;
      background: #f1f5f9;
      border-radius: 999px;
      position: relative;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    
    .bar-fill-v {
      width: 100%;
      min-height: 4px;
      border-radius: 999px;
      transition: height 1s ease-out;
    }
    
    .chart-col .bar-value {
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      text-align: center;
    }
    
    .chart-col .bar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 8px;
      white-space: nowrap;
    }
    
    /* Quick Actions */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    
    .action-card {
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 16px;
      transition: all 0.2s;
      width: 100%;
    }
    
    .action-card:hover { 
      border-color: var(--teal); 
      background: var(--mint-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .action-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      width: 100%;
    }
    
    .action-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--mint-soft);
      color: var(--teal);
      font-weight: 800;
      font-size: 13px;
      border: 1px solid var(--mint);
    }
    
    .action-count { 
      color: var(--muted); 
      font-size: 12px; 
      font-weight: 600; 
    }
    
    .action-label { 
      display: block; 
      font-weight: 700; 
      font-size: 14px;
      color: var(--deep);
    }
    
    .action-note { 
      margin-top: 2px; 
      display: block; 
      color: var(--muted); 
      font-size: 11px; 
    }
    
    /* Entries & Multi-row Forms */
    .entry-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    
    .form-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      position: sticky;
      top: 24px;
      box-shadow: var(--shadow-md);
    }
    
    .form-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0 12px;
      border-radius: var(--radius);
      width: 100%;
      color: var(--muted);
    }
    
    .form-tab:hover {
      background: rgba(13, 148, 136, 0.04);
      color: var(--teal);
    }
    
    .form-tab.active { 
      background: var(--mint-soft); 
      color: var(--teal);
      border: 1px solid var(--mint);
    }
    
    .form-tab-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--canvas);
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }
    
    .form-tab.active .form-tab-icon { 
      background: var(--teal); 
      color: #fff; 
    }
    
    .form-tab-title { 
      font-weight: 700; 
      font-size: 13px;
    }
    
    .form-tab-note { 
      margin-top: 2px; 
      color: var(--muted); 
      font-size: 11px; 
      display: block; 
    }
    
    /* Autocomplete Search Dropdown Styling */
    .ac-container {
      position: relative;
      width: 100%;
    }
    
    .ac-input {
      width: 100%;
      min-height: 46px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }
    
    .ac-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    
    .ac-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 99;
      max-height: 220px;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-top: 4px;
      box-shadow: var(--shadow-lg);
    }
    
    .ac-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .ac-item:hover {
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    .ac-item.selected {
      background: var(--teal);
      color: #fff;
      font-weight: 600;
    }
    
    .ac-item.empty {
      color: var(--muted);
      font-style: italic;
      cursor: default;
    }
    
    /* Form Status & Inputs */
    .status {
      display: none;
      margin: 16px 24px 0;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      white-space: pre-line;
      box-shadow: var(--shadow-sm);
    }
    
    .status.show { display: block; }
    .status.ok { border: 1px solid #86efac; color: var(--green); background: var(--green-soft); }
    .status.warn { border: 1px solid #fde047; color: var(--amber); background: var(--amber-soft); }
    .status.err { border: 1px solid #fca5a5; color: var(--red); background: var(--red-soft); }
    
    .entry-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s;
    }
    
    .entry-row:focus-within {
      border-color: var(--teal);
    }
    
    .entry-row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .entry-row-title { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700;
      color: var(--deep);
      font-size: 15px;
    }
    
    .row-number {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--mint-soft);
      color: var(--teal);
      font-weight: 800;
      font-size: 12px;
      border: 1px solid var(--mint);
    }
    
    .fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    
    label { 
      display: flex;
      flex-direction: column;
      gap: 6px; 
      color: var(--muted); 
      font-size: 12px; 
      font-weight: 700; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input, select, textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 10px 14px;
      outline: none;
      font-size: 16px;
      transition: all 0.2s;
    }
    
    input[type="date"] {
      display: block;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    
    textarea { 
      min-height: 46px; 
      resize: vertical; 
    }
    
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    
    .full { grid-column: 1 / -1; }
    
    /* Floating & Sticky submit bar */
    .submit-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    
    .grow { flex: 1; }
    
    /* Reports List */
    .report-stack { 
      display: flex;
      flex-direction: column;
      gap: 20px; 
    }
    
    .sub-tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px;
      scrollbar-width: none; /* Firefox */
    }
    .sub-tabs-bar::-webkit-scrollbar {
      display: none; /* Safari & Chrome */
    }
    
    .sub-tab {
      min-height: 38px !important;
      padding: 0 18px !important;
