<style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --line: #e2e8f0;
      
      /* Premium Teal & Mint Colors */
      --deep: #062e2b;
      --deep-2: #0b4f49;
      --teal: #0d9488;
      --mint: #ccfbf1;
      --mint-soft: #f0fdfa;
      
      /* Accent Colors */
      --blue: #0284c7;
      --blue-soft: #f0f9ff;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #f0fdfa;
      
      /* Shadow & Glass System */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-premium: 0 20px 25px -5px rgba(6, 46, 43, 0.06), 0 8px 10px -6px rgba(6, 46, 43, 0.04);
      --radius: 12px;
      --radius-lg: 16px;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      background: var(--canvas);
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: 
        radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.04) 0px, transparent 50%),
        var(--canvas);
      overflow-x: hidden;
    }
    
    body.locked { overflow: hidden; }
    
    button, input, select, textarea { 
      font-family: inherit;
    }
    
    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 0 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    button:hover {
      border-color: var(--teal);
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    button:disabled { 
      opacity: 0.5; 
      cursor: not-allowed !important;
    }
    
    button.primary { 
      background: var(--deep); 
      border-color: var(--deep); 
      color: #fff;
    }
    
    button.primary:hover { 
      background: var(--teal); 
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    
    button.ghost { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(8px);
      border-color: var(--line);
    }
    
    button.danger { 
      color: var(--red); 
      border-color: rgba(220, 38, 38, 0.2); 
      background: var(--red-soft); 
    }
    
    button.danger:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    a { 
      color: var(--teal); 
      text-decoration: none; 
      font-weight: 600;
      transition: color 0.15s;
    }
    
    a:hover {
      color: var(--deep);
    }
    
</style>
