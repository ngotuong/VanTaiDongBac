<style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --line: #e2e8f0;
      
      /* Premium Teal & Mint Colors */
      --deep: #062e2b;
      --deep-2: #0b4f49;
      --teal: #0d9488;
      --mint: #ccfbf1;
      --mint-soft: #f0fdfa;
      
      /* Accent Colors */
      --blue: #0284c7;
      --blue-soft: #f0f9ff;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #f0fdfa;
      
      /* Premium Soft Tones for Fund Cards */
      --fund-income-bg: rgba(22, 163, 74, 0.06);
      --fund-income-border: rgba(22, 163, 74, 0.15);
      --fund-income-text: #15803d;
      
      --fund-expense-bg: rgba(220, 38, 38, 0.06);
      --fund-expense-border: rgba(220, 38, 38, 0.15);
      --fund-expense-text: #b91c1c;

      --fund-loan-bg: rgba(217, 119, 6, 0.06);
      --fund-loan-border: rgba(217, 119, 6, 0.15);
      --fund-loan-text: #b45309;

      --fund-balance-bg: rgba(13, 148, 136, 0.06);
      --fund-balance-border: rgba(13, 148, 136, 0.15);
      --fund-balance-text: #0f766e;
      
      /* Shadow & Glass System */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-premium: 0 20px 25px -5px rgba(6, 46, 43, 0.05), 0 8px 10px -6px rgba(6, 46, 43, 0.03);
      --radius: 12px;
      --radius-lg: 16px;
      
      /* Glassmorphism System */
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-blur: blur(20px);
      --glass-border: 1px solid rgba(226, 232, 240, 0.8);
      
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      background: var(--canvas);
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: 
        radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.04) 0px, transparent 50%),
        var(--canvas);
      overflow-x: hidden;
    }
    
    body.locked { overflow: hidden; }
    
    button, input, select, textarea { 
      font-family: inherit;
    }

    input, select, textarea {
      font-weight: 500;
      line-height: 1.3;
    }

    select,
    input[type="text"],
    input[type="number"],
    .vi-date-input {
      display: inline-flex;
      align-items: center;
    }

    .filter-row input,
    .filter-row select,
    .filter-container input,
    .filter-container select,
    .compact-filter select,
    .modal-grid input,
    .modal-grid select,
    .fund-detail-drawer input,
    .fund-detail-drawer select,
    .fund-detail-drawer textarea {
      font-weight: 500 !important;
      line-height: 1.3 !important;
      text-align: left;
    }
    
    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 0 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }
    
    button:hover {
      border-color: var(--teal);
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    button:disabled { 
      opacity: 0.5; 
      cursor: not-allowed !important;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(13, 148, 136, 0.28);
      outline-offset: 2px;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .icon-button {
      width: 44px !important;
      min-width: 44px !important;
      height: 44px !important;
      min-height: 44px !important;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 10px !important;
    }

    .spin-icon,
    .sync-toast-icon.spinning svg {
      animation: spin 0.8s linear infinite;
    }
    
    button.primary { 
      background: var(--deep); 
      border-color: var(--deep); 
      color: #fff;
    }
    
    button.primary:hover { 
      background: var(--teal); 
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    
    button.ghost { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(8px);
      border-color: var(--line);
    }
    
    button.danger { 
      color: var(--red); 
      border-color: rgba(220, 38, 38, 0.2); 
      background: var(--red-soft); 
    }
    
    button.danger:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    a { 
      color: var(--teal); 
      text-decoration: none; 
      font-weight: 600;
      transition: color 0.15s;
    }
    
    a:hover {
      color: var(--deep);
    }
    
</style>
