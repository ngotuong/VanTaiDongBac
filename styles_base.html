<style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --line: #e2e8f0;
      
      /* Premium Teal & Mint Colors */
      --deep: #062e2b;
      --deep-2: #0b4f49;
      --teal: #0d9488;
      --mint: #ccfbf1;
      --mint-soft: #f0fdfa;
      
      /* Accent Colors */
      --blue: #0284c7;
      --blue-soft: #f0f9ff;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #f0fdfa;
      
      /* Premium Soft Tones for Fund Cards */
      --fund-income-bg: rgba(22, 163, 74, 0.06);
      --fund-income-border: rgba(22, 163, 74, 0.15);
      --fund-income-text: #15803d;
      
      --fund-expense-bg: rgba(220, 38, 38, 0.06);
      --fund-expense-border: rgba(220, 38, 38, 0.15);
      --fund-expense-text: #b91c1c;

      --fund-loan-bg: rgba(217, 119, 6, 0.06);
      --fund-loan-border: rgba(217, 119, 6, 0.15);
      --fund-loan-text: #b45309;

      --fund-balance-bg: rgba(13, 148, 136, 0.06);
      --fund-balance-border: rgba(13, 148, 136, 0.15);
      --fund-balance-text: #0f766e;
      
      /* Shadow & Glass System */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-premium: 0 20px 25px -5px rgba(6, 46, 43, 0.05), 0 8px 10px -6px rgba(6, 46, 43, 0.03);
      --radius: 12px;
      --radius-lg: 16px;
      
      /* Glassmorphism System */
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-blur: blur(20px);
      --glass-border: 1px solid rgba(226, 232, 240, 0.8);
      
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      background: var(--canvas);
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: 
        radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.04) 0px, transparent 50%),
        var(--canvas);
      overflow-x: hidden;
    }

    :root[data-theme="dark"] {
      --ink: #e5f3f1;
      --muted: #9fb2bc;
      --paper: #111827;
      --canvas: #07111f;
      --line: rgba(148, 163, 184, 0.24);
      --deep: #d8fffb;
      --deep-2: #7dd3c7;
      --teal: #2dd4bf;
      --mint: rgba(45, 212, 191, 0.24);
      --mint-soft: rgba(20, 184, 166, 0.12);
      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.14);
      --red: #fb7185;
      --red-soft: rgba(251, 113, 133, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.12);
      --fund-income-bg: rgba(52, 211, 153, 0.12);
      --fund-income-border: rgba(52, 211, 153, 0.24);
      --fund-income-text: #86efac;
      --fund-expense-bg: rgba(251, 113, 133, 0.12);
      --fund-expense-border: rgba(251, 113, 133, 0.24);
      --fund-expense-text: #fda4af;
      --fund-loan-bg: rgba(251, 191, 36, 0.12);
      --fund-loan-border: rgba(251, 191, 36, 0.24);
      --fund-loan-text: #fcd34d;
      --fund-balance-bg: rgba(45, 212, 191, 0.12);
      --fund-balance-border: rgba(45, 212, 191, 0.24);
      --fund-balance-text: #5eead4;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.34);
      --shadow-md: 0 10px 22px rgba(0, 0, 0, 0.26);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.28);
      --shadow-premium: 0 24px 44px rgba(0, 0, 0, 0.32);
      --glass-bg: rgba(17, 24, 39, 0.74);
      --glass-border: 1px solid rgba(148, 163, 184, 0.22);
      color-scheme: dark;
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(at 0% 0%, rgba(20, 184, 166, 0.13) 0px, transparent 42%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 46%),
        var(--canvas);
      color: var(--ink);
    }

    :root[data-theme="dark"] .panel,
    :root[data-theme="dark"] .table-card,
    :root[data-theme="dark"] .info-card,
    :root[data-theme="dark"] .form-list,
    :root[data-theme="dark"] .filter-bar,
    :root[data-theme="dark"] .app-sticky-toolbar,
    :root[data-theme="dark"] .app-sticky-tabs,
    :root[data-theme="dark"] .bottom-nav,
    :root[data-theme="dark"] .topbar,
    :root[data-theme="dark"] .modal-container,
    :root[data-theme="dark"] .fund-detail-drawer,
    :root[data-theme="dark"] .entry-row,
    :root[data-theme="dark"] .mobile-record-table tr {
      background: rgba(17, 24, 39, 0.94) !important;
      border-color: var(--line) !important;
      color: var(--ink);
    }

    :root[data-theme="dark"] .sidebar {
      background: rgba(8, 15, 29, 0.84);
      border-color: var(--line);
    }

    :root[data-theme="dark"] input,
    :root[data-theme="dark"] select,
    :root[data-theme="dark"] textarea,
    :root[data-theme="dark"] .ac-input {
      background: #0b1220 !important;
      border-color: var(--line) !important;
      color: var(--ink) !important;
    }

    :root[data-theme="dark"] input::placeholder,
    :root[data-theme="dark"] textarea::placeholder {
      color: #788b9b;
    }

    :root[data-theme="dark"] th,
    :root[data-theme="dark"] .table-card-head,
    :root[data-theme="dark"] .modal-footer,
    :root[data-theme="dark"] .fund-detail-drawer .table-card-head {
      background: rgba(15, 23, 42, 0.96) !important;
      border-color: var(--line) !important;
      color: #cbd5e1;
    }

    :root[data-theme="dark"] td,
    :root[data-theme="dark"] .mobile-record-table td {
      border-color: rgba(148, 163, 184, 0.16) !important;
    }

    :root[data-theme="dark"] button:not(.primary):not(.sub-tab.active):not(.nav-btn.active) {
      background: rgba(15, 23, 42, 0.82);
      border-color: var(--line);
      color: var(--ink);
    }

    :root[data-theme="dark"] button:not(.primary):not(.sub-tab.active):not(.nav-btn.active):hover {
      background: var(--mint-soft);
      color: var(--teal);
    }

    :root[data-theme="dark"] .sub-tab.active,
    :root[data-theme="dark"] .nav-btn.active,
    :root[data-theme="dark"] .bottom-nav button.active {
      background: var(--teal) !important;
      border-color: var(--teal) !important;
      color: #05201d !important;
    }

    :root[data-theme="dark"] .brand-mark {
      background: linear-gradient(135deg, #0f766e, #2dd4bf);
      color: #05201d;
    }
    
    body.locked { overflow: hidden; }
    
    button, input, select, textarea { 
      font-family: inherit;
    }

    input, select, textarea {
      font-weight: 500;
      line-height: 1.3;
    }

    select,
    input[type="text"],
    input[type="number"],
    .vi-date-input {
      display: inline-flex;
      align-items: center;
    }

    .filter-row input,
    .filter-row select,
    .filter-container input,
    .filter-container select,
    .compact-filter select,
    .modal-grid input,
    .modal-grid select,
    .fund-detail-drawer input,
    .fund-detail-drawer select,
    .fund-detail-drawer textarea {
      font-weight: 500 !important;
      line-height: 1.3 !important;
      text-align: left;
    }

    .filter-row input,
    .filter-row select,
    .filter-container input,
    .filter-container select,
    .compact-filter select {
      height: 38px !important;
      min-height: 38px !important;
      box-sizing: border-box;
      font-size: 13px !important;
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }

    .filter-row input,
    .filter-container input {
      display: block;
    }

    .vi-date-field {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 100%;
      min-width: 0;
    }

    .vi-date-field .vi-date-input {
      width: 100%;
      padding-right: 34px !important;
      cursor: pointer;
      background-image: linear-gradient(transparent, transparent);
    }

    .vi-date-native {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      opacity: 0.01;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    .vi-date-field::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      width: 15px;
      height: 15px;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.68;
      background:
        linear-gradient(var(--muted), var(--muted)) 3px 1px / 2px 4px no-repeat,
        linear-gradient(var(--muted), var(--muted)) 10px 1px / 2px 4px no-repeat,
        linear-gradient(var(--muted), var(--muted)) 2px 5px / 11px 1.5px no-repeat;
      border: 1.5px solid var(--muted);
      border-radius: 3px;
      box-sizing: border-box;
    }
    
    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 0 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }
    
    button:hover {
      border-color: var(--teal);
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    button:disabled { 
      opacity: 0.5; 
      cursor: not-allowed !important;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(13, 148, 136, 0.28);
      outline-offset: 2px;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .icon-button {
      width: 44px !important;
      min-width: 44px !important;
      height: 44px !important;
      min-height: 44px !important;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 10px !important;
    }

    .spin-icon,
    .sync-toast-icon.spinning svg {
      animation: spin 0.8s linear infinite;
    }
    
    button.primary { 
      background: var(--deep); 
      border-color: var(--deep); 
      color: #fff;
    }
    
    button.primary:hover { 
      background: var(--teal); 
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    
    button.ghost { 
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(8px);
      border-color: var(--line);
    }
    
    button.danger { 
      color: var(--red); 
      border-color: rgba(220, 38, 38, 0.2); 
      background: var(--red-soft); 
    }
    
    button.danger:hover {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    
    a { 
      color: var(--teal); 
      text-decoration: none; 
      font-weight: 600;
      transition: color 0.15s;
    }
    
    a:hover {
      color: var(--deep);
    }
    
</style>
