<style>

      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;

      font-weight: 500;
      color: #64748b;

      justify-content: space-between;
      align-items: center;
      margin-top: auto;

      font-weight: 600;
      color: var(--muted);

      white-space: nowrap;
