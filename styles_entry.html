<style>
    /* Entries & Multi-row Forms */
    .entry-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .entry-sheet-backdrop,
    .mobile-operation-bar,
    .mobile-entry-close {
      display: none;
    }
    
    .form-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      position: sticky;
      top: 24px;
      box-shadow: var(--shadow-md);
    }
    
    .form-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0 12px;
      border-radius: var(--radius);
      width: 100%;
      color: var(--muted);
    }
    
    .form-tab:hover {
      background: rgba(13, 148, 136, 0.04);
      color: var(--teal);
    }
    
    .form-tab.active { 
      background: var(--mint-soft); 
      color: var(--teal);
      border: 1px solid var(--mint);
    }
    
    .form-tab-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--canvas);
      color: var(--muted);
      font-weight: 800;
      font-size: 12px;
    }
    
    .form-tab.active .form-tab-icon { 
      background: var(--teal); 
      color: #fff; 
    }
    
    .form-tab-title { 
      font-weight: 700; 
      font-size: 13px;
    }
    
    .form-tab-note { 
      margin-top: 2px; 
      color: var(--muted); 
      font-size: 11px; 
      display: block; 
    }
    
    /* Autocomplete Search Dropdown Styling */
    .ac-container {
      position: relative;
      width: 100%;
    }
    
    .ac-input {
      width: 100%;
      min-height: 46px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }
    
    .ac-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    
    .ac-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 99;
      max-height: 220px;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-top: 4px;
      box-shadow: var(--shadow-lg);
    }
    
    .ac-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .ac-item:hover, .ac-item.active {
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    .ac-item.selected {
      background: var(--teal);
      color: #fff;
      font-weight: 600;
    }
    
    .ac-item.empty {
      color: var(--muted);
      font-style: italic;
      cursor: default;
    }
    
    /* Real-time Preview Badges */
    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      animation: fadeIn 0.2s ease;
      width: fit-content;
    }
    .preview-badge.success {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(22, 163, 74, 0.15);
    }
    .preview-badge.warning {
      background: var(--amber-soft);
      color: var(--amber);
      border: 1px solid rgba(217, 119, 6, 0.15);
    }
    .preview-badge.info {
      background: var(--blue-soft);
      color: var(--blue);
      border: 1px solid rgba(2, 132, 199, 0.15);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Form Status & Inputs */
    .status {
      display: none;
      margin: 16px 24px 0;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      white-space: pre-line;
      box-shadow: var(--shadow-sm);
    }
    
    .status.show { display: block; }
    .status.ok { border: 1px solid #86efac; color: var(--green); background: var(--green-soft); }
    .status.warn { border: 1px solid #fde047; color: var(--amber); background: var(--amber-soft); }
    .status.err { border: 1px solid #fca5a5; color: var(--red); background: var(--red-soft); }
    
    @keyframes rowAppear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rowDisappear {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); height: 0; padding: 0; margin: 0; border: 0; }
    }

    .entry-row {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: rowAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .entry-row.removing {
      animation: rowDisappear 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .entry-row:focus-within {
      border-color: var(--teal);
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.04);
    }
    
    .entry-row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .entry-row-title { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700;
      color: var(--deep);
      font-size: 15px;
    }
    
    .row-number {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--mint-soft);
      color: var(--teal);
      font-weight: 800;
      font-size: 12px;
      border: 1px solid var(--mint);
    }
    
    .fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    
    label { 
      display: flex;
      flex-direction: column;
      gap: 6px; 
      color: var(--muted); 
      font-size: 12px; 
      font-weight: 700; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input, select, textarea {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box !important;
      -webkit-box-sizing: border-box !important;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      padding: 10px 14px;
      outline: none;
      font-size: 16px;
      transition: all 0.2s;
    }
    
    input[type="date"] {
      display: block;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      inline-size: 100% !important;
      box-sizing: border-box !important;
      -webkit-box-sizing: border-box !important;
      margin: 0 !important;
      overflow: hidden;
    }
    
    textarea { 
      min-height: 46px; 
      resize: vertical; 
    }
    
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }
    
    .full { grid-column: 1 / -1; }
    
    /* Floating & Sticky submit bar */
    .submit-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    
    .grow { flex: 1; }
    
</style>
