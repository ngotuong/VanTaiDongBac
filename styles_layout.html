<style>
    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }
    
    /* Sidebar styling with glassmorphism */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
      padding: 0 12px;
    }
    
    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      background: linear-gradient(135deg, var(--deep), var(--teal));
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(6, 46, 43, 0.15);
    }
    
    .brand-name { 
      font-weight: 800; 
      line-height: 1.15; 
      font-size: 16px;
    }
    
    .brand-sub { 
      margin-top: 2px; 
      color: var(--muted); 
      font-size: 11px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .drawer-close { display: none; }
    
    .nav-stack { 
      display: flex; 
      flex-direction: column;
      gap: 8px; 
      flex-grow: 1;
      align-items: stretch;
    }
    
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
      min-height: 48px;
      padding: 0 12px;
      border-radius: var(--radius);
      color: var(--muted);
      width: 100%;
    }
    
    .nav-btn:hover {
      background: rgba(13, 148, 136, 0.05);
      color: var(--teal);
    }
    
    .nav-btn.active { 
      background: var(--deep); 
      color: #fff; 
    }
    
    .nav-ico {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s;
    }
    .nav-ico svg {
      width: 22px;
      height: 22px;
    }
    .bottom-nav button svg {
      width: 22px;
      height: 22px;
    }
    
    .nav-btn.active .nav-ico { 
      background: rgba(255, 255, 255, 0.15) !important; 
      color: #fff; 
    }
    .nav-btn:not(.active) .nav-ico {
      background: transparent !important;
    }
    
    .nav-main { 
      font-weight: 600; 
      font-size: 14px; 
    }
    
    .side-card {
      margin-top: auto;
      padding: 16px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--mint-soft), #fff);
      border: 1px solid var(--mint);
    }
    
    .side-card-title { 
      font-weight: 700; 
      font-size: 13px; 
      color: var(--deep-2);
    }
    
    .side-card-text { 
      margin-top: 6px; 
      color: var(--muted); 
      font-size: 12px; 
      line-height: 1.5; 
    }
    
    /* Main Panel */
    .main { 
      min-width: 0; 
      padding: 32px 32px 100px; 
    }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    
    .eyebrow { 
      color: var(--teal); 
      font-size: 11px; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }
    
    h1 { 
      margin: 4px 0 0; 
      font-size: 28px; 
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--deep);
    }
    
    .subtitle { 
      margin-top: 6px; 
      color: var(--muted); 
      font-size: 14px; 
    }
    
    .top-actions { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
    }
    
    .menu-button { display: none; }
    
    .view { display: none; }
    
    @keyframes fadeInSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .view.active { 
      display: block; 
      animation: fadeInSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
</style>
