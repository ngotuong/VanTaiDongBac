<style>
    @media (max-width: 600px) {
      .modal-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Bottom Navigation for Mobile */
    .bottom-nav {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 90;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 25px -5px rgba(6, 46, 43, 0.15), 0 8px 10px -6px rgba(6, 46, 43, 0.1);
      backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    
    .bottom-nav.nav-hidden {
      transform: translateY(calc(100% + 24px)) !important;
      opacity: 0 !important;
      pointer-events: none;
    }
    
    .bottom-nav button {
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 14px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .bottom-nav button:hover {
      background: rgba(13, 148, 136, 0.05);
      color: var(--teal);
    }
    
    .bottom-nav button.active { 
      background: var(--deep); 
      color: #fff; 
    }
    
    /* Native-looking SVG Icons */
    .btn-svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* Shimmer Skeleton Loaders */
    .shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
      background-size: 400% 100%;
      animation: skeleton-loading 1.4s ease infinite;
      border-radius: 8px;
    }
    
    @keyframes skeleton-loading {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .shimmer-text { height: 16px; margin-bottom: 8px; width: 60%; }
    .shimmer-value { height: 28px; width: 40%; }
    .shimmer-chart { height: 200px; width: 100%; }
    .shimmer-table { height: 150px; width: 100%; }
    
    /* Full Screen Loader */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 250, 252, 0.85);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }
    
    .loader-card {
      width: min(320px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-premium);
      text-align: center;
      border-top: 4px solid var(--teal);
    }
    
    .loader-title { 
      font-weight: 800; 
      font-size: 16px;
      color: var(--deep);
    }
    
    .loader-text { 
      margin-top: 8px; 
      color: var(--muted); 
      font-size: 13px; 
      line-height: 1.5;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--teal);
      border-radius: 50%;
      margin: 16px auto 0;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .hidden, .hidden-row { display: none !important; }
    
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(4px);
    }

    /* Mobile Quick Access Shortcuts */
    .mobile-quick {
      display: none;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    
    .mobile-quick-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 14px;
      color: var(--deep);
      background: #f8fafc;
    }
    
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }
    
    .recent-item {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
    }
    
    .loading-note {
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      text-align: center;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 1024px) {
      .app { grid-template-columns: 1fr; }
      
      .sidebar {
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-105%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 20px 0 25px -5px rgba(6, 46, 43, 0.1);
      }
      
      body.drawer-open .sidebar { transform: translateX(0); }
      body.drawer-open .drawer-backdrop { display: block; }
      
      .drawer-close {
        display: grid;
        place-items: center;
        position: absolute;
        right: 12px;
        top: 12px;
        width: 32px !important;
        height: 32px !important;
        min-width: 32px !important;
        min-height: 32px !important;
        max-width: 32px !important;
        max-height: 32px !important;
        padding: 0 !important;
        border-radius: 50% !important;
        border: 1px solid var(--line);
        background: var(--paper);
        font-size: 18px;
        cursor: pointer;
      }
      
      .main { padding: 24px 20px 40px; }
      .menu-button { display: inline-flex; }
      .grid-2 { grid-template-columns: 1fr; }
      .entry-shell { grid-template-columns: 1fr; }
      
      .form-list {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      
      .form-tab { 
        flex-direction: column; 
        text-align: center; 
        min-height: 72px; 
        justify-content: center;
      }
      
      .form-tab-note { display: none; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fund-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .fund-kpi-card { min-height: 92px; padding: 12px; }
      .fund-kpi-card .kpi-value { font-size: 17px; }
    }
    
    @media (max-width: 640px) {
      .main { padding: 16px 12px 108px; }
      .bottom-nav { display: grid; }
      
      .topbar {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr);
        align-items: center;
        margin-bottom: 20px;
      }
      
      .topbar > div:first-of-type { min-width: 0; }
      .top-actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: stretch; }
      .top-actions > button, .top-actions > a { flex: 1; display: flex; }
      .top-actions > a button { width: 100%; }
      
      h1 { font-size: 24px; }
      .subtitle { font-size: 13px; }
      
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .kpi-card { padding: 10px; min-height: 88px; border-radius: var(--radius); }
      .kpi-card .kpi-value { font-size: 16px; margin-bottom: 0; }
      .kpi-card .kpi-icon-badge { width: 24px; height: 24px; font-size: 10px; }
      .kpi-card .kpi-card-header { margin-bottom: 4px; }
      
      .fund-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .fund-kpi-card { min-height: 88px; padding: 10px; border-radius: var(--radius); }
      .fund-kpi-card .kpi-value { font-size: 16px; margin-bottom: 0; }
      
      .action-grid { grid-template-columns: 1fr; }
      .form-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fields { grid-template-columns: 1fr; gap: 12px; }
      .full { grid-column: auto; }
      
      .mobile-quick { display: block; }
      
      .panel-head { 
        flex-direction: column; 
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
      }
      .panel-body { padding: 16px; }
      
      .submit-bar {
        position: fixed;
        bottom: calc(76px + env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        z-index: 80;
        border-radius: 0;
        box-shadow: 0 -8px 20px rgba(6, 46, 43, 0.08);
        padding: 12px 16px;
      }
      
      .submit-bar button { flex: 1 1 30%; }
      .submit-bar .primary { flex-basis: 100%; order: -1; }
      
      .settings-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 70px minmax(0, 1fr); }
      .bar-value { grid-column: 2; text-align: left; margin-top: 4px; }
      
      table { min-width: 600px; }
      input, select, textarea, .ac-input { min-height: 48px; font-size: 16px; }
      button { min-height: 46px; }
    }
    
    @media (max-width: 768px) {
      .sticky-col {
        position: sticky !important;
        z-index: 2;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
      }
      th.sticky-col { background: #f8fafc !important; }
      td.sticky-col { background: var(--paper) !important; }
      tr.total-row td.sticky-col { background: var(--mint-soft) !important; }
    }
</style>
