<style>
    @media (max-width: 600px) {
      .modal-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Bottom Navigation for Mobile */
    .bottom-nav {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 90;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      padding: 6px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 25px -5px rgba(6, 46, 43, 0.15), 0 8px 10px -6px rgba(6, 46, 43, 0.1);
      backdrop-filter: blur(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    
    .bottom-nav.nav-hidden {
      transform: translateY(calc(100% + 24px)) !important;
      opacity: 0 !important;
      pointer-events: none;
    }
    
    .bottom-nav button {
      min-height: 58px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 13px;
      padding: 6px 2px;
      font-size: 10.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .bottom-nav button:hover {
      background: rgba(13, 148, 136, 0.05);
      color: var(--teal);
    }
    
    .bottom-nav button.active { 
      background: var(--deep); 
      color: #fff; 
    }

    .sync-toast {
      position: fixed;
      left: 16px;
      right: 16px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      z-index: 950;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid rgba(13, 148, 136, 0.22);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--deep);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
      backdrop-filter: blur(16px);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-16px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .sync-toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .sync-toast.error {
      border-color: rgba(220, 38, 38, 0.28);
      color: var(--red);
    }

    .sync-toast-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--mint-soft);
      color: var(--teal);
    }
    
    /* Native-looking SVG Icons */
    .btn-svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* Shimmer Skeleton Loaders */
    .shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
      background-size: 400% 100%;
      animation: skeleton-loading 1.4s ease infinite;
      border-radius: 8px;
    }
    
    @keyframes skeleton-loading {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .shimmer-text { height: 16px; margin-bottom: 8px; width: 60%; }
    .shimmer-value { height: 28px; width: 40%; }
    .shimmer-chart { height: 200px; width: 100%; }
    .shimmer-table { height: 150px; width: 100%; }
    
    /* Full Screen Loader */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 250, 252, 0.85);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }
    
    .loader-card {
      width: min(320px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-premium);
      text-align: center;
      border-top: 4px solid var(--teal);
    }
    
    .loader-title { 
      font-weight: 800; 
      font-size: 16px;
      color: var(--deep);
    }
    
    .loader-text { 
      margin-top: 8px; 
      color: var(--muted); 
      font-size: 13px; 
      line-height: 1.5;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--teal);
      border-radius: 50%;
      margin: 16px auto 0;
      animation: spin 0.8s linear infinite;
    }

    .spinner.mini {
      width: 24px;
      height: 24px;
      border-width: 2px;
      margin: 0;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .hidden, .hidden-row { display: none !important; }
    
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(4px);
    }

    /* Mobile Quick Access Shortcuts */
    .mobile-quick {
      display: none;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    
    .mobile-quick-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 14px;
      color: var(--deep);
      background: #f8fafc;
    }
    
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }
    
    .recent-item {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
    }
    
    .loading-note {
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: #f8fafc;
      font-size: 13px;
      text-align: center;
    }

    .loading-card,
    .empty-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 72px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--muted);
      box-shadow: var(--shadow-sm);
      white-space: normal;
    }

    .empty-card {
      display: block;
      text-align: center;
      border-style: dashed;
      background: #f8fafc;
    }

    .empty-card.error {
      border-color: rgba(220, 38, 38, 0.22);
      background: var(--red-soft);
      color: var(--red);
    }

    .loading-card-title,
    .empty-card-title {
      color: var(--deep);
      font-size: 14px;
      font-weight: 800;
    }

    .loading-card-note,
    .empty-card-note {
      margin-top: 4px;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--muted);
    }

    .record-skeleton {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 4px;
    }

    .shimmer-line {
      height: 12px;
      margin: 6px 0;
    }

    .shimmer-pill {
      width: 44px;
      height: 28px;
      border-radius: 999px;
      flex: 0 0 44px;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 1024px) {
      .app { grid-template-columns: 1fr; }
      
      .sidebar {
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        transform: translateX(-105%);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 20px 0 25px -5px rgba(6, 46, 43, 0.1);
        align-items: stretch !important;
      }
      
      .nav-stack {
        align-items: stretch !important;
      }
      
      .nav-btn {
        width: 100% !important;
        justify-content: flex-start !important;
      }
      
      body.drawer-open .sidebar { transform: translateX(0); }
      body.drawer-open .drawer-backdrop { display: block; }
      
      .drawer-close {
        display: grid;
        place-items: center;
        position: absolute;
        right: 12px;
        top: 12px;
        width: 32px !important;
        height: 32px !important;
        min-width: 32px !important;
        min-height: 32px !important;
        max-width: 32px !important;
        max-height: 32px !important;
        padding: 0 !important;
        border-radius: 50% !important;
        border: 1px solid var(--line);
        background: var(--paper);
        font-size: 18px;
        cursor: pointer;
      }
      
      .main { padding: 24px 20px 40px; }
      .menu-button { display: inline-flex; }
      .grid-2 { grid-template-columns: 1fr; }
      .entry-shell { grid-template-columns: 1fr; }
      
      .form-list {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      
      .form-tab { 
        flex-direction: column; 
        text-align: center; 
        min-height: 72px; 
        justify-content: center;
      }
      
      .form-tab-note { display: none; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fund-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .fund-kpi-card { min-height: 92px; padding: 12px; }
      .fund-kpi-card .kpi-value { font-size: 17px; }
    }
    
    @media (max-width: 640px) {
      .main { padding: 16px 12px 96px; }
      .bottom-nav { display: grid; }
      
      .topbar {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      
      .topbar > div:first-of-type { min-width: 0; flex-grow: 1; }
      .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; margin-top: 0; }
      .top-actions > button, .top-actions > a { flex: none; display: inline-flex; }
      .top-actions > a button { width: auto; }
      
      h1 { font-size: 23px; line-height: 1.12; }
      .subtitle { font-size: 13px; }
      
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .kpi-card { padding: 10px; min-height: 88px; border-radius: var(--radius); }
      .kpi-card .kpi-value { font-size: 16px; margin-bottom: 0; }
      .kpi-card .kpi-icon-badge { width: 24px; height: 24px; font-size: 10px; }
      .kpi-card .kpi-card-header { margin-bottom: 4px; }
      
      .fund-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .fund-kpi-card { min-height: 88px; padding: 10px; border-radius: var(--radius); }
      .fund-kpi-card .kpi-value { font-size: 16px; margin-bottom: 0; }
      .fund-export-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .fund-export-table,
      .fund-export-table tbody,
      .fund-export-table tr {
        display: table;
        width: 100%;
        min-width: 0 !important;
        table-layout: auto;
      }
      .fund-export-table tbody {
        display: table-row-group;
      }
      .fund-export-table tr {
        display: table-row;
      }
      .fund-export-table td {
        display: table-cell !important;
        font-size: 12.5px;
        padding: 8px;
        text-align: left;
        vertical-align: middle;
      }
      .fund-export-table td::before {
        content: none !important;
      }
      .fund-export-value {
        text-align: right !important;
      }
      .fund-export-action {
        text-align: right !important;
      }
      .fund-export-action button {
        min-height: 32px;
      }

      .fund-loan-summary-head,
      .vehicle-volume-head {
        align-items: stretch !important;
      }

      .compact-filter,
      .vehicle-volume-filters {
        width: 100%;
      }

      .compact-filter {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
      }

      .compact-filter select {
        min-width: 0;
        max-width: none;
        width: 100%;
        min-height: 44px;
        font-size: 16px;
      }
      
      .action-grid { grid-template-columns: 1fr; }
      .form-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #manageTabsBar {
        display: flex !important;
        flex-wrap: nowrap !important;
        gap: 8px;
        margin: 0 -12px 12px !important;
        padding: 2px 12px 10px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      #manageTabsBar::-webkit-scrollbar {
        display: none;
      }

      #manageTabsBar .sub-tab {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 16px;
        scroll-snap-align: start;
        white-space: nowrap;
      }

      #manageTabsBar::after {
        content: "";
        flex: 0 0 4px;
      }

      .fields { grid-template-columns: 1fr; gap: 12px; }
      .full { grid-column: auto; }

      .mobile-operation-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--paper);
        box-shadow: var(--shadow-sm);
      }

      .mobile-period-control {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1 1 auto;
      }

      .mobile-period-control label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .mobile-period-control select {
        min-width: 0;
        min-height: 44px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
        padding: 0 10px;
      }

      .mobile-operation-bar button {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 12px;
      }

      .manage-add-shortcut {
        display: none !important;
      }

      #manageView > .entry-shell {
        display: none;
      }

      body.mobile-entry-open {
        overflow: hidden;
      }

      body.mobile-entry-open #manageView {
        position: fixed;
        inset: 0;
        z-index: 890;
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
        transform: none !important;
        animation: none !important;
        background: rgba(15, 23, 42, 0.34);
      }

      body.mobile-entry-open #manageView > :not(#entryShell):not(.entry-sheet-backdrop) {
        display: none !important;
      }

      body.mobile-entry-open .bottom-nav {
        transform: translateY(calc(100% + 32px)) !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      body.mobile-entry-open .entry-sheet-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
        background: rgba(15, 23, 42, 0.36);
        backdrop-filter: blur(4px);
      }

      body.mobile-entry-open #entryShell {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 56px minmax(0, 1fr);
        gap: 8px;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(8px + env(safe-area-inset-top, 0px));
        bottom: 0;
        z-index: 1;
        height: auto;
        max-height: none;
        margin: 0 !important;
        padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px));
        align-items: stretch;
        animation: mobileSheetUp 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes mobileSheetUp {
        from { transform: translateY(18px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      body.mobile-entry-open #entryShell .form-list {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 8px;
        height: 56px;
        min-height: 56px;
        max-height: 56px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        padding: 6px 2px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        scrollbar-width: none;
      }

      body.mobile-entry-open #entryShell .form-list::-webkit-scrollbar {
        display: none;
      }

      body.mobile-entry-open #entryShell .form-tab {
        width: auto;
        min-width: max-content;
        max-width: none;
        min-height: 44px;
        max-height: 44px;
        padding: 0 16px;
        flex: 0 0 auto;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      body.mobile-entry-open #entryShell .form-tab-icon,
      body.mobile-entry-open #entryShell .form-tab-note {
        display: none !important;
      }

      body.mobile-entry-open #entryShell .form-tab-title {
        display: block;
        font-size: 14px;
        font-weight: 800;
        white-space: nowrap;
      }

      body.mobile-entry-open #entryShell .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-height: none;
        border-radius: 22px 22px 0 0;
        overflow: hidden;
        box-shadow: 0 -18px 40px rgba(15, 23, 42, 0.18);
      }

      body.mobile-entry-open #entryShell .panel-head {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
      }

      body.mobile-entry-open #entryShell .panel-head > div:first-child {
        min-width: 0;
        flex: 1 1 auto;
      }

      body.mobile-entry-open #entryShell .panel-title {
        font-size: clamp(18px, 4.6vw, 20px);
        line-height: 1.12;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      body.mobile-entry-open #entryShell .panel-note {
        display: none;
      }

      body.mobile-entry-open #entryShell .panel-head > div:last-child {
        flex: 0 0 auto;
        gap: 8px !important;
      }

      body.mobile-entry-open .mobile-entry-close {
        display: inline-flex !important;
      }

      body.mobile-entry-open #entryShell #rows {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none !important;
        overflow-y: auto !important;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      body.mobile-entry-open #entryShell .submit-bar {
        position: sticky !important;
        bottom: 0;
        margin-top: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) !important;
        background: rgba(255, 255, 255, 0.96) !important;
        box-shadow: 0 -10px 24px rgba(15, 23, 42, 0.08) !important;
      }

      body.mobile-entry-open #entryShell #addBtn,
      body.mobile-entry-open #entryShell #cloneBtn,
      body.mobile-entry-open #entryShell #sheetLink {
        width: 44px !important;
        height: 44px !important;
        min-width: 44px !important;
        min-height: 44px !important;
        border-radius: 10px !important;
      }

      body.mobile-entry-open #entryShell .entry-row {
        padding: 14px;
        margin-bottom: 12px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
      }

      #manageView .filter-container,
      #manageView .filter-container > div:first-child,
      #manageDateFilterGroup {
        display: grid !important;
        grid-template-columns: 1fr !important;
        width: 100% !important;
        min-width: 0 !important;
        gap: 10px !important;
      }

      #manageView .filter-container label,
      #manageDateFilterGroup label {
        display: grid !important;
        grid-template-columns: 1fr !important;
        align-items: stretch !important;
        width: 100% !important;
        min-width: 0 !important;
        gap: 6px !important;
      }

      #manageView .filter-container .manage-period-filter {
        display: none !important;
      }

      #manageQuickDateFilter,
      #manageQuickDateFilterMobile,
      #manageStartDate,
      #manageEndDate,
      #manageSearchInput {
        min-height: 44px !important;
        font-size: 16px !important;
      }

      input[type="date"] {
        display: block !important;
        inline-size: 100% !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        flex: 1 1 auto !important;
        align-self: stretch !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        -webkit-appearance: none;
        appearance: none;
      }

      input[type="date"]::-webkit-date-and-time-value {
        min-width: 0;
        text-align: left;
      }
      
      .mobile-quick { display: block; }
      
      .panel-head { 
        flex-direction: column; 
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
      }
      .panel-body { padding: 16px; }
      
      .table-wrap { max-height: none !important; }
      #rows { max-height: none !important; overflow-y: visible !important; }
      
      .submit-bar {
        position: static !important;
        box-shadow: none !important;
        border-top: 1px solid var(--line);
        padding: 20px 0 !important;
        margin-top: 20px;
        background: transparent !important;
        transition: none !important;
      }
      
      .submit-bar button { flex: 1 1 30%; }
      .submit-bar .primary { flex-basis: 100%; order: -1; }
      
      .settings-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 70px minmax(0, 1fr); }
      .bar-value { grid-column: 2; text-align: left; margin-top: 4px; }
      
      table { min-width: 480px !important; }
      table.table-wide { min-width: 720px !important; }
      th, td {
        padding: 6px 8px !important;
        font-size: 11.5px !important;
      }
      .sticky-col-right {
        padding: 6px 4px !important;
      }
      input, select, textarea, .ac-input { min-height: 48px; font-size: 16px; }
      button { min-height: 46px; }

      .mobile-record-table {
        min-width: 0 !important;
