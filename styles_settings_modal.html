<style>
    /* Settings Section */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    
    .info-card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--paper);
      box-shadow: var(--shadow-lg);
    }
    
    .info-card h2 { 
      margin: 0 0 12px; 
      font-size: 18px; 
      font-weight: 700;
      color: var(--deep);
    }
    
    .info-card p { 
      margin: 0; 
      color: var(--muted); 
      line-height: 1.6; 
      font-size: 13.5px; 
    }
    
    .steps { 
      margin: 12px 0 0; 
      padding-left: 20px; 
      color: var(--muted); 
      line-height: 1.6; 
      font-size: 13.5px; 
    }

    /* CRUD Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-container {
      background: var(--paper);
      border-radius: 16px;
      box-shadow: var(--shadow-xl), 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.2s ease;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .modal-overlay.active .modal-container {
      transform: scale(1);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--deep);
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      transition: background 0.15s;
    }
    .modal-close-btn:hover {
      background: var(--mint-soft);
      color: var(--teal);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--mint-soft);
    }
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .modal-grid label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .modal-grid label.full-width {
      grid-column: 1 / -1;
    }
    .modal-grid input, .modal-grid select, .modal-grid textarea {
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      box-sizing: border-box;
    }
    .modal-grid textarea {
      height: 80px;
      padding: 10px 12px;
      resize: vertical;
    }
    .modal-grid input:focus, .modal-grid select:focus, .modal-grid textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--mint-soft);
    }
    
    /* Fund Detail Drawer */
    .fund-detail-drawer {
      position: fixed !important;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      z-index: 120;
      background: var(--paper);
      box-shadow: -8px 0 30px rgba(15, 23, 42, 0.1);
      transform: translateX(110%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      border-radius: 0 !important;
      border: 0;
      overflow: hidden !important;
    }
    
    .fund-detail-drawer.open {
      transform: translateX(0);
    }
    
    /* Support Mobile Safe Area (Notch) */
    .fund-detail-drawer .table-card-head {
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: 16px;
      padding-left: 20px;
      padding-right: 20px;
      flex-shrink: 0;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    
    .fund-detail-drawer .table-wrap {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
    }
    
    /* Mobile Detail Cards List */
    .fund-detail-mobile-list {
      display: none;
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    
    .fund-detail-mobile-card {
      background: var(--canvas);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    
    .fund-detail-mobile-card-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12.5px;
      gap: 10px;
    }
    
    .fund-detail-mobile-card-label {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      flex-shrink: 0;
    }
    
    .fund-detail-mobile-card-value {
      color: var(--ink);
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }
    
    .fund-detail-mobile-card-amount {
      font-size: 14px;
      font-weight: 800;
    }

    /* Screen Queries for Floating Desktop Style & Responsive Lists */
    @media (max-width: 639px) {
      #fundDetailTableWrap {
        display: none !important;
      }
      #fundDetailMobileList {
        display: flex !important;
      }
      .fund-detail-drawer {
        height: 100dvh !important;
      }
    }
    
    @media (min-width: 640px) {
      #fundDetailTableWrap {
        display: block !important;
      }
      #fundDetailMobileList {
        display: none !important;
      }
      
      .fund-detail-drawer {
        top: 20px !important;
        right: 20px !important;
        bottom: 20px !important;
        height: calc(100vh - 40px) !important;
        width: min(750px, 90vw) !important;
        border-radius: var(--radius-lg) !important;
        border: 1px solid var(--line) !important;
        box-shadow: var(--shadow-premium) !important;
        overflow: hidden !important;
      }

      #fundLoanPaymentDrawer, #fundLoanAddDrawer, #fundTransactionAddDrawer {
        width: min(480px, 90vw) !important;
      }
      
      .fund-detail-drawer .table-card-head {
        padding-top: 16px;
      }
      
      .fund-detail-drawer .table-wrap {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
    }
</style>
